    const down = (e) => { e.preventDefault(); b.classList.add("down"); ensureAudio(); keyQt("down", KQ[k]); };
    const up = (e) => { e.preventDefault(); if (!b.classList.contains("down")) return; b.classList.remove("down"); keyQt("up", KQ[k]); };
    b.addEventListener("pointerdown", down); b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("pointerleave", up);
    acts.appendChild(b);
  }
}
function pollUi() {
  if (!api || !IS_TOUCH) return;
  let st = "";
  try { st = api.ui_state(); } catch (e) {}
  if (st !== uiKind) { uiKind = st; touchEl.classList.toggle("on", !!st); if (st) buildActs(st); else setJoyKeys(new Set()); }
}
setInterval(pollUi, 300);

// ============================================================================ sharing the house (PeerJS)
let peer = null, netSeq = 0;
const netConns = new Map();
function peerOpts() {
  const q = new URLSearchParams(location.search), o = { debug: 0 };
  if (q.get("peerhost")) { o.host = q.get("peerhost"); o.port = +(q.get("peerport") || 9000); o.path = q.get("peerpath") || "/"; o.secure = false; }
  return o;
}
function netEvent(cid, kind, text) { if (!api) return; try { api.net_event(cid, kind, text || ""); } catch (e) { console.error(e); } }
function wireConn(cid, conn) {
  netConns.set(cid, conn);
  conn.on("data", (d) => netEvent(cid, "data", typeof d === "string" ? d : new TextDecoder().decode(d)));
  conn.on("close", () => { if (netConns.has(cid)) { netConns.delete(cid); netEvent(cid, "close", "连接断开了"); } });
  conn.on("error", (e) => netEvent(cid, "error", String((e && e.type) || e)));
}
function netStop() {
  for (const c of netConns.values()) { try { c.close(); } catch (e) {} }
  netConns.clear();
  if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
}
const NET = {
  net_host(code) {
    netStop();
    if (typeof Peer === "undefined") { setTimeout(() => netEvent(0, "host_error", "联机组件没加载上（网络问题？）"), 0); return; }
    peer = new Peer("pawpals-" + code, peerOpts());
    peer.on("open", () => netEvent(0, "host_ready"));
    peer.on("error", (e) => netEvent(0, "host_error", e.type === "unavailable-id" ? "这个房间码正被占用，再开一次试试" : String(e.type || e)));
    peer.on("connection", (conn) => {
      const cid = ++netSeq, early = [];
      let ready = false;
      conn.on("data", (d) => { const t = typeof d === "string" ? d : new TextDecoder().decode(d); if (ready) netEvent(cid, "data", t); else early.push(t); });
      conn.on("close", () => { if (netConns.has(cid)) { netConns.delete(cid); netEvent(cid, "close", "连接断开了"); } });
      conn.on("error", (e) => netEvent(cid, "error", String((e && e.type) || e)));
      conn.on("open", () => { netConns.set(cid, conn); netEvent(cid, "incoming"); ready = true; for (const t of early.splice(0)) netEvent(cid, "data", t); });
    });
  },
  net_join(code) {
    netStop();
    const cid = ++netSeq;
    if (typeof Peer === "undefined") { setTimeout(() => netEvent(cid, "error", "联机组件没加载上（网络问题？）"), 0); return cid; }
    peer = new Peer(peerOpts());
    peer.on("open", () => {
      const conn = peer.connect("pawpals-" + code, { reliable: true, serialization: "raw" });
      wireConn(cid, conn);
      conn.on("open", () => netEvent(cid, "open"));
    });
    peer.on("error", (e) => netEvent(cid, "error", e.type === "peer-unavailable" ? "找不到这个房间（房间码对吗？房主开着房间吗？）" : String(e.type || e)));
    return cid;
  },
  net_send(cid, text) { const c = netConns.get(cid);
    if (c && c.open) { try { c.send(text); } catch (e) { console.warn("send failed", e); } } },
  net_close(cid) { const c = netConns.get(cid); netConns.delete(cid); if (c) setTimeout(() => { try { c.close(); } catch (e) {} }, 400); },
  net_stop() { netStop(); },
};
Object.assign(window.pawpalsHost, NET);

// ============================================================================ phones
const PHONE = matchMedia("(pointer: coarse) and (max-height: 500px), (pointer: coarse) and (max-width: 500px)");
let keepPortrait = false;
try { keepPortrait = sessionStorage.getItem("pawpals.portrait") === "1"; } catch (e) {}
function checkRotate() {
  const el = document.getElementById("rotate");
  el.classList.toggle("on", !!api && PHONE.matches && innerHeight > innerWidth && !keepPortrait);
}
document.getElementById("keepPortrait").onclick = () => { keepPortrait = true; try { sessionStorage.setItem("pawpals.portrait", "1"); } catch (e) {} checkRotate(); };
window.addEventListener("resize", checkRotate);
window.addEventListener("orientationchange", () => setTimeout(() => { checkRotate(); onResize(); }, 200));

// ============================================================================ input
const QT = { LeftButton: 1, RightButton: 2, MiddleButton: 4, Shift: 0x02000000, Control: 0x04000000, Alt: 0x08000000, Meta: 0x10000000 };
function mods(e) { return (e.shiftKey ? QT.Shift : 0) | (e.ctrlKey ? QT.Control : 0) | (e.altKey ? QT.Alt : 0) | (e.metaKey ? QT.Meta : 0); }
function btn(b) { return b === 0 ? 1 : b === 2 ? 2 : b === 1 ? 4 : 0; }
function btns(bs) { return (bs & 1 ? 1 : 0) | (bs & 2 ? 2 : 0) | (bs & 4 ? 4 : 0); }
function local(e) { const r = view.getBoundingClientRect(); return [(e.clientX - r.left) * cssW / r.width, (e.clientY - r.top) * cssH / r.height]; }
let lastTap = { t: 0, x: 0, y: 0 };
let longT = 0, touchDown = null;
view.addEventListener("contextmenu", (e) => e.preventDefault());
view.addEventListener("pointerdown", (e) => {
  if (!api) return;
  view.focus();
  try { view.setPointerCapture(e.pointerId); } catch (err) {}
  const [x, y] = local(e);
  ensureAudio();
  if (e.pointerType !== "mouse") {
    // touch: a long press is the right click
    touchDown = { id: e.pointerId, x, y, t: performance.now(), moved: false, long: false };
    clearTimeout(longT);
    longT = setTimeout(() => {
      if (!touchDown || touchDown.moved) return;
      touchDown.long = true;
      api.mouse("down", x, y, 2, 2, 0); api.mouse("up", x, y, 2, 0, 0);
    }, 520);
    api.mouse("move", x, y, 0, 0, 0);
    return;
  }
  api.mouse("down", x, y, btn(e.button), btns(e.buttons), mods(e));
});
view.addEventListener("pointermove", (e) => {
  if (!api) return;
  const [x, y] = local(e);
  if (touchDown && e.pointerId === touchDown.id) {
    if (!touchDown.moved && Math.hypot(x - touchDown.x, y - touchDown.y) > 9) {
      touchDown.moved = true; clearTimeout(longT);
      api.mouse("down", touchDown.x, touchDown.y, 1, 1, 0);     // a drag: press where it started
    }
    if (touchDown.moved) api.mouse("move", x, y, 0, 1, 0);
    return;
  }
  api.mouse("move", x, y, 0, btns(e.buttons), mods(e));
});
function endTouch(e, cancel) {
  const [x, y] = local(e);
  const td = touchDown; touchDown = null; clearTimeout(longT);
  if (!td || td.long) return;
  if (td.moved) { api.mouse("up", x, y, 1, 0, 0); return; }
  if (cancel) return;
  const now = performance.now();
  const dbl = now - lastTap.t < 330 && Math.hypot(x - lastTap.x, y - lastTap.y) < 24;
  api.mouse("down", x, y, 1, 1, 0); api.mouse("up", x, y, 1, 0, 0);
  if (dbl) { api.mouse("dbl", x, y, 1, 1, 0); lastTap.t = 0; } else lastTap = { t: now, x, y };
}
view.addEventListener("pointerup", (e) => {
  if (!api) return;
  if (touchDown && e.pointerId === touchDown.id) { endTouch(e, false); return; }
  const [x, y] = local(e);
  api.mouse("up", x, y, btn(e.button), btns(e.buttons), mods(e));
});
view.addEventListener("pointercancel", (e) => { if (touchDown && e.pointerId === touchDown.id) endTouch(e, true); });
view.addEventListener("dblclick", (e) => { if (!api) return; const [x, y] = local(e); api.mouse("dbl", x, y, 1, 1, mods(e)); });
view.addEventListener("pointerleave", (e) => { if (api && e.pointerType === "mouse") api.mouse("leave", 0, 0, 0, 0, 0); });
view.addEventListener("wheel", (e) => { if (!api) return; e.preventDefault(); const [x, y] = local(e);
  api.wheel(x, y, Math.round(-e.deltaX), Math.round(-e.deltaY * (e.deltaMode ? 40 : 1)), mods(e)); }, { passive: false });

const KEYMAP = { Escape: 0x01000000, Tab: 0x01000001, Backspace: 0x01000003, Enter: 0x01000004, NumpadEnter: 0x01000005,
  Delete: 0x01000007, Home: 0x01000010, End: 0x01000011, ArrowLeft: 0x01000012, ArrowUp: 0x01000013, ArrowRight: 0x01000014,
  ArrowDown: 0x01000015, PageUp: 0x01000016, PageDown: 0x01000017, ShiftLeft: 0x01000020, ShiftRight: 0x01000020,
  ControlLeft: 0x01000021, ControlRight: 0x01000021, AltLeft: 0x01000023, AltRight: 0x01000023, Space: 0x20,
  Minus: 0x2d, Equal: 0x3d, Comma: 0x2c, Period: 0x2e, Slash: 0x2f, F1: 0x01000030 };
function qtKey(e) {
  if (KEYMAP[e.code] != null) return KEYMAP[e.code];
  let m = /^Key([A-Z])$/.exec(e.code); if (m) return m[1].charCodeAt(0);
  m = /^(?:Digit|Numpad)(\d)$/.exec(e.code); if (m) return 0x30 + +m[1];
  return 0;
}
function keyHandler(kind) {
  return (e) => {
    if (kind === "down") ensureAudio();
    if (!api || (e.target.closest && e.target.closest("input,textarea,select")) || dialogs.size) return;
    if (menuEls.length && kind === "down" && e.key === "Escape") { closeMenus(); e.preventDefault(); return; }
    if (kind === "down" && e.code === "KeyM" && !e.repeat && window.PawSound) {
      e.preventDefault(); toast(window.PawSound.toggleMute() ? "🔇 静音（按 M 打开声音）" : "🔊 声音打开了"); return; }
    if (e.code === "KeyM") return;
    const k = qtKey(e); if (!k) return;
    if (e.metaKey || (e.ctrlKey && k !== 0x01000021)) return;
    e.preventDefault();

window.addEventListener("keydown", keyHandler("down"));
window.addEventListener("keyup", keyHandler("up"));
window.addEventListener("blur", () => { if (api) api.blur(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && api) { try { api.save_now(); } catch (e) {} } });
window.addEventListener("pagehide", () => { if (api) { try { api.save_now(); } catch (e) {} } });

// ============================================================================ sound (filled in by the sound module)
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) { if (audioCtx.state === "suspended") audioCtx.resume(); return; }
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); window.PawSound && window.PawSound.init(audioCtx); } catch (e) {}
}

// ============================================================================ main loop
let perf = { n: 0, t: 0, py: 0, js: 0 };
let lastTick = 0;
function loop() {
  requestAnimationFrame(loop);
  tick();
}
// some browsers (headless ones, power-saving modes) run requestAnimationFrame very rarely: keep the clock going
setInterval(() => { if (performance.now() - lastTick > 70) tick(); }, 35);
function tick() {
  if (!api || document.hidden) return;
  lastTick = performance.now();
  const t0 = performance.now();
  let out = 0;
  try { out = api.frame(); } catch (e) { console.error(e); }
  let f = null, strs = "";
  if (out) {
    try { const mv = api.take_bin(); const bytes = mv.toJs(); mv.destroy(); strs = api.take_strs();
      f = new Float32Array(bytes.buffer, bytes.byteOffset, bytes.byteLength >> 2); } catch (e) { console.error(e); }
  }
  const t1 = performance.now();
  if (f) { try { replayBin(f, strs); } catch (e) { console.error(e); } }
  const t2 = performance.now();
  perf.n++; perf.py += t1 - t0; perf.js += t2 - t1;
  if (out) { perf.paints = (perf.paints || 0) + 1; perf.last = perf.last || []; perf.last.push([+(t1 - t0).toFixed(1), +(t2 - t1).toFixed(1)]); if (perf.last.length > 40) perf.last.shift(); }
  window.__perf = perf;
}

async function boot() {
  const msg = document.getElementById("loadmsg"), bar = document.querySelector("#bar i");
  const step = (p, t) => { bar.style.width = p + "%"; msg.textContent = t; };
  if (HUB) { const b = document.getElementById("hubback"); b.style.display = "block"; b.onclick = () => { location.href = "../"; }; }
  try {
    step(8, "正在下载 Python 运行环境（第一次大约 10 MB，之后会被浏览器缓存）…");
    const popts = { indexURL: PYODIDE_URL, stdout: (s) => console.log(s), stderr: (s) => console.warn(s) };
    if ("__STDLIB_URL__".indexOf("__") !== 0) popts.stdLibURL = "__STDLIB_URL__";
    py = await loadPyodide(popts);
    step(70, "正在搬进小屋…");
    const bin = Uint8Array.from(atob(PY_BUNDLE), (ch) => ch.charCodeAt(0));
    py.unpackArchive(bin.buffer, "zip", { extractDir: "/app" });
    py.runPython("import sys; sys.path.insert(0, '/app')");
    await new Promise((r) => setTimeout(r, 30));
    step(85, "猫猫和咕咕正在起床…");
    await new Promise((r) => setTimeout(r, 30));
    py.runPython("import webapp; webapp.start(" + (HUB ? "True" : "False") + ", " + (PHONE.matches ? "True" : "False") + ")");
    document.getElementById("hubback").style.display = "none";
    api = py.pyimport("webapp");
    window.__py = py;
    onResize();
    checkRotate();
    step(100, "好啦！");
    document.getElementById("loading").classList.add("gone");
    view.focus();
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    const er = document.getElementById("err"); er.style.display = "block";
    er.textContent = "加载失败：" + (e && e.message ? e.message : e) + "\n刷新页面再试一次；如果一直不行，可能是网络连不上 cdn.jsdelivr.net。";
    msg.textContent = "";
  }
}
boot();
