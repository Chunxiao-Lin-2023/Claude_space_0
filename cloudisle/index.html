<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="云岛冒险">
<meta name="theme-color" content="#151022">
<title>云岛冒险</title>
<style>
:root{color-scheme:dark;--ui:#f6f0e2;--gold:#ffcf5a;--hp:#ff5d6c;--mp:#4fa3ff;--exp:#ffe066;--panel:rgba(24,20,38,.86);--edge:rgba(255,255,255,.16);--acc:#7fd6c2;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#151022;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;color:var(--ui);-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--edge);background:linear-gradient(#3d3458,#2a2340);border-radius:10px;padding:8px 14px;min-height:40px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
button:hover:not(:disabled){filter:brightness(1.18)}
button:disabled{opacity:.42;cursor:default}
button.pri{background:linear-gradient(#ffd56e,#e7a93a);color:#3a2408;border-color:#ffe7a6;font-weight:700}
button.ghost{background:transparent}
input{font:inherit;color:#2a2233;background:#fff8ea;border:2px solid #e7c98a;border-radius:10px;padding:8px 12px;min-height:42px;outline:none}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;padding:calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl))}
.screen.on{display:flex}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.45);max-width:min(760px,100%);max-height:100%;overflow:auto;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.logo{font-size:44px;font-weight:900;letter-spacing:4px;text-align:center;background:linear-gradient(#fff6c9,#ffc861 55%,#ff8f5a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a2d1a);margin:0}
.sub{text-align:center;opacity:.8;margin:4px 0 16px;font-size:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.slot{border:2px solid var(--edge);border-radius:14px;padding:10px;text-align:center;cursor:pointer;background:rgba(255,255,255,.04);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.slot.sel{border-color:var(--gold);background:rgba(255,207,90,.1)}
.slot canvas{width:72px;height:80px}
.slot .del{position:absolute;top:4px;right:6px;min-height:0;padding:2px 7px;font-size:12px;border-radius:8px;background:transparent;border:none;opacity:.6}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.note{font-size:12.5px;opacity:.72;text-align:center;margin-top:10px;line-height:1.6}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.ccard{border:2px solid var(--edge);border-radius:14px;padding:10px;cursor:pointer;background:rgba(255,255,255,.04);text-align:center}
.ccard.sel{border-color:var(--gold);background:rgba(255,207,90,.1)}
.ccard canvas{width:90px;height:100px}
.ccard h3{margin:2px 0;font-size:18px}.ccard p{margin:4px 0;font-size:12.5px;opacity:.8;line-height:1.5}
.ccard .tag{font-size:12px;color:var(--acc)}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud button,#hud .slotb,#hud #room,#hud #mini{pointer-events:auto}
#pinfo{position:absolute;left:calc(10px + var(--sl));top:calc(10px + var(--st));background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:8px 10px;width:230px}
.lvrow{display:flex;gap:8px;align-items:baseline;margin-bottom:5px;font-size:13px}
.lvrow b{color:var(--gold);font-size:16px}
.bar{position:relative;height:15px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:4px;border:1px solid rgba(255,255,255,.1)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .12s}
.bar.hp i{background:linear-gradient(#ff8a95,#e8394d)}.bar.mp i{background:linear-gradient(#8cc6ff,#2f7fe0)}
.bar span{position:relative;display:block;text-align:center;font-size:11px;line-height:15px;font-weight:700;text-shadow:0 1px 2px #000}
.meso{margin-top:5px;font-size:13px;display:flex;align-items:center;gap:6px}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f4b733 60%,#b07816);box-shadow:0 0 0 1px #8a5a10}
#mate{position:absolute;left:calc(10px + var(--sl));top:calc(122px + var(--st));background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:6px 10px;width:190px;font-size:12px}
#mate .bar{height:10px}
#pauseOv{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(20,16,32,.82);border:1px solid var(--edge);border-radius:16px;padding:14px 28px;text-align:center;pointer-events:none}#pauseOv b{display:block;font-size:30px;letter-spacing:6px;color:var(--gold)}#pauseOv small{font-size:13px;opacity:.85}
body.paused #cv{filter:saturate(.55) brightness(.8)}
#quest{position:absolute;left:calc(10px + var(--sl));top:calc(122px + var(--st));background:rgba(20,16,32,.72);border:1px solid var(--edge);border-radius:12px;padding:6px 10px;width:230px;font-size:12.5px;line-height:1.5;pointer-events:none}#quest b{color:var(--gold)}#quest small{opacity:.85}
#emoBar{position:absolute;right:calc(110px + var(--sr));top:calc(196px + var(--st));display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#topr{position:absolute;right:calc(10px + var(--sr));top:calc(10px + var(--st));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:200px;height:96px;border-radius:12px;border:1px solid var(--edge);background:rgba(10,8,20,.6)}
#mname{font-size:12px;opacity:.9;text-align:right}
#room{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:5px 10px;font-size:12.5px;cursor:pointer}
#room b{color:var(--gold);letter-spacing:2px}
#btns{position:absolute;right:calc(10px + var(--sr));top:calc(196px + var(--st));display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#btns button{min-height:36px;padding:5px 12px;font-size:13px}
#banner{position:absolute;left:50%;top:18%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .5s;pointer-events:none}
#banner h2{margin:0;font-size:34px;font-weight:900;color:#fff8dc;text-shadow:0 3px 0 #3a2a14,0 0 18px rgba(0,0,0,.6);letter-spacing:6px}
#banner p{margin:4px 0 0;font-size:14px;opacity:.85;text-shadow:0 1px 3px #000}
#evbar{position:absolute;left:50%;top:calc(52px + var(--st));transform:translateX(-50%);background:rgba(40,20,60,.82);border:1px solid rgba(255,207,90,.6);border-radius:12px;padding:5px 14px;font-size:13.5px;font-weight:700;color:#ffe9a8;pointer-events:none;white-space:nowrap}
#bossbar{position:absolute;left:50%;top:calc(12px + var(--st));transform:translateX(-50%);width:min(460px,52vw);text-align:center;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000}
#bossbar .bar{height:14px;margin-top:3px}
#bossbar .bar i{background:linear-gradient(#ff9f6b,#c8362f)}
#bar{position:absolute;right:calc(12px + var(--sr));bottom:calc(26px + var(--sb));display:flex;gap:6px}
.slotb{position:relative;width:52px;height:52px;border-radius:12px;background:linear-gradient(#3b3255,#241d38);border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.slotb b{font-size:22px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.slotb em{position:absolute;left:4px;top:2px;font-style:normal;font-size:10.5px;opacity:.85;font-weight:700}
.slotb span{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:700}
.slotb i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);pointer-events:none}
.slotb.locked{opacity:.38}
.slotb.nomp b{color:#8aa0ff}
#expbar{position:absolute;left:0;right:0;bottom:0;height:calc(16px + var(--sb));background:rgba(0,0,0,.65);padding-bottom:var(--sb)}
#expbar i{position:absolute;left:0;top:0;height:16px;background:linear-gradient(#fff2a0,#e6b52e);transition:width .2s}
#expbar span{position:relative;display:block;text-align:center;font-size:11px;line-height:16px;font-weight:700;text-shadow:0 1px 2px #000}
#combo{position:absolute;right:calc(118px + var(--sr));top:calc(200px + var(--st));text-align:right;pointer-events:none;font-weight:900;color:#ffe08a;text-shadow:0 3px 0 #5a3a10,0 0 12px rgba(0,0,0,.5);opacity:0;transition:opacity .25s}
#combo b{display:block;font-size:40px;line-height:1;font-family:'Arial Black',Impact,sans-serif}#combo small{font-size:13px;color:#fff}
.slotb.ready{box-shadow:0 0 0 2px #ffcf5a,0 0 18px #ffcf5a;animation:rdy 1s infinite alternate}@keyframes rdy{to{box-shadow:0 0 0 2px #fff3b0,0 0 30px #ffcf5a}}
#toast{position:absolute;left:50%;top:32%;transform:translateX(-50%);background:rgba(20,16,32,.9);border:1px solid var(--edge);border-radius:12px;padding:8px 16px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#hint{position:absolute;left:50%;top:calc(64px + var(--st));transform:translateX(-50%);background:rgba(20,16,32,.8);border:1px solid var(--edge);border-radius:10px;padding:5px 12px;font-size:13px;pointer-events:none}
/* windows */
.win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;width:min(560px,94vw);max-height:86vh;overflow:auto}
.win h2{margin:0 0 10px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.win h2 button{min-height:32px;padding:2px 10px}
.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:7px}
.item .ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;flex:none}
.item .tx{flex:1;font-size:13px;line-height:1.5}
.item .tx b{font-size:14.5px}
.item .tx small{opacity:.7}
.item button{min-width:78px}
.bookg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.bk{background:rgba(255,255,255,.05);border-radius:12px;padding:8px;text-align:center;font-size:12.5px;line-height:1.5}.bk img{width:64px;height:64px;display:block;margin:0 auto 2px}.bk.un img{filter:brightness(0) opacity(.45)}.bk .st{color:var(--gold);letter-spacing:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;line-height:1.7}
.kv b{color:var(--gold);font-weight:700}
/* touch */
#tpad{position:fixed;inset:0;z-index:12;pointer-events:none}
#tzone{position:absolute;left:0;top:25%;bottom:0;width:46%;pointer-events:auto}
#stick{position:absolute;width:var(--stk,124px);height:var(--stk,124px);border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);display:none;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;background:rgba(255,255,255,.35);transform:translate(-50%,-50%)}
#tbtns{position:absolute;left:var(--sl);top:var(--st);right:calc(6px + var(--sr));bottom:calc(20px + var(--sb));pointer-events:none}
#tbtns .slotb{position:absolute;pointer-events:auto;border-radius:50%;touch-action:none;transform:translate(-50%,-50%);border-width:2px}
#tbtns .slotb b{font-size:var(--fs,22px)}#tbtns .slotb span{font-size:calc(var(--fs,22px)*.5)}
body.tedit #tbtns .slotb{outline:2px dashed rgba(255,255,255,.55);outline-offset:3px;cursor:move}
body.tedit #tbtns .slotb.tsel{outline:3px solid var(--gold)}
body.tedit #tzone{background:rgba(127,214,194,.08);outline:2px dashed rgba(127,214,194,.4);outline-offset:-6px}
#wTouch{position:fixed;left:50%;top:calc(8px + var(--st));transform:translateX(-50%);z-index:26;width:min(560px,94vw);padding:12px 16px}
#wTouch h2{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#wTouch h2 small{font-weight:400;opacity:.7;font-size:12px}
#wTouch .tg{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:13px}
#wTouch input[type=range]{min-height:0;padding:0;border:none;background:none;width:100%;accent-color:#ffcf5a;height:28px}
#wTouch output{min-width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold)}
#tbtns .slotb.jump{background:linear-gradient(#4b8a7a,#2b5a4f)}
body.touch #bar{display:none}
body.touch #btns{top:calc(10px + var(--st));right:calc(222px + var(--sr));flex-direction:row}
@media (max-height:520px){#mini{width:150px;height:72px}body.touch #btns{right:calc(172px + var(--sr))}#pinfo{width:200px;padding:6px 8px}#mate{top:calc(98px + var(--st))}}
#wDeath{text-align:center}
.kf{outline:3px solid var(--gold)!important;outline-offset:2px;box-shadow:0 0 0 7px rgba(255,207,90,.2)!important}
.navhint{font-size:12px;opacity:.62;text-align:center;margin:10px 0 0;line-height:1.6}
body.touch .navhint{display:none}
.krow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:5px 8px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:5px;font-size:13.5px}
.krow button{min-width:96px;min-height:34px;padding:4px 10px;font-weight:700}
.krow button.wait{background:linear-gradient(#ffd56e,#e7a93a);color:#3a2408}
.keys2{display:grid;grid-template-columns:1fr;gap:0}
#wKeys{width:min(440px,94vw)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- title -->
<div id="sTitle" class="screen on"><div class="panel" style="width:min(640px,100%)">
 <h1 class="logo">云岛冒险</h1>
 <p class="sub">横版刷怪 · 职业技能 · 双人联机</p>
 <div class="slots" id="slots"></div>
 <div class="row" id="titleBtns">
  <button class="pri" id="bSolo">单人冒险</button>
  <button id="bHost">创建房间</button>
  <input id="joinCode" maxlength="4" placeholder="房间码" style="width:96px;text-transform:uppercase;text-align:center;letter-spacing:3px">
  <button id="bJoin">加入</button>
 </div>
 <div class="row" style="margin-top:10px"><button class="ghost" id="bHelp0">操作说明</button><button class="ghost" id="bKeys0">按键设置</button><button class="ghost" id="bImport">导入存档</button><button class="ghost" id="bExport0">导出存档</button><input type="file" id="fImport" accept=".json,application/json" style="display:none"></div>
 <p class="navhint"></p>
 <p class="note" id="titleNote"></p>
</div></div>

<!-- create -->
<div id="sCreate" class="screen"><div class="panel" style="width:min(720px,100%)">
 <h2 style="margin:0 0 6px;text-align:center">创建角色</h2>
 <div class="row"><span>名字</span><input id="cName" maxlength="8" style="width:180px"></div>
 <div class="cls" id="clsList"></div>
 <div class="row" id="diffRow"><span>难度</span><button data-diff="easy">休闲</button><button data-diff="normal">普通</button><button data-diff="hard">困难</button></div>
 <p class="note" id="diffNote" style="margin:4px 0 10px"></p>
 <div class="row"><button class="ghost" id="cBack">返回</button><button class="pri" id="cOk">开始冒险</button></div>
 <p class="navhint"></p>
</div></div>

<!-- HUD -->
<div id="hud" class="hidden">
 <div id="pinfo">
  <div class="lvrow"><b id="hLv">Lv.1</b><span id="hName"></span><span id="hCls" style="opacity:.7"></span></div>
  <div class="bar hp"><i id="hpF"></i><span id="hpT"></span></div>
  <div class="bar mp"><i id="mpF"></i><span id="mpT"></span></div>
  <div class="meso"><span class="coin"></span><span id="hMeso">0</span><span id="hBuff" style="margin-left:auto;font-size:11.5px;color:var(--acc)"></span></div>
 </div>
 <div id="quest" class="hidden"></div>
 <div id="mate" class="hidden"><div><b id="mName"></b> <span id="mLv"></span> <span id="mMap" style="opacity:.65"></span></div><div class="bar hp"><i id="mHp"></i></div></div>
 <div id="topr"><canvas id="mini" width="400" height="192"></canvas><div id="mname"></div><div id="room" class="hidden"></div></div>
 <div id="btns">
  <button id="bSkill">技能 K</button>
  <button id="bBag">背包 B</button>
  <button id="bBook">图鉴 N</button>
  <button id="bEmo">表情</button>
  <button id="bShop" class="hidden">商店 ↑</button>
  <button id="bMenu">菜单</button>
 </div>
 <div id="emoBar" class="hidden"></div>
 <div id="evbar" class="hidden"></div>
 <div id="bossbar" class="hidden"><span id="bossName"></span><div class="bar"><i id="bossF"></i><span id="bossT"></span></div></div>
 <div id="banner"><h2 id="bnT"></h2><p id="bnS"></p></div>
 <div id="hint" class="hidden"></div>
 <div id="bar"></div>
 <div id="expbar"><i id="expF"></i><span id="expT"></span></div>
 <div id="toast"></div>
 <div id="pauseOv" class="hidden"><b>已暂停</b><small></small></div>
 <div id="combo"></div>
</div>

<div id="tpad" class="hidden"><div id="tzone"><div id="stick"><div id="knob"></div></div></div><div id="tbtns"></div></div>

<!-- windows -->
<div id="wSkill" class="panel win hidden"><h2><span>技能 <small id="spLeft" style="font-size:13px;color:var(--gold)"></small></span><button data-close>关闭</button></h2><div id="skList"></div><div class="kv" id="statKv" style="margin-top:8px"></div><p class="navhint"></p></div>
<div id="wShop" class="panel win hidden"><h2><span>杂货商 · 莉卡 <small style="font-size:13px"><span class="coin"></span> <span id="shopMeso"></span></small></span><button data-close>关闭</button></h2><div id="shopList"></div><p class="navhint"></p></div>
<div id="wTalk" class="panel win hidden"><h2><span id="talkName"></span><button data-close>关闭</button></h2><p id="talkText" style="line-height:1.8;font-size:14.5px;margin:0 0 12px"></p><div class="row"><button id="talkNext">下一条</button></div><p class="navhint"></p></div>
<div id="wMenu" class="panel win hidden" style="width:min(340px,92vw)"><h2><span>菜单</span><button data-close>关闭</button></h2>
 <div style="display:flex;flex-direction:column;gap:8px">
  <button data-close>继续游戏</button><button id="mSave">保存游戏</button><button id="mExport">导出存档文件</button><button id="mTouch" class="hidden">触屏按键布局</button><button id="mKeys">按键设置</button><button id="mHelp">操作说明</button><button id="mMusic">音乐：开</button><button id="mMute">声音：开</button><button id="mFull">全屏</button><button id="mQuit">保存并返回标题</button><p class="note" id="saveNote" style="margin:4px 0 0;font-size:12.5px;opacity:.8"></p>
 </div><p class="navhint"></p></div>
<div id="wTouch" class="panel hidden"><h2><span>触屏按键布局 <small>拖动按钮改位置，点按钮后可单独调大小</small></span><button class="pri" id="tDone">完成</button></h2>
 <div class="tg">
  <span>整体大小</span><input type="range" id="tScale" min="60" max="180" step="5"><output id="oScale"></output>
  <span id="tSelName">选中按钮</span><input type="range" id="tSize" min="50" max="220" step="5"><output id="oSize"></output>
  <span>不透明度</span><input type="range" id="tOp" min="25" max="100" step="5"><output id="oOp"></output>
  <span>摇杆大小</span><input type="range" id="tStick" min="60" max="180" step="5"><output id="oStick"></output>
 </div>

/* ---------------- terrain ----------------
   A map is a set of runs: x-monotonic polylines you can stand on.
   ground runs are solid land that reaches the bottom of the map; where two
   neighbouring ground runs meet at different heights there is a wall.
   isle runs are solid floating islands, plat runs are thin one-way platforms. */
const STEP=14;
function mkRun(pts,kind){const r={pts,kind,x0:pts[0][0],x1:pts[pts.length-1][0],L:null,R:null};r.ymin=Math.min(...pts.map(p=>p[1]));r.ymax=Math.max(...pts.map(p=>p[1]));return r;}
function runY(r,x){const P=r.pts;if(x<=P[0][0])return P[0][1];for(let i=1;i<P.length;i++)if(x<=P[i][0]){const a=P[i-1],b=P[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);}return P[P.length-1][1];}
function runAt(M,x,y,tol=3){let b=null,bd=tol;for(const r of M.runs){if(r.gone>0||x<r.x0-1||x>r.x1+1)continue;const d=Math.abs(runY(r,clamp(x,r.x0,r.x1))-y);if(d<=bd){bd=d;b=r;}}return b;}
function landRun(M,px,py,x,y,skip){let best=null,by=1e9;for(const r of M.runs){if(r===skip||r.gone>0||x<r.x0||x>r.x1)continue;const ry=runY(r,x),pry=runY(r,clamp(px,r.x0,r.x1));if(py<=pry+1.5&&y>=ry-.01&&ry<by){best=r;by=ry;}}return best;}
function surfBelow(M,x,y){let b=null,by=1e9;for(const r of M.runs){if(r.gone>0||x<r.x0||x>r.x1)continue;const ry=runY(r,x);if(ry>=y-.5&&ry<by){by=ry;b=r;}}return b?{r:b,y:by}:null;}
function groundAt(M,x){for(const r of M.gruns)if(x>=r.x0&&x<=r.x1)return runY(r,x);return M.gy;}
// a column of stacked platforms, alternate rows shifted by st
const col=(x,w,ys,st=50)=>ys.map((y,i)=>[[x+(i%2?st:0),y],[x+(i%2?st:0)+w,y]]);

 M.crumbles=[];for(const pts of d.crumble||[]){const r=mkRun(pts,'plat');r.crumble=1;r.ct=0;r.gone=0;M.runs.push(r);M.crumbles.push(r);}
 M.movers=[];for(const [x,y,w,ax,ay,per] of d.movers||[]){const r=mkRun([[x,y],[x+w,y]],'plat');r.mv={bx:x,by:y,w,ax,ay,per,dx:0};M.runs.push(r);M.movers.push(r);}

function moverTick(M){const T=mechTime();for(const r of M.movers){const v=r.mv,sn=Math.sin(T*TAU/v.per),nx=v.bx+v.ax*sn,ny=v.by+v.ay*sn;v.dx=nx-r.x0;r.pts[0][0]=nx;r.pts[0][1]=ny;r.pts[1][0]=nx+v.w;r.pts[1][1]=ny;r.x0=nx;r.x1=nx+v.w;r.ymin=r.ymax=ny;}}
function mechTick(M,dt){
 moverTick(M);if(GUST.t>0)GUST.t-=dt;
 for(const r of M.runs){if(!r.crumble)continue;
  if(r.gone>0){r.gone-=dt;if(r.gone<=0){r.gone=0;r.ct=0;}continue;}
  if(r.ct>0){r.ct+=dt;if(r.ct>=.7){r.gone=4.5;r.ct=0;sfx('crumble');if(ME&&ME.run===r){ME.onGround=false;ME.run=null;ME.vy=0;}}}}
}
function buildMap(d,i){
 const M=Object.assign({},d,{id:i});
 const gr=[];let cur=[d.ground[0]];
 for(let k=1;k<d.ground.length;k++){const p=d.ground[k],q=d.ground[k-1];if(p[0]===q[0]){gr.push(mkRun(cur,'ground'));cur=[p];}else cur.push(p);}
 gr.push(mkRun(cur,'ground'));
 M.walls=[];const cliffs=[];
 for(let k=0;k<gr.length-1;k++){const A=gr[k],B=gr[k+1];A.R=B;B.L=A;const ya=A.pts[A.pts.length-1][1],yb=B.pts[0][1];
  if(Math.abs(ya-yb)>STEP){M.walls.push({x:A.x1,top:Math.min(ya,yb),bot:Math.max(ya,yb),hiL:ya<yb});
   if(Math.abs(ya-yb)>=95)cliffs.push({x:A.x1+(yb>ya?20:-20),top:Math.min(ya,yb),bot:Math.max(ya,yb),hi:ya<yb?A:B});}}
 M.gruns=gr;
 M.runs=gr.concat((d.isles||[]).map(p=>mkRun(p,'isle')),(d.plats||[]).map(p=>mkRun(p,'plat')));
 M.gy=Math.max(...gr.map(r=>r.ymax));
 const R=srng(i*7919+13);
 // isle undersides
 for(const r of M.runs)if(r.kind==='isle'){const w=r.x1-r.x0,N=Math.max(4,Math.ceil(w/26));r.under=[];
  for(let j=N;j>=0;j--){const x=r.x0+w*j/N,f=1-Math.abs(2*j/N-1);r.under.push([x,runY(r,x)+14+(26+w*.2)*Math.pow(f,.75)+(j&&j<N?R()*16*f:0)]);}
  r.umax=Math.max(...r.under.map(p=>p[1]));}
 // ropes
 M.ropes=[];
 const nearPortal=x=>(d.portals||[]).some(p=>Math.abs(p[0]-x)<60);
 M.runs.filter(r=>r.kind!=='ground').forEach((r,j)=>{
  const w=r.x1-r.x0,fs=w>420?[.15,.85]:[j%2?.8:.2];
  for(const f of fs){const x=Math.round(r.x0+w*f);if(nearPortal(x))continue;const top=runY(r,x),s=surfBelow(M,x,top+6);if(s&&s.y-top>=70&&!(d.lava||[]).some(l=>x>l[0]-20&&x<l[1]+20))M.ropes.push({x,top,bot:s.y,topRun:r});}});
 for(const c of cliffs)M.ropes.push({x:c.x,top:c.top,bot:c.bot,topRun:c.hi,cliff:1});
 // portals, npcs, hazards
 const snapY=(x,y)=>{if(y==null)return groundAt(M,x);const r=runAt(M,x,y,40);return r?runY(r,x):y;};
 M.portals=d.portals.map(([x,y,to,ti,label])=>({x,y:snapY(x,y),to,ti,label}));
 M.npcs=(d.npcs||[]).map(n=>Object.assign({},n,{y:groundAt(M,n.x)}));
 M.pads=(d.pads||[]).map(x=>({x,y:groundAt(M,x),t:9}));
 M.lava=(d.lava||[]).map(([x0,x1,y])=>({x0,x1,y}));
 M.geysers=(d.geysers||[]).map((x,k)=>({x,y:groundAt(M,x),per:4.4+(k%3)*.6,off:k*1.37}));
 M.spawnX=d.spawn||200;
 M.bossDef=(d.fixed||[]).find(f=>isBossT(f[0]))||null;
 M.fly=[Math.min(...M.runs.map(r=>r.ymin))-60,M.gy-80];
 decorate(M,R,d);
 return M;
}
function decorate(M,R,d){
 const set=DSET[M.theme],tot=set.reduce((a,b)=>a+b[1],0);
 const pickD=()=>{let q=R()*tot;for(const [k,w] of set){q-=w;if(q<=0)return k;}return set[0][0];};
 const small=set.filter(s=>!BIGD.has(s[0])).map(s=>s[0]);
 const avoid=x=>M.portals.some(p=>Math.abs(p.x-x)<70)||M.npcs.some(p=>Math.abs(p.x-x)<70)||M.pads.some(p=>Math.abs(p.x-x)<55)||M.lava.some(l=>x>l.x0-34&&x<l.x1+34)||M.geysers.some(g=>Math.abs(g.x-x)<46)||M.walls.some(w=>Math.abs(w.x-x)<26);
 const dec=[];
 for(const r of M.runs){
  const w=r.x1-r.x0,n=Math.floor(w/(r.kind==='ground'?(M.safe?160:90):105));
  for(let k=0;k<n;k++){const x=r.x0+20+R()*(w-40),y=runY(r,x);
   if(avoid(x)||M.ropes.some(q=>Math.abs(q.x-x)<26&&(Math.abs(q.top-y)<4||Math.abs(q.bot-y)<4)))continue;
   let t=pickD();if(r.kind==='plat'&&BIGD.has(t)&&R()<.75)t=small[Math.floor(R()*small.length)];
   dec.push({k:t,x,y:y+2,s:.82+R()*.4,r:R(),back:BIGD.has(t)});}
 }
 for(const [k,x,y] of (d.deco||[])){const yy=y==null?groundAt(M,x):y;dec.push({k,x,y:yy+2,s:1,r:R(),back:BIGD.has(k)});}
 dec.sort((a,b)=>(a.k==='house'||a.k==='house2'||a.k==='throne'||a.k==='mill'?0:1)-(b.k==='house'||b.k==='house2'||b.k==='throne'||b.k==='mill'?0:1));
 M.dec=dec;
 M.hang=[];
 for(const r of M.runs){if(r.kind==='ground')continue;
  if(r.kind==='isle'){for(const [x,y] of r.under)if(R()<.7)M.hang.push({x:x+R()*10-5,y:y-4,len:10+R()*34,r:R(),isle:1});}
  else for(let x=r.x0+12;x<r.x1-8;x+=(DSET[M.theme]===DSET.hell||M.theme==='ruin'||M.theme==='throne'||M.theme==='volcano'?60:18)+R()*34)M.hang.push({x,y:runY(r,x)+17,len:6+R()*20,r:R()});}
 M.tufts=[];
 for(const r of M.runs)for(let x=r.x0+5;x<r.x1-4;x+=8+R()*15)M.tufts.push({x,y:runY(r,x),r:R()});
 M.clouds=[];for(let k=0;k<8;k++)M.clouds.push({x:R()*2600,y:20+R()*190,s:.6+R()*.9,v:3+R()*9});
}

  const comp=c.createDynamicsCompressor();AU.master=c.createGain();AU.master.gain.value=AU.muted?0:.55;AU.master.connect(comp);comp.connect(c.destination);
  const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;}catch(e){}

 const c=AU.ctx;if(!c)return;const t=c.currentTime+delay,r=1+rnd(-.08,.08);
 const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0*r,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1*r),t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 let n=o;if(lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(f);n=f;}n.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+.02);
}

 const s=c.createBufferSource();s.buffer=AU.noise;const f=c.createBiquadFilter();f.type=ft;f.Q.value=Q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
 const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
}

function pathPts(c,pts,dy=0,move=true){pts.forEach((p,i)=>(i||!move)?c.lineTo(p[0],p[1]+dy):c.moveTo(p[0],p[1]+dy));}
function crustLine(c,pts,C){
 c.lineCap='butt';c.lineJoin='round';
 c.beginPath();pathPts(c,pts,C.band/2);c.lineWidth=C.band;c.strokeStyle=C.c;c.stroke();
 c.beginPath();pathPts(c,pts,C.band);c.lineWidth=2.2;c.strokeStyle=C.dark;c.stroke();
 c.beginPath();pathPts(c,pts,1.6);c.lineWidth=2.4;c.strokeStyle=C.hi;c.stroke();
 c.beginPath();pathPts(c,pts,0);c.lineWidth=2;c.strokeStyle=OL;c.stroke();
 c.lineCap='round';
}
function crustBumps(c,r,C,x0,x1){
 if(!C.bump)return;c.fillStyle=C.c;c.beginPath();
 for(let x=Math.max(r.x0+4,Math.floor(x0/13)*13);x<Math.min(r.x1-6,x1);x+=13){const y=runY(r,x+6)+C.band-1;c.moveTo(x+12,y);c.arc(x+6,y,6,0,Math.PI);}
 c.fill();
}
function drawTerrain(c,M,t){

 for(const r of M.runs){

   c.beginPath();pathPts(c,r.pts);c.lineTo(r.x1,M.H+80);c.lineTo(r.x0,M.H+80);c.closePath();
   c.fillStyle=tex;c.fill();
   for(const side of [0,1]){const nb=side?r.R:r.L,ex=side?r.x1:r.x0,ey=side?r.pts[r.pts.length-1][1]:r.pts[0][1];
    if(!nb)continue;const ny=runY(nb,ex);if(ny<=ey+STEP)continue;
    const d=side?-1:1;c.fillStyle=lg(c,ex,0,ex+d*16,0,'rgba(0,0,0,.35)','rgba(0,0,0,0)');c.fillRect(Math.min(ex,ex+d*16),ey,16,ny-ey);
    c.strokeStyle=OL;c.lineWidth=2.4;c.beginPath();c.moveTo(ex,ey);c.lineTo(ex,ny+2);c.stroke();}
   crustLine(c,r.pts,C);crustBumps(c,r,C,x0,x1);

   c.fillStyle=tex;c.fill();c.fillStyle=lg(c,0,r.ymin,0,r.umax,'rgba(0,0,0,.05)','rgba(0,0,0,.5)');c.fill();c.lineWidth=2.4;c.strokeStyle=OL;c.stroke();
   crustLine(c,r.pts,C);crustBumps(c,r,C,x0,x1);

   if(r.crumble){c.save();if(r.ct>0)c.translate(rnd(-2.5,2.5),r.ct*6);drawPlat(c,M,r,V,C,tex,x0,x1);c.strokeStyle='rgba(40,10,0,.75)';c.lineWidth=2;c.beginPath();for(let i=1;i<4;i++){const x=r.x0+(r.x1-r.x0)*i/4,y=runY(r,x);c.moveTo(x-6,y+1);c.lineTo(x+3,y+8);c.lineTo(x-2,y+15);}c.stroke();

 }

  c.strokeStyle='rgba(40,24,14,.5)';c.lineWidth=1.2;c.beginPath();pathPts(c,top,7);c.stroke();c.beginPath();pathPts(c,top,12);c.stroke();
  body();c.lineWidth=2.2;c.strokeStyle=OL;c.stroke();
  for(const ex of [r.x0+3,r.x1-3]){const y=runY(r,ex)+th/2;ell(c,ex,y,4.5,th/2+1);fo(c,'#c99a66',1.8);c.strokeStyle='#8a5e3c';c.lineWidth=1;circ(c,ex,y,2.5);c.stroke();}

 }

  body();c.fillStyle=lg(c,0,r.ymin,0,r.ymax+th,'rgba(220,240,255,.95)','rgba(130,175,230,.95)');c.fill();
  c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=1.5;c.beginPath();for(let x=r.x0+20;x<r.x1-10;x+=46){const y=runY(r,x);c.moveTo(x,y+th-3);c.lineTo(x+10,y+4);}c.stroke();
  body();c.lineWidth=2;c.strokeStyle='#3a4a7a';c.stroke();crustLine(c,top,C);return;
 }
 body();c.fillStyle=tex;c.fill();c.fillStyle=lg(c,0,r.ymin,0,r.ymax+th,'rgba(0,0,0,0)','rgba(0,0,0,.35)');c.fill();
 c.lineWidth=2.2;c.strokeStyle=OL;c.stroke();

function drawTufts(c,M,C,x0,x1,y0,y1,t){

function drawHang(c,M,V,x0,x1,y0,y1,t){

  }
 }

let REBIND=null;
const NAV={root:null,i:0,el:null};
function navRoot(){
 const w=WINS.find(id=>!$(id).classList.contains('hidden'));if(w)return $(w);
 if(state==='play'&&!$('wDeath').classList.contains('hidden'))return $('wDeath');
 if(state==='title')return $('sTitle');if(state==='create')return $('sCreate');return null;
}
function navEls(root){
 const all=[...root.querySelectorAll('button,input,.slot,.ccard')].filter(e=>e.offsetParent!==null&&!e.classList.contains('del'));
 const head=all.filter(e=>e.matches('h2 [data-close]'));
 return all.filter(e=>!head.includes(e)).concat(head);
}
function navStart(root,els){
 const f=id=>els.indexOf($(id));
 if(root.id==='sTitle'){const a=f('bSolo');if(!$('bSolo').disabled&&a>=0)return a;const sl=els.filter(e=>e.classList.contains('slot'));return Math.max(0,els.indexOf(sl[slotSel]));}
 if(root.id==='sCreate')return Math.max(0,els.findIndex(e=>e.classList.contains('ccard')&&e.classList.contains('sel')));
 if(root.id==='wTalk')return Math.max(0,f('talkNext'));
 return 0;
}
function navSync(){
 const root=navRoot();
 if(!root||TOUCH){if(NAV.el){NAV.el.classList.remove('kf');NAV.el=null;}NAV.root=root;return;}
 const els=navEls(root);
 if(root!==NAV.root){NAV.root=root;NAV.i=navStart(root,els);}
 NAV.i=clamp(NAV.i,0,Math.max(0,els.length-1));
 const el=els[NAV.i]||null;
 if(el!==NAV.el){if(NAV.el)NAV.el.classList.remove('kf');NAV.el=el;if(el){el.classList.add('kf');try{el.scrollIntoView({block:'nearest'});}catch(e){}}}
}
function navBack(root){
 sfx('click');
 if(root.id==='sCreate'){$('cBack').click();return;}
 if(root.id==='sTitle')return;
 if(root.id==='wDeath'){toggleWin('wMenu');return;}
 const back=state==='play'&&(root.id==='wHelp'||root.id==='wKeys');
 closeWins();if(back)toggleWin('wMenu');
}
function navKey(code,root){
 if(root!==NAV.root){if(NAV.el){NAV.el.classList.remove('kf');NAV.el=null;}navSync();}
 if(code==='Escape'){navBack(root);return;}
 if((root.id==='wSkill'&&code===BIND.skills)||(root.id==='wBag'&&code===BIND.bag)||(root.id==='wBook'&&code===BIND.book)){closeWins();return;}
 const els=navEls(root);if(!els.length)return;
 const prev=code==='ArrowUp'||code==='ArrowLeft'||code===BIND.up||code===BIND.left||(code==='Tab'&&KEY.ShiftLeft);
 const next=!prev&&(code==='ArrowDown'||code==='ArrowRight'||code===BIND.down||code===BIND.right||code==='Tab');
 const ok=code==='Enter'||code==='NumpadEnter'||code==='Space'||code===BIND.atk;
 if(prev||next){NAV.i=(NAV.i+(prev?-1:1)+els.length)%els.length;sfx('tick');
  const el=els[NAV.i];if(root.id==='sCreate'&&el.classList.contains('ccard'))el.click();}
 else if(ok){const el=els[NAV.i];if(!el)return;
  if(el.tagName==='INPUT'){el.focus();el.select();return;}
  if(el.disabled){sfx('nope');return;}
  el.click();
  if(el.classList.contains('ccard'))NAV.i=navEls(root).indexOf($('cOk'));
  else if(el.classList.contains('slot')&&state==='title'&&loadSlots()[slotSel]){NAV.root=$('sTitle');NAV.i=navEls($('sTitle')).indexOf($('bSolo'));}
 }
 else if((code==='Delete'||code==='Backspace')&&root.id==='sTitle'){const el=els[NAV.i];const d=el&&el.querySelector&&el.querySelector('.del');if(d)d.click();}
 if(NAV.el){NAV.el.classList.remove('kf');NAV.el=null;}
 navSync();
}
addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 auInit();
 const ae=document.activeElement;if(ae&&ae.tagName==='BUTTON')ae.blur();
 if(REBIND){e.preventDefault();if(e.code!=='Escape')setBind(REBIND,e.code);REBIND=null;renderKeys();return;}
 const root=navRoot();
 if(root){
  e.preventDefault();
  for(const k in KEY)KEY[k]=false;KEY.ShiftLeft=e.shiftKey;
  const moveKeys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',BIND.up,BIND.down,BIND.left,BIND.right];
  if(e.repeat&&!moveKeys.includes(e.code))return;
  navKey(e.code,root);return;
 }
 if(state==='play'){
  if(e.code==='Escape'){if(PAUSE&&$('wMenu').classList.contains('hidden')){PAUSE=false;e.preventDefault();return;}toggleWin('wMenu');e.preventDefault();return;}
  if(e.code==='KeyP'&&!isBound('KeyP')){togglePause();e.preventDefault();return;}
  if(e.code===BIND.skills){toggleWin('wSkill');e.preventDefault();return;}
  if(e.code===BIND.bag){toggleWin('wBag');e.preventDefault();return;}
  if(/^Digit[1-4]$/.test(e.code)&&!isBound(e.code)&&!e.repeat){emote(+e.code.slice(5)-1);return;}
  if(e.code===BIND.book){toggleWin('wBook');e.preventDefault();return;}
  if(e.code==='KeyM'&&!isBound('KeyM')){setMute(!AU.muted);return;}
 }
 if(isBound(e.code)||e.code==='Space'||e.code==='Tab'||e.code.startsWith('Arrow')||e.code.startsWith('Alt'))e.preventDefault();
 if(!e.repeat)PRESS[e.code]=true;KEY[e.code]=true;
});
function setBind(a,code){
 const other=ACTIONS.find(([x])=>x!==a&&BIND[x]===code);
 if(other){BIND[other[0]]=BIND[a];toast('「'+other[1]+'」改为 '+keyName(BIND[a]));}
 BIND[a]=code;saveBind();onBindChange();sfx('learn');
}
function onBindChange(){if(state==='play')buildSlots();renderHelp();updNavHints();for(const k in KEY)KEY[k]=false;}
function renderKeys(){
 const L=$('keyList');L.innerHTML='';
 for(const [a,label] of ACTIONS){const r=document.createElement('div');r.className='krow';r.innerHTML='<span>'+label+'</span>';
  const b=document.createElement('button');b.textContent=REBIND===a?'按下新按键…':kn(a);if(REBIND===a)b.classList.add('wait');
  b.onclick=()=>{REBIND=a;renderKeys();};r.appendChild(b);L.appendChild(r);}
 $('keysNote').textContent=REBIND?'按下想要的按键（Esc 取消）。如果这个键已被占用，两个动作会互换按键。':'选中一项后按 回车 或 '+kn('atk')+'，再按下新按键。Esc 返回。打开菜单固定用 Esc。';
 if(NAV.el){NAV.el.classList.remove('kf');NAV.el=null;}
}
$('kWasd').onclick=()=>{BIND=Object.assign({},PRESETS.wasd);saveBind();onBindChange();renderKeys();toast('已切换为 WASD 布局');};
$('kArrows').onclick=()=>{BIND=Object.assign({},PRESETS.arrows);saveBind();onBindChange();renderKeys();toast('已切换为方向键布局');};
function renderHelp(){
 const sk=['s0','s1','s2','s3','s4'].map(kn).join(' ');
 $('helpKv').innerHTML=[
  ['移动',kn('left')+' '+kn('right')+'　（'+kn('down')+' 蹲下，'+kn('down')+' + '+kn('jump')+' 从平台跳下）'],
  ['跳跃',kn('jump')],
  ['攀爬','在绳子旁按 '+kn('up')+' / '+kn('down')+'，爬绳时按 '+kn('left')+' / '+kn('right')+' + '+kn('jump')+' 离开'],
  ['普通攻击',kn('atk')+'（按住连续攻击）'],['二段跳','空中再按一次 '+kn('jump')+'；爬绳时按 '+kn('jump')+' 可以直接向上跳'],['大招',kn('ult')+'：打怪积累怒气，满 100 后释放全屏大招，释放时短暂无敌'],['连击','连续命中越多伤害越高，每 10 连击 +5%，最多 +25%，2 秒不打就清零'],['技能',sk],['药水',kn('potR')+' 红药水　'+kn('potB')+' 蓝药水'],
  ['传送门 / 对话 / 商店','站在传送门或 NPC 旁按 '+kn('up')],['技能窗口',kn('skills')],['背包 / 图鉴',kn('bag')+' 背包（装备戒指、项链、披风，出售）　'+kn('book')+' 怪物图鉴'],['转职',JOBLV+' 级后回村找向导阿栗，二选一，获得技能 5（'+kn('s4')+'）'],['任务','左上角显示当前任务，完成后自动领奖并接下一个'],['表情','数字键 1–4，或右上「表情」按钮'],['地区机关','峡谷有上升气流、雪原有滑索（按 '+kn('up')+'）、火山有会塌的石台、地狱有移动平台、丛林可以荡藤蔓'],['双人机关','两人同时站在地图两端的机关上，会出现两个宝箱。每张地图最高处还藏着一个秘密宝箱'],['暂停 / 存档','P 暂停（单人时打开菜单也会暂停）；每 5 秒自动保存，菜单里可以手动保存、导出存档文件，标题画面可导入'],['菜单','Esc'],
  ['窗口与菜单',kn('up')+' / '+kn('down')+'（或方向键）选择，回车 / 空格 / '+kn('atk')+' 确认，Esc 返回'],
  ['精英与事件','金色光环的「精英」怪更强，但掉落 4 倍经验和道具。每张练级图每隔几分钟会触发事件：怪物潮、流星雨、寻宝、宝箱怪'],
  ['宠物','在莉卡的商店购买，跟在身边自动拾取金币和药水'],
  ['道具','地图上发光的球可以直接捡：力=攻击 +30%，域=攻击范围 +40%，盾=受伤 -40%，速=移动加速（各 40 秒），愈=回复一半 HP/MP；菱形结晶永久提升攻击或 HP'],
  ['改键','菜单 → 按键设置：WASD 布局、方向键布局，或逐个改键'],
  ['触屏','左半屏拖动摇杆移动（上推爬绳 / 进传送门），右下按钮攻击、跳跃、技能、药水。菜单 → 触屏按键布局 可拖动按钮、调大小和透明度'],
  ['联机','一人「创建房间」，把 4 位房间码发给队友，队友输入后加入。同一地图里的队友分享经验（各得 75%），倒下的队友可以靠近按住 '+kn('up')+' 复活。'],
 ].map(([k,v])=>'<b>'+k+'</b><span>'+esc(v)+'</span>').join('');
}
function updNavHints(){
 const t=kn('up')+' '+kn('down')+' 选择 · 回车 或 '+kn('atk')+' 确认 · Esc 返回';
 for(const e of document.querySelectorAll('.navhint'))if(e.id!=='keysNote')e.textContent=e.closest('#sTitle')?t+' · Del 删除角色':t;
}
addEventListener('keyup',e=>{KEY[e.code]=false;});
addEventListener('blur',()=>{for(const k in KEY)KEY[k]=false;});
// touch joystick
const STK={id:null,ox:0,oy:0,upLatch:false,max:50};
function enableTouch(){if(TOUCH)return;TOUCH=true;document.body.classList.add('touch');$('mTouch').classList.remove('hidden');if(state==='play'){$('tpad').classList.remove('hidden');layoutTouch();}}
addEventListener('touchstart',()=>{enableTouch();auInit();},{passive:true});
if(matchMedia&&matchMedia('(pointer:coarse)').matches)enableTouch();
const tz=$('tzone'),stick=$('stick'),knob=$('knob');
tz.addEventListener('pointerdown',e=>{e.preventDefault();auInit();if(STK.id!=null||TED.on)return;STK.id=e.pointerId;STK.ox=e.clientX;STK.oy=e.clientY;tz.setPointerCapture&&tz.setPointerCapture(e.pointerId);
 const r=tz.getBoundingClientRect();stick.style.display='block';stick.style.left=(e.clientX-r.left)+'px';stick.style.top=(e.clientY-r.top)+'px';knob.style.transform='translate(-50%,-50%)';});
tz.addEventListener('pointermove',e=>{if(e.pointerId!==STK.id)return;let dx=e.clientX-STK.ox,dy=e.clientY-STK.oy;const d=Math.hypot(dx,dy),m=STK.max;if(d>m){dx*=m/d;dy*=m/d;}
 knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
 TIN.left=dx<-m*.3;TIN.right=dx>m*.3;const up=dy<-m*.52,dn=dy>m*.52;if(up&&!TIN.up)TIN.upP=true;TIN.up=up;TIN.down=dn;});
const stkEnd=e=>{if(e.pointerId!==STK.id)return;STK.id=null;TIN.left=TIN.right=TIN.up=TIN.down=false;stick.style.display='none';};
tz.addEventListener('pointerup',stkEnd);tz.addEventListener('pointercancel',stkEnd);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------------- main loop ---------------- */
let last=performance.now(),saveT=0;
function step(dt){
 if(state==='title'||state==='create'){TITLE.t+=dt;const nm=TITLE_MAPS[Math.max(0,Math.floor(TITLE.t/10))%TITLE_MAPS.length];if(nm!==TITLE.map){TITLE.map=nm;AMB.length=0;}
  const M=MAPS[TITLE.map],ph=(TITLE.t%10)/10;cam.x=(.15+ph*.7)*(M.W-VIEW.w);cam.y=clamp(M.gy-VIEW.h*.72-(M.H>1300?260:0),0,M.H-VIEW.h);ambStep(M,dt,TITLE.t);if(state==='create')drawCreatePreviews(TITLE.t);return;}
 if(state!=='play'||!ME)return;
 {const pz=canPause()&&(PAUSE||!$('wMenu').classList.contains('hidden'));if(pz!==PAUSED){PAUSED=pz;document.body.classList.toggle('paused',pz);$('pauseOv').classList.toggle('hidden',!pz||!$('wMenu').classList.contains('hidden'));
   $('pauseOv').querySelector('small').textContent=TOUCH?'点「菜单」→「继续游戏」':'按 '+(isBound('KeyP')?'Esc':'P')+' 继续';}
  if(pz){PAUSE_T+=dt;return;}}
 G.time+=dt;
 mechTick(MAPS[ME.map],dt);
 const inp=readInput();
 stepLocal(ME,inp,dt);
 for(const q of P)if(q&&q.emo){q.emo.t-=dt;if(q.emo.t<=0)q.emo=null;}
 if(IS_HOST){hostUpdate(dt);netHostTick(dt);}else{guestUpdate(dt);netGuestTick(dt);}
 for(const p of P){if(!p||p===ME)continue;if(p.rsw){p.rswA=p.rswA==null?p.rsw[1]:p.rswA+(p.rsw[1]-p.rswA)*Math.min(1,dt*18);}else p.rswA=null;if(dt>0){const vx=(p.x-(p.px0==null?p.x:p.px0))/dt;p.vx=(p.vx||0)+(vx-(p.vx||0))*.2;p.px0=p.x;}const a=Math.min(1,dt*15);if(Math.abs(p.x-p.sx)>300||Math.abs(p.y-p.sy)>300){p.sx=p.x;p.sy=p.y;}p.sx+=(p.x-p.sx)*a;p.sy+=(p.y-p.sy)*a;p.anim.t+=dt;}
 updFx(dt);ambStep(MAPS[ME.map],dt,G.time);
 camTarget(MAPS[ME.map]);cam.x+=(cam.tx-cam.x)*Math.min(1,dt*7);cam.y+=(cam.ty-cam.y)*Math.min(1,dt*5);cam.shake=Math.max(0,cam.shake-dt*40);
 hudTick(dt);
 saveT+=dt;if(saveT>5){saveT=0;saveMe();}
}
let PAUSE=false,PAUSED=false,PAUSE_T=0,LAST_SAVE=0;
const canPause=()=>IS_HOST&&!connected();
function togglePause(){if(state!=='play')return;if(!canPause()){toastOnce('联机时不能暂停（队友还在游戏中）');return;}PAUSE=!PAUSE;sfx('click');if(!PAUSE)closeWins();}
function frame(now){
 requestAnimationFrame(frame);
 const raw=(now-last)/1000,dt=clamp(raw,0,.05);last=now;qualTick(raw);
 step(dt);render(now/1000);navSync();musicTick();
 for(const k in PRESS)PRESS[k]=false;TIN.jumpP=false;TIN.upP=false;TIN.skP=null;TIN.atkL=false;TIN.skL.fill(false);TIN.ultP=false;
}
// keep the host simulating while its tab is in the background
setInterval(()=>{if(document.hidden&&state==='play'&&IS_HOST&&connected()){const now=performance.now();const dt=Math.min(.1,(now-last)/1000);last=now;step(dt);}},100);
addEventListener('pagehide',()=>{if(state==='play')saveMe();if(connected())netSend({t:'bye'});});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')saveMe();});
renderSlots();renderHelp();updNavHints();
requestAnimationFrame(frame);
if(window.__TEST)window.__dbg={get G(){return G;},get P(){return P;},get ME(){return ME;},MAPS,MOB,CLS,BAL,warpTo,hostAct,trySkill,gainExp,spawnMob,stats,get state(){return state;},get NET(){return NET;},CL,startHost,netJoin,toggleWin};
