const CH_NAMES = { 1: '第一章 · 濒临倒闭的恐怖屋', 2: '第二章 · 午夜逃杀', 3: '第三章 · 红舞鞋', 4: '第四章 · 暮阳中学', 5: '第五章 · 第三病栋' };

function me(t) { return say('陈歌', t); }

/* 一段台本：每行 “谁|话”。空=旁白，我=陈歌，@=黑色手机，>=弹幕（／分隔），!=惊吓，#=整屏旁白（／分行），~=音效，%=震屏 */
async function T_(s) { const my = STATE.run; for (let ln of s.split('\n')) { ln = ln.trim(); if (!ln) continue; if (my !== STATE.run) return new Promise(() => {}); const sp = /^(#m|#r|[@#!~>%^])\|?/.exec(ln); const i = sp ? -1 : ln.indexOf('|'), who = sp ? sp[1] : i < 0 ? '' : ln.slice(0, i), t = sp ? ln.slice(sp[0].length) : i < 0 ? ln : ln.slice(i + 1);
    if (who === '^') { if (/^wait /.test(t)) await sleep(+t.slice(5)); else stageCmd(t); } else if (who === '>') danmu(t.split('／')); else if (who === '!') { STG.flash = 1; STG.shake = .5; await scare(t); } else if (who === '#') await cine(t.split('／')); else if (who === '#m') await cine(t.split('／'), 'mem'); else if (who === '#r') await cine(t.split('／'), 'red'); else if (who === '~') sfx(t); else if (who === '%') shake();
    else if (who === '@') await ph(t); else if (who === '我') await me(t); else if (who === '') await nar(t); else await say(who, t); } }

function comboText(B) { if (!B.scare || !B.lastK) return ''; return B.rep ? ' · <span class="cb no">' + SKILLS[B.lastK].n + '用多了 -' + Math.round((1 - Math.pow(REPEAT_DOWN, Math.min(B.rep, 3))) * 100) + '%</span>' : B.combo ? ' · <span class="cb">连段 ×' + B.combo + '（+' + Math.round(COMBO_UP * B.combo * 100) + '%）换一招继续</span>' : ''; }

/* —— 11 场景一击：夜里的对峙，每场一个跟地点有关的按钮，只能用一次，不占回合 —— */
function strikeOf() { const k = stageKey(); if (['doorhall', 'hall', 'corridor', 'wardhall', 'apt'].includes(k)) return ['🚪', '关门', 'door']; if (['dance', 'room', 'wc', 'toilet', 'inside'].includes(k)) return ['🪞', '砸镜子', 'mirror'];
  if (['classroom', 'dorm', 'school', 'office', 'laundry', 'ward', 'ctrl', 'prop', 'attic', 'shop', 'house'].includes(k)) return ['🪑', '掀翻桌柜', 'table']; if (['woods', 'hut', 'field', 'park', 'parking', 'burnt'].includes(k)) return ['🌑', '关掉手电', 'dark']; return ['🧱', '抄起手边的东西', 'grab']; }
function sceneStrike() { const B = STATE.battle; if (!B || B.scare || B.phase !== 'hero' || B.result || B.strikeUsed) return; B.strikeUsed = true; B.ev = []; const [ic, n, k] = strikeOf(), fs = alive(B.foes);
  blog(B, '陈歌 · ' + ic + n + '（不占回合）', 'epic'); fxe(B, { t: 'banner', who: 'hero', txt: n, ic });
  if (k === 'door') for (const f of fs) { if (f.boss) addSt(B, f, 'slow', 2); else addSt(B, f, 'stun', 1); }
  else if (k === 'mirror') for (const f of fs) { if (f.k === 'ghost') applyDmg(B, B.hero, f, Math.round(f.mhp * .12), {}); else addSt(B, f, 'weak', 2); }
  else if (k === 'table') for (const f of fs) { addSt(B, f, 'vuln', 2); applyDmg(B, B.hero, f, Math.round(f.mhp * .06), {}); }
  else if (k === 'dark') { for (const f of fs) addSt(B, f, 'dark', 2); addSt(B, B.hero, 'shield', 1); }
  else { const f = B.foes[B.sel] && B.foes[B.sel].hp > 0 ? B.foes[B.sel] : fs[0]; applyDmg(B, B.hero, f, Math.round(f.mhp * .1), {}); if (f.hp > 0) addSt(B, f, 'weak', 2); }
  sfx('hit'); if (!alive(B.foes).length) { B.result = 'win'; renderBattle(); return battleFinish(); } renderBattle(); }

/* —— 7 一键营业一整天 —— */
async function dayRun() { if (STATE.scene || STATE.battle || STATE.busy) return; if (isNight()) { toast('乐园关门了'); return; } if (C.loc !== 'hh_door') { toast('去恐怖屋门口'); return; }
  const m0 = C.money, s0 = C.hh.screams, p0 = C.hh.today, g0 = C.hh.good, b0 = C.hh.bad, q0 = C.q, mo = SET.motion, au = C.auto; SET.motion = 0; C.auto = 1; STATE.dayRun = true; let n = 0;
  try { while (!isNight() && C.loc === 'hh_door' && C.q === q0 && n < 8) { const sid = sceneList().sort((a, b) => scenePas(b).pay * (1 + sceneStar(b)) - scenePas(a).pay * (1 + sceneStar(a)))[0]; await receive(sid); n++; for (let i = 0; i < 400 && (STATE.battle || STATE.scene); i++) await sleep(20); if (STATE.scene) break; } }
  finally { SET.motion = mo; C.auto = au; STATE.dayRun = false; }
  const rv = FN().rv.slice(0, 2).map(r => '<div class="c3" style="text-align:left">“' + esc(r.s) + '”</div>').join('');
  await showCard('<div class="c1">今天收工</div><div class="c2">接待 ' + n + ' 批 · ' + (C.hh.today - p0) + ' 人</div><div class="c3">好评 ' + (C.hh.good - g0) + ' · 差评 ' + (C.hh.bad - b0) + '<br>门票 +' + (C.money - m0) + ' 元 · 尖叫 +' + Math.max(0, C.hh.screams - s0) + '</div>' + rv, 700); refresh(); save(); storyArrive(); }

const RELIC_AREA = { pingan: 'pingan', xicheng: 'xicheng', muyang: 'muyang', haiming: 'muyang', kangfu: 'kangfu', park: null };
function relicSetDone(s) { return RELICS[s].every(r => FN().relic[r[0]]); }
function relicBonus(c, k) { if (!c.fun || !c.fun.relic) return 0; const has = s => RELICS[s].every(r => c.fun.relic[r[0]]); return k === 'mp' ? (has('pingan') ? 10 : 0) : k === 'hp' ? (has('kangfu') ? 25 : 0) : k === 'ticket' ? (has('xicheng') ? .1 : 0) : k === 'scare' ? (has('muyang') ? .06 : 0) : 0; }

function relicGain(area) { const s = area ? RELIC_AREA[area] : null; const L = (s ? RELICS[s] : Object.values(RELICS).flat()).filter(r => !FN().relic[r[0]]); if (!L.length) return null; const r = L[Math.floor(rnd() * L.length)]; FN().relic[r[0]] = 1;

        if (hs === 'bald') R(4, hT, 8, 1, shade(skin, -.12));
        if (hs === 'queue') { R(4, hT, 8, 2, shade(skin, -.15)); R(4, hT + 2, 8, 1, hair); }
        if (P.mask) { R(4, hT + 5, 8, 3, '#ecebe4'); R(4, hT + 7, 8, 1, '#cfcdc4'); R(3, hT + 5, 1, 1, '#d8d8d0'); R(12, hT + 5, 1, 1, '#d8d8d0'); }
        if (P.slit) { R(4, hT + 6, 8, 1, '#5a0c10'); R(3, hT + 5, 1, 1, '#5a0c10'); R(12, hT + 5, 1, 1, '#5a0c10'); }
      }
    } else {
      if (hs === 'bald') R(4, hT, 8, 2, shade(skin, -.12));
      else if (hs === 'queue') { R(4, hT, 8, 2, shade(skin, -.15)); R(4, hT + 2, 8, 5, hair); R(7, hT + 7, 2, tB - hT - 4, hair); }
      else if (hs === 'bob') R(3, hT, 10, 8, hair);
      else { R(4, hT, 8, 6, hair); R(3, hT + 1, 1, 4, hair); R(12, hT + 1, 1, 4, hair); }
      if (hs === 'long' || P.cover) R(4, hT, 8, 8, hair);
      if (hs === 'bun') R(6, hT - 2, 4, 2, hair);
      if (hs === 'twin') { R(1, hT + 2, 2, 6, hair); R(13, hT + 2, 2, 6, hair); }
    }
  } else {
    /* ---- 侧面（朝左；朝右由镜像得到） ---- */
    if (legs) {
      if (step === 0) { if (!P.robe) { R(6, lT, 2, L, bot); R(8, lT, 2, L, bdk); } if (!P.noFeet) { R(5, 22, 3, 1, shoe); R(8, 22, 2, 1, shoe); } }
      else {
        const fc = step === 1 ? bot : bdk, bc = step === 1 ? bdk : bot;
        if (!P.robe) { R(6, lT, 4, 1, bot); R(4, lT + 1, 2, L - 1, fc); R(9, lT + 1, 2, L - 1, bc); }
        if (!P.noFeet) { R(3, 22, 3, 1, shoe); R(9, 22, 3, 1, shoe); }
      }
    }
    if (P.hs === 'long' || P.cover) R(8, hT + 3, 4, tT - hT + 3, hair);
    if (lowerEnd) { R(4, tB - 1, 8, 1, top); R(4, tB, 8, lowerEnd - tB + 1, P.robe || P.dress || P.coat || P.ghost ? top : bot); R(10, tB, 2, lowerEnd - tB + 1, dk); }

    if (P.apron) R(4, tT + 2, 2, (lowerEnd || tB) - tT - 2, P.apron);
    const ax = step === 1 ? 6 : step === -1 ? 8 : 7;
    R(ax, tT + 1, 2, armL - 1, dk); R(ax, tT + armL, 2, 1, skin);
    R(5, hT, 6, 7, skin); R(6, hT + 7, 4, 1, skin); R(4, hT + 4, 1, 1, skin);
    const hs = P.hs || 'short';
    if (P.cover) { R(4, hT, 8, 3, hair); R(4, hT + 3, 3, 6, hair); R(7, hT + 3, 5, 5, hair); R(5, hT + 5, 1, 1, P.redEye ? '#ff3a3a' : '#ddd'); }
    else {
      R(6, hT + 4, 1, 2, eye); if (P.redEye) R(6, hT + 4, 1, 1, '#ff3030');
      if (P.mouth) R(5, hT + 6, 1, 1, P.mouth);
      if (hs === 'bald') R(5, hT, 6, 1, shade(skin, -.12));
      else if (hs === 'queue') { R(5, hT, 6, 2, shade(skin, -.15)); R(8, hT + 2, 3, 5, hair); R(10, hT + 6, 2, tB - hT - 4, hair); }
      else {
        R(5, hT, 6, 3, hair); R(9, hT + 3, 2, 3, hair); R(11, hT + 1, 1, 5, hair);
        if (hs === 'messy') R(6, hT - 1, 3, 1, hair);
        if (hs === 'long') { R(5, hT + 3, 1, 2, hair); R(9, hT + 3, 3, 7, hair); }
        if (hs === 'bob') { R(4, hT, 8, 3, hair); R(8, hT + 3, 4, 5, hair); R(5, hT + 3, 1, 3, hair); }
        if (hs === 'bun') R(9, hT - 1, 3, 3, hair);
        if (hs === 'twin') R(11, hT + 2, 3, 6, hair);
      }
      if (P.mask) { R(3, hT + 5, 5, 3, '#ecebe4'); R(8, hT + 5, 2, 1, '#d8d8d0'); }
      if (P.slit) R(3, hT + 6, 7, 1, '#5a0c10');

  }
  // 帽子
  const hc = P.hatC;
  if (P.hat === 'qing') { R(3, hT - 1, 10, 3, hc || '#2a2420'); R(4, hT - 2, 8, 1, shade(hc || '#2a2420', .15)); R(7, hT - 3, 2, 1, '#c03030'); }
  if (P.hat === 'cap') { R(4, hT - 1, 8, 3, hc || '#2b3d6b'); if (d === 0) R(4, hT + 2, 8, 1, shade(hc || '#2b3d6b', -.3)); if (d === 1) R(2, hT + 1, 3, 1, shade(hc || '#2b3d6b', -.3)); }

  if (P.hat === 'veil') { const v = hc || '#e8e4dc'; R(3, hT - 1, 10, 2, v); R(2, hT, 2, tT - hT + 5, v); R(12, hT, 2, tT - hT + 5, v); if (d === 3) R(3, hT, 10, tT - hT + 4, v); }
  if (P.hat === 'scarf') { const v = hc || '#5a3a3a'; R(3, hT - 1, 10, 3, v); R(3, hT + 2, 1, 6, v); R(12, hT + 2, 1, 6, v); if (d === 3) R(4, hT, 8, 8, v); }
  if (P.hat === 'hood') { const v = hc || '#3a3a44'; R(3, hT - 1, 10, 3, v); R(3, hT + 2, 1, 6, v); R(12, hT + 2, 1, 6, v); if (d === 3) R(3, hT, 10, 9, v); }
  if (P.extra) P.extra(g, d, fr, G, R);
}

  metal: { top: '#16181b', face: '#70757d', trim: '#40444a', pat: 'metal' }

function paintWall(R, X, Y, face, st, isWall) {
  if (!face) {
    R(0, 0, 16, 16, st.top);
    const e = shade(st.top, .18);
    if (!isWall(X - 1, Y)) R(0, 0, 1, 16, e); if (!isWall(X + 1, Y)) R(15, 0, 1, 16, e); if (!isWall(X, Y - 1)) R(0, 0, 16, 1, e);
    return;
  }
  const f = st.face; R(0, 0, 16, 16, f);
  switch (st.pat) {
    case 'paper': for (let x = 2; x < 16; x += 5) R(x, 0, 1, 13, shade(f, -.1)); for (let x = 4; x < 16; x += 5) R(x, 4 + (X % 2) * 4, 1, 1, shade(f, .15)); break;
    case 'brick': for (let r = 0; r < 4; r++) { R(0, r * 4 + 3, 16, 1, shade(f, -.3)); const o = (r + Y) % 2 ? 0 : 4; R(o, r * 4, 1, 3, shade(f, -.3)); R(o + 8, r * 4, 1, 3, shade(f, -.3)); } break;
    case 'wood': for (let x = 0; x < 16; x += 4) R(x, 0, 1, 14, shade(f, -.25)); break;
    case 'tile': R(0, 4, 16, 1, shade(f, -.15)); R(0, 9, 16, 1, shade(f, -.15)); R(5, 0, 1, 14, shade(f, -.15)); R(11, 0, 1, 14, shade(f, -.15)); break;
    case 'concrete': if (hash(X, Y, 3) < .3) R(4, 5, 5, 1, shade(f, -.2)); R(0, 7, 16, 1, shade(f, -.06)); break;
    case 'stone': for (let r = 0; r < 3; r++) { R(0, r * 5 + 4, 16, 1, shade(f, -.3)); R((r * 6 + X * 3) % 16, r * 5, 1, 4, shade(f, -.3)); } break;
    case 'shoji': R(0, 0, 16, 14, '#d9d2bc'); for (let x = 0; x < 16; x += 5) R(x, 0, 1, 14, '#5a4630'); R(0, 4, 16, 1, '#5a4630'); R(0, 9, 16, 1, '#5a4630'); break;
    case 'busw': R(0, 0, 16, 3, '#2f4f5f'); R(1, 3, 14, 8, '#0d1a24'); R(2, 4, 4, 2, '#24425a'); R(0, 11, 16, 3, '#2f4f5f'); break;
    case 'metal': for (let x = 3; x < 16; x += 6) R(x, 0, 1, 14, shade(f, -.2)); R(0, 2, 16, 1, shade(f, .12)); break;
  }
  R(0, 0, 16, 1, shade(f, -.35));
  R(0, 14, 16, 2, st.trim);
}

   → 除了白天鬼屋经营，所有恐怖场景都在这里玩：全屏 iframe 里跑百物语引擎（kongbuwu/night/，构建时拼进 NIGHT_HTML）。

     r.kind：'end' 走完了 · 'skip' 死了以后选“跳过这一夜” · 'quit' 中途离开（这一步不算完成，下次从检查点接着走）

function night(id, o = {}) {
  if (typeof NIGHT_IDS === 'undefined' || !NIGHT_IDS.includes(id)) { console.warn('夜晚任务不存在', id); return Promise.resolve({ kind: 'end', none: 1, f: {}, inv: [] }); }
  if (nightAuto()) return Promise.resolve({ kind: 'end', auto: 1, f: Object.assign({}, o.autoF || {}), inv: [] });
  F().ntq = F().ntq || {}; const fromCp = !!F().ntq[id];
  return new Promise(res => {
    const ov = document.createElement('div'); ov.id = 'nightov'; ov.innerHTML = '<iframe id="nightfr" title="夜晚任务" allow="autoplay; fullscreen"></iframe>'; document.body.appendChild(ov);
    const fr = ov.firstChild; fr.srcdoc = NIGHT_HTML; document.body.classList.add('nightup'); try { if (AU.ctx) AU.ctx.suspend(); } catch (e) { }
    const onMsg = ev => { const m = ev.data; if (!m || !m.kbwNight || ev.source !== fr.contentWindow) return;
      if (m.t === 'ready') { fr.contentWindow.postMessage({ kbwNight: 1, t: 'play', id, fromCp, env: nightEnv(), mute: !SET.snd }, '*'); setTimeout(() => { try { fr.focus(); fr.contentWindow.focus(); } catch (e) { } }, 60); }
      if (m.t === 'done') { window.removeEventListener('message', onMsg); ov.remove(); document.body.classList.remove('nightup'); try { if (AU.ctx) AU.ctx.resume(); } catch (e) { }
        if (m.kind === 'quit') F().ntq[id] = 1; else delete F().ntq[id]; STATE.nightLast = m; res(Object.assign({ f: {}, inv: [] }, m)); } };
    window.addEventListener('message', onMsg); STATE.night = { id, ov, fr };
  }); }

n.it{border:1px solid #3a2a30;padding:8px 12px;background:rgba(30,20,24,.6)}\n.it b{font-family:var(--serif);letter-spacing:1px;color:#f0e2c8}\n.it div{color:var(--dim);font-size:13.5px;margin-top:2px;line-height:1.6;white-space:pre-wrap}\n.it.clk{cursor:pointer}\n.it.clk:hover{border-color:var(--red)}\n.empty{color:#6a6058;text-align:center;padding:20px}\n/* 触屏 */\n#touch{position:fixed;inset:0;z-index:9;pointer-events:none}\nbody.touch #touch{pointer-events:auto}\n#joyb{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);pointer-events:none}\n#joyk{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.22);pointer-events:none}\n.tbtn{position:absolute;border-radius:50%;background:rgba(40,16,20,.55);border:2px solid rgba(224,72,76,.55);color:#fff;font-family:var(--serif);display:flex;align-items:center;justify-content:center;touch-action:none}\n#bA{width:76px;height:76px;right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 30px);font-size:20px}\n#bA.hot{background:rgba(160,30,36,.75);box-shadow:0 0 14px rgba(224,72,76,.6)}\n#bRun{width:52px;height:52px;right:calc(var(--sr) + 100px);bottom:calc(var(--sb) + 18px);font-size:14px;border-color:rgba(255,255,255,.3)}\n#bRun.on{background:rgba(180,140,60,.6)}\nbody:not(.touch) #touch{display:none}\nbody.dlgup #bRun,body.dlgup #joyb,body.dlgup #joyk{display:none}\nbody.dlgup #bA{bottom:calc(var(--sb) + 180px)}\n/* 手机 */\n@media (pointer:coarse) and (max-width:500px){\n #title h1{font-size:44px;letter-spacing:.2em}\n #htl{max-width:52vw}#htl .ct{font-size:13px}#htl .goal{font-size:12px}\n .hb{width:40px;height:40px;font-size:16px}#htr{gap:4px}\n #ctrlbar{top:calc(var(--st) + 48px);font-size:12px}\n #reqp{top:calc(var(--st) + 94px);font-size:13px}\n #toasts{top:calc(var(--st) + 140px)}\n #dlg{padding:12px 12px 14px;min-height:96px}#dlg .txt{font-size:16.5px;line-height:1.65}#dlg .ch{font-size:15.5px}\n #chgrid{grid-template-columns:1fr 1fr;gap:8px}.card .tt{font-size:16px}.card .tl{display:none}\n #bA{width:66px;height:66px;font-size:17px}#bRun{width:46px;height:46px;right:calc(var(--sr) + 86px)}\n body.dlgup #bA{bottom:calc(var(--sb) + 210px)}\n}\n@media (pointer:coarse) and (max-height:500px){\n #title h1{font-size:40px;margin-bottom:0}#title .tag{margin-bottom:10px}.menu{gap:6px}.menu .btn{min-height:40px;padding:6px 14px;font-size:15px}\n .foot{margin-top:8px}\n #select h2{font-size:20px;margin-top:4px}#select .sub{margin-bottom:6px}\n #chgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.card .tl{display:none}.card .tt{font-size:15px}\n #dlg{width:min(640px,calc(100vw - 230px));padding:10px 14px 12px;min-height:80px;bottom:calc(var(--sb) + 4px)}#dlg .txt{font-size:15.5px;line-height:1.6}#dlg .ch{font-size:14.5px;min-height:38px;padding:5px 10px}\n #ctrlbar{font-size:12px}#reqp{top:calc(var(--st) + 46px)}\n #toasts{top:calc(var(--st) + 84px)}\n #bA{width:64px;height:64px;bottom:calc(var(--sb) + 22px)}#bRun{width:44px;height:44px;bottom:calc(var(--sb) + 10px);right:calc(var(--sr) + 84px)}\n body.dlgup #bA{bottom:calc(var(--sb) + 22px)}\n #card .b{margin-top:12px;line-height:1.7}\n .panel{padding:10px 16px}.panel h2{margin:2px 0 6px;font-size:20px}.panel .menu{gap:5px}.panel .menu .btn{min-height:38px;padding:4px 12px;font-size:15px}\n}\n<\/style>\n\n<\/head>\n<body>\n<canvas id=\"cv\"><\/canvas>\n<div id=\"touch\"><div id=\"joyb\" class=\"hidden\"><\/div><div id=\"joyk\" class=\"hidden\"><\/div><button class=\"tbtn\" id=\"bA\">调查<\/button><button class=\"tbtn\" id=\"bRun\">跑<\/button><\/div>\n<div id=\"hud\" class=\"hidden\">\n <div id=\"htl\"><div class=\"ct\" id=\"hct\"><\/div><div class=\"goal\" id=\"hgoal\"><\/div><\/div>\n <div id=\"htr\"><button class=\"hb\" id=\"hInv\" title=\"物品 (I)\">囊<\/button><button class=\"hb\" id=\"hJour\" title=\"笔记 (J)\">笺<\/button><button class=\"hb\" id=\"hMute\" title=\"声音 (M)\">♪<\/button><button class=\"hb\" id=\"hMenu\" title=\"菜单 (Esc)\">≡<\/button><\/div>\n <div id=\"ctrlbar\" class=\"hidden\"><span class=\"who\" id=\"cbWho\"><\/span><button class=\"btn small\" id=\"cbBtn\"><\/button><\/div>\n <div id=\"reqp\" class=\"hidden\"><span id=\"rqTxt\"><\/span><button class=\"btn small\" id=\"rqY\">同意 <kbd>Y<\/kbd><\/button><button class=\"btn small\" id=\"rqN\">拒绝 <kbd>N<\/kbd><\/button><\/div>\n <div id=\"timerb\" class=\"hidden\"><\/div>\n <div id=\"toasts\"><\/div>\n <div id=\"dlg\" class=\"hidden\"><div class=\"who\"><\/div><div class=\"watch hidden\">对方操作中<\/div><div class=\"txt\"><\/div><div class=\"chs\"><\/div><div class=\"more\">▼<\/div><\/div>\n<\/div>\n<div id=\"card\" class=\"ov hidden\"><div class=\"t\"><\/div><div class=\"s\"><\/div><div class=\"b\"><\/div><div class=\"k\">— 点击继续 —<\/div><\/div>\n<div id=\"note\" class=\"ov hidden\"><div class=\"paper\"><h3><\/h3><div class=\"tx\"><\/div><\/div><div class=\"k\">— 点击合上 —<\/div><\/div>\n<div id=\"keypad\" class=\"ov hidden\"><div class=\"panel\"><div id=\"kpP\"><\/div><div class=\"pv\" id=\"kpV\"><\/div><div class=\"keys\" id=\"kpK\"><\/div><div class=\"row\"><button class=\"btn small\" id=\"kpDel\">退格<\/button><button class=\"btn small\" id=\"kpX\">取消<\/button><\/div><\/div><\/div>\n<div id=\"endov\" class=\"ov hidden\"><div class=\"panel\"><h2 id=\"enT\"><\/h2><div class=\"tx\" id=\"enX\"><\/div><div class=\"lg\" id=\"enL\"><\/div><div class=\"row\" style=\"margin-top:16px\" id=\"enB\"><\/div><\/div><\/div>\n\n<div id=\"title\" class=\"screen\">\n <h1>百物语<\/h1>\n <div class=\"tag\" style=\"font-size:26px;letter-spacing:.6em;color:#b3262b;margin:-4px 0 10px\">壹<\/div>\n <div class=\"tag\">三十个流传已久的怪谈 · 两人同看一盏灯<\/div>\n <div class=\"menu\" id=\"tmenu\">\n  <button class=\"btn primary\" id=\"tStart\">独自开始<\/button>\n  <button class=\"btn\" id=\"tHost\">创建房间（双人）<\/button>\n  <button class=\"btn\" id=\"tJoin\">加入房间<\/button>\n  <button class=\"btn\" id=\"tArch\">怪谈档案<\/button>\n  <button class=\"btn\" id=\"tHelp\">操作说明<\/button>\n  <button class=\"btn hidden\" id=\"tHub\">‹ 百物语目录<\/button>\n <\/div>\n <div class=\"foot\" id=\"tfoot\">像素恐怖探索合集 · 建议戴耳机、关灯游玩<br>剧情含惊吓与死亡描写<\/div>\n<\/div>\n<div id=\"select\" class=\"screen hidden\">\n <h2 id=\"selH\">百物语<\/h2><div class=\"sub\" id=\"selSub\">选择今晚要听的故事<\/div>\n <div id=\"chgrid\"><\/div>\n <div id=\"selbar\"><button class=\"btn small\" id=\"sBack\">‹ 返回<\/button><button class=\"btn small\" id=\"sArch\">怪谈档案<\/button><\/div>\n<\/div>\n<div id=\"lobby\" class=\"screen hidden\"><div class=\"panel\">\n <h2 id=\"lbT\">创建房间<\/h2>\n <div id=\"lbHost\"><p>把下面的房间码告诉朋友，对方在「加入房间」里输入即可。两人看到的是同一个画面，同一时刻只有一人操作，另一人可以请求接手。<\/p><div class=\"codebox\" id=\"lbCode\">····<\/div><\/div>\n <div id=\"lbJoin\" class=\"hidden\"><p>输入朋友给你的 4 位房间码：<\/p><input id=\"joinCode\" maxlength=\"4\" autocomplete=\"off\" autocapitalize=\"characters\" spellcheck=\"false\"><div class=\"row\" style=\"margin-top:10px\"><button class=\"btn primary\" id=\"lbGo\">加入<\/button><\/div><\/div>\n <div class=\"status\" id=\"lbS\"><\/div>\n <div class=\"row\"><button class=\"btn small\" id=\"lbX\">取消<\/button><\/div>\n<\/div><\/div>\n<div id=\"archive\" class=\"screen hidden\"><div class=\"panel arch\"><h2>怪谈档案<\/h2><p style=\"color:var(--dim);font-size:13px\">通关一章即可解锁该怪谈的来历与流变。笔记在游戏中拾得。<\/p><div id=\"archL\"><\/div><div class=\"row\" style=\"margin-top:14px\"><button class=\"btn small\" id=\"arX\">‹ 返回<\/button><\/div><\/div><\/div>\n<div id=\"help\" class=\"ov hidden\"><div class=\"panel\"><h2>操作说明<\/h2>\n <p><b>移动<\/b>：方向键 / WASD；按住 <kbd>Shift<\/kbd> 奔跑<br><b>调查 / 对话 / 确认<\/b>：<kbd>空格<\/kbd> <kbd>Enter<\/kbd> <kbd>Z<\/kbd> <kbd>E<\/kbd><br><b>选项<\/b>：上下键选择，确认键选定（也可直接点）<br><b>物品<\/b> <kbd>I<\/kbd>　<b>笔记<\/b> <kbd>J<\/kbd>　<b>菜单<\/b> <kbd>Esc<\/kbd>　<b>静音<\/b> <kbd>M<\/kbd><\/p>\n <p><b>触屏<\/b>：左半屏按住拖动是摇杆；右下「调查」键；「跑」键切换奔跑。点击对话框翻页。<\/p>\n <p><b>双人<\/b>：两人共享一个角色与画面。操作者按 <kbd>T<\/kbd> 或顶部按钮可把操作交给对方；观看者按 <kbd>T<\/kbd> 请求操作，操作者按 <kbd>Y<\/kbd> 同意 / <kbd>N<\/kbd> 拒绝。任何一方点击画面都能放一个标记，提醒对方「看这里」。<\/p>\n <p><b>提示<\/b>：头上冒出 <span style=\"color:#e0484c\">!<\/span> 的东西可以调查。每章右上角会写当前目标。死亡后可从最近的检查点重来。<\/p>\n <div class=\"row\"><button class=\"btn small\" id=\"hpX\">知道了<\/button><\/div><\/div><\/div>\n<div id=\"menu\" class=\"ov hidden\"><div class=\"panel\" style=\"max-width:380px\"><h2 style=\"text-align:center\">暂停<\/h2><div class=\"menu\" style=\"margin:10px auto\" id=\"mList\">\n <button class=\"btn\" id=\"mRes\">继续<\/button><button class=\"btn\" id=\"mInv\">物品<\/button><button class=\"btn\" id=\"mJour\">笔记<\/button><button class=\"btn\" id=\"mHelp\">操作说明<\/button>\n <button class=\"btn\" id=\"mRetry\">从检查点重来<\/button><button class=\"btn\" id=\"mQuit\">返回章节选择<\/button><button class=\"btn hidden\" id=\"mHub\">返回百物语目录<\/button><\/div>\n <div class=\"status\" id=\"mNote\"><\/div><\/div><\/div>\n<div id=\"inv\" class=\"ov hidden\"><div class=\"panel\" style=\"max-width:460px\"><h2>随身物品<\/h2><div class=\"list\" id=\"invL\"><\/div><div class=\"row\" style=\"margin-top:12px\"><button class=\"btn small\" id=\"invX\">合上<\/button><\/div><\/div><\/div>\n<div id=\"journal\" class=\"ov hidden\"><div class=\"panel\" style=\"max-width:520px\"><h2>笔记<\/h2><div class=\"list\" id=\"jrL\"><\/div><div class=\"row\" style=\"margin-top:12px\"><button class=\"btn small\" id=\"jrX\">合上<\/button><\/div><\/div><\/div>\n<script>\n\n/* ---- engine/00_core.js ---- */\n'use strict';\n/* ================= 百物语 · core：工具、画布、输入、合成音效 ================= */\nconst TS = 16;                       // 瓦片像素\nconst LSP = 'kbw.nt.';   /* 恐怖屋夜晚任务自己的存档前缀，不碰百物语的存档 */           // 本地存储前缀\n/* 中文数字：1→一 … 10→十 … 21→二十一 */\nfunction cnum(n) { const D = '一二三四五六七八九'; if (n < 10) return D[n - 1] || String(n); if (n === 10) return '十'; const t = Math.floor(n / 10), u = n % 10; return (t > 1 ? D[t - 1] : '') + '十' + (u ? D[u - 1] : ''); }\nconst VOLS = ['卷一', '卷二', '卷三', '卷四', '卷五', '卷六'];   // 每十夜一卷\nconst QS = new URLSearchParams(location.search);\nconst FAST = Math.max(1, +(QS.get('fast') || 1));   // 测试用：加速剧本等待\nconst $ = id => document.getElementById(id);\nconst clamp = (v, a, b) => v < a ? a : v > b ? b : v;\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst now = () => performance.now();\nconst DIRS = [[0, 1], [-1, 0], [1, 0], [0, -1]];   // 0下 1左 2右 3上\nconst DIRN = { down: 0, left: 1, right: 2, up: 3 };\nfunction hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }\nfunction mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }\nconst store = {\n  get(k, d) { try { const v = localStorage.getItem(LSP + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },\n  set(k, v) { try { localStorage.setItem(LSP + k, JSON.stringify(v)); } catch (e) { } },\n  del(k) { try { localStorage.removeItem(LSP + k); } catch (e) { } }\n};\n/* （百物语的旧存档合并逻辑在恐怖屋里不需要，已去掉） */\nfunction esc(s) { return String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c])); }\n\n/* ---------------- 画布：按短边约 12 格选整数倍缩放 ---------------- */\nconst cv = $('cv'), cx = cv.getContext('2d');\nconst buf = mk(320, 200), bx = buf.getContext('2d');\nlet VW = 320, VH = 200, SC = 4, DPR = 1, SW = 0, SH = 0;\nconst PHONE_MQ = matchMedia('(pointer:coarse) and (max-height:500px), (pointer:coarse) and (max-width:500px)');\nlet PHONE = PHONE_MQ.matches;\nconst TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;\nfunction resize() {\n  SW = innerWidth; SH = innerHeight; PHONE = PHONE_MQ.matches;\n  SC = Math.max(1, Math.round(Math.min(SW, SH) / (12 * TS)));\n  VW = Math.ceil(SW / SC); VH = Math.ceil(SH / SC);\n  buf.width = VW; buf.height = VH;\n  DPR = Math.min(window.devicePixelRatio || 1, 2);\n  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);\n  cv.style.width = SW + 'px'; cv.style.height = SH + 'px';\n  document.body.classList.toggle('phone', PHONE);\n  document.body.classList.toggle('touch', TOUCH);\n}\naddEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 120));\nresize();\n\n/* ---------------- 输入 ---------------- */\nconst IN = {\n  stack: [], run: false, runLatch: false, joy: null, joyDir: -1,\n  handlers: [],                      // (name)=>bool ，返回 true 表示已处理\n  press(n) { for (let i = this.handlers.length - 1; i >= 0; i--) if (this.handlers[i](n)) return; },\n  dir() { if (this.joyDir >= 0) return this.joyDir; return this.stack.length ? this.stack[this.stack.length - 1] : -1; },\n  running() { return this.run || this.runLatch; }\n};\nconst KEYDIR = { ArrowDown: 0, KeyS: 0, ArrowLeft: 1, KeyA: 1, ArrowRight: 2, KeyD: 2, ArrowUp: 3, KeyW: 3 };\nconst KEYACT = { Space: 'a', Enter: 'a', KeyZ: 'a', KeyE: 'a', NumpadEnter: 'a', Escape: 'menu', KeyI: 'inv', Tab: 'inv', KeyJ: 'journal', KeyT: 'ctrl', KeyY: 'yes', KeyN: 'no', KeyM: 'mute', KeyX: 'b', Backspace: 'del' };   // del：密码盘里删一位，其他地方等同 b\naddEventListener('keydown', e => {\n  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;\n  AU.init();\n  if (e.code in KEYDIR) {\n    const d = KEYDIR[e.code]; if (!IN.stack.includes(d)) IN.stack.push(d);\n    if (!e.repeat) IN.press(['down', 'left', 'right', 'up'][d]); e.preventDefault(); return;   // 按住不放不连发（避免选项来回跳）\n  }\n  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { IN.run = true; return; }\n  if (e.repeat) return;\n  const a = KEYACT[e.code];\n  if (a) { IN.press(a); if (e.code === 'Tab' || e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') e.preventDefault(); }\n});\naddEventListener('keyup', e => {\n  if (e.code in KEYDIR) { const d = KEYDIR[e.code]; IN.stack = IN.stack.filter(x => x !== d); }\n  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') IN.run = false;\n});\naddEventListener('blur', () => { IN.stack = []; IN.run = false; IN.joy = null; IN.joyDir = -1; });\n\n/* ---------------- 合成音效（Web Audio，无音频文件） ---------------- */\nconst AU = {\n  ctx: null, master: null, muted: store.get('mute', false), nb: null, amb: null, ambName: '', last: {},\n  init() {\n    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }\n    try {\n      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;\n      const c = this.ctx = new C();\n      const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 6;\n      this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.8;\n      this.master.connect(comp); comp.connect(c.destination);\n      const n = c.sampleRate * 2, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);\n      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;\n      this.nb = b;\n      if (this.ambName) { const a = this.ambName; this.ambName = ''; this.ambient(a); }\n    } catch (e) { this.ctx = null; }\n  },\n  setMute(m) { this.muted = m; store.set('mute', m); if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.8, this.ctx.currentTime, 0.05); },\n  tone(type, f0, f1, dur, vol, delay = 0, lp = 0, out) {\n    const c = this.ctx; if (!c) return;\n    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();\n    o.type = type; const j = 1 + (Math.random() - .5) * .08;\n    o.frequency.setValueAtTime(f0 * j, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1 * j), t + dur);\n    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.02, dur * .2)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    let node = o; if (lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); node = f; }\n    node.connect(g); g.connect(out || this.master); o.start(t); o.stop(t + dur + .05);\n  },\n  noise(dur, vol, ft = 'lowpass', f0 = 1000, f1 = f0, Q = 1, delay = 0, out) {\n    const c = this.ctx; if (!c)  ghKit(R), C = o.col || '#9a1818', S = '#e8e4e0', OL = '#120404', b = Math.round(Math.sin(t * 2) * .6), tl = Math.sin(t * .9) * 1.2 + 1;\n    K.shape(15 + b, 23 + b, y => [9, 4 + (y - 15) * .3], C, OL); K.limb([[8, 23 + b], [7, 27], [8, 29]], S, 1, OL); K.limb([[10, 23 + b], [11, 27], [10, 29]], S, 1, OL);\n    K.limb([[7, 16 + b], [4, 21 + b], [5, 24 + b]], S, 1, OL); K.limb([[11, 16 + b], [14, 20 + b], [14, 24 + b]], S, 1, OL);\n    K.shape(1 + b, 14 + b, y => [9 + tl * (14 - y) / 13, [6, 9, 11, 12, 12, 12, 12, 12, 11, 11, 10, 9, 7, 4][y - 1 - b]], S, OL); K.line(4 + tl, 2 + b, 13 + tl, 2 + b, '#141214', 2);\n    K.shape(6 + b, 8 + b, y => [6.5 + tl * .6, 3], '#000'); K.shape(6 + b, 8 + b, y => [11.5 + tl * .6, 3], '#000'); K.line(6 + tl * .6, 9 + b, 6 + tl * .5, 14 + b + ((t * 3 | 0) % 3), '#1a0a0a'); K.line(12 + tl * .6, 9 + b, 12 + tl * .5, 13 + b, '#1a0a0a'); K.shape(11 + b, 12 + b, y => [9 + tl * .4, 3], '#2a0000'); } },\n  /* 淹死的人：泡胀了，肚子和脸都圆鼓鼓的，皮肤发青，血管发黑；头发湿成一条一条贴在脸上 */\n  drowned: { w: 24, h: 40, draw(R, t, o) { const K = ghKit(R), S = '#a8bcc2', S2 = '#7a949e', H = '#0e1416', C = o.col || '#4a5a6a', OL = '#0a1014', b = Math.round(Math.sin(t * 1.2));\n    K.shape(13 + b, 32, y => { const k = (y - 13) / 19; return [12, 7 + Math.sin(k * 2.6) * 8]; }, C, OL); K.line(9, 18, 7, 28, '#34404c'); K.line(14, 16, 16, 24, '#2a3640');\n    K.limb([[10, 32], [9, 39]], S2, 3, OL); K.limb([[14, 32], [15, 39]], S2, 3, OL); K.limb([[6, 15 + b], [3, 22], [4, 28]], S, 3, OL); K.limb([[18, 15 + b], [21, 22], [20, 28]], S, 3, OL);\n    K.shape(1 + b, 13 + b, y => [12, [6, 9, 11, 12, 13, 13, 13, 13, 12, 12, 11, 9, 7][y - 1 - b]], S, OL); K.line(9, 5 + b, 10, 11 + b, '#5a7680'); K.line(15, 6 + b, 14, 12 + b, '#5a7680');\n    for (let i = 0; i < 7; i++) K.line(6 + i * 2, 1 + b, 6 + i * 2 + Math.sin(i) * 1.5, 7 + b + (i * 5) % 7, H); K.px(9, 7 + b, '#f0f8f8'); K.px(15, 7 + b, '#f0f8f8'); K.shape(10 + b, 11 + b, y => [12, 4], '#203030');\n    for (let i = 0; i < 5; i++) K.px(5 + i * 3.5, 28 + ((t * 18 + i * 9) % 12), '#7ab0c8'); } },\n  /* 学生：脖子断了，头往一边折过去吊着；两条胳膊一长一短，耷拉着 */\n  student: { w: 20, h: 36, draw(R, t, o) { const K = ghKit(R), U = '#2e3e5e', W = '#e8e8e8', S = '#d8d2cc', OL = '#0c0e14', tl = o.tilt ?? 4, sg = Math.sign(tl) || 1, sw = Math.sin(t * 1.4) * .6;\n    K.shape(12, 25, y => [10, 7 + (y - 12) * .1], U, OL); K.shape(12, 15, y => [10, 3], W); K.limb([[8, 25], [8, 30], [7, 35]], U, 2, OL); K.limb([[12, 25], [12, 30], [13, 35]], U, 2, OL);\n    K.limb([[7, 13], [5, 20], [5 + sw, 27]], S, 1, OL); K.limb([[13, 13], [15, 19], [15 + sw, 23]], S, 1, OL);\n    K.line(10, 12, 10 + sg * 3, 10, S, 2); const hx = 10 + sg * 6, hy = 10; K.shape(hy - 3, hy + 4, y => [hx + (y - hy) * sg * .5, [4, 6, 7, 7, 7, 6, 5, 3][y - hy + 3]], S, OL);\n    K.line(hx + sg * 3, hy - 3, hx + sg * 3, hy + 3, '#141214', 2); K.px(hx - sg, hy - 1, '#000'); K.px(hx - sg, hy + 2, '#000'); K.line(hx + sg * -2, hy - 1, hx + sg * -2, hy + 2, '#300'); } },\n  /* 影子：边缘一直在冒烟的黑色人形，只有两点白；脚底下拖着烟 */\n  shadow: { w: 20, h: 40, draw(R, t, o) { const K = ghKit(R), Kc = '#050407', K2 = '#100e14';\n    K.shape(11, 36, y => [10 + Math.sin(y * .5 + t * 3) * .8, 6 + (y - 11) * .12 + Math.sin(y * 1.3 + t * 5) * 1.2], Kc); K.shape(13, 30, y => [10, 3], K2);\n    K.shape(1, 11, y => [10 + Math.sin(y + t * 4) * .5, [4, 6, 7, 8, 8, 8, 8, 7, 6, 5, 4][y - 1]], Kc); K.limb([[6, 13], [3, 22], [4, 30]], Kc, 2); K.limb([[14, 13], [17, 21], [16, 29]], Kc, 2);\n    for (let i = 0; i < 8; i++) { const x = 4 + i * 1.7, h = (t * 6 + i * 2.3) % 5; K.px(x + Math.sin(t * 3 + i), 37 - h, i % 2 ? Kc : K2); K.px(x + 1, 38 - h * .5, Kc); }\n    if (Math.sin(t * 1.9) > -.6) { K.px(8, 6, '#e8e4dc'); K.px(12, 6, '#e8e4dc'); } } }\n};\n\nfor (const k in GH) SPR['gh_' + k] = function (g, e, t, R) {\n  const G = GH[k], flip = e.dir === 1, ox = 8 - G.w / 2, oy = 16 - G.h;\n  const o = Object.assign({ dir: e.dir, moving: !!e.mv, talk: false }, (e.s && e.s.o) || {});\n  const tw = Math.sin(t * 2.3 + (e.px || 0) * .37) > .95, b0 = (hash(Math.floor(t * 8), e.px | 0, 3) * G.h) | 0, sh = tw ? (Math.random() < .5 ? -2 : 2) : 0;\n  G.draw((x, y, w, h, c) => { if (!c) return; const X = flip ? G.w - x - w : x; R(X + ox + (tw && y >= b0 && y < b0 + 7 ? sh : 0), y + oy, w, h, c); }, t, o);\n};\n\n/* ---- lib/k_20_props.js ---- */\n/* ================= 恐怖屋夜晚任务的共用道具（R 以实体左上角为原点，高的东西往上伸） ================= */\nObject.assign(SPR, {\n  /* 人偶模型：e.st 0 正常 · 1 头歪 · 2 脸朝你 · e.torn 破了还没补 · e.col 衣服颜色 · e.blank 没有脸 */\n  mannequin(g, e, t, R) { const C = e.col || '#5a5048', S = '#d8ccc0', S2 = '#a89c90';\n    R(6, 14, 4, 2, '#3a3028'); R(7, 2, 2, 12, '#4a4038');\n    R(4, -6, 8, 10, C); R(3, -5, 1, 7, C); R(12, -5, 1, 7, C); R(5, 4, 6, 4, shade(C, -.2));\n    const tilt = e.st === 1 ? 1 : 0; R(5 + tilt, -13, 6, 7, S); R(10 + tilt, -12, 1, 5, S2);\n    if (!e.blank) { if (e.st === 2) { R(6 + tilt, -10, 1, 1, '#1a1010'); R(9 + tilt, -10, 1, 1, '#1a1010'); R(7 + tilt, -8, 2, 1, '#6a3030'); } else R(6 + tilt, -9, 4, 1, S2); }\n    if (e.torn) { R(4, -3, 3, 4, '#2a2018'); R(5, -2, 1, 2, '#e8dcc8'); R(11, -4, 1, 3, '#8a1010'); } },\n  /* 僵尸复活夜的假僵尸（绿脸、烂衣服、伸着手） */\n  zombie(g, e, t, R) { const sw = Math.sin(t * 1.5 + (e.px || 0)) * .5;\n    R(5, 14, 2, 2, '#2a2a20'); R(9, 14, 2, 2, '#2a2a20'); R(5, 6, 2, 8, '#3a3a2a'); R(9, 6, 2, 8, '#3a3a2a');\n    R(4, -5, 8, 12, '#4a5a3a'); R(5, -2, 2, 3, '#2a3020'); R(9, 2, 3, 2, '#2a3020'); R(4, 5, 8, 1, '#3a2a1a');\n    R(1, -4 + sw, 3, 2, '#6a8a5a'); R(12, -4 - sw, 3, 2, '#6a8a5a'); R(-1, -4 + sw, 2, 2, '#8aa070'); R(15, -4 - sw, 2, 2, '#8aa070');\n    R(5, -12, 6, 7, '#7a9a6a'); R(6, -10, 1, 1, '#c01010'); R(9, -10, 1, 1, '#c01010'); R(6, -7, 4, 1, '#3a1a1a'); R(10, -11, 1, 3, '#5a7a4a'); },\n  /* 挂旧戏服的衣架（领口空空的） */\n  costume(g, e, t, R) { R(1, -14, 14, 1, '#5a4a3a'); R(1, -14, 1, 30, '#4a3a2a'); R(14, -14, 1, 30, '#4a3a2a');\n    for (let i = 0; i < 3; i++) { const x = 2 + i * 4, c = ['#6a2a2a', '#2a3a5a', '#3a3a2a'][i]; R(x, -13, 3, 1, '#8a8a8a'); R(x, -12, 4, 1 ####',\n    '############',\n    '#++++#wwwww#',\n    '#++++#wwwww#',\n    '#+++++wwwww#',\n    '#++++#wwwww#',\n    '############'];\n  const L = { r: 2.2, col: 'rgba(255,190,120,.16)', flick: true };\n  const ZOMB = ['它们是爸妈从旧货市场淘回来的。你给它们换过三次眼珠。', '这一只的胳膊是你十二岁那年粘上去的，胶水还看得见。', '假僵尸张着嘴。嘴里塞着一团发黄的棉花——游客扔进去的瓜子壳还在里面。'];\n  const hallEnts = (o = {}) => [\n    { id: 'booth', x: 2, y: 9, spr: 'booth', solid: true, on: o.booth || (async S => S.narr('售票台。抽屉里压着今天的票根：四张。\\n其中两张被撕成了碎片——那两个人说“退钱”，你退了。')) },\n    { id: 'fam', x: 4, y: 1, spr: 'famframe', on: o.fam || (async S => S.narr('墙上挂着一张合影。爸爸、妈妈，还有扛着塑料斧头的你。\\n照片里的恐怖屋门口，排着长队。')) },\n    { id: 'z1', x: 11, y: 3, spr: 'zombie', solid: true, on: async S => S.narr(ZOMB[0]) },\n    { id: 'z2', x: 15, y: 4, spr: 'zombie', solid: true, on: async S => S.narr(ZOMB[1]) },\n    { id: 'z3', x: 12, y: 9, spr: 'zombie', solid: true, on: async S => S.narr(ZOMB[2]) },\n    { id: 'cof', x: 17, y: 9, spr: 'coffin', solid: true, on: async S => S.narr('道具棺材。盖子是你用合页改过的，从里面一推就开。\\n你小时候在里面睡过午觉。') },\n    { id: 'sw', x: 6, y: 1, spr: 'switch', off: true, on: o.sw || (async S => S.narr('总闸。你没开。\\n电费单就压在售票台上——上个月欠的那一半还没交。')) },\n    { id: 'up', x: 18, y: 2, spr: 'stairsup', solid: false, to: ['f2', 13, 2, 1] },\n    { id: 'lamp', x: 1, y: 2, spr: 'candle', light: L, on: async S => S.narr('售票台旁边那根应急蜡烛，是你点的。整座楼只有这一点光。') },\n    ...(o.extra || [])];\n  const f2Ents = (o = {}) => [\n    { id: 'down', x: 14, y: 2, spr: 'stairsdown', solid: false, to: ['hall', 17, 2, 1] },\n    { id: 'up3', x: 1, y: 2, spr: 'stairsup', solid: false, to: o.up3 || ['attic', 2, 2, 2], lock: o.lock3, lockMsg: o.lockMsg3 },\n    { id: 'bride', x: 7, y: 3, spr: 'bride', solid: true, on: o.bride || (async S => S.narr('冥婚场景的纸新娘。红盖头，红绣鞋。\\n这是妈妈亲手糊的。她说，纸人不能画眼睛，画了就“活”了。')) },\n    { id: 'cand1', x: 5, y: 3, spr: 'candles', light: { r: 1.6, col: 'rgba(255,90,60,.18)', flick: true } },\n    { id: 'cand2', x: 10, y: 3, spr: 'candles', light: { r: 1.6, col: 'rgba(255,90,60,.18)', flick: true } },\n    { id: 'altar', x: 8, y: 4, spr: 'altar', solid: true, on: async S => S.narr('供桌上摆着两只碗，两双筷子。碗是空的。\\n你记得上个月清理的时候，碗里是满的。') },\n    { id: 'cof2', x: 12, y: 8, spr: 'coffin', solid: true, on: async S => S.narr('第二口棺材。这是冥婚场景的“新郎”。\\n盖子上贴着一张褪色的喜字。') },\n    ...(o.extra || [])];\n\n  /* =================== 第一夜：三楼的旧箱子 =================== */\n  defChapter({\n    id: 'attic', n: 1, title: '三楼的旧箱子', sub: '关门以后，一个人上三楼，翻爸妈留下的东西。', origin: '恐怖屋 · 第一章', color: '#3a2a1a',\n    icon: '@me', amb: 'room', floor: 'wood', wall: 'wood', dark: .84, plr: 2.6,\n    people: { me: KP.chen }, faces: KFACES,\n    items: { phone: { name: '黑色手机', desc: '没有电池，没有卡。屏幕却亮过一次。' }, ragdoll: { name: '布偶', desc: '你小时候缝的第一个玩具。针脚很粗。' } },\n    notes: {\n      log: { title: '营业日志（爸爸的字）', text: '七月十四。客人十一位。\\n小陈今天说要给僵尸换眼珠，用的是玻璃弹珠，挺像。\\n\\n七月十五。闭馆一天。\\n有些客人不是来玩的。他们站在门口，不进来，也不走。\\n我们点了蜡烛，备了白米。\\n\\n（后面几页被撕掉了）' },\n      list: { title: '警方移交物品清单（复印件）', text: '移交人：九江市公安局西郊分局\\n发现地点：郊区原康复中心（废弃）三楼\\n\\n1. 布偶一个（手工缝制）\\n2. 手机一部（黑色，无电池，无 SIM 卡）\\n\\n备注：现场未发现其他个人物品。两名失踪人员下落不明。' },\n      draw: { title: '小时候的图纸', text: '蜡笔画的。一座房子，门口写着“恐怖屋”，歪歪扭扭。\\n房子里有很多房间，每个房间里都画了一个笑脸。\\n只有最上面一间，画的是一扇门。门上涂满了红色。' } },\n    start: { map: 'hall', x: 3, y: 7, dir: 3 },\n    async intro(S) { await S.card('三楼的旧箱子', '九江 · 西郊新世纪乐园 · 恐怖屋　晚上十点', '最后一批游客走的时候，骂了一句“一点都不吓人”。\\n今天的门票钱，刚够交一半电费。\\n\\n关上门，你没开灯。'); },\n    maps: {\n      hall: { rows: HALL_ROWS, amb: 'room',\n        ents: hallEnts(),\n        async enter(S, first) { if (!first) return; await S.think('再撑不下去，就真要停业转让了。\\n……三楼还堆着爸妈留下的东西。有些，该收拾了。'); S.goal('上三楼，翻一翻爸妈留下的东西'); } },\n      f2: { rows: F2_ROWS, wall: 'wood', amb: 'room', dark: .86,\n        ents: f2Ents({ bride: async S => { const b = S.ent('bride'); if (b.st >= 1) await S.narr('盖头掀开了一角。\\n下面那张纸脸上，有人画了一只眼睛。'); else await S.narr('冥婚场景的纸新娘。红盖头，红绣鞋。\\n这是妈妈亲手糊的。她说，纸人不能画眼睛，画了就“活”了。'); } }),\n        async enter(S, first) { if (first) await S.think('二楼是冥婚。红灯笼一个都没亮，只有两盏电子蜡烛还在闪。'); },\n        step(S, x, y) { if (x <= 3 && !S.f.lift) { S.f.lift = true; S.ent('bride').st = 1; S.sfx('tear'); return S.think('身后很轻地“嚓”了一声。像纸被风掀起来。'); } } },\n      attic: { rows: ATTIC_ROWS, wall: 'wood', floor: 'W', amb: 'wind', dark: .88, plr: 2.4,\n        ents: [\n          { id: 'down', x: 1, y: 2, spr: 'stairsdown', solid: false, to: ['f2', 2, 2, 2] },\n          { id: 'cos1', x: 5, y: 2, spr: 'costume', solid: true, on: async S => S.narr(S.f.turned ? '一排旧戏服。领口空空的。\\n你刚才看见的，就是它们？' : '一排挂起来的旧戏服。鬼新娘、白无常、吊死鬼……都是爸妈当年最得意的作品。') },\n          { id: 'cos2', x: 9, y: 2, spr: 'costume', solid: true, on: async S => S.narr('这一排是你的。小学的时候你天天穿着它们在门口吓客人，被妈妈追着打。') },\n          { id: 'mq1', x: 7, y: 4, spr: 'mannequin', solid: true, blank: true, on: async S => S.narr('一个没有脸的人偶模型。爸爸说，没有脸的最吓人——客人会自己给它想一张。') },\n          { id: 'bx1', x: 3, y: 6, spr: 'box', solid: true, on: async S => { if (S.once('draw')) await S.note('draw'); else await S.narr('箱子里是你小时候的东西。蜡笔、作业本，还有一张图纸。'); } },\n          { id: 'sh', x: 11, y: 3, spr: 'shelf', solid: true, on: async S => { if (S.once('log')) await S.note('log'); else await S.narr('架子上是爸爸的营业日志。后面几页被撕掉了。'); } },\n          { id: 'cr', x: 10, y: 6, spr: 'crate', solid: true, on: async S => S.narr('一箱假头颅。你拆过其中一个，想看看里面是什么。是泡沫。') },\n          { id: 'win', x: 7, y: 1, spr: 'window', on: async S => S.narr('窗外是乐园的摩天轮，停了很多年。\\n玻璃上有你的倒影。只有你一个。') },\n          { id: 'chest', x: 12, y: 7, spr: 'chest', solid: true, on: async S => {\n            if (S.f.got) return S.narr('木箱已经空了。');\n            const c = S.ent('chest'); c.open = true; S.sfx('open'); await S.wait(300);\n            await S.narr('最里面那个木箱。\\n里面只有两样东西：一个针脚粗糙的布偶，和一部黑色的手机。');\n            await S.note('list'); S.give('ragdoll'); S.give('phone'); S.f.got = true;\n            await S.think('布偶是我小时候缝的第一个玩具。手机……没有印象。\\n爸妈为什么半夜去那所废弃的医院？没人知道。');\n            S.show('doll'); S.show('bp'); await S.wait(400);\n            await S.think('再撑不下去，就真要停业转让了……');\n            S.sfx('phone'); S.ent('bp').lit = true; S.lights([[12 * 16 + 8, 8 * 16 + 8, 1.4, .8]]); await S.wait(500);\n            await S.narr('话音刚落，那部从来没亮过的黑色手机，屏幕一闪。\\n它没有电池，也没有卡。');\n            await S.narr('黑色的屏幕边框里，映出了你身后——');\n            await S.scare('face', { face: 'shadow', sfx: 'sting' });\n            const r = await S.ask('站着一个人。', ['回头', '不回头，盯着屏幕']);\n            if (r === 1) { await S.narr('屏幕里那个人抬起一只手，慢慢放到了你的肩膀上。\\n你的肩膀上什么都没有。可是很沉。'); S.sfx('whisper'); await S.wait(600); }\n            S.turn(3); S.f.turned = true; S.sfx('thud'); await S.narr('你猛地回头。\\n是那一排旧戏服。领口空空的，下摆还在轻轻晃。');\n            S.lights(null); S.ent('bp').lit = false; S.turn(0); await S.wait(500);\n            S.ent('doll').st = 1; S.sfx('close');\n            await S.narr('你下意识看了一眼箱子里的布偶。\\n它的脸朝着你。你记得刚才拿出来的时候，它是脸朝下的。');\n            S.ent('bp').lit = true; S.sfx('phone');\n            const b = await S.ask('屏幕上，一行白字慢慢浮出来：\\n「你是否相信，这个世界上有鬼？」', ['相信', '不相信', '……应该有吧']);\n            S.f.k_believe = b; S.ent('bp').lit = false;\n            await S.end({ title: '三楼的旧箱子', text: '屏幕上只剩一个图标：一扇门。\\n有点眼熟——像你家恐怖屋的大门。' }); } },\n          { id: 'doll', x: 12, y: 6, spr: 'ragdoll', hidden: true, on: async S => S.narr(S.ent('doll').st ? '布偶的脸朝着你。线缝的嘴，好像比刚才弯了一点。' : '布偶脸朝下趴着。') },\n          { id: 'bp', x: 11, y: 7, spr: 'blackphone', hidden: true, on: async S => S.narr('黑色手机。屏幕黑着，能照出你的脸。') }],\n        async enter(S, first) { if (first) { await S.narr('推开落灰的木门。三楼堆满了被淘汰的道具，大半是爸妈经营时留下的。\\n你从小就在这些东西中间长大。别的孩子玩拼图的时候，你在拆人头模型。'); S.goal('找到最里面那个木箱'); } } } } });\n\n  /* =================== 修人偶（一般难度日常任务） =================== */\n  const MQ = [['hall', 4, 4, '#5a4a3a'], ['hall', 11, 6, '#3a4a5a'], ['hall', 17, 6, '#5a3a3a'], ['f2', 3, 7, '#6a1a1a'], ['f2', 12, 4, '#2a2a3a'], ['f2', 9, 8, '#4a3a2a']];\n  /* 多出来的那个：每修好一个，它就换一个地方，一次比一次近 */\n  const MQX = { hall: [[6, 3], [10, 8], [14, 9], [16, 3]], f2: [[2, 4], [13, 7], [6, 8], [11, 3]] };\n  async function repair(S, i) {\n    const e = S.ent('mq' + i); if (!e.torn) return S.narr('这一个已经补好了。');\n    S.sfx('tear'); await S.wait(300); e.torn = false; S.f.n = (S.f.n || 0) + 1;\n    await S.narr(['你把裂开的肩膀缝上，又往脖子的接缝处补了点血浆。', '掉了的指头粘回去了。你顺手把它的嘴角往下压了压。', '胸口破了一个洞，里面的泡沫露出来了。你塞回去，缝上。', '一只玻璃眼珠掉在地上。你找了很久，最后在它自己的口袋里找到了。', '它的假发歪了。你扶正的时候，摸到假发底下是湿的。……血浆。是血浆。', '最后一个。针脚比你平时缝得都细。'][S.f.n - 1]);\n    S.goal('修好恐怖屋里所有的人偶（' + S.f.n + '/6）');\n    if (S.f.n >= 3) await moveX(S);\n    if (S.f.n >= 6) await finale(S); }\n  async function moveX(S) {\n    const m = S.map, list = MQX[m] || MQX.hall, k = Math.min(list.length - 1, (S.f.xi = (S.f.xi || 0) + 1) - 1);\n    S.plr(.4); S.sfx('switch'); await S.wait(260); S.plr(null); await S.wait(120); S.plr(.4); await S.wait(200);\n    if (S.ent('mqx_' + (m === 'hall' ? 'f2' : 'hall'))) S.hide('mqx_' + (m === 'hall' ? 'f2' : 'hall'));\n    S.place('mqx_' + m, list[k][0], list[k][1], 0); S.plr(null);\n    if (S.f.xi === 1) await S.think('手电接触不良，闪了几下。\\n光再亮起来的时候，那排人偶里……好像多了一个。');\n    else if (S.f.xi === 2) await S.think('又闪了一下。\\n那个多出来的，换了个地方。离你近了。');\n    else await S.think('手电闪了。你没敢回头数。'); }\n  async function finale(S) {\n    await S.wait(400); S.plr(.3); S.sfx('switch'); await S.wait(500);\n    for (const [mp, , , ] of MQ) void mp;\n    for (let i = 1; i <= 6; i++) { const e = S.ent('mq' + i); if (e) e.st = 2; }\n    await S.narr('最后一针收线。手电灭了。\\n黑暗里，你听见很多很轻的“咔”的一声——像很多颗脑袋，同时转了一下。');\n    S.plr(null); S.sfx('switch'); await S.wait(300);\n    for (let i = 1; i <= 6; i++) { const e = S.ent('mq' + i); if (e) e.st = 0; }\n    S.hide('mqx_hall'); S.hide('mqx_f2');\n    await S.narr('光回来了。人偶们都好好地站着，脸朝着它们该朝的方向。\\n那个多出来的，不见了。');\n    await S.think('……是我记错了。大概。');\n    await S.end({ title: '修好了', text: '你退后两步看了看：比以前自己修的强。\\n原来以前的维护，一直都不到位。' }); }\n  const mqEnt = (i, m, x, y, col) => ({ id: 'mq' + i, x, y, spr: 'mannequin', solid: true, torn: true, col, on: async S => repair(S, i) });\n  const xEnt = m => ({ id: 'mqx_' + m, x: 1, y: 1, spr: 'mannequin', solid: true, blank: true, hidden: true, col: '#1e1a1a',\n    on: async S => { const n = (S.f.xs = (S.f.xs || 0) + 1); await S.narr(n === 1 ? '这一个……不在维修清单上。\\n它没有脸。身上的衣服，你从来没见过。' : n === 2 ? '它身上有一股味道。不是血浆，是香烛。' : '你伸手碰了一下。是凉的。像刚从外面进来。'); } });\n  defChapter({\n    id: 'daily1', n: 2, title: '修人偶', sub: '一般难度：今夜凌晨之前，修补好恐怖屋里所有的人偶模型。', origin: '恐怖屋 · 日常任务', color: '#2a2a22',\n    icon: '@me', amb: 'room', floor: 'wood', wall: 'wood', dark: .86, plr: 2.4,\n    people: { me: KP.chen }, faces: KFACES,\n    items: { bucket: { name: '人造血浆', desc: '没用完的半桶。' } },\n    notes: { list: { title: '人偶维修清单', text: '一楼：大厅三个（门口、柱子旁、棺材边）\\n二楼：冥婚三个（新娘左手边、供桌后、新郎棺材旁）\\n\\n共六个。\\n——清单是你自己写的。字迹你认得。' } },\n    start: { map: 'hall', x: 3, y: 8, dir: 3 },\n    async intro(S) { await S.card('修人偶', '恐怖屋　晚上十一点', '为了省电，走廊灯一盏都没开。\\n你提着半桶人造血浆，胳膊底下夹着手电。\\n换了别人，这场面足够吓到报警。'); },\n    maps: {\n      hall: { rows: HALL_ROWS, amb: 'room',\n        ents: hallEnts({ booth: async S => { if (S.once('list')) { S.give('bucket', true); await S.note('list'); } else await S.narr('售票台上压着你写的维修清单。六个。'); }, extra: [mqEnt(1, 'hall', ...MQ[0].slice(1)), mqEnt(2, 'hall', ...MQ[1].slice(1)), mqEnt(3, 'hall', ...MQ[2].slice(1)), xEnt('hall')] }),\n        async enter(S, first) { if (first) { await S.think('先看一眼清单，再挨个补。'); S.goal('修好恐怖屋里所有的人偶（0/6）'); } } },\n      f2: { rows: F2_ROWS, wall: 'wood', amb: 'room', dark: .88,\n        ents: f2Ents({ lock3: () => false, lockMsg3: '三楼今晚不用去。', extra: [mqEnt(4, 'f2', ...MQ[3].slice(1)), mqEnt(5, 'f2', ...MQ[4].slice(1)), mqEnt(6, 'f2', ...MQ[5].slice(1)), xEnt('f2')] }) } } });\n\n  /* =================== 噩梦难度：镜子游戏 =================== */\n  const EV = [\n    [4, async S => { S.sfx('drip'); await S.narr('水一滴一滴地落。\\n窗户没关严，夜风吹在后颈上，像一双手。'); }],\n    [8, async S => { S.sfx('whisper'); const r = await S.ask('耳边有人跟着你一起念。陈歌、陈歌……\\n那个声音，比你慢半拍。', ['继续念', '睁眼看看是谁']); if (r === 1) return fail(S); }],\n    [13, async S => { S.sfx('knock'); await S.narr('隔间的门，轻轻敲了三下。\\n这间卫生间里，只有你一个人。'); }],\n    [18, async S => { S.sfx('glass'); S.ent('mir').cracked = true; const r = await S.ask('镜子“咔”地响了一声。\\n有人在你耳边呼吸。离得很近，节奏和你一模一样。', ['别睁眼，继续念', '睁 ('thud'); S.show('pp');\n          await S.narr('他被一把推到墙上，启事散了一地。\\n他没还手，蹲下去一张一张捡，像一具会动的空壳。');\n          const c = await S.ask('有一张，正好落在你脚边。', ['帮他捡起来', '从旁边绕过去']);\n          if (c === 0) { S.f.k_helpWq = 1; S.hide('pp'); S.face('wq', 'pl'); await S.say('wangqi', '……谢谢。'); await S.narr('这是他第一次开口。声音很哑。'); }\n          await S.walk('wq', [2, 3], 3); S.hide('wq');\n          await S.say('landlord', '五十一晚。二楼随便挑，一楼三楼不能住。午夜以后别出门。');\n          const q = await S.ask('', ['三楼为什么不能住？', '……好。']);\n          if (q === 0) await S.say('landlord', '你问题怎么那么多？不能住就是不能住！');\n          await S.walk('ll', [15, 2], 2.2); S.hide('ll'); S.f.met = false; S.f.paid = true;\n          S.goal('上二楼，住进 208'); } },\n      f2: { rows: F2, amb: 'tv',\n        ents: f2Doors({ upLock: () => false,\n          d207: async S => { if (S.once('old')) { S.ent('d207').open = true; S.show('oldm'); S.sfx('open'); await S.narr('207 的门开着。屋里，一个老人背对着门坐在轮椅上。'); S.sfx('close'); S.ent('d207').open = false; S.hide('oldm'); S.sfx('close'); await S.narr('门“嘭”地关了。\\n你的房间是 208——就在他隔壁。'); } else await S.narr('207。电视的声音开得很大。'); },\n          extra: [{ id: 'oldm', x: 12, y: 2, spr: 'wheelchair', sit: true, hidden: true }] }),\n        async enter(S, first) { if (first) S.goal('208 在走廊最里面'); } },\n      r208: { rows: ROOM, floor: 'wood', amb: 'tv', dark: .7,\n        ents: r208({ out: async S => {\n          if (!S.f.noise) return S.narr('先把包放下。');\n          S.sfx('open'); S.show('llx'); S.ent('out').open = true;\n          await S.scare('flash', { sfx: 'sting' });\n          await S.narr('你拉开门——\\n房东就站在你门外。不知道站了多久。');\n          await S.say('landlord', '……给你送暖瓶。');\n          S.hide('llx'); S.ent('out').open = false; S.sfx('close');\n          await S.think('假如他就是那个“精神病患者”，我今晚要和他做一夜邻居。');\n          await S.end({ title: '入住', text: '暖瓶放在门口。你没碰。\\n隔壁的电视，一整夜都在放广告。' }); },\n          bed: async S => { if (S.f.noise) return S.narr('隔壁吵成这样，谁睡得着。'); S.f.noise = true; S.sfx('glass'); S.shake(200, 1);\n            await S.narr('你刚坐下，隔壁传来碗摔碎的声音。\\n接着是房东的咒骂，夹着几句外地方言。');\n            S.amb('tv'); await S.narr('然后电视的音量被调到最大。放的全是广告。'); S.goal('出去看看'); },\n          desk: async S => S.note('tv'),\n          extra: [{ id: 'llx', x: 6, y: 2, spr: '@landlord', hidden: true, solid: true }] }),\n        async enter(S, first) { if (first) { await S.narr('208。一张床，一张桌子，一扇对着后山的窗。\\n五十块一晚，你没还价。'); S.goal('在床边坐一会儿'); } } } } }));\n\n  /* =================== 贴寻人启事的人 =================== */\n  defChapter(Object.assign({}, BASE, {\n    id: 'wangqi', n: 5, title: '贴寻人启事的人', sub: '晚上八点。走廊里，有人在往空房间的门缝里塞纸。', origin: '平安公寓 · 第二章', color: '#2a2a3a',\n    amb: 'tv', floor: 'concrete', wall: 'plain', dark: .7, plr: 2.6,\n    items: {}, notes: {\n      fuan: { title: '五年前的富安公寓', text: '王琦说的：\\n\\n那屋里住着一家四口。父亲、母亲、一个女儿、一个小儿子。\\n那天晚上，有人敲了三下门。没有人去开，门自己开了。\\n\\n一夜之间，全没了。\\n出了事，才改的名字：富安改成了平安。' },\n      news: { title: '旧案（网上能查到的）', text: '火灾现场有多个起火点。\\n四具尸体。\\n现场有第五个人的痕迹——没找到人。\\n\\n唯一的亲属，是轮椅上那位老人。他也是火灾以后最大的受益人。' },\n      ear: { title: '隔墙听见的', text: '房东骂人的时候，夹着外地方言。\\n老人的公寓，为什么让一个外地人管着？\\n那只碗，摔得太是时候了。' },\n      sms: { title: '王琦的手机', text: '发件人：她\\n时间：昨天凌晨 2:00\\n\\n救我\\n\\n往上翻，每一条都是凌晨发来的。每一条都只有这两个字。' } },\n    start: { map: 'f2', x: 15, y: 2, dir: 0 },\n    async intro(S) { await S.card('贴寻人启事的人', '平安公寓 · 二楼　晚上八点', '房东说午夜以后别出门。\\n现在才八点。'); },\n    maps: {\n      f2: { rows: F2, amb: 'tv',\n        ents: f2Doors({ upLock: () => false, extra: [\n          { id: 'wq', x: 7, y: 2, spr: '@wangqi', solid: true, dir: 3, on: async S => {\n            if (S.f.wq) return S.say('wangqi', '……');\n            S.f.wq = true; S.face('wq', 'pl');\n            await S.say('wangqi', KENV.flags.helpWq ? '你人不错，听我一句：别在这过夜。钱重要还是命重要？' : '……新来的？别在这过夜。');\n            await S.say('wangqi', '这楼以前叫富安公寓。五年前，这层楼上住着一家四口。');\n            S.sfx('knock'); await S.wait(300); S.sfx('knock'); await S.wait(300); S.sfx('knock');\n            await S.note('fuan');\n            await S.say('wangqi', '我未婚妻就是在这附近失踪的。每天午夜以后，我都会收到她发来的短信。只有两个字。');\n            S.sfx('phone'); await S.note('sms');\n            await S.say('wangqi', '一觉醒来，她的东西还会出现在我床上。……我知道你把我当疯子。');\n            await S.walk('wq', [2, 3], 2.6); S.hide('wq'); S.show('tt'); S.goal('楼梯口有人在抽烟'); } },\n          { id: 'tt', x: 2, y: 2, spr: '@tattoo', hidden: true, solid: true, on: async S => {\n            if (S.f.tt) return S.say('tattoo', '回屋去。');\n            S.f.tt = true; S.face('tt', 'pl');\n            await S.say('tattoo', '新来的，离那个贴纸的远点。这世上哪有鬼？最多是有人装鬼。回屋去。');\n            await S.narr('他夹烟的左手抬起来，手背上纹着一朵牡丹。');\n            await S.think('两个人里，肯定有一个在撒谎。');\n            S.hide('tt'); S.sfx('step'); S.goal('回 208，把今晚看到的东西过一遍'); } }] }),\n        async enter(S, first) { if (first) { S.sfx('paper'); await S.narr('走廊里有窸窸窣窣的声音。\\n有人正往没人住的空房间门缝里，一张一张地塞纸。'); S.goal('看看是谁'); } } },\n      r208: { rows: ROOM, floor: 'wood', amb: 'tv', dark: .72,\n        ents: r208({\n          desk: async S => { S.f.c1 = 1; await S.note('news'); clue(S); },\n          wall: async S => { S.f.c2 = 1; await S.note('ear'); clue(S); },\n          win: async S => { S.f.c3 = 1; await S.narr('窗外，院子里的水房亮着一盏灯。\\n这么晚了，有人在里面拖地。'); clue(S); },\n          bed: async S => {\n            if (!S.f.ready) return S.narr('还睡不着。脑子里乱得很。');\n            S.ent('lmp').light = null; S.dark(.94); S.sfx('switch');\n            await S.narr('你关了灯。');\n            S.sfx('tear'); await S.wait(500); S.sfx('step'); await S.wait(400); S.sfx('step');\n            await S.narr('楼上传来拖东西的声音。一下，一下，从走廊这头拖到那头。\\n三楼不让住人。');\n            const g = await S.ask('你觉得，谁最可疑？', ['房东。他鸠占鹊巢，挟持了老人', '王琦。他的故事太完整了', '现在下结论太早']);\n            S.f.k_guess = g;\n            await S.end({ title: '贴寻人启事的人', text: ['方言、电视、门外偷听。', '短信、失踪、热情得过分。', '需要证据。'][g] + '\\n拖东西的声音，一直到两点才停。' }); } }),\n        async enter(S, first) { if (first) S.goal('查一查：桌上的电脑、薄薄的墙、窗外'); } } } }));\n  function clue(S) { const n = (S.f.c1 || 0) + (S.f.c2 || 0) + (S.f.c3 || 0); if (n >= 2 && !S.f.ready) { S.f.ready = true; S.goal('关灯，躺下'); } }\n\n  /* =================== 凶宅直播 =================== */\n  defChapter(Object.assign({}, BASE, {\n    id: 'live', n: 6, title: '凶宅直播', sub: '晚上十点。直播开着，房间里只有你一个人。', origin: '平安公寓 · 第二章', color: '#3a2a2a',\n    amb: 'room', floor: 'wood', wall: 'plain', dark: .7, plr: 2.6,\n    items: { hammer: { name: '工具锤', desc: '从恐怖屋带来的。' }, knife: { name: '水果刀', desc: '口袋里的。抽了几次，顺手了。' } },\n    notes: { dm: { title: '弹幕', text: '有没有吊大的知道这直播间播什么？\\n喂妖妖灵吗，我发现一个野生的精神病\\n好好的墙皮被刮坏了，心疼公寓老板一秒\\n现实版狼人杀啊，有请预言家发言\\n我怀疑真凶是轮椅上的老人' } },\n    start: { map: 'r208', x: 6, y: 4, dir: 3 },\n    async intro(S) { await S.card('凶宅直播', '208　晚上十点', '标题：夜宿凶宅！亲身探秘！为你掀开这世界不为人知的一幕！\\n\\n在线人数：四十。'); S.give('hammer', true); },\n    maps: {\n      r208: { rows: ROOM, floor: 'wood', amb: 'room', dark: .74,\n        ents: r208({\n          wall: async S => { if (S.f.w) return S.narr('熏黑的砖。这面墙烧过。'); S.f.w = 1; S.sfx('cut'); await S.narr('你用工具锤刮掉一层墙皮。\\n下面露出来的砖，是熏黑的。'); await S.note('dm'); await S.think('……你们的关注点能不能别那么刁钻。'); await next(S); },\n          desk: async S => { if (S.f.k) return S.narr('桌上的手机还在直播。'); S.f.k = 1; S.give('knife'); await S.narr('你把水果刀放进口袋，练了几次抽刀。'); await next(S); },\n          out: async S => {\n            if (!S.f.gone) return S.narr(S.f.sh ? '门缝下面……' : '还不到出门的时候。');\n            S.sfx('paper'); await S.narr('出门之前，你从头上拔了一根头发，轻轻塞进锁眼里。\\n回来的时候，它要是不在了——');\n            await S.end({ title: '凶宅直播', text: '在线人数：一千二。\\n有人在弹幕里问：主播，你回去还敢睡吗？' }); },\n          extra: [{ id: 'sh', x: 6, y: 2, spr: 'shadowdoor', hidden: true, on: async S => S.narr('门缝下面，那道影子……') }] }),\n        async enter(S, first) { if (first) S.goal('直播开着：刮开墙皮、把刀揣好'); } } } }));\n  async function next(S) {\n    if (!(S.f.w && S.f.k) || S.f.sh) return; S.f.sh = true;\n    await S.wait(500); S.plr(.3); S.sfx('tv'); S.show('sh'); await S.wait(300); S.plr(null);\n    await S.say('弹幕', ['主播你身后！！！', '门缝下面！', '我截图了你们看'], { style: 'big' });\n    await S.narr('弹幕突然刷成一片。\\n直播画面里，你身后那扇门的门缝下面，有一道影子，停住了。');\n    const r = await S.ask('', ['回头', '不回头，盯着手机屏幕']);\n    if (r === 1) { await S.narr('屏幕里，那道影子一点一点变长。像有人蹲了下来——\\n从门缝底下往里看。'); S.sfx('heart'); await S.wait(500); }\n    S.turn(3); S.hide('sh'); S.sfx('step'); await S.wait(300); S.sfx('step');\n    await S.narr('你回头。门缝下面什么都没有。\\n走廊里的脚步声，往楼上去了。');\n    S.f.gone = true; S.goal('出门前，留个记号'); }\n\n  /* =================== 三楼 =================== */\n  const PILE = ['一把烧变形的椅子底下，压着一个布偶。', '一卷发霉的地毯里，裹着第二个。', '一个破纸箱，里面只有第三个布偶，坐得端端正正。', '最后一个在墙角。它的脸朝着墙。'];\n  const CARD = ['发霉的棉絮里有一张卡片，字里行间全是爱意。', '也是一张卡片。同样的话，同样的笔迹。', '第三张卡片。写卡片的人很用心，一笔一画。'];\n  defChapter(Object.assign({}, BASE, {\n    id: 'f3', n: 7, title: '三楼', sub: '凌晨一点。三楼不让住人。', origin: '平安公寓 · 第二章', color: '#2a2020',\n    amb: 'wind', floor: 'concrete', wall: 'plain', dark: .9, plr: 2.4,\n    items: { dolls: { name: '四个布偶', desc: '同一个厂家，五年前的款。' } },\n    notes: { scraps: { title: '第四个布偶', text: '没有卡片。\\n棉絮里塞满了撕碎的纸条。\\n\\n每一张上，只有三个字：\\n\\n去死吧！\\n\\n（弹幕：这字迹和卡片不是一个人的）' } },\n    start: { map: 'r208', x: 6, y: 3, dir: 3 },\n    async intro(S) { await S.card('三楼', '平安公寓　凌晨一点', '拖东西的声音停了。\\n你等了半个小时，楼里一点动静都没有。'); },\n    maps: {\n      r208: { rows: ROOM, floor: 'wood', amb: 'room', dark: .9, ents: r208({ dark: true }), async enter(S, first) { if (first) S.goal('上三楼'); } },\n      f2: { rows: F2, amb: 'none', dark: .9, ents: f2Doors({ d207: async S => S.narr('207 里没有电视的声音了。'), d208: async S => S.go('r208', 6, 5, 3) }) },\n      f1: { rows: F1, amb: 'none', dark: .92,\n        ents: [\n          { id: 'out', x: 2, y: 1, spr: 'door', solid: true, on: async S => { if (!S.f.done) return S.narr('大门锁着。'); S.sfx('locked'); await S.narr('防盗门从里面锁死了。钥匙在房东身上。'); await S.end({ title: '三楼', text: '你给鹤山发了两个字：报警。\\n然后蹲在黑暗里，听着楼梯上的脚步声，一下一下，往二楼来。' }); } },\n          { id: 'up', x: 15, y: 2, spr: 'stairsup', solid: false, to: ['f2', 1, 3, 2] }] },\n      f3: { rows: F3, amb: 'wind', dark: .92, plr: 2.2,\n        ents: [\n          { id: 'down', x: 1, y: 2, spr: 'stairsdown', solid: false, to: ['f2', 17, 2, 1] },\n          ...[[6, 2], [11, 5], [15, 2], [19, 5]].map(([x, y], i) => ({ id: 'p' + i, x, y, spr: ['crate', 'sack', 'box', 'box'][i], solid: true, on: async S => pile(S, i) })),\n          { id: 'hd', x: 9, y: 1, spr: 'door', solid: true, open: true, on: async S => hide(S) },\n          { id: 'bw', x: 20, y: 1, spr: 'brickwall', solid: true, on: async S => S.narr(S.f.seen ? '墙里那个人，还在里面。' : '走廊尽头堆着杂物，后面挂着一块布帘。\\n布帘后面的墙，颜色比别处新。') },\n          { id: 'll', x: 2, y: 3, spr: '@landlord', hidden: true, solid: true },\n          { id: 'tt', x: 2, y: 2, spr: '@tattoo', hidden: true, solid: true },\n          { id: 'wm', x: 3, y: 3, spr: '@woman', hidden: true, solid: true },\n          { id: 'ft', x: 3, y: 2, spr: '@fat', hidden: true, solid: true },\n          { id: 'snd', x: 1, y: 1, spr: 'lamp', light: null },\n          { id: 'st1', x: 13, y: 3, spr: 'stain' }, { id: 'st2', x: 4, y: 5, spr: 'footprints' }],\n        async enter(S, first) { if (first) { await S.narr('三楼没翻修过。到处是烧过的痕迹。\\n杂物和垃圾堆到没地方下脚。'); S.goal('翻翻这些垃圾'); } } } },\n    resume: { hide: async S => { S.hidePlayer(false); ['ll', 'tt', 'wm', 'ft'].forEach(k => { S.stop(k); S.hide(k); }); S.ent('snd').light = null; S.f.alarm = false; S.after(400, alarm); } } }));\n  async function pile(S, i) {\n    if (S.f['p' + i]) return S.narr('翻过了。');\n    S.f['p' + i] = 1; S.f.n = (S.f.n || 0) + 1; S.sfx('paper'); await S.narr(PILE[i]);\n    if (S.f.n < 4) await S.narr(CARD[S.f.n - 1]); else { await S.note('scraps'); S.give('dolls'); await S.narr('四个布偶，出自同一个厂家，五年前的款。\\n房子、家具都烧没了，它们是怎么躲过去的？'); }\n    S.goal('翻翻这些垃圾（' + S.f.n + '/4）');\n    if (S.f.n >= 4) { kCpAt(S, 'hide'); await alarm(S); } }\n  async function alarm(S) {\n    S.f.alarm = true; S.ent('snd').light = { r: 3, col: 'rgba(255,240,200,.35)' }; S.sfx('switch'); S.shake(200, 1);\n    await S.narr('楼梯拐角的声控灯，突然亮了。\\n有好几个人的脚步声，正往三楼来。');\n    S.goal('躲起来！（左边那间开着门的屋子）'); S.timer(7, '躲', async S => { if (!S.pl.hidden) await seen(S); }); }\n  async function hide(S) {\n    if (!S.f.alarm) return S.narr('一间空屋。门半开着，门后有一块能藏人的地方。');\n    S.clearTimer(); S.hidePlayer(true); S.ent('hd').open = false; S.sfx('close'); S.plr(0);\n    await S.narr('你躲进门后，屏住呼吸，从门缝往外看。');\n    S.show('ll'); S.show('tt'); S.place('ll', 2, 3, 2); S.place('tt', 2, 2, 2); S.focus(12, 3); S.sfx('step');\n    await Promise.all([S.walk('ll', [14, 3], 3), S.walk('tt', [14, 2], 3)]);\n    S.place('wm', 17, 3, 1); S.place('ft', 19, 2, 1); S.show('wm'); S.show('ft'); S.ent('wm').alpha = 0; S.ent('ft').alpha = 0; await Promise.all([S.alpha('wm', 1, 500), S.alpha('ft', 1, 500)]);\n    await S.say('landlord', '必须赶紧把那东西弄出去。最近来的外人越来越多。');\n    await S.say('tattoo', '叫上其他人，今夜就给它挖出来，埋到后山去。');\n    await S.say('woman', '这事大家人人有份，谁也跑不了。干活吧。');\n    await S.narr('矮胖的那个抓着铁钎，手在抖。\\n他掀开走廊尽头杂物堆后面的布帘——墙是新砌的。');\n    S.face('ft', 2); S.sfx('cut'); await S.wait(400); S.sfx('cut'); S.ent('bw').open = true; S.focus(20, 2);\n    await S.scare('glitch', { sfx: 'sting' });\n    await S.narr('墙里，是一个人。');\n    S.f.seen = true; S.ent('snd').light = null;\n    await S.narr('房东和纹身男抬着麻袋下了楼，说是去“后山老地方”。\\n另外两个，也跟着走了。');\n    for (const k of ['ll', 'tt', 'wm', 'ft']) S.hide(k);\n    S.focus(null); S.plr(null); S.hidePlayer(false); S.ent('hd').open = true;\n    await S.narr('脚步声远了。');\n    S.f.done = true; S.goal('下楼，离开这栋楼'); }\n  async function seen(S) {\n    S.f.k_seen = 1; S.f.alarm = false; S.ent('snd').light = null;\n    S.sfx('paper'); await S.narr('你往后退的时候，踩到了一个布偶。');\n    S.show('tt'); S.place('tt', 2, 2, 2); await S.say('tattoo', '谁？！');\n    S.goal('跑！从楼梯下去'); S.f.done = true;\n    S.chase('tt', { spd: 2.9, catch: kCaught('axe', '一只左手从背后捂住了你的嘴。\\n手背上，纹着一朵牡丹。', '被纹身男抓住了') }); }\n\n  /* =================== 午夜逃杀 =================== */\n  defChapter(Object.assign({}, BASE, {\n    id: 'escape', n: 8, title: '午夜逃杀', sub: '凌晨两点。回 208，从窗户下去。', origin: '平安公寓 · 第二章', color: '#3a1a1a',\n    amb: 'none', floor: 'concrete', wall: 'plain', dark: .9, plr: 2.4, items: {}, notes: {},\n    start: { map: 'f1', x: 3, y: 2, dir: 2 },\n    async intro(S) { await S.card('午夜逃杀', '平安公寓　凌晨两点', '大门锁死了。\\n只能回 208，把床单捆在窗框上，从二楼下去。'); },\n    maps: {\n      f1: { rows: F1, amb: 'none', dark: .92,\n        ents: [{ id: 'out', x: 2, y: 1, spr: 'door', solid: true, on: async S => { S.sfx('locked'); await S.narr('锁死了。'); } },\n          { id: 'up', x: 15, y: 2, spr: 'stairsup', solid: false, to: ['f2', 1, 3, 2] }],\n        async enter(S, first) { if (first) S.goal('上二楼，回 208'); } },\n      f2: { rows: F2, amb: 'none', dark: .9,\n        ents: f2Doors({ upLock: () => false,\n          d208: async S => {\n            if (S.f.door) return S.narr('门板那一边……');\n            S.f.door = true; S.focus(15, 2);\n            await S.narr('你摸出钥匙，借着屏幕的微光对准锁孔——');\n            S.sfx('heart'); await S.scare('flash', { sfx: 'sting' });\n            await S.narr('锁眼里那根头发，被顶进去了。\\n有人进过你的房间。或者说，现在就在里面。');\n            S.sfx('whisper'); await S.narr('门板那一边，有人也屏住了呼吸。');\n            S.focus(null); S.norun(true); S.goal('一点声音都别出：退到走廊另一头'); },\n          d203: async S => { if (!S.f.chase) return S.narr('203。门没锁，虚掩着。'); S.sfx('open'); await S.go('r203', 6, 5, 3); },\n          extra: [{ id: 'll', x: 15, y: 2, spr: '@landlord', hidden: true, solid: true }, { id: 'tt', x: 14, y: 2, spr: '@tattoo', hidden: true, solid: true }] }),\n        step(S, x, y) { if (S.f.door && !S.f.chase && x <= 7) S.run(burst); } },\n      r203: { rows: ROOM, floor: 'wood', amb: 'none', dark: .9,\n        ents: [\n          { id: 'out', x: 6, y: 1, spr: 'door', solid: true, on: async S => S.narr('外面有人在找你。') },\n          { id: 'win', x: 3, y: 1, spr: 'window', on: async S => {\n            S.sfx('glass'); await S.narr('你撞开窗户，踩着一楼的防盗网往下跳。');\n            S.sfx('thud'); S.shake(300, 2); await S.go('yard', 10, 4, 0);\n            await S.narr('一把菜刀擦着你的肩膀飞过去，钉在地上。');\n            S.show('ft'); S.show('wm'); S.place('ft', 4, 2, 0); S.place('wm', 5, 2, 0);\n            await S.narr('胖子和那个女人举着修灌木的铁剪，从楼门口冲出来。');\n            kCpAt(S, 'yard'); S.goal('翻出铁门，往后山跑！');\n            S.chase('ft', { spd: 2.7, catch: kCaught('axe', '铁剪合上的声音，比你想的还要轻。', '被追上了') }); S.chase('wm', { spd: 2.6, catch: kCaught('axe', '她抓住了你的后领。“跑什么？”', '被追上了') }); } },\n          { id: 'bd', x: 2, y: 3, spr: 'bed', solid: true, col: '#5a5a6a', on: async S => S.narr('203 的床上，铺着一张发黄的塑料布。') }] },\n      yard: { rows: YARD, amb: 'wind', floor: 'grass', dark: .82,\n        ents: [{ id: 'bd', x: 4, y: 1, spr: 'door', solid: true, on: async S => S.narr('回去？') },\n          { id: 'kf', x: 7, y: 4, spr: 'knife' },\n          { id: 'ft', x: 4, y: 2, spr: '@fat', hidden: true, solid: true }, { id: 'wm', x: 5, y: 2, spr: '@woman', hidden: true, solid: true },\n          { id: 'gate', x: 6, y: 10, spr: 'sparkle', solid: false, touch: async S => leaveYard(S) }, { id: 'gate2', x: 7, y: 10, solid: false, touch: async S => leaveYard(S) }] },\n      woods: { rows: WOODS, amb: 'night', floor: 'grass', dark: .9, plr: 2.2,\n        ents: [\n          { id: 'wq', x: 15, y: 6, spr: '@wangqi', hidden: true, solid: true, light: { r: 2.6, col: 'rgba(255,240,200,.28)' } },\n          { id: 'bush', x: 10, y: 6, spr: 'plant', solid: false },\n          { id: 'hut', x: 13, y: 1, spr: 'door', solid: true, on: async S => { S.sfx('open'); await S.narr('一间木屋，像护林员住的。门没锁。'); await S.end({ title: '午夜逃杀', text: '衣服被树杈挂烂了。直播黑屏了一个多小时，满屏都在刷问号。\\n你推开了木屋的门。' }); } },\n          { id: 'sign', x: 4, y: 9, spr: 'sign', on: async S => S.narr('护林防火，人人有责。牌子被刀砍过。') }],\n        step(S, x, y) { if (y <= 7 && !S.f.wq) { S.f.wq = true; S.run(lamp); } },\n        async enter(S, first) { if (first) { await S.narr('跑了十五分钟，身后的手电光才消失。'); S.goal('往山上走'); } } } },\n    resume: {\n      corridor: async S => { S.f.chase = true; S.norun(false); S.show('ll'); S.show('tt'); S.place('ll', 15, 2, 1); S.place('tt', 14, 2, 1); goChase(S); },\n      yard: async S => { S.show('ft'); S.show('wm'); S.place('ft', 4, 2, 0); S.place('wm', 5, 2, 0); S.chase('ft', { spd: 2.7, catch: kCaught('axe', '铁剪合上的声音，比你想的还要轻。', '被追上了') }); S.chase('wm', { spd: 2.6, catch: kCaught('axe', '她抓住了你的后领。', '被追上了') }); } } }));\n  async function burst(S) {\n    S.f.chase = true; S.norun(false); S.sfx('open'); S.ent('d208').open = true; S.show('ll'); S.show('tt');\n    await S.scare('red', { sfx: 'scream' });\n    await S.narr('208 的门被推开。\\n房东和纹身男提着钢钎和菜刀冲了出来。');\n    kCpAt(S, 'corridor'); S.goal('203 的门虚掩着——进去，跳窗！'); goChase(S); }\n  function goChase(S) { S.chase('tt', { spd: 3.0, catch: kCaught('axe', '菜刀落下来的时候，你听见他在笑。', '被追上了') }); S.chase('ll', { spd: 2.6, catch: kCaught('axe', '钢钎捅进了墙里，离你的脸只有一指。下一下，没有偏。', '被追上了') }); }\n  async function leaveYard(S) { if (!S.ent('ft') || S.ent('ft').hidden) return; S.stop('ft'); S.stop('wm'); S.hide('ft'); S.hide('wm'); await S.go('woods', 3, 11, 3); }\n  async function lamp(S) {\n    S.show('wq'); S.sfx('step'); await S.narr('有一束很浅的光扫过来。');\n    const r = await S.ask('', ['趴进灌木里，别动', '握紧工具锤']);\n    if (r === 1) await S.narr('你握紧了锤柄。光停在你身前两步远的地方，又移开了。');\n    else await S.narr('你趴进灌木。光从你背上扫过去，停了一下。');\n    await S.say('wangqi', '……是我看错了？不可能啊。');\n    S.face('wq', 1); await S.wait(300); S.face('wq', 2); await S.wait(300);\n    await S.walk('wq', [20, 4], 2.4); S.hide('wq');\n    await S.narr('他拿着手电在原地转了几圈，走了。'); S.goal('前面有一间木屋'); }\n\n  /* =================== 真凶（木屋） =================== */\n  defChapter(Object.assign({}, BASE, {\n    id: 'hut', n: 9, title: '真凶', sub: '凌晨三点。后山护林员的木屋。', origin: '平安公寓 · 第二章', color: '#2a1a1a',\n    amb: 'night', floor: 'darkwood', wall: 'wood', dark: .88, plr: 2.4,\n    items: { pinkphone: { name: '桃红色的手机', desc: '发件箱里，每一条都是“救我”。' } },\n    notes: {\n      cl: { title: '床底下的衣服', text: '大部分是女人的衣服，从来没洗过。\\n有一件上面的泥还没干透——像这一两天还有人穿过。\\n\\n尺码，和墙里那个人对得上。' },\n      love: { title: '皱巴巴的纸条', text: '我爱你\\n我爱你\\n我爱你\\n\\n和五年前布偶里的卡片，是一样的话。一样的笔迹。' },\n      out: { title: '发件箱', text: '凌晨 2:00　救我\\n凌晨 2:00　救我\\n凌晨 2:00　救我\\n……\\n\\n收件人：王琦。\\n用死者的手机，每天夜里给自己发短信。然后一觉醒来，什么都不记得。' } },\n    start: { map: 'hut', x: 4, y: 5, dir: 3 },\n    async intro(S) { await S.card('真凶', '后山 · 木屋　凌晨三点', '一股怪味。\\n生活用品堆得像垃圾场。'); },\n    maps: {\n      hut: { rows: HUT, amb: 'night', floor: 'darkwood',\n        ents: [\n          { id: 'door', x: 4, y: 1, spr: 'door', solid: true, on: async S => { if (!S.f.chase) return S.narr('门外是黑漆漆的林子。'); if (!S.f.froze) return S.narr('他堵在门口。'); S.sfx('open'); await S.go('woods', 13, 4, 0); } },\n          { id: 'bed', x: 1, y: 2, spr: 'bed', solid: true, col: '#5a4a3a', on: async S => { if (S.once('cl')) { await S.note('cl'); clue2(S); } else S.narr('床底下塞满了衣服。'); } },\n          { id: 'cl', x: 7, y: 4, spr: 'clothes', solid: true, on: async S => { if (S.once('love')) { await S.note('love'); clue2(S); } else S.narr('那堆衣服的口袋，你都翻过了。'); } },\n          { id: 'tb', x: 7, y: 2, spr: 'table', solid: true, on: async S => S.narr('桌上有半碗泡面，还温着。') },\n          { id: 'st', x: 2, y: 5, spr: 'stove', solid: true, on: async S => S.narr('炉子里的灰，是新的。烧的是纸。') },\n          { id: 'ph', x: 6, y: 5, spr: 'pinkphone', hidden: true, on: async S => phone(S) },\n          { id: 'xiao', x: 3, y: 3, spr: '@xiao', hidden: true, alpha: .7 },\n          { id: 'wq', x: 4, y: 2, spr: '@wangqi', hidden: true, solid: true, on: async S => showPhone(S) },\n          { id: 'ax', x: 5, y: 2, spr: 'axe', hidden: true },\n          { id: 'raise', x: 1, y: 1, hidden: true, solid: false, on: async S => { const z = S.ent('wq'); if (Math.abs(z.x - S.pl.x) + Math.abs(z.y - S.pl.y) <= 4) await showPhone(S); else await S.narr('你攥紧了那部手机。等他再近一点。'); } }],\n        tick(S) { const r = S.ent('raise'); if (S.f.chase && !S.f.froze) { r.hidden = false; S.place('raise', S.pl.x, S.pl.y); } else r.hidden = true; },\n        async enter(S, first) { if (first) S.goal('翻一翻这间屋子'); } },\n      woods: { rows: WOODS, amb: 'night', floor: 'grass', dark: .9, plr: 2.2,\n        ents: [\n          { id: 'hut', x: 13, y: 1, spr: 'door', solid: true, on: async S => S.narr('不能回去。') },\n          { id: 'wq2', x: 13, y: 2, spr: '@wangqi', hidden: true, solid: true },\n          { id: 'car', x: 9, y: 11, spr: 'car', solid: false, light: { r: 3.2, col: 'rgba(80,120,255,.28)', flick: true }, touch: async S => road(S) },\n          { id: 'car2', x: 11, y: 11, solid: false, touch: async S => road(S) }, { id: 'car3', x: 12, y: 11, solid: false, touch: async S => road(S) }],\n        async enter(S, first) { if (first) { S.goal('一直往山下跑，跑到有路的地方'); S.show('wq2'); S.place('wq2', 13, 2, 0); S.after(700, async S => { S.chase('wq2', { spd: 2.9, catch: axeCatch }); await S.narr('身后，门被撞开了。'); }); } } } },\n    resume: { axe: async S => { S.f.froze = false; S.f.chase = true; S.show('wq'); S.place('wq', 4, 2, 0); S.show('ax'); S.chase('wq', { spd: 2.7, catch: axeCatch }); } } }));\n  const axeCatch = async S => { await S.scare('face', { face: 'axe', sfx: 'scream' }); await S.die('斧头砍在门框上的声音，你只听见了一半。', '真凶'); };\n  function clue2(S) { if (S.f._o_cl && S.f._o_love && !S.f.ph) { S.f.ph = true; S.show('ph'); S.sfx('thud'); S.toast('衣服里掉出来一样东西'); S.goal('衣服里掉出来一部手机'); } }\n  async function phone(S) {\n    if (S.f.got) return; S.f.got = true; S.hide('ph'); S.give('pinkphone');\n    await S.narr('一部桃红色外壳的手机。屏幕停在编辑短信的页面。'); await S.note('out');\n    await S.think('贴寻人启事的那个人，找的是被他自己砌进墙里的人。');\n    S.ent('ph').lit = false; S.show('xiao'); S.sfx('whisper');\n    await S.narr('手机屏幕暗下去。\\n黑色的屏幕上，映出你身后站着一个小女孩，七八岁。');\n    await S.scare('face', { face: 'child', sfx: 'sting' });\n    await S.narr('她抬起手，指了指你的背后。'); S.hide('xiao');\n    S.show('wq'); S.show('ax'); S.sfx('open'); S.turn(3);\n    await S.narr('你转身。王琦提着一把斧头，堵在门口。');\n    await S.say('wangqi', '毕竟……是我亲手把她砌进墙里的。我不想这样的。你知道吗？我也不想这样的。');\n    if (KENV.flags.guess === 1) await S.think('猜对了。但我宁愿是猜错了。');\n    S.f.chase = true; kCpAt(S, 'axe'); S.goal('他堵着门。等他走近，把手机举到他眼前（按调查键）');\n    S.chase('wq', { spd: 2.7, catch: axeCatch });\n    S.after(2500, async S => { if (!S.f.froze) { S.show('xiao'); await S.narr('屋角那个小女孩又出现了。\\n她指了指你手里的手机，又指了指他。'); S.hide('xiao'); } }); }\n  async function showPhone(S) {\n    if (!S.f.chase || S.f.froze) return;\n    S.stop('wq'); S.f.froze = true; S.ent('ph').lit = true;\n    await S.narr('你把那部桃红色的手机举到他眼前。\\n屏幕亮着：凌晨两点，救我。');\n    await S.say('wangqi', '……她发的。她又发了。她在哪儿？她在哪儿……');\n    await S.narr('斧头垂了下去。他盯着屏幕，嘴唇一直在动。\\n门口空出来了。');\n    S.place('wq', 6, 3, 0); S.goal('跑！出门'); }\n  async function road(S) {\n    if (S.f.end) return; S.f.end = true; S.stop('wq2'); S.hide('wq2');\n    await S.narr('一刻没停，一直跑到看见水泥路。\\n警灯。');\n    await S.say('me', '是我报的警！我抓住了五年前灭门案的凶手！');\n    await S.end({ title: '真凶', text: '王琦当场落网。\\n他被押上警车的时候，还在问：她在哪儿？' }); }\n\n  /* =================== 恐怖屋 · 午夜逃杀三楼 =================== */\n  const WS = [\n    '######################',\n    '######################',\n    '#xxxxx#xxxxxxxx#+++++#',\n    '#xxxxx#xxxxxxxx#+++++#',\n    '#xx#xxxxx###xxxx+++++#',\n    '#xx#xxxxx###xxx#+++++#',\n    '#xx######xxxxxx#######',\n    '#xxxxxxxxxxx##xxxxxxx#',\n    '#xxxxxxxxxxx##xxxxxxx#',\n    '######################'];\n  const wsEnts = (o = {}) => [\n    { id: 'gate', x: 2, y: 1, spr: 'door', solid: true, on: o.gate || (async S => S.narr('员工通道。') ) },\n    { id: 'innr', x: 20, y: 6, spr: 'door', solid: true, on: o.innr || (async S => S.narr('三楼最里面的房间。门关着。')) },\n    { id: 'mir', x: 18, y: 1, spr: 'mirror', on: o.mir || (async S => S.narr('浴室的镜子。镜面上有一道新的裂痕。')) },\n    { id: 'tub', x: 17, y: 3, spr: 'tub', solid: true, w: 2, full: !!o.full, on: o.tub || (async S => S.narr('浴缸。白瓷，冰凉。')) },\n    { id: 'b1', x: 9, y: 2, spr: 'crate', solid: true }, { id: 'b2', x: 4, y: 8, spr: 'sack', solid: true },\n    { id: 'k1', x: 13, y: 2, spr: 'stain' }, { id: 'k2', x: 8, y: 7, spr: 'handprint' }, { id: 'k3', x: 18, y: 8, spr: 'footprints' },\n    { id: 'lm', x: 11, y: 1, spr: 'lamp', light: { r: 1.6, col: 'rgba(255,60,40,.14)', flick: true } },\n    ...(o.extra || [])];\n\n  /* —— 布偶的房间（午夜逃杀开张那天晚上） —— */\n  defChapter(Object.assign({}, BASE, {\n    id: 'dolls', n: 10, title: '亡者的执念', sub: '学生们走了。三楼最里面那间屋子，门关着。', origin: '恐怖屋 · 午夜逃杀', color: '#2a1a2a',\n    amb: 'room', floor: 'concrete', wall: 'plain', dark: .88, plr: 2.4, items: {}, notes: {},\n    start: { map: 'ws', x: 2, y: 2, dir: 0 },\n    async intro(S) { await S.card('亡者的执念', '恐怖屋 · 午夜逃杀　傍晚', '鹤山问：里面那个小孩是谁演的？就是一直跟在猴子后面那个。\\n\\n你的员工，只有徐婉一个。'); },\n    maps: {\n      ws: { rows: WS, amb: 'room',\n        ents: wsEnts({ innr: async S => {\n          S.sfx('open'); S.ent('innr').open = true; S.show('d4'); S.focus(20, 7);\n          await S.narr('房间正中央，并排坐着四个布偶——你从平安公寓带回来的那四个。\\n你记得，你把它们锁在了二楼的柜子里。');\n          S.sfx('phone'); await S.narr('手机震了一下。\\n「亡者的执念尚未放下。完成它们的心愿，它们方才能为你所用。」');\n          const c = await S.ask('它们想要什么？', ['把王琦的寻人启事贴在这个房间里', '把寻人启事烧掉']);\n          S.f.k_notice = c;\n          if (c === 0) await S.narr('你把那张纸贴在墙上。照片下面，你用红笔写了四个字：已经归案。\\n最小的那个布偶，往你这边歪了一下。');\n          else { S.sfx('match'); await S.narr('纸烧成灰的时候，四个布偶一动不动。\\n过了很久，最小的那个，往你这边歪了一下。'); }\n          S.show('xiao'); S.place('xiao', S.pl.x - 1, S.pl.y, 2); await S.wait(500);\n          await S.narr('一个小小的影子拽了拽你的衣角。'); S.hide('xiao');\n          await S.narr('你低头，什么都没有。'); await S.say('me', '小家伙，别乱跑，小心被人踩到。');\n          await S.end({ title: '亡者的执念', text: '第二天早上，三楼的垃圾被人收拾得干干净净。\\n午夜逃杀的样子，一点都没变。' }); },\n          extra: [{ id: 'd4', x: 19, y: 7, spr: 'dolls4', hidden: true }, { id: 'xiao', x: 1, y: 1, spr: '@xiao', hidden: true, alpha: .65 },\n            { id: 'ft', x: 6, y: 5, spr: 'footprints', on: async S => S.narr('一串很小的脚印。光着脚的，往最里面去了。') }] }),\n        async enter(S, first) { if (first) S.goal('去三楼最里面那间屋子'); } } } }));\n\n  /* —— 深水 —— */\n  const DOORS = [\n    '##############################',\n    '##############################',\n    '#oooooooooooooooooooooooooooo#',\n    '#oooooooooooooooooooooooooooo#',\n    '##############################'];\n  defChapter(Object.assign({}, BASE, {\n    id: 'water', n: 11, title: '深水', sub: '噩梦难度：把浴缸放满，整个人沉进去，屏住呼吸六十秒。', origin: '恐怖屋 · 日常任务', color: '#1a2a3a',\n    amb: 'room', floor: 'concrete', wall: 'plain', dark: .9, plr: 2.4,\n    items: { ragdoll: { name: '布偶', d
