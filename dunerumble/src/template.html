<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
__IOSMETA__
<title>沙丘乱斗</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--ink:#22141f;--y1:#ffe14d;--y2:#ffb21e;--panel:rgba(28,18,34,.82);--line:rgba(255,255,255,.12);--txt:#fff7ea;--sub:#e8d6c0;--good:#4fe36f;--ally:#47aaff;--foe:#ff4d4d;
 --font:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--num:"Lilita One","ZCOOL KuaiLe",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1220;color:var(--txt);font-family:var(--font);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#gl,canvas#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#ov{z-index:2}
.hidden{display:none!important}
button{font-family:var(--font);cursor:pointer;color:var(--ink);border:3px solid var(--ink);border-radius:14px;background:linear-gradient(#fff,#e9dccb);box-shadow:0 4px 0 var(--ink);font-size:16px;padding:8px 14px;min-height:44px;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button.on{background:linear-gradient(var(--y1),var(--y2))}
button:disabled{opacity:.45;cursor:default}
input{font-family:var(--font);font-size:16px;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;min-height:44px;background:#fff8ec;color:var(--ink);width:100%}
/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:5;display:flex;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#menu>*{pointer-events:auto}
.brand{position:absolute;left:max(22px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));pointer-events:none}
.brand h1{margin:0;font-size:clamp(34px,5.4vw,64px);line-height:1;color:var(--y1);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);letter-spacing:2px}
.brand small{display:block;font-family:var(--num);font-size:clamp(13px,1.6vw,19px);letter-spacing:6px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;margin-top:6px}
#hubBtn{position:absolute;left:max(22px,env(safe-area-inset-left));top:calc(max(14px,env(safe-area-inset-top)) + clamp(78px,9.5vw,112px));min-height:40px;padding:4px 14px;font-size:15px}
#heroInfo{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:min(380px,44vw);background:var(--panel);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#heroInfo .nm{font-size:30px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#heroInfo .tt{font-size:15px;color:var(--sub);margin-left:6px}
#heroInfo .ds{font-size:14px;color:var(--sub);margin:4px 0 8px}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.stat b{width:38px;font-weight:normal;color:var(--sub)}
.stat .bar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;border:2px solid var(--ink)}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb21e,#ffe14d)}
.stat span{font-family:var(--num);width:46px;text-align:right}
.skill{display:flex;gap:8px;margin-top:8px;font-size:13.5px;line-height:1.35}
.skill .ic{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--ink);display:grid;place-items:center;font-size:16px}
.skill .ic.a{background:#ffd7a3}.skill .ic.s{background:linear-gradient(var(--y1),var(--y2))}
.skill em{font-style:normal;color:var(--y1)}
#panel{touch-action:pan-y;-webkit-overflow-scrolling:touch;margin-left:auto;width:min(430px,48vw);max-height:100%;overflow:auto;background:var(--panel);border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.sec>label{display:block;font-size:14px;color:var(--sub);margin:0 0 6px 2px}
#heroGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.hcard{position:relative;border:3px solid var(--ink);border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:1/0.86;box-shadow:0 4px 0 var(--ink);background:#3a2a40;transition:transform .1s}
.hcard img{width:100%;height:100%;object-fit:cover;display:block}
.hcard span{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:14px;padding:2px 0 3px;background:linear-gradient(transparent,rgba(0,0,0,.7));-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.hcard.on{outline:4px solid var(--y1);transform:translateY(-2px)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;padding:6px 10px;font-size:15px}
@media (pointer:fine){.seg button,#panel input{min-height:38px;padding-top:4px;padding-bottom:4px}#panel{gap:8px}}
#startBtn{font-size:26px;min-height:60px;background:linear-gradient(var(--y1),var(--y2));letter-spacing:4px}
#onlineBox{border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
#onlineBox .row{display:flex;gap:8px}
#onlineBox .row input{flex:1;text-transform:uppercase;letter-spacing:4px;font-family:var(--num)}
#netStatus{font-size:14px;color:var(--sub);line-height:1.4}
#netStatus b{font-family:var(--num);font-size:26px;color:var(--y1);letter-spacing:6px;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.keys{font-size:12.5px;color:var(--sub);line-height:1.55;opacity:.9}
.keys kbd{font-family:var(--num);background:#fff3;border-radius:5px;padding:0 5px}
@media (max-width:820px),(max-height:520px){#heroInfo{display:none}}
@media (max-width:1100px) and (orientation:portrait){#menu{flex-direction:column;justify-content:flex-end}#panel{width:100%;max-height:58%;margin:0}#heroInfo{display:none}#heroGrid{grid-template-columns:repeat(6,1fr)}.hcard span{font-size:13px}}
/* ---------- hud ---------- */
#hud{position:fixed;inset:0;z-index:3;pointer-events:none}
#hTop{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;align-items:flex-start;gap:10px}
.pill{background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:4px 12px;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.3);white-space:nowrap}
.pill .n{font-family:var(--num);font-size:24px;color:var(--y1);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;margin-left:4px}
#hGas{margin:0 auto;font-size:16px}
#hGas.warn{background:rgba(70,140,40,.9);animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
#hFeed{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:150px}
#hFeed div{background:rgba(28,18,34,.75);border-radius:10px;padding:2px 9px;font-size:14px;border:2px solid var(--ink);animation:fin .25s}
#hFeed .a{color:#9fe8ff}#hFeed .me{color:var(--good)}#hFeed .x{color:#ffb4b4}
@keyframes fin{from{transform:translateX(30px);opacity:0}}
#mini{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 54px);width:132px;height:132px;border:3px solid var(--ink);border-radius:12px;background:rgba(28,18,34,.6);opacity:.92}
#hBtns{position:absolute;left:max(12px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 54px);display:flex;gap:8px;pointer-events:auto}
#hBtns button{min-height:40px;min-width:44px;padding:4px 10px;font-size:18px}
#superBtn{position:absolute;right:max(26px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);background:#3b2b3c;overflow:hidden;display:grid;place-items:center;box-shadow:0 5px 0 var(--ink)}
#superBtn .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--y1),var(--y2));height:0%}
#superBtn span{position:relative;font-size:20px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#superBtn small{position:absolute;bottom:10px;font-family:var(--num);font-size:12px;color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
#superBtn.ready{animation:glow .6s infinite alternate}
@keyframes glow{to{box-shadow:0 5px 0 var(--ink),0 0 26px 8px rgba(255,210,63,.75)}}
#spec{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);font-size:22px;background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:8px 18px;text-align:center}
#gasVig{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 140px 40px rgba(90,220,60,.55);opacity:0;transition:opacity .25s}
#hurtVig{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 160px 50px rgba(255,40,40,.55);opacity:0;transition:opacity .2s}
#keyHint{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12.5px;color:#fff;opacity:.75;background:rgba(0,0,0,.25);border-radius:8px;padding:2px 10px;white-space:nowrap}
/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}
#touchZone{position:absolute;left:0;top:18%;bottom:0;width:50%;pointer-events:auto;touch-action:none}
.stick{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:grid;place-items:center;border:4px solid rgba(34,20,31,.85)}
.stick .knob{width:46%;height:46%;border-radius:50%;border:3px solid var(--ink);transition:transform .05s}
#atkStick{right:max(34px,env(safe-area-inset-right));bottom:max(34px,env(safe-area-inset-bottom));width:132px;height:132px;background:rgba(255,160,60,.25)}
#atkStick .knob{background:linear-gradient(#ffcf7a,#ff9f1c)}
#supStick{right:calc(max(34px,env(safe-area-inset-right)) + 150px);bottom:max(46px,env(safe-area-inset-bottom));width:96px;height:96px;background:rgba(255,220,60,.2);overflow:hidden}
#supStick .knob{background:linear-gradient(var(--y1),var(--y2));position:relative;z-index:1}
#supStick .sfill{position:absolute;left:0;right:0;bottom:0;background:rgba(255,210,63,.55);height:0}
#supStick.ready{animation:glow .6s infinite alternate}
#mvBase,#mvKnob{position:absolute;display:none;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
#mvBase{width:120px;height:120px;border:4px solid rgba(34,20,31,.7);background:rgba(255,255,255,.12)}
#mvKnob{width:54px;height:54px;border:3px solid var(--ink);background:rgba(255,255,255,.75)}
/* ---------- overlays ---------- */
.modal{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(18,10,22,.55);backdrop-filter:blur(2px)}
.card{background:var(--panel);border:4px solid var(--ink);border-radius:22px;padding:20px 22px;min-width:min(380px,92vw);max-width:94vw;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.card h2{margin:0 0 6px;font-size:40px;color:var(--y1);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.card .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#rRank{font-family:var(--num);font-size:84px;line-height:1;color:var(--y1);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
#rSub{font-size:24px;margin:6px 0 10px}
#rStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
#rStats div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 4px;font-size:13px;color:var(--sub)}
#rStats b{display:block;font-family:var(--num);font-size:24px;color:#fff}
#rTable{margin-top:12px;font-size:14px;max-height:30vh;overflow:auto;text-align:left}
#rTable div{display:flex;gap:8px;padding:3px 8px;border-radius:8px}
#rTable div:nth-child(odd){background:rgba(255,255,255,.05)}
#rTable .me{color:var(--good)}#rTable .al{color:#9fe8ff}
#rTable span:first-child{font-family:var(--num);width:30px}
#rTable span:nth-child(2){flex:1}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:9;background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:8px 18px;font-size:18px;pointer-events:none;transition:opacity .3s;opacity:0}
#banner{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;text-align:center;font-size:clamp(40px,7vw,80px);color:var(--y1);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);opacity:0;white-space:nowrap}
#banner small{display:block;font-size:.32em;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 3px 0 var(--ink);margin-top:6px}
#banner.show{animation:ban 2.2s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#1a1220;font-size:26px;color:var(--y1)}
</style>
<body>
<canvas id="gl"></canvas><canvas id="ov"></canvas>
<div id="gasVig"></div><div id="hurtVig"></div>
<div id="menu">
  <div class="brand"><h1>沙丘乱斗</h1><small>DUNE RUMBLE</small></div>
  <button id="hubBtn" class="hidden">‹ 游戏厅</button>
  <div id="heroInfo"></div>
  <div id="panel">
    <div class="sec"><label>选择英雄</label><div id="heroGrid"></div></div>
    <div class="sec"><label>模式</label><div class="seg" id="modeSeg"></div></div>
    <div class="sec" id="mapSec"><label>地图</label><div class="seg" id="mapSeg"></div></div>
    <div class="sec" id="diffSec"><label>AI 难度</label><div class="seg" id="diffSeg"></div></div>
    <div class="sec"><label>昵称</label><input id="nameIn" maxlength="8" placeholder="你的名字"></div>
    <div id="onlineBox" class="hidden">
      <div class="row"><button id="hostBtn">创建房间</button><input id="codeIn" maxlength="4" placeholder="房间码"><button id="joinBtn">加入</button></div>
      <div id="netStatus"></div>
    </div>
    <button id="startBtn">开 战 ！</button>
    <div class="keys" id="keysHelp"></div>
  </div>
</div>
<div id="hud" class="hidden">
  <div id="hTop"><div class="pill" id="hAlive">剩余<span class="n">10</span></div><div class="pill" id="hGas"></div><div id="hFeed"></div></div>
  <div id="hBtns"><button id="pauseBtn">❚❚</button><button id="muteBtn">🔊</button></div>
  <canvas id="mini" width="264" height="264"></canvas>
  <div id="superBtn"><div class="fill"></div><span>大招</span><small>E / 右键</small></div>
  <div id="spec" class="hidden"></div>
  <div id="keyHint">WASD 移动 · 鼠标瞄准 · 左键攻击 · E/右键 大招 · 空格 自动瞄准 · F 自动大招 · Esc 暂停</div>
</div>
<div id="touch" class="hidden">
  <div id="touchZone"></div>
  <div class="stick" id="supStick"><div class="sfill"></div><div class="knob"></div></div>
  <div class="stick" id="atkStick"><div class="knob"></div></div>
  <div id="mvBase"></div><div id="mvKnob"></div>
</div>
<div id="pause" class="modal hidden"><div class="card"><h2>暂停</h2><div id="pauseNote" style="color:var(--sub)"></div><div class="btns"><button id="pResume" class="on">继续</button><button id="pQuit">退出到大厅</button><button id="pHub" class="hidden">返回游戏厅</button></div></div></div>
<div id="result" class="modal hidden"><div class="card">
  <div id="rRank">#1</div><div id="rSub">大吉大利！</div>
  <div id="rStats"></div><div id="rTable"></div>
  <div class="btns"><button id="rAgain" class="on">再来一局</button><button id="rWatch">继续观战</button><button id="rMenu">返回大厅</button></div>
</div></div>
<div id="toast"></div><div id="banner"></div>
<div id="loading">加载中…</div>
__SCRIPTS__
</body>
