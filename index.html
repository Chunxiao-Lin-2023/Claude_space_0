<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="游戏厅">
<meta name="theme-color" content="#14171c">
<title>游戏厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314171c'/%3E%3Cpath d='M18 26h28a8 8 0 0 1 8 8v4a8 8 0 0 1-14 5l-3-3H27l-3 3a8 8 0 0 1-14-5v-4a8 8 0 0 1 8-8z' fill='%23e8b65a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171c; --bg2:#1b1f26; --card:#1e232b; --line:#2c333e; --line2:#3a4350;
  --ink:#ece6da; --ink2:#a9a294; --ink3:#776f63;
  --gold:#e8b65a; --gold2:#f4d48e; --dev:#6fb3d9; --done:#8fc98a;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{
  font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(232,182,90,.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(111,179,217,.07), transparent 60%),
    var(--bg);
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:1180px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:18px 0 26px}
.eyebrow{font-size:12px;letter-spacing:.35em;color:var(--gold);opacity:.85;margin-bottom:6px}
h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(40px,7vw,64px);line-height:1;margin:0;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#b9823a);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.06em}
.lede{color:var(--ink2);font-size:14px;margin:12px 0 0;max-width:34em;line-height:1.7}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line2);background:transparent;color:var(--ink2);font:inherit;font-size:14px;
  padding:9px 16px;border-radius:999px;cursor:pointer;touch-action:manipulation;transition:.15s}
.chip:hover{color:var(--ink);border-color:var(--ink3)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:700}
.chip .n{opacity:.65;margin-left:6px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;outline:none;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 1px var(--gold) inset}
.cover{position:relative;aspect-ratio:16/9;background:var(--bg2);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.card:hover .cover img,.card:focus-visible .cover img{transform:scale(1.035)}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:"Noto Serif SC",serif;font-weight:900;font-size:44px;color:rgba(255,255,255,.85);letter-spacing:.08em}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(20,23,28,.85))}
.badge{position:absolute;bottom:12px;left:14px;z-index:1;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;
  background:rgba(20,23,28,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid currentColor}
.badge.done{color:var(--done)} .badge.dev{color:var(--dev)}
.badge.dev::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.key{position:absolute;top:12px;right:12px;z-index:1;font-size:11px;color:var(--ink2);border:1px solid var(--line2);background:rgba(20,23,28,.7);border-radius:6px;padding:2px 7px}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.ttl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ttl h2{font-family:"Noto Serif SC",serif;font-size:24px;margin:0;letter-spacing:.04em}
.ttl .sub{color:var(--gold);font-size:13px}
.desc{color:var(--ink2);font-size:14px;line-height:1.65;margin:0}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);padding:3px 9px;border-radius:6px}
.play{flex:none;font-size:14px;font-weight:700;color:var(--gold);white-space:nowrap}
.card:hover .play,.card:focus-visible .play{color:var(--gold2)}
.empty{color:var(--ink3);text-align:center;padding:60px 0;grid-column:1/-1}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink3);font-size:12px;line-height:1.8;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink2)}
@media (pointer:coarse),(hover:none){.chip{padding:12px 18px;min-height:44px}.key{display:none}}
@media (max-width:520px){.grid{grid-template-columns:1fr;gap:16px}header{margin-top:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">GAME ROOM</div>
      <h1>游戏厅</h1>
      <p class="lede">自己做的网页小游戏。点开即玩，电脑、iPad、iPhone 都可以；每个游戏独立运行，存档各自保存在本机浏览器里。</p>
    </div>
    <nav class="filters" id="filters" aria-label="筛选"></nav>
  </header>
  <main class="grid" id="grid" aria-live="polite"></main>
  <footer>
    <span>键盘：<kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 选择 · <kbd>Enter</kbd> 开始 · <kbd>1</kbd>–<kbd>9</kbd> 直接打开</span>
    <span>iPhone / iPad：Safari 分享 →「添加到主屏幕」，全屏玩；iPhone 建议横屏</span>
  </footer>
</div>
<script src="games.js"></script>
<script>
(() => {
  const games = Array.isArray(window.GAMES) ? window.GAMES : [];
  const STATUS = { done: '已完成', dev: '开发中' };
  const FILTERS = [['all', '全部'], ['done', '已完成'], ['dev', '开发中']];
  let filter = 'all';
  try { filter = localStorage.getItem('hub.filter') || 'all'; } catch (e) {}
  if (!FILTERS.some(f => f[0] === filter)) filter = 'all';

  const $grid = document.getElementById('grid');
  const $filters = document.getElementById('filters');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function renderFilters() {
    $filters.innerHTML = FILTERS.map(([k, label]) => {
      const n = k === 'all' ? games.length : games.filter(g => g.status === k).length;
      return `<button class="chip" data-f="${k}" aria-pressed="${k === filter}">${label}<span class="n">${n}</span></button>`;
    }).join('');
  }

  function renderGrid() {
    const list = games.filter(g => filter === 'all' || g.status === filter);
    if (!list.length) { $grid.innerHTML = '<div class="empty">这里还没有游戏</div>'; return; }
    $grid.innerHTML = list.map((g, i) => {
      const hue = Number.isFinite(g.hue) ? g.hue : 30;
      const ph = `<div class="ph" style="background:linear-gradient(135deg,hsl(${hue} 45% 32%),hsl(${(hue + 40) % 360} 40% 18%))">${esc(g.title)}</div>`;
      const cover = g.cover ? `<img src="${esc(g.cover)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:${esc(JSON.stringify(g.title))}}))">` : '';
      return `<a class="card" href="${esc(g.url)}" data-i="${i}">
        <div class="cover">${g.cover ? '' : ph}${cover}
          <span class="badge ${g.status === 'dev' ? 'dev' : 'done'}">${STATUS[g.status] || STATUS.done}</span>
          ${i < 9 ? `<span class="key">${i + 1}</span>` : ''}
        </div>
        <div class="body">
          <div class="ttl"><h2>${esc(g.title)}</h2>${g.sub ? `<span class="sub">${esc(g.sub)}</span>` : ''}</div>
          ${g.desc ? `<p class="desc">${esc(g.desc)}</p>` : ''}
          <div class="foot">
            <div class="tags">${(g.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
            <span class="play">开始游戏 →</span>
          </div>
        </div>
      </a>`;
    }).join('');
  }

  $filters.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    filter = b.dataset.f;
    try { localStorage.setItem('hub.filter', filter); } catch (e) {}
    renderFilters(); renderGrid();
  });

  // 键盘：方向键在卡片间移动，数字键直接打开
  addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const cards = [...$grid.querySelectorAll('.card')];
    if (!cards.length) return;
    if (/^[1-9]$/.test(e.key)) { const c = cards[+e.key - 1]; if (c) location.href = c.href; return; }
    const keys = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: 'up', ArrowDown: 'down' };
    if (!(e.key in keys)) return;
    e.preventDefault();
    let i = cards.indexOf(document.activeElement);
    if (i < 0) { cards[0].focus(); return; }
    const cols = Math.max(1, Math.round($grid.clientWidth / cards[0].getBoundingClientRect().width));
    const d = keys[e.key];
    i = d === 'up' ? i - cols : d === 'down' ? i + cols : i + d;
    cards[Math.max(0, Math.min(cards.length - 1, i))].focus();
  });

  renderFilters(); renderGrid();
})();
</script>
</body>
</html>
