<title>机巧百战</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: full-bleed canvas arena with a framed HUD (portrait + vitals left, wave dial centre, weapon tray bottom). Overlays (character select, workshop, results) sit on a blurred scrim inside brass-cornered frames; columns stack on phones. Single committed dark "machine workshop" world: oxidized slate, brass, verdigris. */
:root{
  --ground:#0e1619;
  --surface:#152126;
  --surface-2:#1d2d33;
  --surface-3:#25393f;
  --rule:#2c434a;
  --fg:#ece4ce;
  --muted:#8fa4a1;
  --brass:#d69f3e;
  --brass-hi:#f2cb7a;
  --brass-lo:#7d5a1f;
  --brass-ink:#1a1307;
  --verdigris:#5cb19d;
  --danger:#e05a4b;
  --good:#8cc65a;
  --t1:#c7cfcd; --t2:#5aa6e6; --t3:#b37be8; --t4:#f0b93a;
  --font-display:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --font-num:"Chakra Petch",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--ground);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;touch-action:manipulation}
input{touch-action:manipulation}
button:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
img{display:block}
[hidden]{display:none!important}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--danger)}
.goldtxt{color:var(--t4)}
.t1{--sc:var(--t1)}.t2{--sc:var(--t2)}.t3{--sc:var(--t3)}.t4{--sc:var(--t4)}

.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-inline:16px;padding-block:20px;z-index:5;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(214,159,62,.10),transparent 70%),rgba(10,16,19,.84);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.frame{position:relative;background:linear-gradient(180deg,rgba(33,50,56,.95),rgba(21,33,38,.95));border:1px solid var(--rule);border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 18px 40px rgba(0,0,0,.4)}
.frame::before,.frame::after{content:"";position:absolute;width:20px;height:20px;border:2px solid var(--brass);pointer-events:none}
.frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.frame::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:10px}
.label{font-size:12px;letter-spacing:.18em;color:var(--muted)}
.btn{position:relative;background:linear-gradient(180deg,var(--brass-hi),var(--brass) 45%,#b07f2a);color:var(--brass-ink);border-radius:6px;padding:12px 30px;font-weight:700;font-size:16px;letter-spacing:.12em;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.25),0 6px 16px -6px rgba(214,159,62,.6)}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:rgba(0,0,0,.2);color:var(--fg);border:1px solid var(--rule);box-shadow:none;letter-spacing:.06em}
.btn.sm{padding:6px 14px;font-size:13px;letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:rgba(0,0,0,.22);border-radius:6px;padding:5px 10px 5px 6px;font-size:13px}
.chip img{width:22px;height:22px}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass-hi);background:rgba(214,159,62,.1);box-shadow:inset 0 0 0 1px var(--brass)}
.chip small{color:var(--verdigris);font-size:11px}
.chip.txt{padding:5px 14px}
.chip:disabled{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seal{display:grid;place-items:center;font-family:var(--font-display);line-height:1;color:var(--sc);border:2px solid var(--sc);border-radius:7px;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.09),transparent 60%),var(--ground);box-shadow:inset 0 0 0 2px var(--ground),inset 0 0 0 3px rgba(255,255,255,.06)}
.ic{width:54px;height:54px;flex:none;border-radius:9px;border:2px solid var(--sc);background:radial-gradient(circle at 50% 30%,var(--surface-3),var(--ground) 75%);display:grid;place-items:center;font-family:var(--font-display);font-size:29px;color:var(--sc);box-shadow:0 0 16px -5px var(--sc),inset 0 0 0 2px rgba(0,0,0,.35)}
.ic img{width:46px;height:46px}
.qian{display:inline-block;position:relative;width:14px;height:14px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,var(--brass-hi),var(--brass) 55%,var(--brass-lo));box-shadow:inset 0 0 0 1.5px var(--brass-ink)}
.qian::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;transform:translate(-50%,-50%);background:var(--brass-ink)}

/* menu */
.menu{max-width:1120px;margin-inline:auto;display:grid;gap:18px;padding-block:4px 20px}
.brand{display:grid;gap:4px}
.hublink{justify-self:start;display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);font-size:13px;text-decoration:none;background:rgba(10,16,19,.55);touch-action:manipulation}
.hublink:hover,.hublink:focus-visible{color:var(--fg);border-color:var(--muted)}
@media (pointer:coarse){.hublink{padding:10px 16px;font-size:14px}}
.eyebrow{font-size:12px;letter-spacing:.3em;color:var(--verdigris)}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:clamp(50px,10vw,92px);line-height:.95;margin:0;letter-spacing:.06em;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass) 55%,#a2701f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 var(--brass-ink))}
.brand p{margin:0;color:var(--muted);max-width:46ch;text-wrap:balance}
.roster{display:flex;gap:10px;overflow-x:auto;padding-block:6px 10px;scroll-snap-type:x proximity}
.rt{flex:1 0 120px;max-width:156px;display:grid;justify-items:center;gap:0;padding:6px 6px 10px;border-radius:10px;scroll-snap-align:start;
  background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--rule);transition:transform .15s,border-color .15s}
.rt:hover{transform:translateY(-2px)}
.rt img{width:96px;height:96px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.rt .n{font-family:var(--font-display);font-size:21px;line-height:1.1}
.rt .tg{font-size:11px;color:var(--muted)}
.rt[aria-pressed="true"]{border-color:var(--brass);background:linear-gradient(180deg,#2c3b37,var(--surface-2));box-shadow:0 0 0 1px var(--brass),0 10px 26px -8px rgba(214,159,62,.45)}
.rt[aria-pressed="true"] .tg{color:var(--brass-hi)}
.detail{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:26px;padding:20px}
@media (max-width:780px){.detail{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;aspect-ratio:1/1;width:100%;max-width:340px;justify-self:center;border-radius:10px;overflow:hidden;border:1px solid var(--rule);background:radial-gradient(circle at 50% 62%,#203338,#0c1316 72%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage .weap{position:absolute;right:10px;top:10px;width:44px;height:44px}
.info{display:grid;gap:14px;align-content:start;min-width:0}
.info .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.info h2{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,6vw,54px);margin:0;line-height:1}
.info .tag{font-size:13px;color:var(--verdigris);letter-spacing:.12em}
.info .lore{margin:0;color:var(--muted)}
.diffstar{font-size:12px;color:var(--muted)} .diffstar b{color:var(--brass);letter-spacing:2px;font-weight:400}
.traits{list-style:none;padding:0;margin:0;display:grid;gap:5px}
.traits li{padding-left:18px;position:relative}
.traits li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;transform:rotate(45deg);background:var(--good)}
.traits li.con::before{background:var(--danger)}
.sect{display:grid;gap:8px}
.wdesc{font-size:13px;color:var(--muted);margin:0}
.go{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;padding-top:6px;border-top:1px solid var(--rule)}
.howto{color:var(--muted);font-size:13px;max-width:78ch;margin:0}
.howto b{color:var(--fg);font-weight:500}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:max(12px,env(safe-area-inset-top,0px)) 12px}
.hud-r{display:flex;gap:8px}
.fsbtn{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:rgba(10,16,19,.75);border:1px solid var(--rule);color:var(--fg)}
.fsbtn svg{width:20px;height:20px}
#sndBtn .x{display:none}#sndBtn.off .x{display:inline}#sndBtn.off .w1{display:none}#sndBtn.off{color:var(--muted)}
@media (pointer:coarse){.pausebtn,.fsbtn{width:52px;height:52px}.chip{padding-block:8px}.btn.sm{padding:9px 16px}}
.vit{display:flex;gap:12px;align-items:center;width:min(310px,48vw);padding:6px 12px 6px 6px;border-radius:40px 10px 10px 40px;background:linear-gradient(90deg,rgba(10,16,19,.8),rgba(10,16,19,.45));border:1px solid rgba(44,67,74,.8)}
.pwrap{position:relative;flex:none}
.portrait{width:52px;height:52px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--surface-3),var(--ground));box-shadow:0 0 0 2px var(--brass-lo),0 0 0 3px var(--brass-ink),0 0 0 4.5px var(--brass)}
.portrait img{width:100%;height:100%;transform:translateY(5px) scale(1.25)}
.lvb{position:absolute;right:-6px;bottom:-4px;min-width:22px;height:20px;padding-inline:4px;border-radius:5px;display:grid;place-items:center;font:700 12px var(--font-num);color:var(--brass-ink);background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 0 0 1.5px var(--brass-ink)}
.bars{flex:1;min-width:0;display:grid;gap:5px}
.hp{position:relative;height:17px;border-radius:4px;background:#0a0f11;box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 1px var(--rule);overflow:hidden}
.hp i,.hp b{position:absolute;left:0;top:0;bottom:0}
.hp b{background:#f3e0b0;opacity:.55}
.hp i{background:linear-gradient(180deg,#f07a63,#c8402f 60%,#9c2c20)}
.hp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(0,0,0,.35) calc(10% - 1px) 10%);pointer-events:none}
.hp span{position:relative;z-index:1;display:block;text-align:center;font:700 11.5px/17px var(--font-num);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.xp{position:relative;height:5px;border-radius:3px;background:#0a0f11;box-shadow:0 0 0 1px var(--rule);overflow:hidden}
.xp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3d8f7c,#7fe0cf)}
.meta{display:flex;align-items:center;gap:10px;font:700 15px var(--font-num)}
.gold{display:flex;align-items:center;gap:6px;color:var(--brass-hi)}
.lvpend{font:500 12px var(--font-body);color:#7fe0cf}
.wavebox{display:grid;justify-items:center;gap:4px}
.dial{--p:1;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,#0c1316 58%,transparent 59%),conic-gradient(var(--brass) calc(var(--p)*1turn),rgba(255,255,255,.08) 0);box-shadow:0 0 0 1px var(--brass-ink),0 0 0 3px rgba(44,67,74,.9),0 4px 14px rgba(0,0,0,.5)}
.dial span{font:700 21px/1 var(--font-num);font-variant-numeric:tabular-nums}
.dial.boss span{font:400 17px/1 var(--font-display);color:var(--danger)}
.wave{font-size:12px;letter-spacing:.16em;color:var(--fg);background:rgba(10,16,19,.7);border:1px solid var(--rule);border-radius:4px;padding:1px 10px}
.hud-r{pointer-events:auto}
.pausebtn{width:44px;height:44px;border-radius:8px;display:flex;justify-content:center;align-items:center;gap:5px;background:rgba(10,16,19,.75);border:1px solid var(--rule)}
.pausebtn span{width:4px;height:15px;border-radius:1px;background:var(--fg)}
.tray{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:10px;background:rgba(10,16,19,.7);border:1px solid rgba(44,67,74,.8);max-width:calc(100% - 32px)}
.tw{--cd:0;position:relative;width:40px;height:40px;border-radius:7px;border:2px solid var(--sc);background:radial-gradient(circle at 50% 30%,var(--surface-3),var(--ground) 80%);display:grid;place-items:center;overflow:hidden}
.tw img{width:32px;height:32px}
.tw i{position:absolute;inset:0;background:conic-gradient(rgba(6,10,12,.72) calc(var(--cd)*1turn),transparent 0)}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:92px;width:min(540px,calc(100% - 32px));pointer-events:none;z-index:2;display:grid;gap:5px}
#bossbar .name{display:flex;align-items:center;gap:12px;justify-content:center;font-family:var(--font-display);font-size:21px;color:var(--brass-hi);line-height:1;text-shadow:0 2px 0 var(--brass-ink)}
#bossbar .name::before,#bossbar .name::after{content:"";height:1px;flex:1;max-width:120px;background:linear-gradient(90deg,transparent,var(--brass))}
#bossbar .name::after{background:linear-gradient(90deg,var(--brass),transparent)}
#bossbar .hp{height:13px;box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 1px var(--brass-lo),0 0 0 3px rgba(10,16,19,.8)}
#bossbar .hp i{background:linear-gradient(180deg,var(--brass-hi),var(--brass) 55%,#9a6a1c)}
#bossbar .hp span{font-size:10px;line-height:13px}
#banner{position:absolute;left:16px;right:16px;top:34%;display:flex;justify-content:center;align-items:center;gap:18px;font-family:var(--font-display);font-size:clamp(38px,8vw,68px);line-height:1.1;color:var(--brass-hi);pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;transform:scale(.96);text-shadow:0 4px 0 var(--brass-ink),0 0 30px rgba(214,159,62,.35);z-index:3}
#banner::before,#banner::after{content:"";height:2px;width:min(120px,14vw);background:linear-gradient(90deg,transparent,var(--brass))}
#banner::after{background:linear-gradient(90deg,var(--brass),transparent)}
#banner.show{opacity:1;transform:none}
#toast{position:absolute;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--brass);padding:9px 18px;border-radius:8px;width:max-content;max-width:calc(100% - 32px);font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;box-shadow:0 10px 24px rgba(0,0,0,.45)}
#toast.show{opacity:1}

/* prep */
.prep{max-width:1200px;margin-inline:auto;display:grid;gap:18px}
.prep-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 20px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.prep-head h2{font-family:var(--font-display);font-weight:400;font-size:clamp(32px,5vw,46px);margin:0;line-height:1.05;text-wrap:balance}
.prep-head .sub{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px}
.prep-head .sub .warn{color:var(--danger)}
.bank{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid var(--brass-lo);font:700 30px/1 var(--font-num);color:var(--brass-hi)}
.bank .qian{width:24px;height:24px}
.bank .qian::after{width:7px;height:7px}
.prep-grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start}
@media (max-width:900px){.prep-grid{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:16px;min-width:0}
.panel{display:grid;gap:12px;min-width:0;padding:16px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel h3{margin:0;font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.panel h3 b{color:var(--fg);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1180px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:340px){.cards{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.prep .card{padding:9px}.prep .card .hd{gap:7px}.prep .ic{width:34px;height:34px;font-size:18px}.prep .ic img{width:28px;height:28px}.prep .acts{gap:5px}.prep .lock{padding:4px 7px}}
.chestbox .card{max-width:340px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left;padding:14px;border-radius:9px;overflow:hidden;
  background:linear-gradient(180deg,var(--surface-3),var(--surface) 70%);border:1px solid var(--rule)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:90px;background:radial-gradient(ellipse 90% 100% at 15% 0%,color-mix(in srgb,var(--sc) 24%,transparent),transparent 70%);pointer-events:none}
.card>*{position:relative}
button.card{transition:transform .12s,border-color .12s}
button.card:hover{transform:translateY(-2px);border-color:var(--sc)}
.card .hd{display:flex;gap:12px;align-items:center;min-width:0}
.card .hd>div{min-width:0}
.card .nm{font-weight:700;font-size:16px;line-height:1.25}
.tier{display:inline-block;font-size:11px;letter-spacing:.1em;color:var(--sc)}
.card .desc{font-size:13px;flex:1;color:#d6cfba}
.card .desc .dim{font-size:12px}
.card .big{font:700 30px/1 var(--font-num)}
.acts{display:flex;gap:8px;align-items:stretch}
.buy{flex:1;display:flex;justify-content:center;align-items:center;gap:7px;border-radius:6px;padding:9px;font:700 16px var(--font-num);color:var(--brass-ink);background:linear-gradient(180deg,var(--brass-hi),var(--brass) 50%,#b07f2a);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.2)}
.buy:disabled{opacity:.35;cursor:not-allowed}
.buy .qian{box-shadow:inset 0 0 0 1.5px var(--brass-ink),0 0 0 1px rgba(26,19,7,.4)}
.lock{border:1px solid var(--rule);border-radius:6px;padding:6px 12px;font-size:13px;background:rgba(0,0,0,.2)}
.lock[aria-pressed="true"]{border-color:var(--brass);color:var(--brass-hi);background:rgba(214,159,62,.12)}
.card.sold{opacity:.4;justify-content:center;align-items:center;min-height:150px;color:var(--muted);border-style:dashed}
.hint{font-size:12px;color:var(--muted);margin:0}
.chestbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.chestbox img{width:120px;height:104px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
@media (max-width:520px){.chestbox{grid-template-columns:minmax(0,1fr);justify-items:center}}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{display:flex;gap:9px;align-items:center;min-width:0;padding:7px;border-radius:8px;background:rgba(0,0,0,.18);border:1px solid var(--rule)}
.slot .ic{width:42px;height:42px;border-radius:7px}
.slot .ic img{width:34px;height:34px}
.slot .bd{min-width:0;display:grid;gap:3px}
.slot .nm{font-weight:700;font-size:13px;line-height:1.2}
.slot.empty{justify-content:center;border-style:dashed;color:var(--muted);font-size:12px;min-height:58px}
.sacts{display:flex;gap:5px;flex-wrap:wrap}
.mini{border:1px solid var(--rule);border-radius:4px;padding:1px 7px;font-size:11.5px;background:rgba(0,0,0,.2)}
.mini:disabled{opacity:.35;cursor:not-allowed}

const INK='#1a1307';
function hexRgb(h){if(h[0]!=='#'){const m=h.match(/[\d.]+/g)||[0,0,0];return [+m[0],+m[1],+m[2]];}const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255];}
function shade(h,a){let[r,g,b]=hexRgb(h);if(a>=0){r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a;}else{r*=1+a;g*=1+a;b*=1+a;}return `rgb(${r|0},${g|0},${b|0})`;}
function mix(h1,h2,t){const a=hexRgb(h1),b=hexRgb(h2);return `rgb(${a.map((v,i)=>(v+(b[i]-v)*t)|0).join(',')})`;}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function fs(g,fill,lw=1.4){g.fillStyle=fill;g.fill();if(lw){g.lineWidth=lw;g.strokeStyle=INK;g.lineJoin='round';g.stroke();}}
function metal(g,x,y,r,base){const gr=g.createRadialGradient(x-r*0.45,y-r*0.55,r*0.08,x,y,r*1.15);gr.addColorStop(0,shade(base,0.5));gr.addColorStop(0.45,base);gr.addColorStop(1,shade(base,-0.5));return gr;}
function eye(g,x,y,r,col='#ff5a3c'){g.globalAlpha=0.35;g.fillStyle=col;g.beginPath();g.arc(x,y,r*2.3,0,TAU);g.fill();g.globalAlpha=1;g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=col;g.fill();g.beginPath();g.arc(x-r*0.3,y-r*0.3,r*0.38,0,TAU);g.fillStyle='#ffffff';g.fill();}
function rivet(g,x,y,r){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle='rgba(0,0,0,.4)';g.fill();g.beginPath();g.arc(x-r*0.25,y-r*0.25,r*0.65,0,TAU);g.fillStyle='rgba(255,255,255,.18)';g.fill();}
function poly(g,x,y,r,n,rot){g.beginPath();for(let i=0;i<n;i++){const a=rot+i*TAU/n;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}g.closePath();}
function gearPath(g,x,y,r,teeth,rot){g.beginPath();const n=teeth*2;for(let i=0;i<n;i++){const a=rot+i*TAU/n,a2=a+TAU/n,rr2=i%2?r:r*0.78;g.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);g.lineTo(x+Math.cos(a2)*rr2,y+Math.sin(a2)*rr2);}g.closePath();}
function s2(g,w,col,pts){const path=()=>{g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));};g.lineCap='round';g.lineJoin='round';path();g.strokeStyle=INK;g.lineWidth=w+2.6;g.stroke();path();g.strokeStyle=col;g.lineWidth=w;g.stroke();}
const glowCache=new Map();
function glow(col){let c=glowCache.get(col);if(c)return c;c=mk(64,64);const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,col);gr.addColorStop(0.35,col.replace(/,\s*[\d.]+\)$/,',0.45)'));gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);glowCache.set(col,c);return c;}

function drawHero(g,key,t,face,moving,s=1){
 const L=LOOK[key];
 g.save();
 g.fillStyle='rgba(0,0,0,.34)';g.beginPath();g.ellipse(0,15*s,12.5*s,4.2*s,0,0,TAU);g.fill();
 const flip=Math.cos(face)<-0.05?-1:1;
 g.scale(s*flip,s);
 const step=moving?Math.sin(t*13):0,bob=moving?-Math.abs(Math.sin(t*13))*1.6:Math.sin(t*2.4)*0.7;
 g.lineJoin='round';g.lineCap='round';
 L.back&&L.back(g,t,step,bob,moving);
 for(const[lx,o] of [[-5.6,step],[1.2,-step]]){rr(g,lx,6+o*1.4,4.4,8.2,2);fs(g,L.pants);rr(g,lx-0.4,11.6+o*1.4,5.2,3,1.4);fs(g,L.boot,1.1);}
 g.beginPath();g.arc(-8,3.5+bob-step*1.4,2.9,0,TAU);fs(g,shade(L.skin,-0.12),1.2);
 rr(g,-8.2,-3.6+bob,16.4,12.6,5.5);
 const tg=g.createLinearGradient(-8,-4+bob,8,9+bob);tg.addColorStop(0,shade(L.coat,0.28));tg.addColorStop(1,shade(L.coat,-0.32));fs(g,tg);
 g.fillStyle='rgba(0,0,0,.35)';g.fillRect(-7.8,5.2+bob,15.6,2.1);
 L.front&&L.front(g,t,bob);
 const hx=8.4,hy=3.5+bob+step*1.4;
 L.prop&&L.prop(g,hx,hy,t);
 g.beginPath();g.arc(hx,hy,2.9,0,TAU);fs(g,L.skin,1.2);
 const cx=0.6,cy=-11+bob;
 L.hairBack&&L.hairBack(g,cx,cy,t);
 g.beginPath();g.arc(cx,cy,8.6,0,TAU);
 const hg=g.createRadialGradient(cx+2,cy-3,1,cx,cy,9.6);hg.addColorStop(0,shade(L.skin,0.22));hg.addColorStop(1,shade(L.skin,-0.2));fs(g,hg,1.4);
 if(!L.noEyes){for(const ex of [3.1,6.4]){g.beginPath();g.ellipse(cx+ex-0.6,cy+0.4,1.25,1.85,0,0,TAU);g.fillStyle=INK;g.fill();g.beginPath();g.arc(cx+ex-0.95,cy-0.35,0.5,0,TAU);g.fillStyle='#fff';g.fill();}
  g.globalAlpha=0.32;g.fillStyle='#e8705a';g.beginPath();g.ellipse(cx+6.6,cy+3.6,1.8,1.1,0,0,TAU);g.fill();g.globalAlpha=1;}
 L.head(g,cx,cy,t,bob);
 g.restore();
}

/* ================= skin: 鲁班七号 =================
   Sprites rendered from battle-of-luban-7/models/Luban_Merged_Animations.glb (cel-shaded + ink outline).
   Walk = IK walk cycle: hips at constant height, stance foot planted, swing foot arcs forward,
   arms + shoulders swing opposite to the legs. Body height never changes.
   LUBAN_IMG:   8 rows = facing (0 E, 1 SE, 2 S, 3 SW, 4 W, 5 NW, 6 N, 7 NE),
                25 cols = 24-frame walk cycle (one stride = two steps) + idle.
   LUBAN_STAGE: hi-res SE walk (24 frames) for the character-select stage.
   LUBAN_STAGE_IDLE: hi-res idle, 8 facings (stage turn-around).
   In battle the character faces its movement direction and turns smoothly through the
   in-between facings. Knobs live in LB. */
const SKINS=[{key:'base',name:'原装'},{key:'luban',name:'鲁班七号'}];
const LB={n:24,idle:24,
 fw:254,fh:200,ax:126.9,ay:138.7,k:0.313,      // in-game sheet
 sfw:381,sfh:300,sax:190.4,say:208.0,sk:0.2087, // stage sheets
 rate:1.0,     // strides per second (two steps per stride)
 sway:0,       // optional toddle sway in radians (0 = off)
 turn:14};     // turning speed (higher = snappier)
const LUBAN_IMG=new Image();LUBAN_IMG.src='__DATAURI_0__';
const LUBAN_STAGE=new Image();LUBAN_STAGE.src='__DATAURI_1__';
const LUBAN_STAGE_IDLE=new Image();LUBAN_STAGE_IDLE.src='__DATAURI_2__';
const LUBAN_POR='__DATAURI_3__';
const imgOk=im=>im.complete&&im.naturalWidth>0;
const lubanReady=()=>imgOk(LUBAN_IMG);
const lubanDir=a=>((Math.round(a/(Math.PI/4))%8)+8)%8;
function drawLuban(g,t,face,moving,s=1,hi=false){
 const dir=lubanDir(face);
 let fi=LB.idle,rot=0;
 if(moving){const ph=(t*LB.rate)%1;fi=Math.floor(ph*LB.n)%LB.n;rot=Math.sin(ph*TAU)*LB.sway;}
 g.save();
 g.fillStyle='rgba(0,0,0,.34)';g.beginPath();g.ellipse(0,15*s,13*s,4.2*s,0,0,TAU);g.fill();
 g.translate(0,15*s);if(rot)g.rotate(rot);
 g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
 const hk=LB.sk*s,lk=LB.k*s;
 if(hi&&moving&&dir===1&&imgOk(LUBAN_STAGE))g.drawImage(LUBAN_STAGE,fi*LB.sfw,0,LB.sfw,LB.sfh,-LB.sax*hk,-LB.say*hk,LB.sfw*hk,LB.sfh*hk);
 else if(hi&&!moving&&imgOk(LUBAN_STAGE_IDLE))g.drawImage(LUBAN_STAGE_IDLE,dir*LB.sfw,0,LB.sfw,LB.sfh,-LB.sax*hk,-LB.say*hk,LB.sfw*hk,LB.sfh*hk);
 else if(lubanReady())g.drawImage(LUBAN_IMG,fi*LB.fw,dir*LB.fh,LB.fw,LB.fh,-LB.ax*lk,-LB.ay*lk,LB.fw*lk,LB.fh*lk);
 g.restore();
}
function drawChar(g,key,t,face,moving,s,skin,hi){if(skin===1&&lubanReady())drawLuban(g,t,face,moving,s,hi);else drawHero(g,key,t,face,moving,s);}

/* ================= helpers ================= */
function addText(x,y,txt,col,size=13){texts.push({x,y,txt,col,size,life:0.75,max:0.75,vx:rand(-12,12)});if(texts.length>90)texts.shift();}
function nearest(x,y,range,skip){let b=null,bd=Infinity;for(const e of enemies){if(e.dead||e.cloak||(skip&&skip.has(e)))continue;const d=Math.hypot(e.x-x,e.y-y)-e.r;if(d<range&&d<bd){bd=d;b=e;}}return b;}
function nearestK(x,y,range,k){const l=[];for(const e of enemies){if(e.dead||e.cloak)continue;const d=Math.hypot(e.x-x,e.y-y)-e.r;if(d<range)l.push([d,e]);}if(!l.length)return null;l.sort((a,b)=>a[0]-b[0]);return l[k%l.length][1];}
function jag(x1,y1,x2,y2){const pts=[[x1,y1]],n=7;for(let i=1;i<n;i++){const t=i/n;pts.push([x1+(x2-x1)*t+rand(-9,9),y1+(y2-y1)*t+rand(-9,9)]);}pts.push([x2,y2]);return pts;}
function burst(x,y,col,n=7,gears=2){const ps=[];for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rand(80,220);ps.push([Math.cos(a)*s,Math.sin(a)*s]);}const gs=[];for(let i=0;i<gears;i++){const a=Math.random()*TAU,s=rand(60,140);gs.push([Math.cos(a)*s,Math.sin(a)*s,rand(-8,8),rand(0.35,0.7)]);}fxs.push({type:'burst',x,y,ps,gs,col,life:0.5,max:0.5});}
function ringFx(x,y,maxR,col,life=0.35){fxs.push({type:'ring',x,y,maxR,col,life,max:life});}
function boomFx(x,y,r,tier){fxs.push({type:'boom',x,y,r,tier:tier||0,life:0.42,max:0.42});ringFx(x,y,r,tier>=2?TC[tier]:C['brass-hi'],0.32);}
function aoe(x,y,r,dmg,o={}){for(const e of enemies){if(e.dead)continue;if((e.x-x)**2+(e.y-y)**2<(r+e.r)**2)hitEnemy(e,dmg,o);}}
function banner(txt,ms=1300){const b=$('#banner');b.textContent=txt;b.classList.add('show');clearTimeout(banner.t);banner.t=setTimeout(()=>b.classList.remove('show'),ms);}
function toast(txt){const t=$('#toast');t.textContent=txt;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200);}

/* ================= sound effects (Web Audio, synthesized — no audio files) =================
   Hurt sounds differ by what hit you (claw/contact, bullet, explosion, fire vent, mine cart,
   lightning, poison) and get heavier with the share of max HP lost. Plus dodge, down, revive,
   revive progress ticks and a low-HP heartbeat. The audio context is unlocked on the first tap/key
   (required on iPad/iPhone). */
const SFX={ctx:null,out:null,noise:null,on:true,last:{},beatT:0};
try{SFX.on=localStorage.getItem('jqbz-sound')!=='0';}catch(e){}
function sfxUnlock(){
 try{
  if(!SFX.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
   const c=new AC();SFX.ctx=c;
   const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;comp.connect(c.destination);
   SFX.out=c.createGain();SFX.out.gain.value=SFX.on?0.6:0;SFX.out.connect(comp);
   const len=c.sampleRate,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;SFX.noise=buf;
   const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,c.sampleRate);s.connect(c.destination);s.start(0);}
  if(SFX.ctx.state==='suspended')SFX.ctx.resume();
 }catch(e){}
}
addEventListener('pointerdown',sfxUnlock,{passive:true});addEventListener('touchend',sfxUnlock,{passive:true});addEventListener('keydown',sfxUnlock);
function sfxSetOn(on){SFX.on=on;try{localStorage.setItem('jqbz-sound',on?'1':'0');}catch(e){}if(SFX.out)SFX.out.gain.value=on?0.6:0;}
// oscillator voice: freq sweep f0->f1, attack/decay envelope
function sTone(type,f0,f1,dur,vol,delay=0,filt){
 const c=SFX.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.012,dur*0.2));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 let n=o;if(filt){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=filt;o.connect(f);n=f;}
 n.connect(g);g.connect(SFX.out);o.start(t);o.stop(t+dur+0.02);
}
// filtered noise burst, optional filter sweep
function sNoise(dur,vol,ftype,f0,f1,q=1,delay=0){
 const c=SFX.ctx,t=c.currentTime+delay,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
 s.buffer=SFX.noise;s.playbackRate.value=0.8+Math.random()*0.4;
 f.type=ftype;f.Q.value=q;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.01,dur*0.2));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(SFX.out);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);
}
const HURT_KINDS=['hit','shot','boom','fire','crush','zap','poison','dodge'];
// kind: one of HURT_KINDS (+ 'down','revive','tick','beat'); amt: share of max HP lost (0..1)
function sfx(kind,amt=0.1,vol=1){
 if(!SFX.on||!SFX.ctx||SFX.ctx.state!=='running')return;
 const now=SFX.ctx.currentTime,gap={tick:0.4,beat:0.3,poison:0.25}[kind]||0.07;
 if(SFX.last[kind]&&now-SFX.last[kind]<gap)return;SFX.last[kind]=now;
 const p=0.92+Math.random()*0.16,h=Math.min(1,Math.max(0,amt)),v=vol;
 try{switch(kind){
  case 'hit': // claw / body contact: thud + flesh slap + short grunt; heavier = deeper and longer
   sTone('sine',150*p,48,0.14+h*0.18,0.55*v);
   sNoise(0.05,0.35*v,'bandpass',1700*p,900,1.2);
   sTone('sawtooth',240*p,150*p,0.09+h*0.08,0.12*v,0.01,900);
   if(h>0.14){sTone('sine',80,32,0.32,0.5*v,0.02);sNoise(0.18,0.22*v,'lowpass',700,160,0.7,0.02);}
   break;
  case 'shot': // bullet impact: sharp crack + metallic ping
   sNoise(0.045,0.4*v,'highpass',2600*p,null,0.8);
   sTone('square',980*p,260,0.08,0.13*v,0,2400);
   sTone('sine',140*p,60,0.1+h*0.12,0.38*v,0.005);
   break;
  case 'boom': // explosion: low boom + debris noise tail
   sTone('sine',95*p,30,0.45+h*0.3,0.75*v);
   sNoise(0.5+h*0.3,0.55*v,'lowpass',1400,110,0.6);
   sNoise(0.08,0.35*v,'bandpass',2600,800,1,0.01);
   break;
  case 'fire': // vent flame: hiss + crackles
   sNoise(0.42,0.32*v,'bandpass',700*p,2400,0.9);
   for(let i=0;i<5;i++)sNoise(0.025,0.28*v,'highpass',3500+Math.random()*2500,null,1,0.03+i*0.06+Math.random()*0.03);
   sTone('triangle',210*p,120,0.18,0.12*v,0,700);
   break;
  case 'crush': // mine cart: heavy slam + metal clang
   sTone('sine',70,28,0.5,0.85*v);
   sNoise(0.3,0.5*v,'lowpass',900,140,0.7);
   sTone('square',520*p,500*p,0.32,0.12*v,0.01,3000);sTone('square',783*p,760*p,0.26,0.09*v,0.01,3000);
   break;
  case 'zap': // lightning: buzzing sweep + crack
   sNoise(0.06,0.45*v,'highpass',4000,null,0.7);
   sTone('sawtooth',1500*p,90,0.24,0.2*v,0,5000);
   sTone('square',60,58,0.22,0.1*v,0.02,600);
   sTone('sine',110,40,0.3,0.4*v,0.02);
   break;
  case 'poison': // toxic pool: two gurgles + soft sting
   sTone('sine',260*p,520*p,0.07,0.14*v);sTone('sine',300*p,600*p,0.07,0.12*v,0.08);
   sNoise(0.12,0.1*v,'bandpass',900,500,2);
   break;
  case 'dodge': // whoosh
   sNoise(0.18,0.28*v,'bandpass',700,3200,1.4);
   sTone('sine',600*p,1100*p,0.08,0.06*v,0.02);
   break;
  case 'down': // falling: descending wail + thud
   sTone('sawtooth',420*p,95,0.75,0.16*v,0,1400);
   sTone('sine',90,30,0.5,0.6*v,0.18);
   sNoise(0.35,0.25*v,'lowpass',800,120,0.7,0.18);
   break;
  case 'revive': // rising chime
   [523,659,784,1047].forEach((f,i)=>{sTone('triangle',f,f,0.32,0.18*v,i*0.08);sTone('sine',f*2,f*2,0.22,0.05*v,i*0.08);});
   break;
  case 'tick': // revive progress
   sTone('sine',880+amt*500,880+amt*500,0.07,0.08*v);
   break;
  case 'beat': // low-HP heartbeat
   sTone('sine',62,44,0.14,0.42*v);sTone('sine',58,40,0.13,0.32*v,0.17);
   break;
 }}catch(e){}
}

/* ================= combat ================= */
function hitEnemy(e,base,o={}){
 if(e.dead)return;
 if(e.seg){e.flash=0.08;const q=e.parent;if(q&&!q.dead){const f=q.segT===tGame?0.2:0.8;q.segT=tGame;hitEnemy(q,base*f,o);}return;}
 let d=base,crit=false;
 if(!o.noCrit&&Math.random()*100<S.crit+(o.critB||0)){crit=true;d*=1.5+S.critdmg/100;}
 if(e.dr)d*=e.dr;
 if(H.poisonAmp&&e.poisonT>0)d*=1+H.poisonAmp/100;
 if(e.tough&&e.rec>e.tough)d*=Math.max(BOSS.toughMin,e.tough/e.rec);
 if(e.type==='shield'&&!o.noShield){const sx=o.sx!=null?o.sx:P.x,sy=o.sy!=null?o.sy:P.y;if(Math.abs(angDiff(Math.atan2(sy-e.y,sx-e.x),e.face))<1.05){d*=0.25;if(Math.random()<0.25)fxs.push({type:'spark',x:e.x+Math.cos(e.face)*e.r,y:e.y+Math.sin(e.face)*e.r,a:Math.random()*TAU,life:0.15,max:0.15});}}
 const dealt=Math.min(d,Math.max(0,e.hp));e.hp-=d;e.flash=0.08;if(e.tough)e.rec+=d;
 if(o.slow)e.slowT=2;
 if(o.freeze)e.freezeT=Math.max(e.freezeT,1);
 if(crit||e.boss||Math.random()<0.45)addText(e.x+rand(-6,6),e.y-e.r,crit?Math.round(d)+'!':Math.max(1,Math.round(d)),crit?C['brass-hi']:(o.col||C.fg),crit?18:12);
 if(crit)fxs.push({type:'spark',x:e.x,y:e.y,a:Math.random()*TAU,life:0.18,max:0.18});
 if(!o.noSteal&&S.lifesteal>0)stealPool+=dealt*S.lifesteal/100;
 if(!o.noSteal&&H.hitPoison&&e.hp>0&&Math.random()*100<H.hitPoison)addPoison(e,d*0.4*poisonMul(),2,'hit:'+H.key,poisonCap());
 if(crit&&FX.critLightning&&Math.random()<0.25*FX.critLightning)chain(e.x,e.y,e,base*0.6,3,{noCrit:1,noSteal:1},GLOW.blue,true);
 if(e.hp<=0)killEnemy(e,o);
}
function chain(ox,oy,first,dmg,n,o,col,skipFirst,lw=7){
 const hit=new Set(),pts=[[ox,oy]];let cur=first,px=ox,py=oy;
 for(let i=0;i<=n&&cur;i++){
  hit.add(cur);
  if(!(skipFirst&&i===0)){jag(px,py,cur.x,cur.y).slice(1).forEach(p=>pts.push(p));hitEnemy(cur,dmg,o);}
  px=cur.x;py=cur.y;cur=nearest(px,py,170,hit);
 }
 if(pts.length>1)fxs.push({type:'bolt',pts,col,lw,life:0.22,max:0.22});
}
function skyBolt(){
 const e=nearest(P.x,P.y,460)||(enemies.length?pick(enemies.filter(x=>!x.dead)):null);
 if(!e)return;
 fxs.push({type:'bolt',pts:jag(e.x+rand(-30,30),e.y-280,e.x,e.y),col:GLOW.blue,life:0.24,max:0.24});
 fxs.push({type:'flash',x:e.x,y:e.y,r:40,col:GLOW.blue,life:0.2,max:0.2});
 hitEnemy(e,flatDmg(8),{noCrit:1,noSteal:1,col:'#9fc0ff'});
 if(H.key==='storm'&&Math.random()<0.15)heal(1,'bolt');
}
function heal(n,src){
 if(!run||state!=='battle')return;
 if(run.hp<S.hp){run.hp=Math.min(S.hp,run.hp+n);addText(P.x+rand(-8,8),P.y-30,'+'+n,C.good,12);}
 let k=(H.key==='storm'?1:0)+(FX.healLightning&&Math.random()<0.35?1:0);
 if(k&&stormCD<=0){stormCD=0.32;for(let i=0;i<k;i++)skyBolt();}
}
function addXP(n){
 run.xp+=n;
 while(run.xp>=xpNeed()){run.xp-=xpNeed();run.level++;run.pendingLevels++;S.hp+=1;run.hp+=1;addText(P.x,P.y-48,'升级',C.verdigris,17);fxs.push({type:'lvl',pid:CUR?CUR.id:0,life:0.9,max:0.9});}
}
function dropCoins(x,y,g){
 const coins=pickups.filter(p=>p.type==='coin');
 const n=Math.min(3,g);let left=g;
 for(let i=0;i<n;i++){const v=i===n-1?left:Math.ceil(g/n);left-=v;if(v<=0)break;
  if(coins.length>260){pick(coins).v+=v;continue;}
  const c={type:'coin',x:clamp(x+rand(-12,12),8,WORLD.w-8),y:clamp(y+rand(-12,12),8,WORLD.h-8),r:6,v,mag:false,ph:Math.random()*TAU};pushOut(c);pickups.push(c);}
}
function chestTier(bonus){const r=Math.random()*(1+S.luck/100)+run.wave*0.012;let t=r>1.05?4:r>0.88?3:r>0.55?2:1;return Math.min(4,t+bonus);}
function killEnemy(e,o){
 e.dead=true;run.kills++;burst(e.x,e.y,e.col,e.boss?24:8,e.boss?10:(e.type==='brute'?4:2));
 dropCoins(e.x,e.y,goldFor(e.gold)+(o.coin||0));
 addXP(e.xp);
 if(H.critStack&&run.critStack<30){const inc=Math.min(0.1,30-run.critStack);run.critStack+=inc;S.crit+=inc;}
 if(e.type==='fairy'){pickups.push({type:'chest',x:e.x,y:e.y,tier:chestTier(0),ph:0});addText(e.x,e.y-20,'宝箱',C.t4,15);}
 if(e.type==='splitter')for(let k=0;k<2;k++)spawns.push({type:'mite',x:e.x+rand(-10,10),y:e.y+rand(-10,10),t:0.05,noAff:true});
 if(e.aff){if(Math.random()<0.25)pickups.push({type:'chest',x:e.x,y:e.y,tier:chestTier(0),ph:0});
  if(e.aff==='split')for(let k=0;k<2;k++)spawns.push({type:e.type,x:e.x+rand(-14,14),y:e.y+rand(-14,14),t:0.05,noAff:true,scale:0.45});
  if(e.aff==='volatile'){const x=e.x,y=e.y,dm=e.dmg*1.6;fxs.push({type:'warnc',x,y,r:80,life:0.6,max:0.6});delayed.push({t:0.6,fn:()=>{boomFx(x,y,80);hurtNear(x,y,80,dm);}});}}
 if(e.segs)for(const sg of e.segs){sg.dead=true;burst(sg.x,sg.y,e.col,5,2);}
 if(e.boss){
  boomFx(e.x,e.y,e.r*2.4);shake=0.5;
  if(e.elite){for(let i=0;i<2;i++)pickups.push({type:'chest',x:e.x+rand(-30,30),y:e.y+rand(-30,30),tier:chestTier(1),ph:0});dropCoins(e.x,e.y,40);banner('精英已击破');netEvent({banner:'精英已击破'});}
  else{run.victory=true;for(const x of enemies)x.dead=true;ebul=[];spawns=[];banner('最终首领已击破',1600);netEvent({banner:'最终首领已击破'});delayed.push({t:1.8,fn:()=>showOver(true)});}
 }
}
function hurt(d,kind='hit'){
 if(P.inv>0||state!=='battle'||run.victory||(CUR&&CUR.down))return;
 if(Math.random()*100<Math.min(dodgeCap(),S.dodge)){P.inv=0.3;hurtSnd(CUR,'dodge',0);addText(P.x,P.y-30,'闪避',C.verdigris,14);fxs.push({type:'after',pid:CUR?CUR.id:0,x:P.x,y:P.y,face:P.face,dface:P.dface,life:0.3,max:0.3});onDodge();return;}
 const A=S.armor;d*=A>=0?15/(15+A):(15-A)/15;
 if(CUR&&CUR.reviving!=null)d*=REV.guard; // reviving a teammate: take less damage
 run.hp-=d;P.inv=0.5;if(isMe())shake=0.25;addText(P.x,P.y-30,'-'+Math.max(1,Math.round(d)),C.danger,15);
 hurtSnd(CUR,kind,d/Math.max(1,S.hp));
 if(run.hp<=0){
  if(FX.revive&&!run.revived){run.revived=true;run.items.splice(run.items.indexOf('不灭火种'),1);computeStats();run.hp=Math.ceil(S.hp*0.5);P.inv=2;if(isMe())banner('不灭火种');boomFx(P.x,P.y,230);aoe(P.x,P.y,230,flatDmg(30),{noSteal:1});ebul=[];return;}
  run.hp=0;playerDown();
 }
}
function playerDown(){
 const p=CUR;if(!p||p.down)return;
 p.down=true;p.rv=0;P.moving=false;burst(P.x,P.y,'#c8402f',10,3);addText(P.x,P.y-36,'倒地',C.danger,17);
 sfx('down',1,p===ME()?1:0.55);
 if(PL.every(q=>q.down)){showOver(false);return;}
 banner(p===ME()?'你倒下了 · 等队友来救':'队友倒下 · 靠近他就能救起',1800);netEvent({banner:p===ME()?'队友倒下 · 靠近他就能救起':'你倒下了 · 等队友来救',sfx:'down',vol:p===ME()?0.55:1});
}
/* ---- teammate revive (co-op only) ----
   Stand inside a downed teammate's ring to fill it. Built to be doable in late waves:
   - big ring (you only need to be near, not on top), 2s for the first revive, +0.75s per extra
     revive in the same wave, capped at 4s; leaving the ring drains progress slowly
   - the reviver takes 40% less damage while inside the ring, and getting hit never interrupts
   - on revive a rescue shockwave knocks back and slows nearby enemies (bosses are only slowed),
     and both players get a short shield
   The revived player comes back with 40% HP. Nobody revives them -> back at the next wave. */
const REV={radius:72,base:2,step:0.75,max:4,hp:0.4,inv:2,helperInv:1.2,decay:0.3,guard:0.6,blast:170};
const revNeed=p=>Math.min(REV.max,REV.base+REV.step*(p.revives||0));
function reviveUpdate(dt){
 for(const p of PL)p.reviving=null;
 if(PL.length<2)return;
 for(const d of PL){
  if(!d.down){d.rv=0;continue;}
  const helper=PL.find(q=>!q.down&&Math.hypot(q.P.x-d.P.x,q.P.y-d.P.y)<REV.radius);
  if(helper){helper.reviving=d.id;d.rv=(d.rv||0)+dt;if(helper===ME()||d===ME())sfx('tick',d.rv/revNeed(d));}
  else d.rv=Math.max(0,(d.rv||0)-dt*REV.decay);
  d.rvk=d.rv/revNeed(d);
  if(d.rv>=revNeed(d)){
   const keep=CUR;use(d);
   d.down=false;d.rv=0;d.rvk=0;d.revives=(d.revives||0)+1;run.hp=Math.max(1,Math.round(S.hp*REV.hp));P.inv=REV.inv;
   if(helper)helper.P.inv=Math.max(helper.P.inv,REV.helperInv);
   rescueBlast(P.x,P.y);
   fxs.push({type:'lvl',pid:d.id,life:0.9,max:0.9});addText(P.x,P.y-40,'救起！',C.good,17);

function pickType(w){
 const pool=[['crawler',10]];
 if(w>=3)pool.push(['charger',4+w*0.3]);if(w>=4)pool.push(['spitter',3+w*0.25],['splitter',2.4+w*0.15]);
 if(w>=5)pool.push(['brute',2+w*0.22],['shield',2+w*0.15]);if(w>=6)pool.push(['bomber',3]);
 if(w>=7)pool.push(['layer',1.6+w*0.08]);
 const cnt=t=>enemies.reduce((n,e)=>n+(e.type===t&&!e.dead?1:0),0);
 if(w>=8&&cnt('medic')<3)pool.push(['medic',1.4]);if(w>=9)pool.push(['stalker',1.8+w*0.08]);if(w>=10&&cnt('totem')<2)pool.push(['totem',0.7]);
 for(const p of pool)if(MAP.favor&&MAP.favor.includes(p[0]))p[1]*=1.6;
 let tot=pool.reduce((s,p)=>s+p[1],0),r=Math.random()*tot;for(const p of pool){r-=p[1];if(r<=0)return p[0];}return 'crawler';
}
function spawnLogic(dt){
 if(run.victory)return;
 const w=run.wave,D=DIFF[run.diff],bossAlive=enemies.some(e=>e.boss&&!e.dead);
 spawnT-=dt;
 if(spawnT<=0){
  spawnT=Math.max(BAL.spawnMin,BAL.spawnBase-w*BAL.spawnSlope)/dRamp(D.spawn,w)*(bossAlive?2:1);
  const n=1+Math.floor(w/BAL.batchDiv)+(Math.random()<0.3?1:0);
  for(let i=0;i<n;i++)if(enemies.length+spawns.length<170)queueSpawn(pickType(w));
 }
 fairyT-=dt;if(fairyT<=0){fairyT=rand(10,16)/(1+S.luck/200);queueSpawn('fairy');}
}
function ebullet(x,y,a,spd,dmg,r=6,home=0){ebul.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r,dmg,life:home?4.5:5,home});}
function wyrmAI(e,dt,dx,dy,d,sf){
 e.anim+=dt;
 let sp=e.spd*sf;
 if(e.st==='wind'){e.windT-=dt;sp*=0.25;if(e.windT<=0){e.st='dash';e.dashT=0.8;}}
 else if(e.st==='dash'){e.dashT-=dt;sp=540;if(e.dashT<=0)e.st='';}
 if(e.st!=='dash'){const want=Math.atan2(dy,dx)+Math.sin(e.anim*1.8)*0.65;e.hd+=clamp(angDiff(want,e.hd),-2.4*dt,2.4*dt);}
 e.x=clamp(e.x+Math.cos(e.hd)*sp*dt,e.r,WORLD.w-e.r);e.y=clamp(e.y+Math.sin(e.hd)*sp*dt,e.r,WORLD.h-e.r);
 if(e.x<=e.r+1||e.x>=WORLD.w-e.r-1||e.y<=e.r+1||e.y>=WORLD.h-e.r-1)e.hd=Math.atan2(WORLD.h/2-e.y,WORLD.w/2-e.x);
 e.face=e.hd;
 const L=e.trail[e.trail.length-1];if(!L||Math.hypot(L[0]-e.x,L[1]-e.y)>=6)e.trail.push([e.x,e.y]);
 const need=e.segs.length*4+8;if(e.trail.length>need)e.trail.splice(0,e.trail.length-need);
 e.segs.forEach((sg,i)=>{const tp=e.trail[Math.max(0,e.trail.length-1-(i+1)*4)]||[e.x,e.y];sg.x=tp[0];sg.y=tp[1];});
 e.ai-=dt*(e.hp<e.max*0.5?1.35:1);
 if(e.ai<=0&&e.st===''){e.ai=rand(2.4,3.4)*(e.elite?1.25:1);const atk=pick(e.atk);
  if(atk==='charge'){e.st='wind';e.windT=0.7;e.hd=Math.atan2(dy,dx);fxs.push({type:'tele',x:e.x,y:e.y,a:e.hd,len:420,w:e.r*2,life:0.7,max:0.7});}
  if(atk==='burst'){for(const sg of e.segs){const nx=Math.atan2(sg.y-e.y,sg.x-e.x);for(const off of [Math.PI/2,-Math.PI/2])ebullet(sg.x,sg.y,e.hd+off+rand(-0.15,0.15),150,e.dmg*0.55,6);}ringFx(e.x,e.y,e.r+20,C.danger,0.3);}
 }
}
function hiveAI(e,dt,dx,dy,d,sf){
 e.anim+=dt;
 const dir=d>330?1:d<240?-1:0,tx=-dy/d,ty=dx/d;
 e.x+=(dx/d*dir*0.9+tx*0.35)*e.spd*sf*dt;e.y+=(dy/d*dir*0.9+ty*0.35)*e.spd*sf*dt;
 e.face+=angDiff(Math.atan2(dy,dx),e.face)*Math.min(1,dt*3);
 e.ai-=dt*(e.hp<e.max*0.5?1.35:1);
 if(e.ai<=0){e.ai=rand(2.8,3.8)*(e.elite?1.25:1);const atk=pick(e.atk),pa=Math.atan2(dy,dx);
  if(atk==='drones'){for(let k=0;k<(e.elite?3:5);k++){const a=k*TAU/5;spawns.push({type:'bomber',x:clamp(e.x+Math.cos(a)*60,30,WORLD.w-30),y:clamp(e.y+Math.sin(a)*60,30,WORLD.h-30),t:0.4,noAff:true});}}
  if(atk==='missiles'){for(let k=0;k<(e.elite?3:5);k++)ebullet(e.x,e.y,pa+(k-2)*0.5,170,e.dmg*0.8,7,1.9);}
  if(atk==='ring'){const n=e.elite?14:20;for(let k=0;k<n;k++)ebullet(e.x,e.y,k*TAU/n,140,e.dmg*0.6,6);ringFx(e.x,e.y,e.r+30,C.danger,0.32);}
 }
}
function bossAI(e,dt,dx,dy,d,sf){
 if(e.tough){e.rec*=Math.exp(-dt);bossPhase(e);}
 if(e.bkey==='wyrm'){wyrmAI(e,dt,dx,dy,d,sf);return;}
 if(e.bkey==='hive'){hiveAI(e,dt,dx,dy,d,sf);return;}
 e.anim+=dt;
 if(e.st==='dash'){e.dashT-=dt;e.x+=e.dvx*dt;e.y+=e.dvy*dt;if(e.dashT<=0)e.st='';return;}
 if(e.st==='wind'){e.windT-=dt;if(e.windT<=0){e.st='dash';e.dashT=0.55;e.dvx=Math.cos(e.dashA)*540;e.dvy=Math.sin(e.dashA)*540;}return;}
 if(e.st==='spiral'){e.spT-=dt;e.spEmit-=dt;if(e.spEmit<=0){e.spEmit=0.09;e.spA+=0.33;for(let k=0;k<3;k++)ebullet(e.x,e.y,e.spA+k*TAU/3,165,e.dmg*0.6);}if(e.spT<=0)e.st='';}
 else chase(e,dx/d,dy/d,e.spd*sf,dt);
 e.face+=angDiff(Math.atan2(dy,dx),e.face)*Math.min(1,dt*3);
 e.ai-=dt*(e.hp<e.max*0.5?1.35:1);
 if(e.ai<=0&&e.st===''){
  e.ai=rand(2.6,3.6)*(e.elite?1.25:1);
  const atk=pick(e.atk),pa=Math.atan2(dy,dx);
  if(atk==='ring'){const n=e.elite?14:20;for(let k=0;k<n;k++)ebullet(e.x,e.y,k*TAU/n+Math.random()*0.2,150,e.dmg*0.7,7);ringFx(e.x,e.y,e.r+34,C.danger,0.32);}
  if(atk==='dash'){e.st='wind';e.windT=0.75;e.dashA=pa;fxs.push({type:'tele',x:e.x,y:e.y,a:pa,len:300,w:e.r*2,life:0.75,max:0.75});}
  if(atk==='summon'){for(let k=0;k<(e.elite?4:6);k++){const a=k*TAU/6;spawns.push({type:'crawler',x:clamp(e.x+Math.cos(a)*70,30,WORLD.w-30),y:clamp(e.y+Math.sin(a)*70,30,WORLD.h-30),t:0.5,noAff:true});}}
  if(atk==='spread'){for(let k=0;k<7;k++)ebullet(e.x,e.y,pa+(k-3)*0.16,210,e.dmg*0.7,7);}
  if(atk==='spiral'){e.st='spiral';e.spT=e.elite?1.8:2.6;e.spEmit=0;e.spA=pa;}
 }
}
// 最终首领在 66% 和 33% 血量各狂怒一次：召唤一圈精锐护卫并放出弹幕环
function bossPhase(e){
 if(e.ph>=2||e.hp>e.max*(e.ph===0?0.66:0.33))return;
 e.ph++;const n=BOSS.adds+(PL.length-1)*2,types=['charger','stalker','shield','brute','layer'];
 for(let k=0;k<n;k++){const a=k*TAU/n;spawns.push({type:pick(types),x:clamp(e.x+Math.cos(a)*110,30,WORLD.w-30),y:clamp(e.y+Math.sin(a)*110,30,WORLD.h-30),t:0.6+k*0.05});}
 for(let k=0;k<24;k++)ebullet(e.x,e.y,k*TAU/24,140,e.dmg*0.6,7);
 ringFx(e.x,e.y,e.r+60,C.danger,0.45);shake=0.45;banner(e.ph===1?'首领狂怒':'首领濒死反扑',1100);netEvent({banner:e.ph===1?'首领狂怒':'首领濒死反扑'});
}
function contactHurt(e){const keep=CUR;for(const p of alivePL()){if(Math.hypot(p.P.x-e.x,p.P.y-e.y)<e.r+p.P.r){use(p);hurt(e.dmg,'hit');}}use(keep);}
function updateEnemies(dt){
 const keep=CUR;
 for(const e of enemies){
  if(e.dead)continue;
  e.flash-=dt;
  // each enemy hunts the closest living player (the "current player" context during its update)
  const tp=nearestPL(e.x,e.y);if(!tp)continue;use(tp);
  if(e.seg){contactHurt(e);continue;}
  if(e.regen&&e.hp<e.max)e.hp=Math.min(e.max,e.hp+e.max*e.regen*dt);
  if(e.poisonT>0){e.poisonT-=dt;e.ptick-=dt;if(e.pl){let mt=0,sum=0;e.pl=e.pl.filter(l=>(l.t-=dt)>0);for(const l of e.pl){sum+=l.dps;if(l.t>mt)mt=l.t;}e.poison=sum;e.poisonT=mt;}if(e.ptick<=0&&e.poison>0){e.ptick=0.5;hitEnemy(e,e.poison*0.5,{noCrit:1,noSteal:1,noShield:1,col:C.good});if(e.dead)continue;}}
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
  if(e.slowT>0)e.slowT-=dt;
  let sf=e.slowT>0?0.55:1;if(MAP.pools&&e.type!=='fairy'&&!e.boss&&inPool(e.x,e.y))sf*=0.62;
  let ta=Math.atan2(dy,dx),as=1.6;
  if(e.freezeT>0){e.freezeT-=dt;as=0;}
  else if(e.boss)bossAI(e,dt,dx,dy,d,sf);
  else if(e.type==='fairy'){
   e.ai-=dt;e.life-=dt;if(e.ai<=0){e.ai=rand(1,2);e.wa=Math.random()*TAU;}
   let ax=Math.cos(e.wa),ay=Math.sin(e.wa);if(d<230){ax=-dx/d;ay=-dy/d;}
   e.x+=ax*e.spd*sf*dt;e.y+=ay*e.spd*sf*dt;ta=Math.atan2(ay,ax);as=3;
   if(e.x<30||e.x>WORLD.w-30||e.y<30||e.y>WORLD.h-30)e.wa=Math.atan2(WORLD.h/2-e.y,WORLD.w/2-e.x);
   if(e.life<=0){e.dead=true;addText(e.x,e.y-16,'跑掉了',C.muted,12);continue;}
  }
  else if(e.type==='charger'){
   if(e.st===0){chase(e,dx/d,dy/d,e.spd*sf,dt);e.ai-=dt;as=2;if(e.ai<=0&&d<330){e.st=1;e.ai=0.55;e.da=Math.atan2(dy,dx);}}
   else if(e.st===1){e.ai-=dt;ta=e.da;as=0.6;if(e.ai<=0){e.st=2;e.ai=0.45;}}
   else{e.x+=Math.cos(e.da)*430*sf*dt;e.y+=Math.sin(e.da)*430*sf*dt;e.ai-=dt;ta=e.da;as=6;if(e.ai<=0){e.st=0;e.ai=rand(2,3.2);}}
  }
  else if(e.type==='spitter'){
   const dir=d>250?1:d<180?-1:0;chase(e,dx/d*dir,dy/d*dir,e.spd*sf*Math.abs(dir),dt);as=dir?1.4:0.5;
   e.ai-=dt;if(e.ai<=0){e.ai=rand(2.2,2.8);ebullet(e.x+Math.cos(e.face)*18,e.y+Math.sin(e.face)*18,Math.atan2(dy,dx),175,e.dmg);fxs.push({type:'muzzle',x:e.x+Math.cos(e.face)*20,y:e.y+Math.sin(e.face)*20,life:0.1,max:0.1,red:1});}
  }
  else if(e.type==='bomber'){
   if(!e.fuse&&d<e.r+P.r+20)e.fuse=0.45;
   if(e.fuse){e.fuse-=dt;as=0;if(e.fuse<=0){e.dead=true;boomFx(e.x,e.y,75);hurtNear(e.x,e.y,75,e.dmg);continue;}}
   else{chase(e,dx/d,dy/d,e.spd*sf,dt);as=2.6;}
  }
  else if(e.type==='layer'){
   const tx=-dy/d*e.orb,ty=dx/d*e.orb,rad=d>260?0.8:d<200?-0.8:0;let ux=tx+dx/d*rad,uy=ty+dy/d*rad;const l=Math.hypot(ux,uy)||1;
   chase(e,ux/l,uy/l,e.spd*sf,dt);ta=Math.atan2(uy,ux);as=2.4;
   if(e.x<60||e.x>WORLD.w-60||e.y<60||e.y>WORLD.h-60)e.orb*=-1;
   e.ai-=dt;if(e.ai<=0){e.ai=rand(2.3,2.9);if(emines.length<18)emines.push({x:e.x,y:e.y,arm:0.8,life:10,dmg:e.dmg});}
  }
  else if(e.type==='medic'){
   const dir=d>300?1:d<200?-1:0;chase(e,dx/d*dir,dy/d*dir,e.spd*sf*Math.abs(dir),dt);as=1.6;
   e.ai-=dt;if(e.ai<=0){e.ai=1.6;const pts=[];for(const o of enemies){if(o===e||o.dead||o.type==='medic'||o.seg)continue;if(Math.hypot(o.x-e.x,o.y-e.y)<170&&o.hp<o.max){o.hp=Math.min(o.max,o.hp+o.max*(o.boss?0.02:0.12));pts.push([o.x,o.y]);}}
    if(pts.length)fxs.push({type:'heal',x:e.x,y:e.y,pts,life:0.4,max:0.4});}
  }
  else if(e.type==='stalker'){
   e.ai-=dt;
   if(e.st==='stalk'){e.cloak=true;chase(e,dx/d,dy/d,e.spd*1.25*sf,dt);as=3;if(e.ai<=0||d<120){e.st='reveal';e.ai=0.45;e.cloak=false;e.da=Math.atan2(dy,dx);}}
   else if(e.st==='reveal'){as=0.3;ta=e.da=Math.atan2(dy,dx);if(e.ai<=0){e.st='lunge';e.ai=0.35;}}
   else if(e.st==='lunge'){e.x+=Math.cos(e.da)*470*sf*dt;e.y+=Math.sin(e.da)*470*sf*dt;ta=e.da;as=6;if(e.ai<=0){e.st='rest';e.ai=1.4;}}
   else{chase(e,dx/d,dy/d,e.spd*0.55*sf,dt);if(e.ai<=0){e.st='stalk';e.ai=2.2;}}
  }
  else if(e.type==='totem'){
   as=1;ta=e.face;e.ai-=dt;if(e.ai<=0){e.ai=4.5;for(let k=0;k<2;k++){if(enemies.length+spawns.length>=165)break;const a=Math.random()*TAU;spawns.push({type:'crawler',x:clamp(e.x+Math.cos(a)*36,30,WORLD.w-30),y:clamp(e.y+Math.sin(a)*36,30,WORLD.h-30),t:0.4,noAff:true});}ringFx(e.x,e.y,40,C.danger,0.3);}
  }
  else{chase(e,dx/d,dy/d,e.spd*sf,dt);as=e.type==='crawler'||e.type==='mite'?2.8:1.4;}
  if(!e.boss){e.face+=angDiff(ta,e.face)*Math.min(1,dt*(e.type==='shield'?1.8:8));e.anim+=dt*as*sf;}
  e.x=clamp(e.x,e.r,WORLD.w-e.r);e.y=clamp(e.y,e.r,WORLD.h-e.r);
  if(e.type!=='fairy'&&!(e.boss&&e.bkey==='wyrm'&&false))pushOut(e);
  if(e.type!=='bomber'&&e.type!=='fairy')contactHurt(e);
 }
 use(keep);
 for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.dead||a.seg)continue;
  for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.dead||b.seg)continue;const dx=b.x-a.x,dy=b.y-a.y,rs=a.r+b.r;
   if(dx>rs||dx<-rs||dy>rs||dy<-rs)continue;const d2=dx*dx+dy*dy;if(d2>=rs*rs||d2<0.01)continue;
   const d=Math.sqrt(d2),o=(rs-d)*0.5,nx=dx/d,ny=dy/d;
   if(a.boss||a.type==='totem'){b.x+=nx*o*2;b.y+=ny*o*2;}else if(b.boss||b.type==='totem'){a.x-=nx*o*2;a.y-=ny*o*2;}else{a.x-=nx*o*0.5;a.y-=ny*o*0.5;b.x+=nx*o*0.5;b.y+=ny*o*0.5;}}}
}

/* ================= main update ================= */
function readInput(){
 let mx=0,my=0;
 if(keys.has('a')||keys.has('arrowleft'))mx-=1;if(keys.has('d')||keys.has('arrowright'))mx+=1;
 if(keys.has('w')||keys.has('arrowup'))my-=1;if(keys.has('s')||keys.has('arrowdown'))my+=1;
 if(joy){const jx=joy.x-joy.ox,jy=joy.y-joy.oy,l=Math.hypot(jx,jy);if(l>8){const k=Math.min(1,l/50)/l;mx=jx*k;my=jy*k;}}
 const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
 return [mx,my,Math.hypot(mx,my)];
}
// local movement for the current player (host's own player, or the guest predicting itself)
function moveLocal(dt){
 const [mx,my,ml]=readInput();
 const spd=190*Math.max(0.3,1+S.speed/100)*(inPool(P.x,P.y)?0.62:1);
 P.x=clamp(P.x+mx*spd*dt,P.r,WORLD.w-P.r);P.y=clamp(P.y+my*spd*dt,P.r,WORLD.h-P.r);pushOut(P);
 P.moving=ml>0.1;if(P.moving){P.face=Math.atan2(my,mx);P.mface=P.face;P.anim+=dt;}else P.anim+=dt*0.4;
 P.dface+=angDiff(P.mface,P.dface)*Math.min(1,dt*LB.turn);
}
function playerUpdate(p,dt){
 // lifesteal: % of damage dealt, paid out 4x per second, capped at 4 + 6% max HP per second
 stealClock-=dt;if(stealClock<=0){stealClock=0.25;const cap=(4+S.hp*0.06)*0.25;stealPool=Math.min(stealPool,cap*4);const amt=Math.min(Math.floor(stealPool),Math.ceil(cap));if(amt>0){stealPool-=amt;heal(amt,'steal');}}
 if(p===ME())moveLocal(dt);
 else{ // remote player: position comes from the network, animate locally
  if(P.moving){P.mface=P.face;P.anim+=dt;}else P.anim+=dt*0.4;
  P.dface+=angDiff(P.mface,P.dface)*Math.min(1,dt*LB.turn);}
 P.inv-=dt;dodgeBuff-=dt;stormCD-=dt;
 if(S.regen>0){regenAcc+=S.regen*0.2*dt;while(regenAcc>=1){regenAcc-=1;heal(1,'regen');}}
 if(FX.poisonTrail&&P.moving){trailT-=dt;if(trailT<=0){trailT=0.3;puddles.push({x:P.x,y:P.y,r:30,life:2,max:2,dps:flatDmg(3)*FX.poisonTrail*poisonMul(),tick:0,seed:Math.random()*99,src:'trail:'+(CUR?CUR.id:0),cap:poisonCap()});}}
}
function update(dt){
 tGame+=dt;
 if(run.wave<FINAL_WAVE&&!run.victory){waveTimer-=dt;if(waveTimer<=0){endWave();return;}}
 shake=Math.max(0,shake-dt);
 for(const p of PL){if(p.down)continue;use(p);playerUpdate(p,dt);}
 use(ME());
 reviveUpdate(dt);
 spawnLogic(dt);
 for(const s of spawns){s.t-=dt;if(s.t<=0){s.done=true;enemies.push(makeEnemy(s.type,s.x,s.y,s));}}
 spawns=spawns.filter(s=>!s.done);
 for(const p of PL){if(p.down)continue;use(p);for(const w of run.weapons)fireWeapon(w,dt);}
 for(const d of delayed.slice()){d.t-=dt;if(d.t<=0&&!d.done){d.done=true;use(d.pl||ME());d.fn();}}
 delayed=delayed.filter(d=>!d.done);
 use(ME());
 if(state!=='battle')return;
 updateEnemies(dt);
 mapUpdate(dt);if(state!=='battle')return;
 for(const p of projs){
  use(p.pl||ME());
  if(p.kind==='lob'){p.t+=dt;const k=Math.min(1,p.t/p.dur);p.x=p.sx+(p.tx-p.sx)*k;p.y=p.sy+(p.ty-p.sy)*k;
   if(k>=1){p.dead=true;aoe(p.tx,p.ty,p.pr*0.6,p.dmg,Object.assign({},p.opts,{col:C.good}));puddles.push({x:p.tx,y:p.ty,r:p.pr,life:3.2,max:3.2,dps:p.dmg*1.4*poisonMul(),tick:0,seed:Math.random()*99,tier:p.tier,src:'w'+p.wid,cap:poisonCap()});fxs.push({type:'splash',x:p.tx,y:p.ty,r:p.pr,tier:p.tier,life:0.3,max:0.3});}continue;}
  if(p.kind==='boom'){p.rot+=dt*16;
   if(!p.ret){p.trav+=p.sp*dt;if(p.trav>=p.range){p.ret=true;p.hit.clear();}}

   p.life-=dt;if(p.life<=0){p.dead=true;continue;}}
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.kind==='proj'){p.life-=dt;
   if(p.life<=0||p.x<0||p.y<0||p.x>WORLD.w||p.y>WORLD.h){if(p.grenade)explode(p);p.dead=true;continue;}}
  for(const e of enemies){

   }
  }
 }
 use(ME());

 const alive=alivePL();
 for(const b of ebul){if(b.home){const tp=nearestPL(b.x,b.y);if(tp){const ca=Math.atan2(b.vy,b.vx),na=ca+clamp(angDiff(Math.atan2(tp.P.y-b.y,tp.P.x-b.x),ca),-b.home*dt,b.home*dt),sp=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;}}
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(b.life<=0||b.x<-20||b.y<-20||b.x>WORLD.w+20||b.y>WORLD.h+20){b.dead=true;continue;}
  for(const p of alive){if((b.x-p.P.x)**2+(b.y-p.P.y)**2<(b.r+p.P.r-3)**2){b.dead=true;use(p);hurt(b.dmg,'shot');break;}}}
 use(ME());
 ebul=ebul.filter(b=>!b.dead);
 for(const u of puddles){u.life-=dt;u.tick-=dt;if(u.tick<=0){u.tick=0.4;for(const e of enemies){if(e.dead)continue;if((e.x-u.x)**2+(e.y-u.y)**2<(u.r+e.r)**2){addPoison(e,u.dps,2.2,u.src||'pool',u.cap||3);}}}}
 puddles=puddles.filter(u=>u.life>0);if(puddles.length>60)puddles.splice(0,puddles.length-60);
 for(const m of mines){m.arm-=dt;if(m.arm>0)continue;
  for(const e of enemies){if(e.dead)continue;if((e.x-m.x)**2+(e.y-m.y)**2<(34+e.r)**2){use(m.pl||ME());m.dead=true;boomFx(m.x,m.y,95);aoe(m.x,m.y,95,flatDmg(18),{noSteal:1});break;}}}
 use(ME());
 mines=mines.filter(m=>!m.dead);
 for(const t of turrets){use(t.pl||ME());const rm=rangeMul();if(!t.perm)t.life-=dt;t.cd-=dt*atkMul();t.kick=Math.max(0,t.kick-dt*6);
  if(t.cd<=0){const tg=nearest(t.x,t.y,300*rm*(t.rg||1));if(tg){t.cd=t.fcd||0.7;t.a=Math.atan2(tg.y-t.y,tg.x-t.x);t.kick=1;
   const off=t.dbl?[-5,5]:[0];for(const o of off){shoot(t.x+Math.cos(t.a)*16-Math.sin(t.a)*o,t.y+Math.sin(t.a)*16+Math.cos(t.a)*o,t.a,600,300*rm*(t.rg||1),t.dmg,{col:t.col,tier:t.tier||1,st:'tbolt',glow:(t.tier||1)>=3?tierGlow[t.tier]:GLOW.warm,pierce:FX.pierce||0,r:4,opts:{col:t.col,critB:t.critB||0,sx:t.x,sy:t.y}});}}else t.cd=0.12;}}
 use(ME());

 for(const p of pickups){

  if(!tp)continue;
  const dx=tp.P.x-p.x,dy=tp.P.y-p.y,d=bd||1;

   if(p.type==='coin'){run.gold+=p.v;run.earned+=p.v;run.coinPick+=p.v;
    while(run.coinPick>=20){run.coinPick-=20;if(FX.mine)for(let k=0;k<FX.mine;k++)if(mines.length<14)mines.push({pl:CUR,x:P.x+rand(-10,10),y:P.y+rand(-10,10),arm:0.5});}}

 use(ME());

function newW(key,tier){return {id:run.nextId++,key,tier,t:0.3};}
// picks: [{hero,skin,weapon}] — one per player (index = player id)
function newRun(picks){
 picks=picks||[{hero:HEROES[selHero].key,skin:selSkin,weapon:selWeapon}];
 G={diff:selDiff,wave:0,map:selMap<0?pick(MAPS).key:MAPS[selMap].key,bosses:shuffle(BOSSES.map(b=>b.key)).slice(0,2),victory:false,waveDur:20,coins:[]};
 CUR=null;PL=picks.map((pk,i)=>makePlayer(i,newPlayerRun(pk.hero,pk.skin)));
 for(let i=0;i<PL.length;i++){use(PL[i]);run.weapons.push(newW(picks[i].weapon||(HEROES.find(h=>h.key===picks[i].hero)||HEROES[0]).weapon,1));computeStats();}
 use(ME());
 setupMap(G.map);
 if(NET.role==='host')netStartRun();
 startWave();
}

 tray.innerHTML=run.weapons.map(w=>`<div class="tw t${w.tier}" title="${WEAPONS[w.key].name} · ${TIER_N[w.tier]}"><img src="${wic(w.key,w.tier)}" alt=""><i></i></div>`).join('');
 trayEls=[...tray.children];
}
function spawnPos(i,n){return n<2?[WORLD.w/2,WORLD.h/2]:[WORLD.w/2+(i?40:-40),WORLD.h/2];}
function startWave(){
 run.wave++;state='battle';paused=false;abandonArm=hubArm=false;run.victory=false;
 for(const p of PL){
  use(p);computeStats();run.hp=S.hp;p.down=false;p.ready=false;p.rv=0;p.rvk=0;p.revives=0;p.reviving=null;
  [P.x,P.y]=spawnPos(p.id,PL.length);P.inv=1;P.moving=false;
  dodgeBuff=0;regenAcc=0;stealPool=0;stealClock=0;
  for(const w of run.weapons){const same=run.weapons.filter(x=>x.key===w.key);w.dup=same.indexOf(w);w.dupN=same.length;w.t=rand(0,0.15)+wCD(w)*w.dup/w.dupN;
   if(w.key==='orbit'){const n=w.tier+1+(w.tier===4?2:0);w.ang=w.dup*TAU/(n*w.dupN);}}
 }
 use(ME());hpGhost=S.hp;
 enemies=[];spawns=[];projs=[];ebul=[];fxs=[];puddles=[];mines=[];turrets=[];texts=[];delayed=[];resetHazards();
 pickups=run.coins.map(c=>({type:'coin',x:c.x,y:c.y,v:c.v,mag:false,ph:Math.random()*TAU}));
 waveTimer=run.wave>=FINAL_WAVE?Infinity:(run.wave===ELITE_WAVE?45:Math.min(55,20+run.wave*2.5));run.waveDur=waveTimer;
 spawnT=0.6;fairyT=rand(5,9);
 for(const p of PL){use(p);for(let k=0;k<(FX.miniTurret||0);k++){const a=k*2.1+p.id;turrets.push({pl:p,x:P.x+Math.cos(a)*55,y:P.y+Math.sin(a)*55,life:1,max:1,cd:0.5,dmg:flatDmg(5),dbl:false,perm:true,a:0,col:C.t2,kick:0});}}
 use(ME());
 let bn;
 if(run.wave===ELITE_WAVE||run.wave===FINAL_WAVE){
  const elite=run.wave===ELITE_WAVE,key=run.bosses[elite?0:1];
  delayed.push({t:1.2,fn:()=>{const b=makeBoss(key,elite);enemies.push(b);if(b.segs)enemies.push(...b.segs);boomFx(b.x,b.y,b.r+60);shake=0.4;}});
  bn=elite?'精英首领来袭':'最终首领';banner(bn);
 }else{bn='第 '+run.wave+' 波';banner(bn,900);}
 if(!FLOOR)setupMap(run.map||'forge');
 $('#hudPor').src=porOf();$('#dial').classList.toggle('boss',run.wave>=FINAL_WAVE);
 buildTray();show(null);$('#hud').hidden=false;

function endWave(){
 // chests left on the ground are dealt out to the players in turn
 let k=0;for(const p of pickups)if(p.type==='chest'){PL[k%PL.length].run.chests.push(p.tier);k++;}
 // 地上剩下的金币：每枚交给离得最近的存活玩家，收 70%
 const swept=PL.map(()=>0),alv=PL.filter(p=>!p.down);
 for(const c of pickups){if(c.type!=='coin')continue;let best=null,bd=Infinity;for(const p of (alv.length?alv:PL)){const d=Math.hypot(p.P.x-c.x,p.P.y-c.y);if(d<bd){bd=d;best=p;}}
  const v=c.v*HELP.sweep;swept[PL.indexOf(best)]+=Math.floor(v)+(Math.random()<v%1?1:0);}
 run.coins=[];
 for(const p of PL){use(p);
  const sw=swept[PL.indexOf(p)];run.gold+=sw;run.earned+=sw;
  const harvest=Math.round(Math.max(0,Math.round(S.harvest))+BAL.baseInc+run.wave*BAL.incPerWave);
  const interest=FX.interest?Math.min(30*FX.interest,Math.floor(run.gold*0.1*FX.interest)):0;
  run.gold+=harvest+interest;run.earned+=harvest+interest;p.summary={harvest,interest,swept:sw};p.ready=false;
  run.freeUsed=false;run.rerollCost=1+Math.floor(run.wave*0.6);run.lvRerollCost=2+Math.floor(run.wave/2);run.lvChoices=null;run.chestItem=null;
  rollShop();ensurePrepChoices();}
 use(ME());lastSummary=ME().summary;
 enemies=[];spawns=[];projs=[];ebul=[];puddles=[];mines=[];turrets=[];texts=[];delayed=[];fxs=[];joy=null;emines=[];hz.carts=[];hz.strikes=[];
 state='prep';

}

function togglePause(){

/* ================= shop ================= */
function rollTier(){
 const w=run.wave,L=1+S.luck/100,r=Math.random();
 const p4=Math.max(0,(w-8)*0.012)*L,p3=Math.max(0,(w-3)*0.03)*L,p2=Math.min(0.6,0.12+w*0.035)*L;
 return r<p4?4:r<p4+p3?3:r<p4+p3+p2?2:1;
}
function price(kind,t){let p=(kind==='w'?[0,18,40,72,120]:[0,16,32,60,98])[t]*(1+run.wave*BAL.priceScale);if(H.key==='merchant')p*=0.85;return Math.max(1,Math.round(p));}
function itemPool(t){let pool=ITEMS.filter(it=>it.t===t&&!(it.u&&run.items.includes(it.n)));if(!pool.length)pool=ITEMS.filter(it=>it.t===1);return pool;}
function makeOffer(){
 const t=rollTier();
 if(Math.random()<0.38){const owned=run.weapons.map(w=>w.key);const key=owned.length&&Math.random()<0.45?pick(owned):pick(WKEYS);return {kind:'w',key,tier:t,price:price('w',t),locked:false,sold:false};}
 const it=pick(itemPool(t));return {kind:'i',name:it.n,tier:it.t,price:price('i',it.t),locked:false,sold:false};
}
function rollShop(){const old=run.shop||[];run.shop=[0,1,2,3].map(i=>old[i]&&old[i].locked&&!old[i].sold?old[i]:makeOffer());helpOffer();}
// 逆风补给：生命偏低时，商店至少有一件加生命上限的道具
function helpOffer(){
 if(!lowHp()||run.shop.some(o=>!o.sold&&o.kind==='i'&&((ITEM_BY[o.name].s||{}).hp||0)>0))return;
 const i=[3,2,1,0].find(j=>!run.shop[j].locked&&!run.shop[j].sold);if(i==null)return;
 const it=ITEM_BY[run.wave>=4?'生命泉':'铜护符'];run.shop[i]={kind:'i',name:it.n,tier:it.t,price:price('i',it.t),locked:false,sold:false,help:true};
}
const canAddWeapon=(key,tier)=>run.weapons.length<run.maxSlots||run.weapons.some(w=>w.key===key&&w.tier===tier&&w.tier<4);
const sellValue=w=>Math.round(price('w',w.tier)*(H.key==='merchant'?0.7:0.4));
function rollLv(){
 const L=1+S.luck/100,lv=run.level;
 return shuffle(LVPOOL.slice()).slice(0,4).map(([k,vals])=>{const r=Math.random(),p4=Math.max(0,(lv-10)*0.012)*L,p3=Math.max(0,(lv-4)*0.025)*L,p2=Math.min(0.55,0.15+lv*0.03)*L;
  const t=r<p4?4:r<p4+p3?3:r<p4+p3+p2?2:1;return {k,t,v:vals[t-1]};}).map((c,i,a)=>{
  if(i===3&&lowHp()&&!a.some(x=>x.k==='hp')){const t=Math.max(2,c.t);return {k:'hp',t,v:LVPOOL.find(x=>x[0]==='hp')[1][t-1],help:true};}return c;});
}

function prepAct(act,i){

  case 'lv':{const c=run.lvChoices&&run.lvChoices[i];if(!c||run.pendingLevels<=0)break;run.lv[c.k]=(run.lv[c.k]||0)+c.v;run.pendingLevels--;run.lvChoices=null;break;}

  case 'take':if(!run.chestItem)break;run.items.push(run.chestItem);run.chests.shift();run.chestItem=null;break;
  case 'recycle':{if(!run.chestItem)break;const it=ITEM_BY[run.chestItem];run.gold+=Math.round(price('i',it.t)*0.5);run.chests.shift();run.chestItem=null;break;}
  case 'reroll':{const rc=FX.freeReroll&&!run.freeUsed?0:run.rerollCost;if(run.gold<rc)break;run.gold-=rc;if(rc===0)run.freeUsed=true;else run.rerollCost+=Math.max(1,Math.floor(run.wave/3));
   run.shop=run.shop.map(o=>o.locked&&!o.sold?o:makeOffer());helpOffer();break;}
  case 'lock':{const o=run.shop[i];if(o)o.locked=!o.locked;break;}
  case 'buy':{const o=run.shop[i];if(!o||o.sold||run.gold<o.price)break;
   if(o.kind==='w'){
    if(run.weapons.length<run.maxSlots)run.weapons.push(newW(o.key,o.tier));

   }else run.items.push(o.name);
   run.gold-=o.price;o.sold=true;o.locked=false;break;}
  case 'merge':{const w=run.weapons[i];if(!w)break;const j=run.weapons.findIndex((x,k)=>k!==i&&x.key===w.key&&x.tier===w.tier);if(j<0||w.tier>=4)break;
   run.weapons.splice(j,1);w.tier++;msg=`${WEAPONS[w.key].name} 合成为${TIER_N[w.tier]}阶${w.tier===4?'，解锁特殊效果':''}`;break;}
  case 'sell':{if(run.weapons.length<=1||!run.weapons[i])break;const w=run.weapons[i];run.gold+=sellValue(w);run.weapons.splice(i,1);break;}

 else if(k==='swamp'){rr(ctx,o.x-o.r*0.7,o.y-o.r*0.2,o.r*1.4,o.r*0.9,4);fs(ctx,metal(ctx,o.x,o.y,o.r,'#6a746c'),1.8);

/* ================= loop ================= */
let last=performance.now();
function frame(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(state==='battle'&&run){if(NET.role==='guest')guestUpdate(dt);else if(!paused)update(dt);}
 if(NET.role==='host'&&state==='battle'&&connected()&&PL.length>1){NET.sT-=dt;if(NET.sT<=0){NET.sT=NET.snapInt;netSnapshot();}}
 if(run&&state==='battle'){hud();
  const me=ME();if(me&&!me.down&&run.hp>0&&run.hp<S.hp*0.3&&!paused){SFX.beatT-=dt;if(SFX.beatT<=0){SFX.beatT=run.hp<S.hp*0.15?0.75:1.05;sfx('beat');}}else SFX.beatT=0.3;}
 draw(dt);
 requestAnimationFrame(frame);
}

/* ================= boot ================= */
function snapshot(){return {selHero,selDiff,selWeapon,selMap,selSkin};}
try{window.claude?.hot?.snapshot?.(snapshot);}catch(e){}
function start(data){
 data=data||{};
 buildIcons();buildProps();buildCoin();buildSprites();sndSync();
 for(const h of HEROES)PORTRAIT[h.key]=makePortrait(h.key,120);
 if(typeof data.selHero==='number')selHero=data.selHero;
 if(typeof data.selDiff==='number')selDiff=data.selDiff;
 if(typeof data.selMap==='number')selMap=data.selMap;
 if(data.selSkin===0||data.selSkin===1)selSkin=data.selSkin;
 if(data.selWeapon&&WEAPONS[data.selWeapon])selWeapon=data.selWeapon;
 renderMenu();show('menu');
 requestAnimationFrame(t=>{last=t;frame(t);});
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
