<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="完美世界OL"><meta name="theme-color" content="#100d0a">
<title>完美世界OL · 文字版</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d0a;--bg2:#17130f;--pan:#1d1813;--pan2:#251f18;--line:#3a3024;--line2:#4e4130;--gold:#d4ad62;--gold2:#f0d79a;--tx:#e8dfcc;--dim:#9b907c;--dim2:#6f6656;--red:#e0604f;--hp:#d0483c;--mp:#3f8fd8;--exp:#c9a442;--grn:#7fd36f;
  --sa:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--ff:'Noto Serif SC','Songti SC','STSong','SimSun',serif;--fh:'Ma Shan Zheng','STKaiti','KaiTi',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--ff);font-size:15px;line-height:1.65;overflow:hidden;-webkit-text-size-adjust:100%}
body{background:radial-gradient(ellipse at 50% -10%,#2a2218 0%,#0f0d0a 60%) fixed}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
b{color:var(--gold2)}
.dim{color:var(--dim)}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:var(--st) var(--sr) 0 var(--sa)}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);background:linear-gradient(#1f1a14,#16120e);min-height:44px}
#top .srv{font-family:var(--fh);font-size:20px;color:var(--gold);letter-spacing:2px;white-space:nowrap}
#top .on{font-size:12px;color:var(--dim);white-space:nowrap}
#top .on i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5fd36a;margin-right:4px;box-shadow:0 0 6px #5fd36a}
#top .sp{flex:1}
.tb{background:none;border:1px solid transparent;border-radius:8px;padding:4px 8px;font-size:13px;color:var(--tx);position:relative;white-space:nowrap;min-height:34px}
.tb:hover{border-color:var(--line2);background:#ffffff08}
.tb .dot{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.tb.net{color:#8fd0ff}
#stat{display:none}
/* ---------- layout ---------- */
#main{display:grid;grid-template-columns:290px 1fr 330px;min-height:0}
#left,#right{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#00000022}
#right{border-right:0;border-left:1px solid var(--line)}
#mid{min-height:0;display:flex;flex-direction:column;position:relative}
#bnav{display:none}
.tabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;font-size:14px;color:var(--dim);white-space:nowrap}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
.tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);vertical-align:top;margin-left:2px}
.pbody{flex:1;min-height:0;overflow:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
/* ---------- location banner ---------- */
#banner{position:relative;flex:none;height:132px;overflow:hidden;border-bottom:1px solid var(--line)}
#banner canvas{position:absolute;inset:0;width:100%;height:100%}
#banner .nm{position:absolute;left:16px;bottom:10px;font-family:var(--fh);font-size:34px;color:#f4ead2;text-shadow:0 2px 8px #000,0 0 2px #000;line-height:1}
#banner .ar{position:absolute;left:18px;top:10px;font-size:12px;color:#e8dcc0cc;text-shadow:0 1px 3px #000;letter-spacing:1px}
#banner .q{position:absolute;right:12px;top:8px;max-width:58%;font-size:12.5px;line-height:1.45;color:#f2e6c8;background:#0c0a08b8;border:1px solid #d4ad6255;border-radius:8px;padding:6px 9px;cursor:pointer;text-align:left}
#banner .q b{color:var(--gold)}
#banner .q .go{color:#8fd0ff;margin-left:6px;white-space:nowrap}
/* ---------- log ---------- */
#log{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 18px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.ln{margin:0 0 8px;animation:fade .35s both}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.ln.dim{color:var(--dim);font-size:14px}
.ln.loc{margin-top:14px;color:#d8cfbb}
.lochead{font-family:var(--fh);font-size:24px;color:var(--gold2);line-height:1.3;margin-bottom:2px}
.lochead span{font-family:var(--ff);font-size:12px;color:var(--dim);margin-left:10px}
.ln.sys{color:#f0d79a;border-left:3px solid var(--gold);padding-left:9px}
.ln.tip{color:#9fd4ff;font-size:14px;border-left:3px solid #4a8ad0;padding-left:9px}
.ln.quest{color:#f3c56a;font-size:14px}
.ln.loot{color:#c9e8b8;font-size:14px}
.ln.enc{color:#f2c8a8}
.ln.say{padding:2px 0}
.ln.say .who{color:var(--gold);font-weight:700;margin-right:6px}
.ln.say.mine .who{color:#9fd4ff}
.ln.nar{color:#e2d8c2;font-style:normal}
.ln.bat{font-size:14px;margin:0 0 3px;color:#d9cfbb}
.lvup{color:#ffd96a!important}
.it{color:#e8e0c8}.gold{color:#f0c850}.exp{color:#c9a442}
.pname{font-weight:700}.pname.real{color:#8fd0ff}
.qnew{color:#ffd068;font-weight:700}
.warn{color:#ff9a5a}
/* battle log */
.bt{display:block;text-align:center;font-family:var(--fh);font-size:22px;color:var(--gold2);margin:6px 0}
.bt.win{color:#ffd96a}.bt.lose{color:#ff7a6a}
.rd{display:block;color:var(--dim2);font-size:12px;text-align:center;margin-top:6px}
.foe{color:#ff9a8a;font-weight:700}.pc{color:#9fd4ff;font-weight:700}.ally{color:#a8e6a0;font-weight:700}
.sk{color:#ffd88a}.dmg{color:#ff8a6a;font-weight:700}.crit{color:#ffcf3a;font-weight:700;font-size:1.08em}.heal{color:#7fe08a;font-weight:700}.miss{color:#9ab}.die{color:#ff5a4a}
.st{font-size:12px;border:1px solid currentColor;border-radius:4px;padding:0 3px}
/* ---------- dialog ---------- */
#dlg{display:none;flex:none;border-top:1px solid var(--line2);background:linear-gradient(#211b14,#17130f);padding:12px 16px calc(12px + var(--sb));max-height:58%;overflow:auto}
#dlg.on{display:block}
#dlg .who{font-family:var(--fh);font-size:22px;color:var(--gold);line-height:1.2;margin-bottom:4px}
#dlg .who .ic{font-size:20px;margin-right:6px}
#dlg .tx{font-size:16px;line-height:1.75;min-height:2.4em}
#dlg .nx{text-align:right;color:var(--dim);font-size:12px;margin-top:4px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
#dlg .ch{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.chb{text-align:left;background:#2a2219;border:1px solid var(--line2);border-radius:9px;padding:10px 14px;font-size:15px;line-height:1.5;min-height:44px}
.chb:hover{border-color:var(--gold);background:#33291e}
.chb:disabled{opacity:.4;cursor:not-allowed}
.chb::before{content:'▸ ';color:var(--gold)}
/* ---------- actions ---------- */
#acts{flex:none;border-top:1px solid var(--line);background:#14110dee;padding:10px 12px calc(10px + var(--sb));max-height:46%;overflow:auto}
.arow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:7px}
.arow:last-child{margin-bottom:0}
.alab{font-size:11px;color:var(--dim2);margin:0 0 4px;letter-spacing:1px}
.ab{background:linear-gradient(#2c241a,#221c15);border:1px solid var(--line2);border-radius:9px;padding:7px 13px;font-size:14.5px;min-height:42px;min-width:44px;line-height:1.25}
.ab:hover{border-color:var(--gold)}
.ab.main{background:linear-gradient(#5a4220,#3e2e17);border-color:#a8843e;color:#ffe9b8;font-weight:700}
.ab.q{border-color:#c9963c;color:#ffd77a}
.ab.dir{min-width:92px}
.ab.dir small{display:block;font-size:11px;color:var(--dim);font-weight:400}
.ab.npc{color:#e8d6b0}
.ab.wb{border-color:#e05a3a;color:#ffb08a;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 12px #e05a3a88}}
.ab:disabled{opacity:.38;cursor:not-allowed}
/* ---------- battle board ---------- */
#board{display:none;flex:none;padding:10px 12px 6px;border-bottom:1px solid var(--line);background:linear-gradient(#1c120f,#140f0c)}
#board.on{display:block}
.side{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.side+.side{margin-top:8px;padding-top:8px;border-top:1px dashed #3a302488}
.uc{position:relative;width:150px;background:#221a14;border:1px solid var(--line2);border-radius:9px;padding:6px 8px;font-size:13px;line-height:1.35;cursor:pointer;transition:transform .12s}
.uc.foe{border-color:#6a3328}
.uc.sel{outline:2px solid var(--gold);outline-offset:1px}
.uc.me{border-color:#4a7ab0}
.uc.dead{opacity:.35;filter:grayscale(1)}
.uc .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc .n small{font-weight:400;color:var(--dim);margin-left:3px}
.bar{height:7px;background:#00000066;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--hp);transition:width .35s}
.bar.mp i{background:var(--mp)}.bar.exp i{background:var(--exp)}
.uc .hpn{font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
.uc .sts{min-height:16px;font-size:11px;margin-top:2px}
.uc .sts span{margin-right:3px}
.uc .int{font-size:11.5px;color:#ffb48a;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc .int.chg{color:#ff6a4a;font-weight:700}
.uc.hit{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.uc .acted{position:absolute;right:6px;top:5px;font-size:11px;color:#7fd36f}
.skb{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:70px;min-height:54px;padding:5px 8px;background:linear-gradient(#2e2519,#211a13);border:1px solid var(--line2);border-radius:10px;font-size:13px;line-height:1.2}
.skb .i{font-size:20px}
.skb .c{font-size:10.5px;color:#8fc0ff}
.skb .cd{position:absolute;inset:0;background:#000000aa;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:700}
.skb:disabled{opacity:.45}
.skb:hover:not(:disabled){border-color:var(--gold)}
.timer{font-size:12px;color:var(--dim);text-align:center;margin-bottom:5px}
/* ---------- panels ---------- */
.card{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-family:var(--fh);font-weight:400;font-size:20px;color:var(--gold)}
.card h4{margin:6px 0 4px;font-size:14px;color:var(--gold2)}
.row{display:flex;align-items:center;gap:8px}
.row .sp{flex:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:13.5px}
.kv span{color:var(--dim)}
.me-hd{display:flex;gap:10px;align-items:center}
.avatar{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:radial-gradient(#3a2f22,#1a1510);border:2px solid var(--gold);flex:none}
.me-hd .nm{font-weight:700;font-size:17px}
.me-hd .sub{font-size:12px;color:var(--dim)}
.pw{font-family:var(--fh);font-size:22px;color:#ffcf6a}
.bars{font-size:11px;color:var(--dim)}
.bars .bar{height:9px;margin:1px 0 4px}
.sb{background:#2a2219;border:1px solid var(--line2);border-radius:7px;padding:4px 10px;font-size:13px;min-height:34px}
.sb:hover{border-color:var(--gold)}
.sb.pri{background:linear-gradient(#5a4220,#3e2e17);border-color:#a8843e;color:#ffe9b8}
.sb:disabled{opacity:.4}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13.5px;line-height:1.4}
.li .ic{font-size:20px;width:26px;text-align:center;flex:none}
.li .t{flex:1;min-width:0}
.li .t small{display:block;color:var(--dim);font-size:12px}
.li .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.eqslot{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px dashed var(--line2);border-radius:8px;margin-bottom:6px;font-size:13.5px;min-height:44px}
.af{font-size:11.5px;color:#9fd4ff}
.pill{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;border:1px solid var(--line2);color:var(--dim);margin-right:4px}
/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.chlist{flex:1;min-height:0;overflow:auto;font-size:13.5px;line-height:1.5;padding:4px 2px}
.cm{margin:0 0 4px;word-break:break-word}
.cm .c{font-size:11px;padding:0 4px;border-radius:3px;margin-right:4px;background:#333;color:#ddd}
.cm .c.world{background:#4a3a1c;color:#f0d08a}.cm .c.near{background:#2a3a2a;color:#a8e0a0}.cm .c.party{background:#1e3450;color:#9fd4ff}.cm .c.guild{background:#3a2448;color:#d8a8ff}.cm .c.sys{background:#5a2018;color:#ffb8a0}
.cm .f{font-weight:700;margin-right:3px;cursor:pointer}
.cm.me .f{color:#9fd4ff}
.chin{display:flex;gap:5px;padding-top:6px;flex:none}
.chin select,.chin input{background:#120f0c;border:1px solid var(--line2);color:var(--tx);border-radius:7px;padding:6px 8px;font-family:inherit;font-size:15px;min-height:38px}
.chin input{flex:1;min-width:0}
#ticker{display:none}
/* map */
.map{position:relative;margin:4px auto 6px}
.mn{position:absolute;transform:translate(-50%,-50%);background:#2a2219;border:1px solid var(--line2);border-radius:8px;padding:3px 6px;font-size:12px;white-space:nowrap;cursor:pointer;line-height:1.25;text-align:center}
.mn.cur{background:#5a4220;border-color:var(--gold);color:#fff;font-weight:700}
.mn.q::after{content:'★';color:#ffd05a;position:absolute;right:-8px;top:-9px;font-size:13px}
.mn.wb{border-color:#e05a3a}
.mn.unk{opacity:.45}
.mn small{display:block;color:var(--dim);font-size:10px}
/* modal / sheet */
#modal{position:fixed;inset:0;z-index:50;display:none;background:#000000aa;padding:calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sa));overflow:auto;align-items:safe center;justify-content:center}
#modal.on{display:flex}
#modal .box{width:min(640px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;margin:auto;box-shadow:0 10px 40px #000}
#modal .mh{display:flex;align-items:center;margin-bottom:8px}
#modal .mh h2{margin:0;flex:1;font-family:var(--fh);font-weight:400;font-size:26px;color:var(--gold)}
#modal .x{background:none;border:0;font-size:26px;color:var(--dim);min-width:44px;min-height:44px}
#toast{position:fixed;left:50%;top:calc(56px + var(--st));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#000000dd;border:1px solid var(--line2);color:#f3e8cc;padding:7px 14px;border-radius:20px;font-size:14px;animation:fade .25s both;max-width:86vw}
/* title */
#title{position:fixed;inset:0;z-index:40;display:flex;align-items:safe center;justify-content:center;overflow:auto;padding:calc(16px + var(--st)) 16px calc(16px + var(--sb))}
#title canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
#title .tbx{width:min(560px,100%);text-align:center;margin:auto}
#title h1{font-family:var(--fh);font-weight:400;font-size:84px;line-height:1;margin:0;color:#f6e6bc;text-shadow:0 4px 18px #000,0 0 30px #d4ad6244;letter-spacing:6px}
#title h1 small{font-size:30px;color:var(--gold);letter-spacing:2px;margin-left:6px}
#title .sub{color:#d8c9a8;margin:10px 0 22px;font-size:15px;text-shadow:0 1px 4px #000}
#title .btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.big{min-width:250px;min-height:52px;font-size:18px;border-radius:12px;background:linear-gradient(#5e4422,#3e2d16);border:1px solid #b18d48;color:#ffeac0;font-weight:700;padding:8px 20px}
.big.sec{background:#1c1712cc;border-color:var(--line2);color:var(--tx);font-weight:400;font-size:16px}
.big:hover{filter:brightness(1.15)}
#title .note{margin-top:18px;font-size:12.5px;color:#b8ab90;text-shadow:0 1px 3px #000}
.hub{position:absolute;left:calc(12px + var(--sa));top:calc(10px + var(--st));background:#00000088;border:1px solid var(--line2);color:var(--tx);border-radius:10px;padding:8px 14px;font-size:14px;min-height:40px}
.clsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.clsc{background:#1c1712dd;border:2px solid var(--line2);border-radius:12px;padding:12px 8px;cursor:pointer;text-align:center}
.clsc.on{border-color:var(--gold);background:#3a2c18dd}
.clsc .i{font-size:36px}
.clsc .n{font-family:var(--fh);font-size:26px;color:var(--gold2)}
.clsc .r{font-size:12px;color:var(--dim)}
.clsc p{font-size:12.5px;text-align:left;margin:6px 0 0;color:#d6cbb2;line-height:1.5}
.namein{width:100%;background:#120f0cdd;border:1px solid var(--line2);color:var(--tx);border-radius:10px;padding:10px 12px;font-size:18px;font-family:inherit;text-align:center}
/* ---------- narrow & medium layouts (set by JS on body) ---------- */
body.mid #main{grid-template-columns:1fr 330px}
body.mid #left{display:none}
body.narrow #main{grid-template-columns:1fr}
body.narrow #left,body.narrow #right{display:none}
body.narrow #bnav{display:flex;border-top:1px solid var(--line);background:#14110d;padding:0 var(--sr) var(--sb) var(--sa)}
#bnav button{flex:1;background:none;border:0;color:var(--dim);font-size:12px;padding:6px 0 5px;min-height:52px;position:relative;line-height:1.2}
#bnav button .i{display:block;font-size:20px}
#bnav button.on{color:var(--gold2)}
#bnav button .dot{position:absolute;top:6px;left:58%;width:8px;height:8px;border-radius:50%;background:var(--red)}
body.narrow #sheet{position:absolute;inset:0;z-index:20;background:var(--bg2);display:none;flex-direction:column}
body.narrow #sheet.on{display:flex}
#sheet{display:none}
body.narrow #ticker{display:block;flex:none;font-size:12.5px;line-height:1.4;padding:5px 12px;background:#0c0a08;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d8cdb6;cursor:pointer}
body.narrow #top{padding:4px 8px;gap:4px;min-height:40px}
body.narrow #top .srv{font-size:17px}
body.narrow #top .tb{padding:3px 6px;font-size:12px}
body.narrow #top .tb .lb{display:none}
body.narrow #stat{display:flex;flex:1;min-width:0;gap:6px;align-items:center}
#stat .lv{font-size:12px;white-space:nowrap;color:var(--gold2)}
#stat .bars2{flex:1;min-width:60px}
#stat .bar{height:6px;margin:2px 0}
body.narrow #top .srv,body.narrow #top .on{display:none}
body.narrow #banner{height:96px}
body.narrow #banner .nm{font-size:27px;left:12px;bottom:8px}
body.narrow #banner .ar{left:13px;top:7px}
body.narrow #banner .q{max-width:62%;font-size:12px;padding:5px 7px}
body.narrow #log{padding:10px 12px 14px}
body.narrow .uc{width:calc(50% - 4px);font-size:12.5px;padding:5px 7px}
body.narrow .skb{min-width:62px;min-height:50px;font-size:12px}
body.narrow #title h1{font-size:60px}
body.narrow #title h1 small{display:block;font-size:24px;margin:6px 0 0}
body.narrow .clsrow{grid-template-columns:1fr;gap:7px}

<script>

/* ================= 完美世界OL · 文字版 — core =================
   single-file text MMO-flavoured RPG.  save keys use the prefix `wanmeiol.` */
'use strict';
const $ = id => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const HUB = /\/wanmeiol\/(index\.html)?$/.test(location.pathname);
const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const PREFIX = 'wanmeiol.';
const store = {
  get(k, d) { try { const v = localStorage.getItem(PREFIX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(PREFIX + k); } catch (e) { } },
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const wpick = (list, wf = x => x.w || 1) => { let s = 0; for (const x of list) s += wf(x); let r = Math.random() * s; for (const x of list) { r -= wf(x); if (r <= 0) return x; } return list[list.length - 1]; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// seeded hash rng — used where several clients must agree (who is standing where this minute, etc.)
const hash = (...xs) => { let h = 2166136261; for (const x of xs) { const s = String(x); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } h ^= 0x9e37; } h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; return (h >>> 0) / 4294967296; };
const srng = seed => { let s = Math.floor(hash(seed) * 4294967296) || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n >= 1e8 ? (n / 1e8).toFixed(1) + '亿' : n >= 1e4 ? (n / 1e4).toFixed(n >= 1e5 ? 0 : 1) + '万' : String(Math.round(n));
const now = () => Date.now();
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const hhmm = (t = now()) => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const uid = () => Math.random().toString(36).slice(2, 9);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

/* ---------- settings ---------- */
const SET = Object.assign({ mute: false, vol: 0.6, fast: false, chatWorld: true, autoFollow: true }, store.get('set', {}));
const saveSet = () => store.set('set', SET);

/* ---------- synth sfx (Web Audio, no files) ---------- */
const AU = { ctx: null, master: null, noise: null, last: {} };
function audioInit() {
  if (AU.ctx) return; try { const C = new (window.AudioContext || window.webkitAudioContext)(); AU.ctx = C; const comp = C.createDynamicsCompressor(); AU.master = C.createGain(); AU.master.gain.value = SET.vol; AU.master.connect(comp); comp.connect(C.destination);
    const b = C.createBuffer(1, C.sampleRate, C.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; AU.noise = b; } catch (e) { }
}
function tone(type, f0, f1, dur, vol = 0.2, delay = 0, lp = 0) {
  const C = AU.ctx; if (!C || SET.mute) return; const t = C.currentTime + delay, o = C.createOscillator(), g = C.createGain(); o.type = type; const j = 1 + (Math.random() - 0.5) * 0.08;
  o.frequency.setValueAtTime(f0 * j, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1 * j), t + dur); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let n = o; if (lp) { const f = C.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); n = f; } n.connect(g); g.connect(AU.master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol = 0.2, type = 'lowpass', f0 = 1200, f1 = 300, Q = 1, delay = 0) {
  const C = AU.ctx; if (!C || SET.mute) return; const t = C.currentTime + delay, s = C.createBufferSource(), f = C.createBiquadFilter(), g = C.createGain(); s.buffer = AU.noise; f.type = type; f.Q.value = Q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f); f.connect(g); g.connect(AU.master); s.start(t); s.stop(t + dur + 0.05);
}
function sfx(k) {
  const t = performance.now(); if (AU.last[k] && t - AU.last[k] < 60) return; AU.last[k] = t;
  switch (k) {
    case 'click': tone('triangle', 660, 520, 0.05, 0.06); break;
    case 'hit': noise(0.12, 0.25, 'lowpass', 1800, 200); tone('square', 160, 70, 0.1, 0.08, 0, 900); break;
    case 'crit': noise(0.18, 0.35, 'lowpass', 3000, 200); tone('sawtooth', 300, 60, 0.18, 0.12, 0, 1400); break;
    case 'magic': tone('sine', 520, 1300, 0.25, 0.12); tone('triangle', 780, 1600, 0.2, 0.06, 0.05); break;
    case 'heal': tone('sine', 520, 780, 0.3, 0.1); tone('sine', 780, 1040, 0.3, 0.07, 0.1); break;
    case 'miss': noise(0.1, 0.08, 'highpass', 3000, 6000); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, f, 0.22, 0.1, i * 0.09)); break;
    case 'lose': [392, 330, 262].forEach((f, i) => tone('triangle', f, f * 0.98, 0.3, 0.1, i * 0.16)); break;
    case 'level': [523, 659, 784, 1046, 1318].forEach((f, i) => tone('sine', f, f, 0.3, 0.1, i * 0.08)); break;
    case 'loot': tone('triangle', 880, 1320, 0.12, 0.08); tone('triangle', 1320, 1760, 0.12, 0.06, 0.07); break;
    case 'epic': [659, 831, 988, 1318].forEach((f, i) => tone('sine', f, f, 0.4, 0.09, i * 0.06)); break;
    case 'chat': tone('sine', 1200, 1100, 0.05, 0.03); break;
    case 'fail': tone('sawtooth', 220, 110, 0.35, 0.09, 0, 800); break;
    case 'step': noise(0.06, 0.05, 'bandpass', 500, 300, 2); break;
    case 'gold': tone('triangle', 1500, 1500, 0.06, 0.06); tone('triangle', 2000, 2000, 0.08, 0.05, 0.05); break;
  }
}

];
const EQB = Object.fromEntries(EQ_BASES.map(b => [b.id, b]));
const AFFIX = [
  { k: 'atkP', n: '攻击', f: v => '+' + Math.round(v * 100) + '%', r: [0.03, 0.08] }, { k: 'defP', n: '防御', f: v => '+' + Math.round(v * 100) + '%', r: [0.04, 0.1] },
  { k: 'hpP', n: '气血', f: v => '+' + Math.round(v * 100) + '%', r: [0.04, 0.1] }, { k: 'crit', n: '暴击', f: v => '+' + (v * 100).toFixed(1) + '%', r: [0.015, 0.045] },
  { k: 'spd', n: '身法', f: v => '+' + Math.round(v), r: [1, 4] }, { k: 'mpP', n: '符力', f: v => '+' + Math.round(v * 100) + '%', r: [0.06, 0.14] },
  { k: 'leech', n: '吸血', f: v => '+' + Math.round(v * 100) + '%', r: [0.03, 0.07] }];
const AFX = Object.fromEntries(AFFIX.map(a => [a.k, a]));
function rollRarity(bonus = 0) { const w = BAL.rarityW.map((x, i) => x * (i ? 1 + bonus * i : 1)); let s = w.reduce((a, b) => a + b), r = Math.random() * s; for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; } return 0; }
function makeEquip(baseId, rar, plus = 0) {
  const b = EQB[baseId]; const af = []; const pool = shuffle(AFFIX.slice());
  for (let i = 0; i < rar && i < pool.length; i++) { const a = pool[i]; let v = rnd(a.r[0], a.r[1]) * (1 + b.lv / 30); if (a.k === 'spd') v = Math.round(v); af.push([a.k, +v.toFixed(3)]); }
  return { u: uid(), b: baseId, r: rar, p: plus, af };
}
function rollEquip(lv, bonus = 0, minRar = 0) { // a random drop suited to level lv
  const cands = EQ_BASES.filter(b => b.lv <= lv + 1 && b.lv >= lv - 9); const b = pick(cands.length ? cands : EQ_BASES.slice(0, 3));
  return makeEquip(b.id, Math.max(minRar, rollRarity(bonus)));
}
function eqStats(e) { // stats an equipment piece adds
  const b = EQB[e.b], m = BAL.rarity[e.r].m * (1 + e.p * BAL.enhPer), s = { atk: 0, def: 0, hp: 0, crit: 0, spd: 0, atkP: 0, defP: 0, hpP: 0, mpP: 0, leech: 0 };
  if (b.atk) s.atk = Math.round(b.atk * m); if (b.def) s.def = Math.round(b.def * m); if (b.hp) s.hp = Math.round(b.hp * m); if (b.crit) s.crit = b.crit * BAL.rarity[e.r].m;
  for (const [k, v] of e.af) s[k] += v; return s;
}
const eqName = e => (e.p ? '+' + e.p + ' ' : '') + EQB[e.b].name;
const eqPrice = e => Math.round((8 + EQB[e.b].lv * 6) * (1 + e.r * e.r * 0.8) * (1 + e.p * 0.3));
const eqPower = e => { const s = eqStats(e); return Math.round(s.atk * 4 + s.def * 4 + s.hp * 0.4 + s.crit * 900 + s.spd * 12 + (s.atkP + s.defP + s.hpP) * 600 + s.mpP * 200 + s.leech * 800); };

    acts: {}, deadline: 0, kills: [], loc: spec.loc || (C && C.loc), owner: spec.owner || MYID, dungeon: spec.dungeon || null, room: spec.room ?? null, noLose: !!spec.noLose, arena: spec.arena || null, seq: 0 };

  for (const h of [{ ...myPub(), pid: MYID }, ...netHumans()]) if (h.pid !== pid && h.loc === asker.loc && !h.busy && !(h.pid === MYID && (STATE.battle || STATE.scene))) humans.push(h.pid === MYID ? { c: C, pid: MYID } : { c: h, pid: h.pid, stats: h.stats });
  spec.bots = (spec.bots || []).concat(); const B = battleCreate(spec, humans); AUTH[B.id] = { B, res: null };
  if (humans.some(h => h.pid === MYID)) { STATE.battle = B; STATE.busy = true; STATE.battleRes = null; netPub(); logLine('队友遇敌，你加入了战斗！', 'enc'); }
  battlePush(B);
}
function battleAct(act) { // my unit's choice
  const B = STATE.battle; if (!B || B.over) return; const u = B.units.find(x => x.kind === 'pc' && x.pid === MYID); if (!u || !u.alive) return;
  if (act.item && !useItem(act.item, true)) return;
  if (AUTH[B.id]) battleInput(B, u.id, act); else netSend({ t: 'bact', bid: B.id, uid: u.id, act, seq: B.seq });
  STATE.myActed = B.seq; refresh();
}
function battleInput(B, uidd, act) { if (B.over) return; B.acts[uidd] = act; if (!needInput(B).length) { battleResolve(B); battlePush(B); } else battlePush(B, true); }
function battleTimeout() { for (const k in AUTH) { const B = AUTH[k].B; if (!B.over && B.deadline && now() > B.deadline) { for (const u of needInput(B)) B.acts[u.id] = botAct(B, u); battleResolve(B); battlePush(B); } } }
function battlePush(B, quiet) { // send state to every human in it and render mine
  for (const u of humansIn(B)) if (u.pid !== MYID) netSendTo(u.pid, { t: 'b', B });
  if (STATE.battle && STATE.battle.id === B.id) { STATE.battle = B; renderBattle(quiet); }
  if (B.over) battleFinish(B);
}
function battleFinish(B) {
  if (B.done) return; B.done = true; const R = B.win ? battleRewards(B) : {};
  for (const u of humansIn(B)) { const r = Object.assign({ win: B.win, fled: !!B.fled, hp: u.hp, mp: u.mp, alive: u.alive, kills: B.kills, noLose: B.noLose, boss: B.room != null && B.dungeon && DUNGEONS[B.dungeon].rooms[B.room]?.boss ? B.dungeon : null, world: !!B.world }, R[u.pid] || {});
    if (u.pid === MYID) setTimeout(() => battleApply(r, B), window.__dbg && __dbg.instant ? 0 : 450); else netSendTo(u.pid, { t: 'bend', bid: B.id, r }); }
  delete AUTH[B.id];
}
function battleApply(r, B) { // every client applies its own result
  const s = charStats(); C.hp = clamp(Math.round(r.hp), 0, s.hpMax); C.mp = clamp(Math.round(r.mp), 0, s.mpMax);
  if (r.win) { sfx('win'); for (const [id, , boss] of r.kills || []) { C.kills[id] = (C.kills[id] || 0) + 1; C.stats.kills++; if (boss) C.stats.bosses++; storyKill(id); }
    if (r.exp) gainExp(r.exp); if (r.gold) addGold(r.gold); for (const it of r.items || []) addItem(it, 1); for (const e of r.eqs || []) addEquip(e);
    if (r.boss) { storyDungeon(r.boss); } if (C.hp <= 0) C.hp = 1; }
  else if (r.fled) { logLine('你逃了出来。', 'dim'); }
  else { sfx('lose'); C.stats.deaths++;
    if (r.noLose) { C.hp = Math.max(C.hp, Math.round(s.hpMax * 0.3)); }
    else { const loss = Math.round(BAL.expNext(C.lv) * BAL.deathExpLoss); C.exp = Math.max(0, C.exp - loss); C.hp = Math.round(s.hpMax * 0.3); C.mp = Math.round(s.mpMax * 0.3);
      logLine(`你倒下了……醒来时已经回到了${PLACES[C.home].name}。<span class="dim">（损失 ${loss} 经验）</span>`, 'sys'); if (STATE.dungeon) STATE.dungeon.failed = true; setTimeout(() => go(C.home, false, true), 300); } }
  STATE.battle = null; STATE.busy = false; STATE.lastBattle = B; netPub(); save(); refresh(); battleEndUI(r);
  const res = STATE.battleRes; STATE.battleRes = null; if (res) res(r);
}

/* ---------- dungeons ---------- */
async function enterDungeon(id) {
  const D = DUNGEONS[id]; if (STATE.battle || STATE.scene || STATE.dungeon) return; if (C.lv < D.lv - 3) { toast(`太危险了（建议 ${D.lv} 级）`); return; }
  if (!STATE.party.length && !partnersHere().length) { STATE.scene = 'match'; const c = await dungeonChoice(['一键匹配队友（推荐）', '单人挑战', '算了']); STATE.scene = null; if (c === 2) { refresh(); return; } if (c === 0) autoMatch(2); }
  STATE.dungeon = { id, room: 0, failed: false }; netPub(); logLine(`<div class="lochead">副本 · ${D.name}<span>${D.rec}</span></div>`, 'loc'); refresh();
  for (let i = 0; i < D.rooms.length; i++) {
    const R = D.rooms[i]; STATE.dungeon.room = i; refresh(); logLine(`<b>【${R.name}】</b>${R.text}`, 'enc'); await sleep(SET.fast ? 100 : 500);
    if (R.mobs) { const r = await startBattle({ mobs: R.mobs.map(m => [m, R.boss ? D.lv : Math.max(1, D.lv - 1 - (R.mobs.length > 2 ? 1 : 0))]), title: `${D.name} · ${R.name}`, flee: !R.boss, dungeon: id, room: i });
      if (!r || !r.win) { if (r && r.fled) logLine('你退出了副本。', 'dim'); STATE.dungeon = null; netPub(); refresh(); return; } }
    else if (R.event) await dungeonEvent(R.event, D);
    if (i < D.rooms.length - 1) { const c = await dungeonChoice(['原地调息，再继续深入（恢复 40% 气血和符力）', '直接继续深入', '退出副本']);
      if (c === 0) { const s = charStats(); C.hp = Math.min(s.hpMax, C.hp + s.hpMax * 0.4); C.mp = Math.min(s.mpMax, C.mp + s.mpMax * 0.4); logLine('你靠着石壁调息了一会儿。', 'dim'); refresh(); }
      if (c === 2) { STATE.dungeon = null; netPub(); refresh(); return; } }
  }
  C.dungeons[id] = (C.dungeons[id] || 0) + 1; logLine(`<b class="lvup">副本「${D.name}」通关！</b>`, 'sys');
  if (C.dungeons[id] === 1) { addGold(D.first.gold); for (const [k, n] of D.first.items) addItem(k, n); logLine('（首次通关奖励）', 'dim'); }
  STATE.dungeon = null; netPub(); save(); refresh(); setTimeout(storyPoll, 300);
}
async function dungeonEvent(k, D) {
  if (k === 'bones') { const c = await dungeonChoice(['翻一翻骨堆', '别碰，绕过去']); if (c === 0) { if (chance(0.6)) { logLine('骨堆里埋着一个猎人的皮囊，里面还有些东西。', 'enc'); addItem('herb', 2); addGold(40); if (chance(0.4)) addEquip(rollEquip(D.lv, 0.4, 1)); } else { logLine('骨堆里钻出一条青鳞蛇！', 'enc'); await startBattle({ mobs: [['snake', D.lv]], title: '骨堆里的蛇', flee: false, dungeon: D.id }); } } }
  if (k === 'chest') { const c = await dungeonChoice(['撬开铜匣', '不动它']); if (c === 0) { if (chance(0.7)) { logLine('铜匣里躺着一件古旧的宝物，被符文封得好好的。', 'enc'); addEquip(rollEquip(D.lv, 0.8, 2)); addItem('soulshard', 1); } else { logLine('铜匣上的符文一亮——是陷阱！', 'enc'); const s = charStats(); C.hp = Math.max(1, C.hp - s.hpMax * 0.25); refresh(); } } }
}
const dungeonChoice = opts => dlgChoose(opts.map(t => ({ t })));

/* ================= hand-written branching story =================
   main quest = list of steps.  A step is finished by: auto | enter (arrive at loc) | talk (npc) |
   kill (n monsters, then turn in at npc) | dungeon (clear, then turn in) | level | multi (sub-goals).
   Scenes are async scripts: say / nar / me / choose / fight / give …  */
const clsBeast = () => ({ mangniu: '莽牛', kunpeng: '鲲鹏', liushen: '柳枝' }[C.cls]);
const F = () => C.story.f;
const sub = s => s.replace(/\{name\}/g, esc(C.name)).replace(/\{cls\}/g, CLASSES[C.cls].name).replace(/\{beast\}/g, clsBeast());
// ---- script primitives (UI implemented in 50_ui) ----
const nar = t => dlgShow({ who: '', text: sub(t) });
const me = t => dlgShow({ who: C.name, text: sub(t), mine: 1 });
const say = (npc, t) => { const N = NPCS[npc]; return dlgShow({ who: N ? N.name : npc, icon: N ? N.icon : '', text: sub(t) }); };
const choose = (opts) => dlgChoose(opts.map(o => typeof o === 'string' ? { t: sub(o) } : Object.assign({}, o, { t: sub(o.t) })));
const tip = t => logLine('【指引】' + t, 'tip');
function give(id, n = 1) { addItem(id, n); }
function giveEq(base, r = 1) { addEquip(makeEquip(base, r)); }
async function fight(spec) { const r = await startBattle(Object.assign({ flee: false }, spec)); return r && r.win; }
async function fightRetry(spec, loseText) { // story boss fights: lose → offer a retry
  for (; ;) { if (await fight(Object.assign({ noLose: true }, spec))) return true; await nar(loseText || '你被打倒在地，眼前一黑……再醒来时，伤口已经被人包扎好了。');
    fullHeal(); refresh(); const c = await choose(['再来一次', '先回去变强一些']); if (c === 1) return false; }
}
const slv = (base, lo = -1, hi = 2) => clamp(C.lv, base + lo, base + hi); // scale story enemies around the player

/* ---------------- quest engine ---------------- */
const curQ = () => MAIN[C.story.q];
function questAdvance() {
  C.story.q = Math.min(MAIN.length - 1, C.story.q + 1); C.story.n = 0; C.story.subs = {}; const q = curQ(); if (q.start) q.start();
  logLine(`<span class="qnew">【主线】${q.title}</span>：${q.goal}`, 'quest'); save(); refresh(); setTimeout(storyPoll, 300);
}
async function runScene(fn) {
  if (STATE.scene) return false; STATE.scene = fn.name || 'scene'; netPub(); refresh(); let r;
  try { r = await fn(); } catch (e) { console.error(e); } finally { STATE.scene = null; dlgClose(); netPub(); save(); refresh(); }
  return r !== false;
}
async function questComplete(q) { const ok = await runScene(q.scene); if (ok && curQ() === q) questAdvance(); return ok; }
function questTalkOptions(npc) { // quest entries an NPC offers right now
  const q = curQ(), out = [];
  if (q.type === 'talk' && q.npc === npc) out.push({ t: '❗ ' + q.title, f: () => questComplete(q) });
  if ((q.type === 'kill' || q.type === 'dungeon') && q.npc === npc && questReady(q)) out.push({ t: '✔ 交付：' + q.title, f: () => questComplete(q) });
  if (q.type === 'multi') { for (const s of q.subs) if (s.type === 'talk' && s.npc === npc && !(C.story.subs || {})[s.k]) out.push({ t: '❗ ' + s.goal.split('：')[0], f: () => subComplete(q, s) }); if (q.npc === npc && questReady(q)) out.push({ t: '✔ 交付：' + q.title, f: () => questComplete(q) }); }
  for (const [id, S] of Object.entries(SIDE)) { if (S.npc !== npc || C.lv < S.minLv) continue; const st = C.side[id]; if (st === 'done') continue;
    if (!st) out.push({ t: '❔ ' + S.title, f: () => sideOffer(id) }); else if (S.need.every(([k, n]) => itemN(k) >= n)) out.push({ t: '✔ 交付：' + S.title, f: () => sideDone(id) }); }
  return out;
}
async function subComplete(q, s) { const ok = await runScene(s.scene); if (ok) { C.story.subs = C.story.subs || {}; C.story.subs[s.k] = 1; logLine(`【主线】完成：${s.goal.split('：')[0]}`, 'quest'); save(); refresh(); } }
function questReady(q) {
  if (q.type === 'kill') return C.story.n >= q.n;
  if (q.type === 'dungeon') return C.story.n >= 1;
  if (q.type === 'multi') { const subs = C.story.subs || {}; return q.subs.filter(s => s.check ? s.check() : subs[s.k]).length >= q.need; }
  return false;
}
function questGoalText() {
  const q = curQ(); let t = q.goal;
  if (q.type === 'kill') t += `（${Math.min(C.story.n, q.n)}/${q.n}）` + (questReady(q) ? ` → 回去找${NPCS[q.npc].name}` : '');
  if (q.type === 'dungeon' && questReady(q)) t += ` → 回去找${NPCS[q.npc].name}`;
  if (q.type === 'level') t += `（当前 ${C.lv} 级）`;
  if (q.type === 'multi') { const subs = C.story.subs || {}; t += '<br>' + q.subs.map(s => (s.check ? s.check() : subs[s.k]) ? `<s>${s.goal}</s>` : '· ' + s.goal).join('<br>'); if (questReady(q)) t += `<br>→ 回去找${NPCS[q.npc].name}`; }
  return t;
}
function questWhere() { // place id the quest wants you at (for the map marker and route hint)
  const q = curQ(); const npcLoc = n => Object.values(PLACES).find(p => (p.npcs || []).includes(n));
  if (q.type === 'enter') return q.loc; if (q.type === 'talk') return npcLoc(q.npc)?.id;
  if (q.type === 'kill' || q.type === 'dungeon') return questReady(q) ? npcLoc(q.npc)?.id : q.loc;
  if (q.type === 'multi') { if (questReady(q)) return npcLoc(q.npc)?.id; const subs = C.story.subs || {}; for (const s of q.subs) if (!(s.check ? s.check() : subs[s.k])) return s.loc || (s.npc && npcLoc(s.npc)?.id) || (s.k === 'arena' ? 'bc_arena' : s.k === 'bounty' ? 'bc_hall' : null); }
  return null;
}
function storyKill(mob) { const q = curQ(); if (q.type === 'kill' && q.mob === mob && C.story.n < q.n) { C.story.n++; logLine(`【主线】${q.title}：${NPCS[q.npc] ? '' : ''}${MOBS[mob].name} ${C.story.n}/${q.n}`, 'quest'); if (C.story.n >= q.n) logLine(`【主线】目标完成，回去找<b>${NPCS[q.npc].name}</b>交付。`, 'quest'); } bountyKill(mob); }
function storyDungeon(id) { const q = curQ(); if (q.type === 'dungeon' && q.dungeon === id) { C.story.n = 1; logLine(`【主线】${q.title}：完成！回去找<b>${NPCS[q.npc].name}</b>。`, 'quest'); } }
function storyItemCheck() { }
function storyLevelCheck() { setTimeout(storyPoll, 200); }
async function storyPoll() { // auto / level / enter triggers that fire without clicking
  if (!C || STATE.scene || STATE.battle || STATE.dungeon || STATE.mode !== 'play') return; const q = curQ();
  if (q.type === 'auto') return questComplete(q);
  if (q.type === 'level' && C.lv >= q.lv) return questComplete(q);
  if (q.type === 'enter' && C.loc === q.loc && !q.tried) { q.tried = 1; return questComplete(q); } // first time only; afterwards the ▶ 剧情 button retries
}
async function sideOffer(id) { const S = SIDE[id]; await runScene(async () => { await say(S.npc, S.ask); const c = await choose(['好，交给我', '下次吧']); if (c === 0) { C.side[id] = 'on'; logLine(`【支线】${S.title}：${S.need.map(([k, n]) => ITEMS[k].name + '×' + n).join('、')} → ${NPCS[S.npc].name}`, 'quest'); } }); }
async function sideDone(id) { const S = SIDE[id]; await runScene(async () => { for (const [k, n] of S.need) takeItem(k, n); await say(S.npc, S.done); S.reward(); C.side[id] = 'done'; }); }

    case 'mail': sendMail(m.m); break;
    case 'gift': if (m.item) addItem(m.item, m.n || 1); if (m.eq) addEquip(m.eq); logLine(`<b>${esc(m.from)}</b> 送给你一份礼物！`, 'loot'); sfx('loot'); save(); refresh(); break;
    case 'bye': break;
  }
}
function sendChat(ch, text) { text = text.trim().slice(0, 80); if (!text) return;
  const bots = () => { if (ch === 'party' && STATE.party.length) setTimeout(() => { const b = pick(STATE.party), f = FAKES.find(x => x.id === b.id); if (f) chatPush('party', f.name, pick(['好', '收到', '哈哈', 'ok', '冲']), { cls: f.cls }); }, rint(1000, 3000)); };
  if (ch === 'guild') { chatPush('guild', C.name, text, { me: true, cls: C.cls }); if (C.guild) setTimeout(() => { const m = FAKES.filter(f => f.guild === C.guild); if (m.length) fakeSay('guild', pick(m), pick(['哈哈哈', '+1', '是的', '同意', '会长呢？'])); }, rint(1500, 4000)); return; }
  if (NETROLE === 'guest') { netSend({ t: 'chat', m: { ch, text } }); bots(); return; } // the host echoes it back to everyone
  chatPush(ch, C.name, text, { me: true, cls: C.cls }); if (ch === 'world' || ch === 'near') fakeReply(text); bots();
}
function giftTo(pid, kind, ref) { const p = NET.roster[pid]; if (!p) return;
  if (kind === 'item') { if (!takeItem(ref, 1)) return; netSend({ t: 'gift', to: pid, item: ref, n: 1 }); }
  else { const i = C.gear.findIndex(g => g.u === ref); if (i < 0) return; const e = C.gear.splice(i, 1)[0]; netSend({ t: 'gift', to: pid, eq: e }); }
  toast(`已送给 ${p.name}`); save(); refresh(); }

/* ================= title, character creation, boot ================= */
function toTitle() {
  if (C) save(true); STATE.mode = 'title'; closeModal(); $('title').style.display = 'flex'; titleDraw();
  const sv = loadSave(); const hub = HUB ? `<button class="hub" onclick="hubBack2(this)">‹ 游戏厅</button>` : '';
  $('tbx').innerHTML = `${hub}<h1>完美世界<small>OL</small></h1><div class="sub">文字版 · ${SERVER} · 在线 ${fmt(onlineCount())} 人</div>
    <div class="btns">${sv ? `<button class="big" onclick="enterGame()">进入游戏<br><span style="font-size:13px;font-weight:400">${esc(sv.name)} · ${CLASSES[sv.cls].name} · Lv${sv.lv}</span></button>` : `<button class="big" onclick="createUI()">创建角色</button>`}
    ${sv ? `<button class="big sec" onclick="createUI()">新建角色（会覆盖存档）</button>` : ''}</div>
    <div class="note">根据辰东《完美世界》改编的文字网游。手写剧情：石村 → 大荒 → 石国边城 → 补天阁。<br>世界频道、组队、公会、交易行、强化、世界首领、虚神界排名；也可以和朋友真人联机组队。</div>`;
}
function hubBack2(b) { if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = '再点一次确认'; setTimeout(() => { b.dataset.arm = ''; b.textContent = '‹ 游戏厅'; }, 3000); return; } location.href = '../'; }
let NEWCLS = 'kunpeng';
function createUI() {
  audioInit(); const sv = loadSave();
  $('tbx').innerHTML = `<h1 style="font-size:52px">创建角色</h1><div class="sub">选择你的宝术传承</div>
    <div class="clsrow">${Object.entries(CLASSES).map(([k, K]) => `<div class="clsc ${k === NEWCLS ? 'on' : ''}" onclick="NEWCLS='${k}';createUI2()"><div class="i">${K.icon}</div><div class="n">${K.name}</div><div class="r">${K.role}</div><p>${K.desc}</p></div>`).join('')}</div>
    <input class="namein" id="nm" maxlength="8" placeholder="给自己起个名字（最多 8 个字）" value="${esc(UI.newName || '')}">
    <div class="btns" style="margin-top:12px"><button class="big" onclick="createGo()">进入大荒</button><button class="big sec" onclick="toTitle()">返回</button></div>${sv ? '<div class="note warn">注意：会覆盖现有角色 ' + esc(sv.name) + '。</div>' : ''}`;
  $('nm').oninput = e => UI.newName = e.target.value;
}
function createUI2() { UI.newName = $('nm').value; sfx('click'); createUI(); }
function createGo() {
  const n = ($('nm').value || '').trim().replace(/[<>&"]/g, ''); if (!n) { toast('起个名字吧'); return; } if (FAKE_NAMES.includes(n)) { toast('这个名字已经被人用了'); return; }
  C = newChar(n.slice(0, 8), NEWCLS); fullHeal(); C.mail.push({ id: uid(), t: now(), from: '系统', title: '开服礼包', body: `欢迎来到${SERVER}！这是给新人的一点心意。`, items: [['gift', 1]], gold: 100, read: false, got: false });
  C.mail.push({ id: uid(), t: now(), from: '系统', title: '欢迎', body: '每天记得签到、做悬赏；世界首领每 15 分钟刷新一只。遇到问题可以在世界频道问问别的玩家。', read: false, got: true });
  save(true); enterGame(true);
}
function enterGame(fresh) {
  audioInit(); if (!fresh) C = loadSave(); if (!C) return createUI(); genFakes(); fixHp();
  // offline progress: market sales while away
  if (C.savedAt) { const mins = Math.min(600, Math.floor((now() - C.savedAt) / 60000)); if (mins > 0) marketTick(mins); }
  STATE.mode = 'play'; $('title').style.display = 'none'; $('log').innerHTML = ''; dailyCheck(); layout();
  sysMsg(`欢迎来到 <b>${SERVER}</b>！当前在线 ${fmt(onlineCount())} 人。`); for (let i = 0; i < 4; i++) fakeSay('world');
  if (fresh) logLine('<div class="lochead">完美世界OL</div>大荒，八百万里群山，凶兽横行。一个少年在一座小石村醒来……', 'loc'); else describe();
  refresh(); bannerDraw(); setTimeout(storyPoll, 600);
  if (!fresh) logLine(`欢迎回来，${esc(C.name)}。`, 'dim');
}
setInterval(() => { try { ambientTick(); } catch (e) { console.error(e); } if (STATE.mode === 'play' && C && !STATE.battle && !DLG) { const t = now(); if (!UI.topT || t - UI.topT > 5000) { UI.topT = t; renderTop(); if (UI.layout !== 'narrow' || UI.sgroup) renderSides(true); } } }, 1000);
addEventListener('pointerdown', audioInit, { once: true });
document.addEventListener('visibilitychange', () => { if (document.hidden && C) save(true); });
addEventListener('pagehide', () => { if (C) save(true); });
layout(); toTitle();

  MAIN, PLACES, go, explore, startBattle, battleAct, curQ, questComplete, storyPoll, enterDungeon, autoWalk, newChar, enterGame, save, refresh, openModal, closeModal, sendChat, gainExp, breakthrough, addItem, fakesAt, inviteFake, FAKES: () => FAKES, netHost, netJoin, MYID: () => MYID, CHAT, npcTalk, questTalkOptions, subComplete,
  arenaFight, arenaOpponents, bountyClaim, SIDE, sideDone, enhance, marketList, marketBuy, signIn, claimMail, useItem, fightWB, wbForSlot, wbSlot, joinGuild, ready: true }); }
