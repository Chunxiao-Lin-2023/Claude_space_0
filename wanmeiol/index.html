/* ---------------- quest engine ---------------- */
const curQ = () => MAIN[C.story.q];
function questAdvance() { C.story.q = Math.min(MAIN.length - 1, C.story.q + 1); C.story.n = 0; setTimeout(expRelease, 300); const q = curQ(); logLine(`<span class="qnew">【主线】${q.title}</span>：${q.goal}`, 'quest'); save(); refresh(); setTimeout(storyPoll, 300); }
async function runScene(fn, meta) { // meta = { title, ch } → the scene's lines are kept in the 回忆录
  if (STATE.scene) return false; STATE.scene = fn.name || 'scene'; UI.hist = []; UI.cur = null; if (meta && NETROLE !== 'guest') UI.jEntry = { t: meta.title, ch: meta.ch || curQ().ch, l: [], at: now() }; refresh(); netSync(); let r;
  try { r = await fn(); } catch (e) { console.error(e); } finally { STATE.scene = null; const J = UI.jEntry; UI.jEntry = null; if (J && J.l.length) { JOURNAL.push(J); saveJournal(); } dlgClose(); save(); refresh(); netSync(); }
  return r !== false;
}
async function questComplete(q) { if (q.lvNeed && C.lv < q.lvNeed) { toast(`要先练到第 ${q.lvNeed} 层`); return false; } const ok = await runScene(bridgeWrap(q), { title: q.title, ch: q.ch }); if (ok && curQ() === q) questAdvance(); return ok; }
function storyEvents(loc) { for (const E of EVENTS) if (E.loc === loc && !F()['ev_' + E.id] && E.when()) { F()['ev_' + E.id] = 1; runScene(E.scene, { title: E.title }); return true; } return false; }
function questTalkOptions(npc) {
  const q = curQ(), out = [];
  if (q.type === 'talk' && q.npc === npc) out.push({ t: (q.lvNeed && C.lv < q.lvNeed ? '🔒 ' : '❗ ') + q.title, f: () => questComplete(q) });
  if ((q.type === 'kill' || q.type === 'dungeon') && q.npc === npc && questReady(q)) out.push({ t: '✔ ' + q.title, f: () => questComplete(q) });
  for (const [id, S] of Object.entries(SIDE)) { if (S.npc !== npc || C.story.q < qi(S.minQ)) continue; const st = C.side?.[id]; if (st === 'done') continue;
    if (!st) out.push({ t: '❔ ' + S.title, f: () => sideOffer(id) }); else if (S.need.every(([k, n]) => itemN(k) >= n)) out.push({ t: '✔ ' + S.title, f: () => sideDone(id) }); }
  return out;
}
function questReady(q) { if (q.type === 'kill' || q.type === 'arena') return C.story.n >= q.n; if (q.type === 'dungeon') return C.story.n >= 1; return false; }
function questGoalText() { const q = curQ(); let t = q.goal;
  if (q.type === 'kill' || q.type === 'arena') t += `（${Math.min(C.story.n, q.n)}/${q.n}）` + (questReady(q) && q.npc ? ` → 回去找${NPCS[q.npc].name}` : '');
  if (q.type === 'dungeon' && questReady(q) && q.npc) t += ` → 回去找${NPCS[q.npc].name}`; if (q.lvNeed && C.lv < q.lvNeed) t += `（现在第 ${C.lv} 层）`; return t; }
function questWhere() { const q = curQ(); const npcLoc = n => PLACES[npcLocNow(n)] || Object.values(PLACES).find(p => (p.npcs || []).includes(n)); // an NPC found in several places: the one you can reach now
  if (q.type === 'enter') return q.loc; if (q.type === 'talk') return npcLoc(q.npc)?.id; if (q.type === 'arena') return q.loc;
  if (q.type === 'kill' || q.type === 'dungeon') return questReady(q) && q.npc ? npcLoc(q.npc)?.id : q.loc; return null; }
function storyKill(mob) { bountyKill(mob); const q = curQ(); if (q.type === 'kill' && q.mob === mob && C.story.n < q.n) { C.story.n++; logLine(`【主线】${MOBS[mob].name} ${C.story.n}/${q.n}`, 'quest'); if (C.story.n >= q.n) logLine(`【主线】回去找<b>${NPCS[q.npc].name}</b>。`, 'quest'); }
  if (itemN('peaegg') && !C.pets.ertuzi) { F().eggWins = (F().eggWins || 0) + 1; if (F().eggWins >= 8) setTimeout(hatchEgg, 600); } }
function storyArena() { const q = curQ(); if (q.type === 'arena' && C.story.n < q.n) { C.story.n++; if (C.story.n >= q.n) setTimeout(() => questComplete(q), 500); } }
function storyDungeon(id) { const q = curQ(); if (q.type === 'dungeon' && q.dungeon === id) { C.story.n = 1; if (!q.npc) setTimeout(() => questComplete(q), 600); else logLine(`【主线】回去找<b>${NPCS[q.npc].name}</b>。`, 'quest'); } }
async function hatchEgg() { if (C.pets.ertuzi || !itemN('peaegg') || STATE.scene || STATE.battle) { if (!C.pets.ertuzi && itemN('peaegg')) setTimeout(hatchEgg, 3000); return; }
  await runScene(async function S_hatch() { takeItem('peaegg'); await nar('怀里的蛋“咔”地裂开了。钻出来一只小鸟，浑身光溜溜的，一根毛都没有，冲你“啾”了一声。'); await me('……你怎么是秃的？那就叫你二秃子吧。'); gainPet('ertuzi'); await nar('后来你才知道，二秃子是孔雀一族。只是它的毛，好像一直都长不出来。'); }, { title: '二秃子' }); }
async function storyPoll() { if (!C || STATE.scene || STATE.battle || STATE.dungeon || STATE.mode !== 'play' || NETROLE === 'guest') return; const q = curQ(); if (q.type === 'auto') return questComplete(q); if (q.type === 'enter' && q.loc === C.loc && !STATE.dungeon) return questComplete(q); /* already standing there */ if (STATE.dtPending) return dongtianPick(); }
async function sideOffer(id) { const S = SIDE[id]; C.side = C.side || {}; await runScene(async () => { await say(S.npc, S.ask); const c = await choose(['交给我', '下次吧']); if (c === 0) { C.side[id] = 'on'; logLine(`【支线】${S.title}：${S.need.map(([k, n]) => ITEMS[k].name + '×' + n).join('、')} → ${NPCS[S.npc].name}`, 'quest'); } }); }
async function sideDone(id) { const S = SIDE[id]; await runScene(async () => { for (const [k, n] of S.need) takeItem(k, n); await say(S.npc, S.done); S.reward(); C.side[id] = 'done'; }); }

async function S_huohuang() {

  await nar('火皇坐在大殿上。百断山里那只燃着火的手掌，就是他的。他看你的眼神，跟看别的孩子不一样。');
  await say('huohuang', '你就是那个在百断山里偷了神猴王圣药的孩子？（他笑了）灵儿回来以后，天天说你。');
  await say('huolinger', '父皇！！');
  await me('火皇，我想找我娘。雷族的人说，她来过涅槃池。');
  await say('huohuang', '……（火皇沉默了很久）来过。十几年前，一个女人抱着一个快死的孩子，跪在祖地门口三天三夜。');
  await say('huohuang', '涅槃池是火国的根，外人不能进。可那个孩子……太小了。朕让她进去了。');
  await cine('涅槃池的火，烧了那个孩子七天七夜。<br>孩子活了下来。<br>女人走的时候，在池边的石头上刻了一行字。', 'mem');
  await say('huohuang', '那行字，朕一直没让人碰。你自己去看吧。……还有，涅槃池对你有好处。你胸口那块骨头，想长回来。');
  F().huohuang = 1;
  tip('<b>祖地 · 涅槃池</b>在皇城东边。');
}
async function S_niepan() {
  await nar('涅槃池里烧的不是火，是光。白色的、安静的光。池边的石头上，有一行很浅的字，被火烤了十几年，还在。');
  await cine('<b>“昊儿，活下去。”</b>', 'mem');
  await nar('你在那行字前面站了很久很久。久到火灵儿在你身后叫了你三声，你都没听见。');
  await say('huolinger', '……你要进去吗？涅槃池会把人烧干的。我父皇当年在里面待了一天，出来瘦了二十斤。');
  await me('我娘抱着我在外面跪了三天。我进去待三天。');
  const ms = await miniGame('mash', { title: '涅槃', desc: '火从里往外烧。挺住——让它把你烧干净，再长出来。', time: 8000, rate: 7 });
  if (!ms.ok) await nar('你在火里昏过去好几次，每次醒过来，都咬着牙又坐直了。');
  await cine('第一天，火烧掉了你的皮。<br>第二天，火烧到了你的骨头。<br>第三天，火烧到了你胸口那道疤——<br>疤底下那块刚冒头的骨头，<b>喝饱了火，长了出来</b>。');
  await nar('你从池子里爬出来的时候，瘦得像一根柴火棍。火灵儿看见你，眼泪一下子就掉下来了，然后又笑了。');
  await say('huolinger', '……你瘦成这样，还挺好看的。（她把一大盘烤肉推到你面前）快吃！');
  learnGongfa('niepan'); learnSkill('zhuque'); F().guBack = 1; gainExp(BAL.expNext(C.lv) * 0.5);
  await nar('你怀里那根朱雀真羽，在涅槃池边烧成了一团金红色的火，钻进了你的手心。从此，你的手一扬，就是漫天火羽。');
}
async function S_letter() {
  await nar('第二天清晨，一只巨大的妖蝶落在了火国皇城的城墙上。蝶背上没有人，只有一封信。');
  await nar('信上只有一行字，字写得很好看。');
  await cine('<b>“七日后，天空战场。只能下来一个。——石毅”</b>');
  await say('huolinger', '……你要去？他有重瞳，还有……还有你的骨头。');
  await me('我的骨头，长回来了。');
  F().shiyiDuel = 1;
  tip('<b>天空战场</b>浮在石国皇都的上空，从<b>荒天侯府</b>往北就能上去。');
}
async function S_shiyiDuel() {
  await nar('天空战场浮在云上，台子只够站两个人。四面八方的云上，站满了来看的人——石国的、火国的、太古神山的、还有很多你不认识的。');
  await nar('石毅已经在台上了。他穿着一身白衣，两只眼睛里，各有两个瞳孔。');
  await say('石毅', '……你来了。');
  await me('我来了。');
  await say('石毅', '那块骨头，我用了十三年。（他低头看了看自己的胸口）我没有选过。可我也没有还。');
  const c = await choose(['你还来。', '你不欠我。欠我的是你爹。', '（什么都没说，拉开了架势）']);
  F().duelTalk = ['give', 'father', 'quiet'][c];
  if (c === 0) await say('石毅', '……那就来拿。');
  else if (c === 1) await say('石毅', '（他愣了一下，重瞳里有什么东西晃了晃）……今天，只有你和我。');
  else await say('石毅', '……好。');
  const lv = slv(28, 0, 2);
  if (!await fightRetry({ rivals: [{ name: '石毅', lv, gear: 1.15, sk: ['zhizun', 'sn', 'lei', 'qly'], /* 他胸口那块，是你的至尊骨 */ icon: '👁️', shiyi: 1, boss: 1 }], title: '天空战场 · 双石', noPet: true, epic: { name: '石毅', sub: '重瞳者 · 武王府 · 你的堂兄', seal: '双石', intro: ['两个人，一块骨头。', '他的重瞳在看你。你的骨头，在看他。'], phase: '石毅胸口亮起了刺眼的光——他催动了那块至尊骨！<b>上苍劫光</b>，从天上砸了下来！', low: { who: '至尊骨', t: '劫光把你整个吞了进去。<br>……可你胸口那块刚长出来的骨头，在<b>吃</b>它。<br>一口，一口。像你小时候喝兽奶那样。<br>劫光越吃越少，骨头越长越亮——它<b>长成了</b>。' }, end: ['光散了。', '石毅躺在台上，看着天，重瞳里的光一点一点淡下去。'] } }, '你被劫光打下了天空战场。等你醒过来，石毅留下一句话：“养好了，再来。”')) return false;
  await say('石毅', '……（他笑了一下，很轻）原来……是这种感觉。');
  if (F().duelTalk === 'father') await say('石毅', '你刚才说……欠你的不是我。（他闭上眼睛）……谢谢。');
  await cine('一道看不清的影子从云里落下来。<br>那是一个女人，眼睛里，也有两个瞳孔。<br>她抱起石毅，看了你一眼，<b>走了</b>。', 'mem');
  await nar('你还没来得及喘口气，四面八方的云上，站起来了好几个人——尊者。他们看你的眼神，跟看一块刚长成的宝骨一模一样。');
  await say('尊者', '至尊骨……两块至尊骨的精华，全在这孩子身上了！');
  await nar('他们一起扑了下来。');
  await tzShiyi();
  await nar('一阵黑色的风卷过战场。风里有一个女人的笑声，懒洋洋的，好听得像在唱歌。等风散了，那几个尊者倒了一地，你被人拎着后领子，已经在百里之外了。');
  await say('魔女', '（一个穿黑裙的女人把你放在一块石头上，捏了捏你的脸）小家伙，你欠我一次。……我会来讨的。');
  await tzBone();
  learnGongfa('zhizungu'); learnSkill('zhizun'); F().shiyiWin2 = 1; gainExp(BAL.expNext(C.lv) * 0.6);
  await cine('你胸口那块骨头，安安静静地待在它该在的地方。<br>它是你的。<br>从一开始，就是你的。');
}

  if (!await fightRetry({ mobs: [['yuwai', slv(29)], ['yuwai', slv(29)], ['yuwai', slv(28)]], allies: ['a_jun'], title: '中央天宫 · 域外大教' })) return false;
  await nar('三个域外强者倒在大殿里。殿外，石国的禁军不知道什么时候站满了台阶——他们没有拦你，他们在看着你。');
  await say('叛变的王侯', '都愣着干什么！拿下他！石国早该换个主子了！');

  if (!await fightRetry({ mobs: [['shichong', slv(30, -1, 1)]], title: '中央天宫 · 石崇', epic: { name: '石崇', sub: '被外人扶上龙椅的傀儡', seal: '伪帝', intro: ['他攥着一枚假的皇印，攥得指节发白。'], phase: '石崇硬生生从假皇印里催出了一缕龙气！', end: ['石崇跪了下来。不到五十回合。', '“我认输……那张椅子，我从来就没坐稳过。”'] } })) return false;

  await cine('匣子里有三样东西。<br>一道诏令：人皇很早就写好了，让你进宫——被外人拦下了，你一直没收到。<br>一枚人皇印：石国第一代祭灵打神石的遗蜕炼成，压着整个石国的气运。<br>还有一道金黄的法旨。');
  await cine('<b>“朕去后，石国之主，荒天侯石昊。”</b>');
  await nar('那道法旨一展开，殿里那些域外大教的人脸色全变了。禁军跪了一地。');

  learnGongfa('renhuang'); F().shihuang = 1; gainExp(BAL.expNext(C.lv) * 0.5);

async function S_qishen() {
  await chapterCard('第九章', '七神', '神来收庄稼的那一天');
  await nar('你坐上龙椅的第七天，天裂开了。');
  await cine('七道身影从裂缝里走下来，每一道都燃着火。<br>他们不是来打仗的。<br>他们是来<b>收</b>的——收下界的根，收下界的气运，收下界最好的那几个孩子。');
  await nar('你感觉到胸口的小塔在发烫，接着变冷。它从你脖子上飘了起来，越飞越高，飞向了天的另一边。');
  await say('willow', '（远在石村的柳神，所有的柳枝同时指向了天。然后，柳神也不见了。）');
  await nar('你明白了：它们去挡更大的东西了。这里，只剩你。');
  await say('下界的神', '一个刚坐上龙椅的孩子？……有意思。跪下，你可以做本神的坐骑。');
  const h7 = await holdOut({ mobs: [['shenming', 36]], title: '七神下界', noPet: true, epic: { name: '七神', sub: '从上面下来的神 · 神火境', seal: '神', intro: ['祂们看你的眼神，像在看一棵麦子。'], phase: '神火铺天盖地——这根本不是能打的东西！' } }, 4);
  if (h7.survived) { F().held7 = 1; await nar('你撑了四个回合。四个回合以后，那位神第一次正眼看了你一眼：“……麦子，也会扎手。”'); }
  await cine('你倒了下去。<br>你听见钟伯在哭，火灵儿在喊你的名字，九头狮九个脑袋一起在吼。<br>然后，什么都听不见了。');
  await dieBack7();
  await cine('……很黑。很冷。<br>你好像飘了很久，飘过了石村，飘过了那棵烧焦的柳树，飘过了族长的小木床。<br>你娘在石头上刻的那行字，在黑暗里亮了一下——<b>“活下去。”</b>', 'mem');
  await cine('一只五色的小鸟，落在了你的胸口。<br>它啄了一下。<br>你的心，跳了一下。<br><b>你看见了生，也看见了死——看见了一个圆。</b>');
  await nar('你睁开了眼睛。天上的神愣住了——祂们亲手杀死的孩子，又站了起来。');
  learnSkill('lunhui');
  await me('……刚才那一下，我记住了。');
  if (!await fightRetry({ mobs: [['shenming2', F().dieBack ? slv(32, -2, 0) : slv(32, -1, 1)]], title: '七神 · 轮回', epic: { name: '神火境神明', sub: '七神之一 · 祂第一次害怕了', seal: '神', intro: ['你身上多了一样祂们看不懂的东西。', '一个圆。'], phase: '神火烧到了极致——可它烧不进那个圆！', low: { who: '族长', t: '“吃饱了再打！”……爷爷，我今天，还没吃饭呢。' }, end: ['一位神明，坠了下来。', '剩下的六道身影看着你，第一次往后退了一步。'] } }, '神火把你打退了。你喘着气，又站了起来——下回。')) return false;
  await cine('六道身影退回了天上的裂缝里。<br>裂缝合上了。<br>下界的天，又蓝了。');
  F().qishen = 1; gainExp(BAL.expNext(C.lv) * 0.6);
  tip('有人在<b>血祭台</b>动手脚。血祭台在中央天宫西边。');
}
async function S_shengdi() {
  await nar('七神刚走，下界还没喘过气来，三大圣地就动手了——补天教、不老山、凝金门。他们在皇都外的古祭台上刻满了阵纹。');
  await say('补天教长老', '七神没收走的东西，总得有人收。石国的血，够我们三家打开一条路。');
  await nar('你站在血祭台下，身后是石国的禁军，是侯府里武王府的人，是九头狮，是大红，是毛球。');
  await cine('你闭上眼睛。<br>一个你，两个你，三个你，四个你——<br><b>四道灵身</b>从你身上走出来，各领一军，站在了血祭台的四面。');
  learnGongfa('lingshen');
  const boss = [['butianjiao', 31, '补天教长老', '补天教的人——不是补天阁，补天阁的人看见他们都想吐口水', '长老咬破手指，在血祭阵上画下了最后一笔！', { who: '诡爷', t: '“……吵。”<br>（你笑了。补天阁那个最不爱说话的老头，要是在这儿，也就这一个字。）' }],
    ['bulaoshan', 32, '不老山主', '活了很久很久的人，最怕的是死', '不老山主的皮肤一下子枯了下去——他在烧自己的寿元！', { who: '清风', t: '“……下次去这种地方，带上我。我已经是内门弟子了。”<br>（你想起她攥着补天石的样子。）' }],
    ['ningjin', 33, '凝金门主', '一身金子，心也是金子做的', '凝金门主的身子一寸寸变成了金子——刀枪不入！雷能劈开它。', { who: '火灵儿', t: '“喂！你答应过请我吃烤肉的！”' }]];
  for (const [id, lv, n, sub, ph, low] of boss) {
    if (!await fightRetry({ mobs: [[id, slv(lv, -1, 1)]], allies: ['a_jun'], title: '血祭台 · ' + n, epic: { name: n, sub, seal: '圣地', intro: ['血祭台上的阵纹在跳，像一颗心。'], phase: ph, low } })) return false;
    await nar(`${n}倒在了血祭台上。一道灵身走过去，把那一面的阵纹踩碎了。`); }
  await cine('血祭台塌了。<br>三大圣地的人跑了个干净。<br>那一天以后，整个下界都知道了一件事：<b>石国，没有人惹得起。</b>');
  F().shengdi = 1; gainExp(BAL.expNext(C.lv) * 0.6);
  tip('不老山塌了。塌下去的山底下，好像有什么东西在发光……');
}
async function S_parents() {

  await nar('你站在封印前面，忽然不会动了。你见过很多次这两个人——在梦里，在柳神给你看的画面里，在涅槃池边那行字里。');

  await nar('最后一层封印碎掉的时候，那个女人先睁开了眼睛。她看了你很久很久，像是在认一张很陌生的脸。然后她的目光落在你的胸口。');

/* ================= 石昊's story, volume 4 (登天) and volume 5 (上界) =================

   Beats follow the novel: at 银磨山 eight 神火境 geniuses (太古莽牛初代, 紫金鹄初代, 火蝎族初代, a 三眼兽族 genius, 银葵初代,
   a 冥土 genius, 龙雀 and 白狮初代) lay a formation to force 蓝一尘 to give up the 八珍麒 — 石昊 kills all eight (打神石 on 银葵);
   ancient geniuses surface (龙女, 堕神子, 黑暗神子, 长弓衍, 孤剑云), the 十冠王 shows a sapling of the world tree, 石毅 is back.
   At the 三千州 tournament he holds the stage for 588 wins until he is badly hurt; 银坤 stirs the crowd to swarm him, 孤剑云
   holds back; he burns his 至尊 blood to learn the 柳神法, returns, kills 银坤 with the 大罗剑胎; 宁川 (六冠王, 十凶麒麟血) comes,
   then 谪仙, the 十冠王, 天子; 轮回's disc is blocked by the world tree; 石昊 reaches 涅槃圆满, kills 轮回 with 石毅 striking last,
   beats 宁川 in one move and wins. In 仙古 he kills 帝冲's avatar; 宁川 calls them both 罪血后代 and 石昊 and 石毅 fight him
   together; 帝冲's real body fuses with what is left of the avatar and dies too. The prose is written fresh for the game. */

/* ================= 石昊's story, volume 8 (帝关) and volume 9 (清算) =================
   Beats follow the novel: at 帝关 on the 边荒 frontier the young generation of 九天十地 fights 异域; 石昊 learns that the 七王
   held the pass and their descendants, slandered as 罪血, kept holding it; the 王家 of the long-lived families goes after him on
   the wall; he outmatches the 异域 帝族 youth but the war is costly; the 不朽之王 安澜 comes; 孟天正 gives up his own road to
   immortality to defend the pass, kills a foe already on that road, and is lost in the dark of 边荒; 石昊 risks his life for a
   rotten wooden box in 边荒 and flees back to 下界. Back home he records 王家, 金家 and 风族 dealing with dark creatures on
   留影晶石 and shows them when the 仙域 envoy comes: 王长生 kills his own six sons and hands over the 平乱诀 to buy his family a
   place; 金家 and 风族 lose theirs. After years of training he is back at 至尊境, leads 800 men of 石村 up and tears down 仙殿,
   天国, 剑谷, 妖龙道门, 罗浮真谷, 冥土 and 火云洞, wipes out 金家 and 风族 who were still hiding two dark 至尊, and drives the
   dark creatures out of 九天十地 — ten thousand years of peace. Every line of prose is written fresh for the game. */

/* ================= 石昊's story, volume 9 (异域) and volume 10 (仙域) =================
   Beats follow the novel: handed over to 异域 for "500 years of peace", he is chained in the 黑水天牢 (the black water eats at
   his feet, his cultivation sealed), hung at the city gate and mocked, then let out to be the whetstone for 异域's young
   geniuses — he beats the 赤王后裔 and fights for the 悟道茶树; over a hundred years his 道基 is completed, all his arts merge
   into one, and 蛄祖 helps fill in his 道则. He escapes through the 海瀑 (a branch of the 界海), catches a 始祖鱼苗 and rides it
   past 异域's strongmen with 三藏 and 神冥, reaches 仙域, finds the 原始帝城 and the truth about 罪血, and goes back to 帝关 at
   late 斩我境 — where 孟天正, out of seclusion, had already gone after 金家 and 王长生 for him. Prose written fresh. */

/* ---------------- 第九卷 · 异域 ---------------- */
async function S_yyStart() {

  await say('黑水狱卒', '九天十地最强的那个？（他用鞭子挑起你的下巴）就这？');

  await cine('第十天，他们把你拖出天牢，用绳子吊在了异域大城的城门上。<br>城门下面，异域的人一个一个走过去，冲你吐口水，扔石头，笑。<br>你挂在上面，看着边荒的方向。<br>帝关在那边。小七在那边。<b>你答应过回去的</b>。');
  await nar('有一天夜里，城门下来了一群人，十几个，个个是异域的强者。他们想趁你被封着修为，把你的道基挖出来。');
  await nar('你被吊着，修为被封着，脚是烂的。你用牙咬断了绳子，掉下来，用头撞，用肘砸，用烂掉的脚踢。天亮的时候，城门下面躺了一地。');
  await say('异域的长老', '（他看着满地的人，又看着你，眼神变了）……留着他。这么好的磨刀石，杀了可惜。');

async function S_guzu() {

/* ================= 石昊's story, volume 12 (天庭) and volume 13 (帝落) =================
   Beats follow the novel's later stages as summarised by readers: at the peak of 至尊 he rules 九天, destroys the 残仙 hiding
   beneath it and founds the 天庭; he goes to the 堤坝 and looks out over the 界海; in 仙域 he reaches the combat power of a
   true immortal, beats the heirs of the 仙王 and goes through the 造化之门; then the 帝落时代 — he goes up the river of time,
   lives eight lives backwards, and comes back. The novel tells these stages briefly and at a great scale; the game keeps to
   that outline, and the scenes in between are written fresh. */

/* ---------------- 第十二卷 · 天庭 ---------------- */
async function S_v12start() {
  await cine('<div class="cc"><small>第十二卷</small><b>天庭</b><i>下一次黑暗来的时候</i></div>', 'card');
  await chapterCard('第二十六章', '天庭', '站在一起');
  await say('chief', '（族长坐在柳神的树桩旁边，晒着太阳）……九天太平了？');
  await me('太平了一阵子。');
  await say('chief', '一阵子？（他眯着眼睛看你）你这孩子，打完了架，还皱着眉。');
  await me('九天底下，还有东西在吃九天。帝关外面，还有界海。黑暗不会只来一次。');
  await say('chief', '那你打算怎么办？一个人，一次一次地去挡？');
  await nar('你没说话。你想起了帝关，想起了原始帝城——城里的人跑了，七王没跑。');
  await me('……不能再一个人挡了。得有个地方，让九天十地站在一起。');
  await say('chief', '（他笑了，皱纹挤成一团）那就去立一个。吃饱了再去。');
  F().v12 = 1;
  tip('九天之巅西边，有一座<b>残仙墓</b>。先把那个吃九天的东西清掉。');
}

async function S_tianting() {

  await say('qidaolin', '（齐道临挤过来，胡子都白了）徒弟，这……这就是天庭？');

/* ================= 石昊's story, volume 14 (异域之战) and volume 15 (独断万古) =================
   Beats follow the novel's final stages as summarised by readers: he goes into 异域, frees 火灵儿 (taken long ago; her spirit
   sleeps), kills a 准不朽之王, and three 仙王 ambush him and his body falls — 他化自在大法 carries him through; he brings the
   dark 柳神 back out of the 界海; he kills 赤王 in the 界海 / 异域 while more than a dozen 仙王 close in, uses 他化自在 bodies
   and blows up the pair's weapons to get away; he beats 鲲帝, chases him into 异域 and is wounded by the 原始古器's dark
   matter; at the great battle in 仙域 he breaks through to 准仙帝 and kills 刀王, 蒲魔王, 九头魔, 无殇, then goes into 异域 and
   kills 鲲帝 and 屈冲 — 异域 is pacified. In the 界海 he fights three emperors, holds down the four dark emperors, is killed in
   its depths by the 尸骸仙帝, becomes 仙帝 through 他化自在大法 and kills him; he wakes 火灵儿; with one stroke he cuts the
   river of time — 独断万古 — and keeps the darkness of 上苍之上 away from home. Prose is written fresh for the game. */

/* ---------- 骨文 game: the runes light up one by one (numbered), then you connect them 1 → n.
   Nothing to memorise — the numbers stay. Finishing in time without a wrong tap gives the 宝术 a head start.
   The lighting is game state (R.shown), not a CSS animation, so it works with animations off and is mirrored in co-op. */
function runeGame(id) {
  if (window.__dbg && __dbg.auto) return Promise.resolve(!__dbg.runeFail);
  const n = { qly: 4, sn: 5, lei: 6, gw: 6 }[id] || 5, nodes = [];
  for (let t = 0; nodes.length < n && t < 400; t++) { const x = 34 + Math.random() * 252, y = 34 + Math.random() * 124; if (nodes.every(o => Math.hypot(o.x - x, o.y - y) > 66)) nodes.push({ x: Math.round(x), y: Math.round(y), g: runeGlyph() }); }
  const seq = shuffle(nodes.map((_, i) => i));
  return new Promise(res => { DLG = { rune: { id, name: SKILLS[id].name, nodes, seq, got: [], phase: 'show', shown: 0, fails: 0, bad: -1, dur: n * 1400 + 2000, t0: 0, k: uid() }, res }; renderDlg(); netSync(); runeShowStep(); });
}
function runeGlyph() { // a few strokes inside a circle — an abstract rune, different every time
  const P = () => [Math.round((Math.random() - 0.5) * 24), Math.round((Math.random() - 0.5) * 24)]; let d = '';
  for (let i = 0; i < 2 + rint(0, 1); i++) { const a = P(), b = P(), c = P(); d += i % 2 ? `M${a[0]} ${a[1]}Q${c[0]} ${c[1]} ${b[0]} ${b[1]}` : `M${a[0]} ${a[1]}L${b[0]} ${b[1]}`; } return d;
}
function runeShowStep() { const R = DLG && DLG.rune; if (!R || R.phase !== 'show') return; const k = R.k;
  setTimeout(() => { const Q = DLG && DLG.rune; if (!Q || Q.k !== k || Q.phase !== 'show') return;
    if (Q.shown < Q.seq.length) { Q.shown++; sfx('click'); renderDlg(); netSync(); runeShowStep(); }
    else { Q.phase = 'input'; Q.t0 = now(); renderDlg(); netSync(); } }, R.shown === 0 ? 500 : R.shown < R.seq.length ? 520 : 800); }
function runeTap(i) { const R = DLG && DLG.rune; if (!R || R.phase !== 'input' || NETROLE === 'guest' || R.got.includes(i)) return;
  if (R.seq[R.got.length] === i) { R.got.push(i); R.bad = -1; sfx('click'); if (R.got.length === R.seq.length) { R.phase = 'done'; R.ok = R.fails === 0 && now() - R.t0 <= R.dur; sfx(R.ok ? 'epic' : 'click'); renderDlg(); netSync(); if (R.ok) setTimeout(() => runeEnd(true), 900); return; } }
  else { R.fails++; R.bad = i; sfx('fail'); }
  renderDlg(); netSync(); }
function runeRetry() { const R = DLG && DLG.rune; if (!R || R.phase !== 'done' || R.ok || NETROLE === 'guest') return; Object.assign(R, { seq: shuffle(R.seq.slice()), got: [], phase: 'show', shown: 0, fails: 0, bad: -1, t0: 0, tries: (R.tries || 0) + 1, k: uid() }); sfx('click'); renderDlg(); netSync(); runeShowStep(); }
function runeAccept() { const R = DLG && DLG.rune; if (R && R.phase === 'done' && !R.ok && NETROLE !== 'guest') runeEnd(false); }
function runeSkip() { if (DLG && DLG.rune && NETROLE !== 'guest') runeEnd(false); }
function runeEnd(ok) { const D_ = DLG; if (!D_ || !D_.rune) return; DLG = null; logLine(ok ? '骨文一气呵成地连了起来，你一下子就看透了它的走向。' : '骨文连上了，可还不够顺，往后得慢慢磨。', 'dim'); renderDlg(); netSync(); D_.res(ok); }
function runeHtml(R) {
  const order = {}; R.seq.forEach((n, j) => order[n] = j); const path = R.phase === 'show' ? R.seq.slice(0, R.shown) : R.phase === 'done' ? R.seq : R.got;
  const links = path.slice(1).map((n, j) => { const a = R.nodes[path[j]], b = R.nodes[n]; return `<line class="lnk ${R.phase === 'show' ? 'demo' : ''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`; }).join('');
  const numOn = i => R.phase !== 'show' || order[i] < R.shown, lit = i => R.phase === 'show' ? order[i] < R.shown : R.phase === 'done' || R.got.includes(i);
  const nodes = R.nodes.map((o, i) => `<g class="nd ${lit(i) ? 'lit' : ''} ${R.phase === 'show' && order[i] === R.shown - 1 ? 'pop' : ''} ${R.phase === 'input' && R.seq[R.got.length] === i ? 'next' : ''} ${R.bad === i ? 'bad' : ''}" onclick="runeTap(${i})" transform="translate(${o.x} ${o.y})"><circle r="22"/><path d="${o.g}"/>${numOn(i) ? `<g class="num" transform="translate(16 -16)"><circle r="9"/><text y="4">${order[i] + 1}</text></g>` : ''}</g>`).join('');
  const left = R.phase === 'input' ? Math.max(0, R.dur - (now() - R.t0)) : R.dur;
  const msg = R.phase === 'show' ? `看骨文一道道亮起来……（${R.shown}/${R.seq.length}）` : R.phase === 'input' ? `按 1 → ${R.seq.length} 的顺序点，把骨文连起来（${R.got.length}/${R.seq.length}）${R.fails ? `　<span class="bad">点错 ${R.fails} 次</span>` : ''}` : R.ok ? '一气呵成！熟练度起步更高。' : `连上了，不过${R.fails ? `点错了 ${R.fails} 次` : '慢了一点'}。一气呵成的话，熟练度起步更高。`;
  return `<div class="line"><div>${sealHtml({ n: R.name, c: '#7a4a1a' })}</div><div class="tx nar">${R.phase === 'done' ? '骨文连成了一体，在你眼前亮了一下，钻进了你的骨头里。' : R.phase === 'show' ? '骨文在你眼前一道接一道地亮起来，串成一条路。' : '照着它的路，自己走一遍。不用记——数字都在。'}</div></div>
    <div class="rune"><svg viewBox="0 0 320 190">${links}${nodes}</svg>${R.phase === 'input' ? `<div class="rtime" title="又快又不点错，熟练度起步更高"><i style="animation-duration:${R.dur}ms;animation-delay:-${R.dur - left}ms"></i></div>` : ''}<div class="msg">${msg}</div></div>${R.phase !== 'done' ? `<div class="ch"><button class="chb" onclick="runeSkip()">先不连了，直接学（跳过）</button></div>` : R.ok ? '' : `<div class="ch"><button class="chb" onclick="runeRetry()">↻ 再连一次</button><button class="chb" onclick="runeAccept()">就这样，学下来</button></div>`}`;
}

/* ---------- 宝骨 ---------- */
function gainRelic(id, quiet) { C.relics = C.relics || {}; if (C.relics[id]) return; C.relics[id] = 1; const R = RELICS[id]; C.eq = C.eq || []; let off = null; if (C.eq.length < relicSlots(C.lv)) C.eq.push(id); else { const own = Object.keys(C.relics); off = C.eq.filter(r => !forgeLv(r)).sort((a, b) => own.indexOf(a) - own.indexOf(b))[0]; if (off) C.eq[C.eq.indexOf(off)] = id; } /* a full 宝骨栏 swaps out the oldest unforged one */
  if (!quiet) { logLine(`<b class="lvup">得到宝骨</b>：${R.i}<b>${R.n}</b>——${R.d}${C.eq.includes(id) ? (off ? `（栏满了，换下了最早的「${RELICS[off].n}」，想换回来去「石昊」页）` : '（已经戴上了）') : '（在“石昊”页里换着戴）'}`, 'sys'); sfx('epic'); bigFlash(R.n, 'relic'); } fixHp(); }
function relicFromKills(kills) { for (const [mob, , boss] of kills || []) if (boss) for (const [id, R] of Object.entries(RELICS)) if (R.from === mob) gainRelic(id); }
function equipRelic(id) { if (!C.relics || !C.relics[id]) return; C.eq = C.eq || []; const i = C.eq.indexOf(id); if (i >= 0) C.eq.splice(i, 1); else { if (C.eq.length >= relicSlots(C.lv)) { toast('宝骨栏满了（' + relicSlots(C.lv) + ' 件），先摘下一件'); return; } C.eq.push(id); } fixHp(); sfx('click'); save(); refresh(); }

/* ---------- trading surplus materials ---------- */
function tradeOptions(npc) { return TRADES.map((T, i) => [T, i]).filter(([T]) => T.npc === npc).map(([T, i]) => ({ t: `🔁 ${T.t}`, dis: !T.need.every(([k, n]) => itemN(k) >= n), f: () => tradeDo(i) })); }
async function tradeDo(i) { const T = TRADES[i]; if (!T || !T.need.every(([k, n]) => itemN(k) >= n)) { toast('东西不够'); return; }

  for (const [k, n] of T.need) takeItem(k, n); T.give(); sfx('loot'); save(); refresh(); }

/* ---------- daily bounties ---------- */
function bountyToday() { // one per person per day; someone who becomes available later in the day gets theirs then
  const d = gameDay(); if (!C.bounty || C.bounty.day !== d) C.bounty = { day: d, list: [] }; const list = C.bounty.list;
  for (const B of BOUNTY_FROM) { if (!B.open() || list.some(b => b.npc === B.npc)) continue; const r = srng('bounty' + d + C.created + B.npc);
    const ps = Object.values(PLACES).filter(p => B.areas.includes(p.area) && placeOpen(p.id) && p.mobs && p.lv && p.lv[0] <= C.lv + 2);
    if (ps.length && r() < 0.7) { const P = ps[Math.floor(r() * ps.length)], m = P.mobs[Math.floor(r() * P.mobs.length)][0]; list.push({ npc: B.npc, kind: 'kill', id: m, n: 4 + Math.floor(r() * 3), got: 0, st: 'new', where: P.name, loc: P.id }); }
    else { const it = ['bone', 'herb', 'meat', 'lingyao'][Math.floor(r() * 4)]; list.push({ npc: B.npc, kind: 'item', id: it, n: it === 'lingyao' ? 2 : 3 + Math.floor(r() * 2), got: 0, st: 'new' }); } }
  return list; }
const bountyText = b => b.kind === 'kill' ? `打 ${b.n} 头${MOBS[b.id].name}（${b.where}，${Math.min(b.got, b.n)}/${b.n}）` : `带 ${b.n} 个${ITEMS[b.id].name}（${Math.min(itemN(b.id), b.n)}/${b.n}）`;
const bountyReady = b => b.kind === 'kill' ? b.got >= b.n : itemN(b.id) >= b.n;
function bountyOptions(npc) { const out = []; bountyToday().forEach((b, i) => { if (b.npc !== npc || b.st === 'done') return;
  out.push({ t: b.st === 'new' ? `📋 今日悬赏：${bountyText(b)}` : bountyReady(b) ? `✔ 交悬赏：${bountyText(b)}` : `📋 悬赏进行中：${bountyText(b)}`, dis: b.st === 'on' && !bountyReady(b), f: () => bountyTake(i) }); }); return out; }
function bountyTake(i) { const b = bountyToday()[i]; if (!b || b.st === 'done') return;
  if (b.st === 'new') { b.st = 'on'; logLine(`【悬赏】${NPCS[b.npc].name}：${bountyText(b)}`, 'quest'); save(); refresh(); return; }
  if (!bountyReady(b)) return; if (b.kind === 'item') takeItem(b.id, b.n); b.st = 'done'; C.stats.bounty = (C.stats.bounty || 0) + 1;
  logLine(`【悬赏完成】${NPCS[b.npc].name}很满意。`, 'quest'); gainMoney(20 + C.lv * 4, '赏钱'); addItem('baoyao'); addItem('lingyao'); gainExp(BAL.expNext(C.lv) * 0.3); const sk = C.bar.length ? pick(C.bar) : null; if (sk) { for (let k = 0; k < 5; k++) profUse(sk); logLine(`${SKILLS[sk].name} 熟练度 +5`, 'dim'); } sfx('loot'); save(); refresh(); }
function bountyKill(mob) { if (!C.bounty || C.bounty.day !== gameDay()) return; for (const b of C.bounty.list) if (b.st === 'on' && b.kind === 'kill' && b.id === mob && b.got < b.n) { b.got++; if (b.got === b.n) logLine(`【悬赏】${MOBS[mob].name} 够数了，回去找${NPCS[b.npc].name}。`, 'quest'); } }

/* ---------- 地点探索度: every kind of beast here beaten + everything here gathered ---------- */
function exTargets(P) { const m = [...new Set((P.mobs || []).map(x => x[0]))], g = [...new Set((P.gather || []).map(x => x[0]))]; return { m, g, n: m.length + g.length }; }
function exState(loc) { C.ex = C.ex || {}; return C.ex[loc] || (C.ex[loc] = { m: {}, g: {} }); }
function exCount(loc) { const P = PLACES[loc], T = exTargets(P), E = (C.ex && C.ex[loc]) || { m: {}, g: {} }; return { have: T.m.filter(x => E.m[x]).length + T.g.filter(x => E.g[x]).length, n: T.n, done: !!E.done }; }
function exNote(loc, k, id) { const P = PLACES[loc]; if (!P || !P.lv) return; const T = exTargets(P); if (!T[k].includes(id)) return; const E = exState(loc); if (E[k][id]) return; E[k][id] = 1;
  const c = exCount(loc); if (c.have >= c.n && !E.done) { E.done = 1; logLine(`<b class="lvup">${P.name} 探索完成</b>：这里的凶兽都交过手，能采的东西也都找到了。`, 'sys'); addItem('baoyao'); addItem('lingyao'); gainMoney(30 + C.lv * 5, '还翻出了'); gainExp(BAL.expNext(C.lv) * 0.3); sfx('epic'); bigFlash(P.name + ' · 探索完成', 'relic'); } }

function enterDungeonHard(id) { if (!C.dungeons[id]) return; enterDungeon(id, true); }

/* ---------- 任务列表: main line, side errands and bounties side by side; pick which one to follow ---------- */
const npcLocNow = n => { const P = Object.values(PLACES).find(p => placeOpen(p.id) && npcsHere(p.id).includes(n)); return P ? P.id : null; };
function itemWhere(id) { // the open wild place closest to your level where it can be gathered, or else where a beast drops it
  const open = Object.values(PLACES).filter(p => placeOpen(p.id) && p.lv && route(C.loc, p.id)), by = L => L.sort((a, b) => Math.abs(a.lv[0] - C.lv) - Math.abs(b.lv[0] - C.lv))[0];
  const g = open.filter(p => (p.gather || []).some(x => x[0] === id)), m = open.filter(p => (p.mobs || []).some(x => (MOBS[x[0]].loot || []).some(l => l[0] === id)));
  const P = by(g.length ? g : m); return P ? P.id : null; }
function tasks() {
  const q = curQ(), out = [{ key: 'main', kind: '主线', title: `${CH_NAMES[q.ch].split(' · ')[1] || ''} · ${q.title}`, goal: questGoalText(), where: questWhere() }];
  for (const [id, S] of Object.entries(SIDE)) { const st = C.side && C.side[id]; if (st === 'done' || C.story.q < qi(S.minQ)) continue; const N = NPCS[S.npc];
    if (!st) { out.push({ key: 'side:' + id, kind: '支线 · 可接', title: S.title, goal: `去找${N.name}`, where: npcLocNow(S.npc) }); continue; }
    const miss = S.need.find(([k, n]) => itemN(k) < n), prog = S.need.map(([k, n]) => `${ITEMS[k].name} ${Math.min(itemN(k), n)}/${n}`).join('、');
    out.push({ key: 'side:' + id, kind: '支线', title: S.title, goal: miss ? `${prog}（${PLACES[itemWhere(miss[0])]?.name || '野外'}能找到）` : `${prog} → 交给${N.name}`, where: miss ? itemWhere(miss[0]) : npcLocNow(S.npc) }); }
  for (const q of SIDEQ) { if (!q.open()) continue; const s = q.st(); if (s >= q.max) continue; out.push({ key: 'sideq:' + q.id, kind: '支线', title: q.n, goal: q.hint(s), where: q.loc(s) }); }
  for (const q of BSQ) { if (!q.open()) continue; const s = bsSt(q.id); if (s >= q.max) continue; out.push({ key: 'bsq:' + q.id, kind: '机缘', title: '宝术 · ' + q.n, goal: q.hint(s), where: q.loc(s) }); } /* 宝术谱 tasks */
  for (const b of bountyToday()) { if (b.st === 'done') continue; const N = NPCS[b.npc], ready = b.st === 'on' && bountyReady(b);
    const loc = b.st === 'new' || ready ? npcLocNow(b.npc) : b.kind === 'kill' ? (b.loc || Object.values(PLACES).find(p => p.name === b.where)?.id) : itemWhere(b.id);
    out.push({ key: 'bounty:' + b.npc, kind: b.st === 'new' ? '悬赏 · 可接' : '悬赏', title: `${N.name}的悬赏`, goal: bountyText(b) + (b.st === 'new' ? ` · 去找${N.name}接` : ready ? ` → 交给${N.name}` : ''), where: loc }); }
  return out; }
function curTask() { const T = tasks(); return T.find(t => t.key === C.track) || T[0]; }
const taskWhere = () => curTask().where;
function trackTask(key) { C.track = key; sfx('click'); save(); refresh(); }

/* ---------- 歇脚 in the wild: once per visit, 40% back, and something may come sniffing ---------- */
async function camp() { const P = PLACES[C.loc]; if (STATE.scene || STATE.battle || STATE.dungeon || !P.mobs || P.town) return; const key = C.loc + C.seenN; if (UI.campAt === key) { toast('刚歇过了，换个地方再歇'); return; } UI.campAt = key;
  passTime(1); if (chance(0.25)) { logLine('你刚找了块石头坐下，草丛里就有东西扑了过来——', 'enc'); const id = wpick(P.mobs, x => x[1])[0]; const r = await startBattle({ mobs: [[id, clamp(rint(P.lv[0], P.lv[1]), 1, 30)]], title: `${P.name} · 歇脚被打断`, flee: true }); if (!r || !r.win) return; }
  const s = charStats(); C.hp = Math.min(s.hpMax, C.hp + s.hpMax * 0.4); C.mp = Math.min(s.mpMax, C.mp + s.mpMax * 0.4); sfx('heal');
  logLine(isNight() ? '你拢了一小堆火，靠着火歇了一会儿。气血、符力回了四成。' : '你找了块背风的石头靠着歇了一会儿。气血、符力回了四成。', 'dim'); save(); refresh(); }

/* ---------- 灵石 and trading: sell in any town, buy where there is a stall ---------- */
const PRICE = { milk: 6, herb: 8, meat: 10, lingyao: 30, baoyao: 90, bone: 6 }; // buying price; selling gets half
const sellPrice = id => Math.max(1, Math.floor((PRICE[id] || 0) / 2));
const canTrade = () => !!(PLACES[C.loc].town && PLACES[C.loc].area !== 'xushen');
function sellItem(id, all) { const it = ITEMS[id]; if (!canTrade() || !it || !PRICE[id] || !itemN(id)) return; const n = all ? itemN(id) : 1; takeItem(id, n); C.money = (C.money || 0) + sellPrice(id) * n; logLine(`卖掉 ${it.icon}${it.name} ×${n}，得到 💎${sellPrice(id) * n} 灵石。`, 'loot'); sfx('gold'); save(); refresh(); }
function buyItem(id) { const P = PLACES[C.loc]; if (!P.shop || !P.shop.includes(id)) return; if ((C.money || 0) < PRICE[id]) { toast('灵石不够'); return; } C.money -= PRICE[id]; addItem(id, 1, true); logLine(`买了 ${ITEMS[id].icon}${ITEMS[id].name}，花了 💎${PRICE[id]}。`, 'loot'); sfx('gold'); save(); refresh(); }
function gainMoney(n, why) { n = Math.round(n); if (n <= 0) return; C.money = (C.money || 0) + n; if (why) logLine(`${why} 💎${n} 灵石`, 'loot'); }

/* ---------- partner loadout: 4 moves in battle (5 once awakened); a new move replaces the lowest-tier one of its kind ---------- */
const petSlots = id => 4 + (C.pets[id] && C.pets[id].evo ? 1 : 0);
const petOpen = id => PETS[id].sk.map((s, i) => ({ s, i })).filter(x => (!x.s.aff || C.pets[id].aff >= x.s.aff) && (!x.s.evo || C.pets[id].evo)).map(x => x.i);
function petBar(id) { const p = C.pets[id]; if (!p) return []; const open = petOpen(id), n = petSlots(id);
  if (!p.bar) p.bar = open.slice(0, n);
  for (const i of open) if (!p.bar.includes(i) && !(p.seen || []).includes(i)) { p.seen = [...(p.seen || []), i]; // newly learned: take a free slot, or replace the lowest-tier move of the same kind
    if (p.bar.length < n) p.bar.push(i); else { const cat = PETS[id].sk[i].cat, old = p.bar.filter(k => PETS[id].sk[k].cat === cat)[0]; if (old != null) { p.bar[p.bar.indexOf(old)] = i; if (STATE.mode === 'play') toast(`${PETS[id].name} 学会「${PETS[id].sk[i].n}」，换下了「${PETS[id].sk[old].n}」`); } } }
  p.seen = [...new Set([...(p.seen || []), ...open])]; p.bar = p.bar.filter(i => open.includes(i)).slice(0, n); return p.bar; }
function togglePetMove(id, i) { const p = C.pets[id]; if (!p || !petOpen(id).includes(i)) return; const bar = petBar(id), n = petSlots(id);
  if (bar.includes(i)) { if (bar.length <= 1) { toast('至少留一招'); return; } p.bar = bar.filter(k => k !== i); }
  else if (bar.length < n) p.bar = [...bar, i];
  else { const cat = PETS[id].sk[i].cat, same = bar.filter(k => PETS[id].sk[k].cat === cat), old = same.length ? same[0] : bar[0]; p.bar = bar.map(k => k === old ? i : k); toast(`换下了「${PETS[id].sk[old].n}」`); }
  sfx('click'); save(); refresh(); }
function setDuo(v) { C.duo = v; sfx('click'); save(); if (STATE.battle) renderBattle(true); netSync(); }

/* ---------- partner growth: its own level (to 30, past 石昊's cap), move ranks (材料), and a second awakening (返祖) ---------- */
const PET_LV_CAP = 85;
const petLv = id => { const p = C.pets[id]; return p ? (p.lv || C.lv) : C.lv; };
const petNeed = lv => Math.round(BAL.expNext(Math.min(lv, 20)) * (lv >= 20 ? 1 + (lv - 19) * 0.35 : 1));
function petGainExp(id, n) { const p = C.pets[id]; if (!p || n <= 0) return; if (!p.lv) p.lv = C.lv; p.exp = (p.exp || 0) + Math.round(n * (p.lv < C.lv ? 1.6 : 1));
  const cap = Math.min(PET_LV_CAP, C.lv + 2); // never more than 2 above 石昊 (so the story's level ceilings hold for partners too)
  while (p.lv < cap && p.exp >= petNeed(p.lv)) { p.exp -= petNeed(p.lv); p.lv++; logLine(`${PETS[id].icon}<b>${PETS[id].name}</b> 长到了 <b>${p.lv} 级</b>${p.lv > C.lv ? '（比石昊还高，属性 +' + Math.round((p.lv - C.lv) * 3) + '%）' : ''}。`, 'sys'); if (id === C.pet) bigFlash(PETS[id].name + ' · ' + p.lv + ' 级', 'lv'); }
  if (p.lv >= cap) p.exp = Math.min(p.exp, petNeed(p.lv)); petEvo2Check(id); petEvo3Check(id); }

  { at: 'shicun', from: 'q_xushen0', to: 'q_leave', who: 'dazhuang', t: '听说你一口气开了三座洞天？洞天是啥？能吃吗？' },
  { at: 'shicun', from: 'q_xushen0', to: 'q_leave', who: 'ermeng', t: '清风姐姐教我们认字了！她说外面的人都认字。' },
  { at: 'sc_chief', from: 'q_xushen0', to: 'q_leave', who: 'chief', t: '我年轻时也想出去看看。后来有了石村，就走不开了。' },
  { at: 'xs_hall', from: 'q_xushen', to: 'q_end', who: '', t: '光幕上，一个名字后面带着“重瞳”二字的少年，一直稳稳地挂在最前面。' },
  { at: 'xs_hall', from: 'q_xushen', to: 'q_end', who: '', t: '“那个从大荒来的小娃娃又来了！”远处的石台上有人喊了一声。' },
  { at: 'dh_road', from: 'q_qingfeng', to: 'q_gate', who: '', t: '古道上偶尔能看见几辆兽车的残骸，车辙一直延伸到山外。' },
  // 补天阁
  { at: 'bt_gate', from: 'q_gate', to: 'q_join', who: 'qingfeng', t: '那个偷石头的人，我好像在山门里见过……算了，等你进去了再说。' },
  { at: 'bt_gate', from: 'q_bully', to: 'q_qf1', who: 'qingfeng', t: '外门也挺好的。真的。（她把头扭到一边）' },
  { at: 'bt_gate', from: 'q_qf1', to: 'q_qf3', who: 'qingfeng', t: '今天我把那套拳打了三百遍。……你别那样看我，我不累。' },
  { at: 'bt_gate', from: 'q_qf2', to: 'q_qf3', who: '外门弟子', t: '那个清风，平时不声不响的，打起架来是真不要命。' },
  { at: 'bt_court', from: 'q_end', to: 'q_end', who: 'qingfeng', t: '内门的功课好难。……可我一点都不想回去。' },
  { at: 'bt_court', from: 'q_bully', to: 'q_end', who: '补天阁弟子', t: '听说了吗？新来的小师弟把三个外门师兄打趴下了，诡爷还开口了！诡爷！' },
  { at: 'bt_train', from: 'q_qf1', to: 'q_end', who: '雷池师兄', t: '雨族的冰甲？挨一道雷就裂。我亲眼见过。' },
  { at: 'bt_lib', from: 'q_qf2', to: 'q_end', who: 'libelder', t: '残魂没有肉身，刀剑砍不着。可骨文是刻在魂上的，锁得住它们。' },
  { at: 'bd_desert', from: 'q_yu', to: 'q_end', who: '', t: '沙地上躺着一只被砸碎的蝎壳。看来有人知道该怎么对付它们——硬壳要砸，不要砍。' },
  { at: 'bt_court', from: 'q_lei', to: 'q_baiduan', who: 'guiye', t: '……（诡爷盯着神藤上那几个干瘪的葫芦，一动不动。）' },
  { at: 'bt_court', from: 'q_lei', to: 'q_baiduan', who: 'gezhu', t: '神藤一年不如一年了。补天阁的根，都在它身上。' },
  { at: 'bt_court', from: 'q_join', to: 'q_end', who: '补天阁弟子', t: '那个就是扛着半扇虎肉进山门的小娃娃？' },
  { at: 'bt_train', from: 'q_lib', to: 'q_end', who: '雷池师兄', t: '（头发还竖着）小师弟，你再来一次，我这辈子都不来雷池了。' },
  { at: 'bt_lib', from: 'q_lib', to: 'q_end', who: 'libelder', t: '第五层的楼梯，我加了一道锁。……你别看我，我知道锁不住你。' },
  { at: 'bt_wild', from: 'q_gate', to: 'q_lotus', who: '', t: '林子深处的虎穴里，传来一阵沉闷的呼噜声。' },
  // 百断山
  { at: 'baiduan', from: 'q_bdgate', to: 'q_yu', who: 'huolinger', t: '雨族的人在找你。他们那一族心眼小，你小心点。' },
  { at: 'baiduan', from: 'q_lion', to: 'q_spring', who: 'huolinger', t: '我那只火鸟最近总往你那只大红鸟边上凑……你管管你的鸟！' },
  { at: 'baiduan', from: 'q_lion', to: 'q_mount', who: 'huolinger', t: '花果山那棵怪树我远远见过，一身的油。要是我的火鸟在，一口火就能让它叫唤。' },
  { at: 'shicun', from: 'q_tomb0', to: 'q_tomb', who: 'linhu', t: '墓里的石兽，刀砍上去只冒火星子。对付那种东西，得用砸的。' },
  // night
  { at: 'shicun', night: 1, from: 'q_wake', to: 'q_shanbao', who: 'linhu', t: '天黑了别出村。大荒的夜，是凶兽的白天。' },
  { at: 'shicun', night: 1, from: 'q_ruin', to: 'q_end', who: 'ermeng', t: '（打着哈欠）新村夜里的星星真多啊……小不点你怎么还不睡？' },
  { at: 'sc_willow', night: 1, from: 'q_wake', to: 'q_end', who: 'willow', t: '（月光下，柳枝上浮着一层极淡的光，一明一暗，像在呼吸。）' },
  { at: 'sc_chief', night: 1, from: 'q_wake', to: 'q_end', who: 'chief', t: '（族长还没睡，就着油灯一遍遍摸那块刻满骨文的兽骨。）' },
  { at: 'dahuang', night: 1, from: 'q_wolf', to: 'q_end', who: '', t: '林子里亮起一对对绿莹莹的眼睛，又悄悄熄灭了。' },
  { at: 'dahuang', night: 1, from: 'q_wolf', to: 'q_end', who: '', t: '头顶有什么东西无声地掠过，带起一阵冷风。是夜枭。' },
  { at: 'bt_court', night: 1, from: 'q_bully', to: 'q_end', who: 'guiye', t: '（夜深了，诡爷还站在神藤下。月光照着他，他的影子好像比人还老。）' },
  { at: 'bt_gate', night: 1, from: 'q_qf1', to: 'q_qf3', who: '', t: '外门的院子里，木桩还在一声一声地响。' },
  { at: 'baiduan', night: 1, from: 'q_bdgate', to: 'q_end', who: '', t: '断山之间飘起一串幽绿的鬼火，排成一行，慢慢往山谷深处去了。' },
  { at: 'xs_hall', night: 1, from: 'q_xushen', to: 'q_end', who: '', t: '夜里的虚神界人少了些。光幕上的名字一个个暗下去，只有最前面那一个，一直亮着。' },
  { at: 'bd_gate', from: 'q_bdgate', to: 'q_end', who: '', t: '断口平整得像镜子，照出你的影子。据说这里的每一座山，都是被一剑斩断的。' },
  { at: 'bd_cliff', from: 'q_cliff', to: 'q_end', who: '', t: '崖上的古兵器在风里嗡嗡作响，像是在说话。' },
  { at: 'bd_spring', from: 'q_spring', to: 'q_end', who: '', t: '泉眼冒着白气。那头金鹏留下的羽毛，还散落在泉边。' },
  { at: 'bd_mount', from: 'q_mount', to: 'q_end', who: '', t: '山顶空荡荡的。神猴王不在，可满山的猴子都瞪着你，你怀里的桃子位置有点烫。' },
  // pets
  { at: '*', pet: 'maoqiu', who: '毛球', t: '（毛球蹲在你肩膀上，偷偷把你口袋里的肉干掏出来吃了。）' },
  { at: '*', pet: 'maoqiu', who: '毛球', t: '（毛球冲远处龇了龇牙。那边的灌木丛里，有什么东西悄悄退走了。）' },
  { at: '*', pet: 'dahong', who: '大红', t: '（大红在你头顶盘旋，嘎嘎叫着，好像在嘲笑谁。）' },
  { at: '*', pet: 'ertuzi', who: '二秃子', t: '（二秃子缩在你衣领里，光溜溜的身子打了个哆嗦。）' },
  // more voices (2026-11): running jokes, everyone has a personality
  { at: 'sc_street', from: 'q_wake', to: 'q_egg', who: 'dazhuang', t: '我昨晚梦见一头烤好的野猪自己跑到我嘴边……醒了发现在啃枕头。' },
  { at: 'sc_street', from: 'q_egg0', to: 'q_tomb', who: 'dazhuang', t: '小不点，你打回来的狼，能不能分我一条腿？……两条也行。' },
  { at: 'sc_street', from: 'q_ruin', to: 'q_leave', who: 'dazhuang', t: '新村子哪儿都好，就是离山远了，打猎得多走半天。我腿都瘦了。……真的，你摸摸。' },
  { at: 'sc_gate', from: 'q_wake', to: 'q_egg', who: 'pihou', t: '我今天一口气翻了十个跟头！第十一个……我们不提第十一个。' },
  { at: 'sc_gate', from: 'q_tomb0', to: 'q_shanbao', who: 'pihou', t: '我跟邻村的娃娃说，我跟你一起掏过青鳞鹰的窝。他们问我是谁，我说我是你大哥。' },
  { at: 'sc_gate', from: 'q_jijing', to: 'q_leave', who: 'pihou', t: '毛球跟我比爬树，它赢了。它还冲我做鬼脸。我要跟它决斗！……你别告诉它。' },
  { at: 'sc_yard', from: 'q_wake', to: 'q_bei', who: 'ermeng', t: '……（二猛默默递给你半罐兽奶。你没问是谁家的，他也没说。）' },
  { at: 'sc_yard', from: 'q_jijing', to: 'q_leave', who: 'ermeng', t: '毛球偷兽奶，比我还熟练。……我有点不服。' },
  { at: 'sc_yard', from: 'q_egg0', to: 'q_bei', who: 'linhu', t: '你那一拳是怎么打的？下回教教我。……别笑，我是认真的。' },
  { at: 'sc_yard', from: 'q_shanbao', to: 'q_leave', who: 'linhu', t: '你洗完药鼎那天，我家那张弓自己响了一声。我当了三十年猎人，头一回见。' },
  { at: 'sc_chief', from: 'q_wake', to: 'q_egg', who: 'chief', t: '兽奶不能当水喝。……你又偷喝了是不是？嘴上那圈白的还在呢！' },
  { at: 'sc_chief', from: 'q_yaoding', to: 'q_leave', who: 'chief', t: '（族长在磨一根骨针）给你缝衣裳。你一天打三架，袖子就没有一条是全的。' },
  { at: 'sc_willow', from: 'q_egg0', to: 'q_leave', who: 'willow', t: '（你冲柳神说今天打了三头狼。一片叶子落下来，正好盖在你头上——像是在说“知道了，别显摆”。）' },
  { at: 'sc_willow', from: 'q_jijing', to: 'q_leave', who: 'willow', t: '（毛球想爬上柳枝去摘叶子。柳枝轻轻一抖，它就顺着树干滑了下来，四脚朝天。）' },
  { at: 'dh_forest', from: 'q_wolf', to: 'q_end', who: '', t: '一只野兔从你脚边窜过去，跑出老远才回头看了一眼，确认你没追。' },
  { at: 'dh_stone', from: 'q_tomb0', to: 'q_end', who: '', t: '崖顶上那个空了的鹰窝还在。窝边多了几根新羽毛——它回来看过。' },
  { at: 'dh_road', from: 'q_xushen0', to: 'q_end', who: '', t: '古道边的老树上，有人用刀刻了一行字：“此路有娃，慎行。”' },
  { at: 'bt_gate', from: 'q_gate', to: 'q_join', who: 'qingfeng', t: '……你别盯着前面那人的干粮看了。我这儿还有半块饼。' },
  { at: 'bt_gate', from: 'q_qf1', to: 'q_qf2', who: 'qingfeng', t: '听说你在雷池被劈了七回？……头发都焦了。（她别过脸去，肩膀在抖）我没笑。' },
  { at: 'bt_gate', from: 'q_qf2', to: 'q_qf3', who: '外门弟子', t: '清风姐让我们每天多打一百拳。谁有意见？……没人有意见。' },
  { at: 'bt_court', from: 'q_bully', to: 'q_end', who: 'guiye', t: '……（诡爷看了你一眼。你等了半天，他什么都没说。）' },
  { at: 'bt_court', from: 'q_bully', to: 'q_end', who: 'gezhu', t: '伙房的厨子来找我告状了，说你一顿顶他们一天的米。……多吃点，长个子。' },
  { at: 'bt_court', from: 'q_qf2', to: 'q_end', who: '补天阁弟子', t: '小师弟，你上回在藏经阁吃的那个……是守阁人养了十年的灵芝。' },
  { at: 'bt_lib', from: 'q_qf2', to: 'q_end', who: 'libelder', t: '书是拿来看的，不是拿来垫屁股的。……更不是拿来包肉的！' },
  { at: 'bt_train', from: 'q_qf1', to: 'q_end', who: '雷池师兄', t: '我在雷池坐了五年，雷都不搭理我。你来三天，雷追着你劈。……这世道。' },
  { at: 'bt_wild', from: 'q_join', to: 'q_end', who: '', t: '林子里的老虎远远看见你，转身就钻回了洞里。洞口还用石头堵上了。' },
  { at: 'bd_gate', from: 'q_bdgate', to: 'q_lion', who: 'huolinger', t: '我叫火灵儿，火国的公主。……你那是什么表情？公主怎么了？公主也能打你。' },
  { at: 'bd_gate', from: 'q_yu', to: 'q_end', who: 'huolinger', t: '我回去查了，九头狮的肉是酸的。你别惦记了。……我没偷偷尝！' },
  { at: 'bd_gate', from: 'q_cliff', to: 'q_end', who: 'huolinger', t: '你那只大红鸟，昨天叼走了我火鸟的一根尾羽，还在它面前晃！你管不管？！' },
  { at: 'bd_lion', from: 'q_yu', to: 'q_end', who: '', t: '九头狮的洞里空荡荡的，地上有九个排得整整齐齐的、脑袋形状的坑。' },
  { at: 'bd_desert', from: 'q_cliff', to: 'q_end', who: '', t: '沙丘上有一块人形的湿印子，四周全是大红的爪印。那是你被冻成冰的地方。' },
  { at: '*', pet: 'maoqiu', who: '毛球', t: '（毛球把一颗不知道从哪儿摘来的果子塞进你手里，然后伸手要你的肉干。这是交易。）' },
  { at: '*', pet: 'maoqiu', who: '毛球', t: '（毛球学你走路，学得太像了，你都不好意思骂它。）' },
  { at: '*', pet: 'dahong', who: '大红', t: '（大红落在你头顶，开始用嘴给你梳头。梳完了，你的头发比鸟窝还乱。）' },
  { at: '*', pet: 'dahong', who: '大红', t: '（远处飞过一只火红的鸟。大红立刻挺起胸膛，嘎了一声，响得震耳朵。）' },
  { at: '*', pet: 'ertuzi', who: '二秃子', t: '（二秃子盯着别的鸟看了很久，又低头看了看自己光溜溜的身子，叹了口气。鸟也会叹气。）' },
  { at: '*', pet: 'ertuzi', who: '二秃子', t: '（二秃子又饿了。它刚吃完。）' },
  // ---- round 2 ----
  { at: 'sc_street', from: 'q_wake', to: 'q_wolf', who: '石村的大婶', t: '小不点！昨天是不是你把我晾的肉干摘了？……算了算了，长身体呢。' },
  { at: 'sc_street', from: 'q_egg0', to: 'q_shanbao', who: '石村的大婶', t: '大壮他娘说，大壮那天回来，抱着鹰蛋哭了一晚上，说是舍不得吃。' },
  { at: 'sc_street', from: 'q_bei', to: 'q_shanbao', who: 'dazhuang', t: '狈村的人都怕你了！我今天去河边，他们看见我是石村的，扭头就走。我威风了一整天！' },
  { at: 'sc_street', from: 'q_jijing', to: 'q_leave', who: 'dazhuang', t: '毛球昨天偷了我一块肉，我追了它三圈，它爬到柳神身上冲我做鬼脸。我不敢上去。' },
  { at: 'sc_street', from: 'q_gate', to: 'q_end', who: 'dazhuang', t: '你不在，没人陪我进山了。我自己去了一回，被一只野猪追回来了。……别告诉皮猴。' },
  { at: 'sc_street', from: 'q_gate', to: 'q_end', who: '石村的大婶', t: '小不点回来啦！快快快，家里还有半只烤羊腿！……哎你别全拿走啊！' },
  { at: 'sc_gate', from: 'q_egg0', to: 'q_tomb', who: 'pihou', t: '族长罚我们几个扫三天村口。大壮扫了一天就说腰疼。他哪儿有腰？' },
  { at: 'sc_gate', from: 'q_bandit', to: 'q_leave', who: 'pihou', t: '你把族长救回来的时候，我在村口哭了。……那是沙子迷了眼！' },
  { at: 'sc_gate', from: 'q_gate', to: 'q_end', who: 'pihou', t: '我现在能翻十二个跟头了！第十一个和第十二个……我们一起不提。' },
  { at: 'sc_yard', from: 'q_egg0', to: 'q_tomb', who: 'ermeng', t: '那颗鹰蛋……要是孵不出来，能不能炒了？我就问问。' },
  { at: 'sc_yard', from: 'q_bandit', to: 'q_leave', who: 'linhu', t: '你开洞天那会儿，我离着二里地都看见光了。我还以为天要塌了。' },
  { at: 'sc_yard', from: 'q_gate', to: 'q_end', who: 'linhu', t: '村里的娃娃现在都学你，天不亮就爬起来迎霞锻体。可惜没一个学会的，全在空地上打瞌睡。' },
  { at: 'sc_yard', from: 'q_gate', to: 'q_end', who: 'ermeng', t: '……（二猛冲你点了点头，又从怀里摸出一罐兽奶。这是他打招呼的方式。）' },
  { at: 'sc_chief', from: 'q_egg0', to: 'q_tomb', who: 'chief', t: '那几只小鹰？柳神留下了一只。剩下的两枚蛋……（族长咳了一声）……补身子了。' },
  { at: 'sc_chief', from: 'q_bandit', to: 'q_leave', who: 'chief', t: '（族长的手腕上还有绳子勒出的印子）不碍事。比起当年猎貔貅，这算什么。' },
  { at: 'sc_chief', from: 'q_gate', to: 'q_end', who: 'chief', t: '你那张床我没让人动。被子晒过了，还是你走的时候那床。' },
  { at: 'sc_willow', from: 'q_bandit', to: 'q_leave', who: 'willow', t: '（柳枝上多了一片新叶。你数了数，比上个月多了三片。）' },
  { at: 'sc_willow', from: 'q_gate', to: 'q_end', who: 'willow', t: '（你回来的时候，柳枝垂得比平时低一点，碰了碰你的肩膀。）' },
  { at: 'dh_forest', from: 'q_egg0', to: 'q_end', who: '', t: '林子里有棵树上刻着几道歪歪扭扭的印子，是大壮比身高留下的。最下面一道，是你的。' },
  { at: 'dh_deep', from: 'q_ruin', to: 'q_end', who: '', t: '那四位至尊打出来的裂谷还在，深不见底。裂谷边上长出了一圈嫩草。' },
  { at: 'dh_tomb', from: 'q_bei', to: 'q_end', who: '', t: '狻猊墓的石门上，多了一道小小的手印——比你的手还小一点。是你自己按的，你忘了。' },
  { at: 'dh_bei', from: 'q_bei', to: 'q_end', who: '狈村的小孩', t: '（一个狈村的小孩远远看着你，壮着胆子喊了一声：“你、你能教我打拳吗？”然后被他娘拽走了。）' },
  { at: 'dh_road', from: 'q_qingfeng', to: 'q_end', who: '', t: '那辆翻倒的兽车已经被人拖走了。路边多了一个小小的土堆，土堆前插着一把断刀。' },
  { at: 'dh_road', from: 'q_gate', to: 'q_end', who: '过路的猎户', t: '小兄弟，前面那段路……哦，是你啊。那没事了，你走吧，该担心的是山里的东西。' },
  { at: 'xs_hall', from: 'q_xushen', to: 'q_end', who: '虚神界的少年', t: '你就是那个大荒来的？……能不能别用那种眼神看我？我们羽族不好吃！' },
  { at: 'xs_hall', from: 'q_xushen', to: 'q_end', who: '虚神界的少女', t: '光幕上又多了一个纪录。纪录后面的名字，写的是“小不点”。……这名字也太敷衍了吧。' },
  { at: 'xs_hall', from: 'q_xushen', to: 'q_end', who: '虚神界的少年', t: '我族长老说，跟大荒来的打架，先把干粮藏好。我以为他开玩笑，结果……我的干粮呢？' },
  { at: 'bt_gate', from: 'q_join', to: 'q_qf1', who: '外门弟子', t: '那个就是扛着虎肉拜师的？……我们外门三百年来，头一回有人带着“见面礼”进门。' },
  { at: 'bt_gate', from: 'q_qf1', to: 'q_qf2', who: 'qingfeng', t: '你别老来看我练拳……你在旁边吃东西，我饿。' },
  { at: 'bt_gate', from: 'q_qf3', to: 'q_end', who: '外门弟子', t: '清风师姐去了内门，外门的木桩终于不用每个月换了。' },
  { at: 'bt_court', from: 'q_bully', to: 'q_lei', who: '补天阁弟子', t: '那几个收份例的师兄被你打了以后，主动把份例全退了，还附赠了一句“小师弟好”。' },
  { at: 'bt_court', from: 'q_qf1', to: 'q_end', who: 'gezhu', t: '你在雷池那几天，雷池的雷少了三成。……雷池管事来找我诉苦了。' },
  { at: 'bt_court', from: 'q_qf2', to: 'q_end', who: 'guiye', t: '……（诡爷递给你一个干瘪的小葫芦。里面什么都没有，可你拿着它，心里莫名地静。）' },
  { at: 'bt_court', from: 'q_return', to: 'q_end', who: '补天阁弟子', t: '神藤上的葫芦今天又鼓了一个！阁主数了三遍，笑了三遍。' },
  { at: 'bt_lib', from: 'q_qf2', to: 'q_end', who: '藏经阁的扫地弟子', t: '守阁人这几天在第五层的锁上又加了一把锁。你说加了有用吗？……反正我是不敢说没用。' },
  { at: 'bt_train', from: 'q_qf1', to: 'q_end', who: '雷池师兄', t: '我们给雷池边那块焦黑的石头起了名字，叫“小师弟坐过的”。现在大家都抢着坐，图个吉利。' },
  { at: 'bt_wild', from: 'q_join', to: 'q_end', who: '补天阁弟子', t: '阁外山林的老虎最近都很乖，见了穿补天阁衣裳的人就绕道。……全是托你的福。' },
  { at: 'bt_tiger', from: 'q_join', to: 'q_end', who: '', t: '虎穴里那汪黑水还在，水面上空荡荡的。洞口多了一行字：“莲已摘，勿扰。”' },
  { at: 'bd_gate', from: 'q_bdgate', to: 'q_lion', who: '各族少年', t: '那个就是在虚神界刷纪录的？……他手里拿的是什么？烤肉？进百断山还带烤肉？' },
  { at: 'bd_gate', from: 'q_lion', to: 'q_end', who: '各族少年', t: '我们族的长辈说，进了百断山，先活着，再抢机缘。你那个火国公主朋友，好像只听了后半句。' },
  { at: 'bd_gate', from: 'q_cliff', to: 'q_end', who: 'huolinger', t: '你背上那把锈剑……看着跟烧火棍似的，可我的火鸟离它三丈远就不肯过去了。' },
  { at: 'bd_lion', from: 'q_bdgate', to: 'q_lion', who: '', t: '狮岭上的石头缝里，到处都是金色的长毛。山顶的洞里，传出很沉的呼吸声——九道。' },
  { at: 'bd_desert', from: 'q_lion', to: 'q_yu', who: '', t: '荒漠上一点风都没有。太安静了，像是有人在等你。' },
  { at: 'bd_cliff', from: 'q_cliff', to: 'q_end', who: '各族少年', t: '那块灰石头……就是你拿去砸碎石柱的？我拿起来试了试——我的手腕到现在还疼。' },
  { at: 'bd_spring', from: 'q_cliff', to: 'q_spring', who: '', t: '泉眼边上一点声音都没有。白虎趴着，金鹏盘着，一个白衣少女站着——三个都在等。' },
  { at: 'bd_bone', from: 'q_tiangu', to: 'q_end', who: '', t: '骨山塌了一半。风从骨头缝里吹过去，呜呜地响，不像哭，像是在哼一首很老的歌。' },
  { at: 'bd_mount', from: 'q_spring', to: 'q_mount', who: '', t: '满山的果子香得人发晕。你吞了好几口口水，毛球已经在流哈喇子了。' },
  { at: '*', pet: 'maoqiu', who: '毛球', t: '（毛球蹲在你头顶，用你的头发编了一根小辫子。你摸到的时候，它假装在看风景。）' },
  { at: '*', pet: 'maoqiu', who: '毛球', t: '（路过一棵果树，毛球“嗖”地上去了。下来的时候，嘴里两个，手里两个，尾巴上还卷着一个。）' },
  { at: '*', pet: 'maoqiu', who: '毛球', t: '（毛球冲一只路过的山雀龇牙。山雀没理它。毛球很受伤。）' },
  { at: '*', pet: 'dahong', who: '大红', t: '（大红叼来一只死老鼠放在你脚边，一脸“不用谢”。）' },
  { at: '*', pet: 'dahong', who: '大红', t: '（大红又在跟毛球抢一块肉。两个打成一团，最后肉掉进了草丛，谁也没吃着。）' },
  { at: '*', pet: 'dahong', who: '大红', t: '（大红站在高处，挺着胸，等你夸它。你不夸，它就一直站着。）' },
  { at: '*', pet: 'ertuzi', who: '二秃子', t: '（二秃子在你手心里睡着了，打着很小很小的呼噜。）' },
  { at: '*', pet: 'ertuzi', who: '二秃子', t: '（二秃子背上好像冒出了一根很细很细的绒毛。你们一起盯着它看了很久。）' },
  // 石国 · 皇都
  { at: 'sg_gate', from: 'q_sgmarket', to: 'q_fin', who: '守门的兵', t: '……荒、荒天侯？（他把长枪往身后一藏）小的眼拙，上回那三块灵石，您千万别往心里去。' },
  { at: 'sg_gate', from: 'q_sgmarket', to: 'q_fin', who: '进城的商队', t: '城外那头九个脑袋的狮子，是谁家的？它冲我们的骆驼笑了一下，骆驼当场跪了。' },
  { at: 'sg_gate', from: 'q_sgmarket', to: 'q_jiaojun', who: '守门的兵', t: '城门这块石头是从太古神山上搬下来的，刀砍不留印。（你看着它，舔了舔嘴唇）……您不会是想啃吧？' },
  { at: 'sg_wild', from: 'q_sgarrive', to: 'q_fin', who: '九头狮', t: '大哥，城外这片林子我巡过了。铁背狼认我当老大了——呃，认您当老大的老大。' },
  { at: 'sg_wild', from: 'q_sgarrive', to: 'q_fin', who: '九头狮', t: '我第三个脑袋说想吃城里的糖葫芦。我第七个脑袋说它也想。……大哥，能带九串吗？' },
  { at: 'sg_wild', from: 'q_sgarrive', to: 'q_fin', who: '赶路的书生', t: '皇都外的官道修了三百年，每年都修，每年都坑。听说修路的钱，都修进了某几家王府的后院。' },
  { at: 'sg_market', from: 'q_yuwang', to: 'q_fin', who: '卖糖人的老头', t: '小兄弟，糖人要什么样的？……九头狮子？那得九根签子。' },
  { at: 'sg_market', from: 'q_yuwang', to: 'q_fin', who: '烤肉摊的胖掌柜', t: '你又来了！我这摊子开了二十年，没见过一个人能吃空三个烤架的。……今天给你留了第四个。' },
  { at: 'sg_market', from: 'q_yuwang', to: 'q_fin', who: '说书先生', t: '上回书说到，那大荒来的孩子一口咬下雨神法旨——（台下有人喊：“他在这儿呢！”）……今天先讲到这儿。' },
  { at: 'sg_market', from: 'q_yuwang', to: 'q_zhong', who: '茶楼伙计', t: '雨王府最近在招人看门，工钱给得高。听说上一批看门的，是被一个孩子吓跑的。' },
  { at: 'sg_market', from: 'q_wuwang', to: 'q_fin', who: '卖符纸的道人', t: '雨神法旨可不是凡物，吃了是要闹肚子的！……你没闹？那你这肚子，比法旨还硬。' },
  { at: 'sg_market', from: 'q_invite', to: 'q_fin', who: '茶楼伙计', t: '武王府的大门换了三回了。第一回被大魔神砸的，第二回被你砸的，第三回……是他们自己吵架砸的。' },
  { at: 'sg_market', from: 'q_invite', to: 'q_shouyan', who: 'leiting', t: '寿宴上坐哪儿是有讲究的。你……算了，你坐哪儿都一样，反正你会往菜最多的那桌挪。' },
  { at: 'sg_market', from: 'q_jiaojun', to: 'q_fin', who: '说书先生', t: '各位看官！今日讲“荒天侯大战两尊者”！——那孩子脖子上的小塔一亮，好家伙，天都矮了三尺！' },
  { at: 'sg_market', from: 'q_jiaojun', to: 'q_fin', who: '烤肉摊的胖掌柜', t: '我这摊子现在挂了块牌子：“荒天侯吃过”。生意好了三倍。你下回来，记得在门口多站一会儿。' },
  { at: 'sg_market', from: 'q_houfu', to: 'q_fin', who: 'leiting', t: '雷族的长老问我，为什么跟一个大荒来的野孩子混在一起。我说：因为他请客。' },
  { at: 'sg_market', from: 'q_v3', to: 'q_fin', who: 'leiting', t: '火国那边来信了，说他们的公主最近天天站在城楼上往西看。……你脸红什么？' },
  { at: 'sg_market', from: 'q_dajie', to: 'q_tiangong', who: '茶楼伙计', t: '（压低声音）天上掉下来那帮人，走路都不看地的。昨天有个在我们店里喝茶，喝完说“下界的茶，也就这样”——然后没给钱。' },
  { at: 'sg_market', from: 'q_qishen', to: 'q_fin', who: '说书先生', t: '今日不收钱！讲“石皇登基”！……那孩子坐上龙椅说的第一句话是：“给我拿个垫子来。”' },
  { at: 'sg_market', from: 'q_shengdi', to: 'q_fin', who: '卖糖人的老头', t: '那天天裂开的时候，我把摊子收了，跪在地上等死。后来天又合上了……老汉我活了七十年，头一回觉得这天，是有人在扛着的。' },
  { at: 'sg_yuwang', from: 'q_wuwang', to: 'q_fin', who: '雨王府的门房', t: '（他看见你，转身就把门关上了。门缝里传出一句：“法旨库里没有了！真没有了！”）' },
  { at: 'sg_yuwang', from: 'q_wuwang', to: 'q_fin', who: '雨族少年', t: '我们族长把剩下的雨神法旨都锁进了铁箱子，箱子外面又刻了一圈符文，符文外面写着：“石昊勿近”。' },
  { at: 'sg_wuwang', from: 'q_invite', to: 'q_fin', who: '武王府的老仆', t: '子腾老爷那天以后，一直坐在祠堂里，不说话，也不吃饭。……小少爷，你别去看他。也别不去。' },
  { at: 'sg_wuwang', from: 'q_invite', to: 'q_fin', who: '武王府的小丫鬟', t: '你就是那个石昊？……你比他们说的好看。（她红着脸跑开了，跑了两步又回头）石毅少爷其实……也没那么坏。' },
  { at: 'sg_wuwang', from: 'q_houfu', to: 'q_fin', who: '武王府的护卫', t: '府里一半的人跟着你走了。剩下的一半，晚上睡觉都睁着一只眼——怕你半夜回来再砸一回门。' },
  { at: 'sg_palace', from: 'q_jiaojun', to: 'q_fin', who: '皇宫侍卫', t: '寿宴那天的烤架，到现在还没洗干净。御膳房说上面那股蛛腿味，怎么都去不掉。' },
  { at: 'sg_palace', from: 'q_jiaojun', to: 'q_dajie', who: 'huolinger', t: '我、我是来给人皇送寿礼的！顺路！……你别笑！' },
  { at: 'sg_palace', from: 'q_houfu', to: 'q_fin', who: '皇宫侍卫', t: '荒天侯，人皇说了，您进宫不用通报。……还说了，您进宫的时候，御膳房要多备二十个人的饭。' },
  { at: 'sg_field', from: 'q_houfu', to: 'q_fin', who: '校军场的教头', t: '那天两位尊者砸出来的坑，到现在还在。我们干脆不填了，立了块碑：“荒天侯在此打过架”。' },
  { at: 'sg_field', from: 'q_houfu', to: 'q_fin', who: '新兵', t: '教头说，练到能接你一拳，就能当百夫长。我练了三个月……能接你一根手指了。' },
  { at: 'sg_hou', from: 'q_leiting', to: 'q_fin', who: 'laozhong', t: '侯爷，库房里的宝药老奴都给您清点好了。……您别一顿吃完啊！' },
  { at: 'sg_hou', from: 'q_leiting', to: 'q_fin', who: 'laozhong', t: '老太爷要是知道您现在这样，一定会在门口笑出声来。他笑起来，半条街都听得见。' },
  { at: 'sg_hou', from: 'q_leiting', to: 'q_fin', who: '侯府的厨子', t: '侯爷，今天想吃什么？……全要？好嘞。（他转身冲后厨喊）把那头整牛架上！' },
  { at: 'sg_hou', from: 'q_v3', to: 'q_dajie', who: 'laozhong', t: '侯爷走的那晚，老奴在门口站了一夜。您下回要走，跟老奴说一声。老奴不拦，就是想……送送。' },
  { at: 'sg_hou', from: 'q_shengdi', to: 'q_fin', who: 'laozhong', t: '陛下。（他行了个礼，又忍不住笑了）……老奴还是叫您小少爷吧。叫陛下，舌头打结。' },
  { at: 'sg_inner', from: 'q_qishen', to: 'q_fin', who: '老侍卫', t: '那道诏令，人皇写好以后，压在御案上整整一年。他说：“那孩子会来的。他要是不来，就是还没吃饱。”' },
  { at: 'sg_inner', from: 'q_qishen', to: 'q_fin', who: '禁军统领', t: '陛下，石崇……他求见。他说他什么都不要，只想去您那个石村，种地。' },
  { at: 'sg_sky', from: 'q_dajie', to: 'q_fin', who: '守台的老兵', t: '天空战场上那道裂缝，是劫光劈的。下雨的时候，雨水落进去，就再也不出来了。' },
  { at: 'sg_altar', from: 'q_farewell', to: 'q_fin', who: '收拾残局的禁军', t: '三大圣地的人跑得太急，丢下了一地的法器。……陛下，这根金子做的拐杖，您要不要？' },
  { at: 'shiguo', from: 'q_houfu', to: 'q_fin', night: 1, who: '打更的老汉', t: '天干物燥，小心火烛——（看见你）荒天侯夜里还出来逛？……那这条街，今晚就不用打更了。' },
  // 火国
  { at: 'hg_border', from: 'q_huohuang', to: 'q_fin', who: '火国守将', t: '公主殿下吩咐过：荒天侯进出火国，不查、不问、不收钱。……还有，不让碰她的火鸟。' },
  { at: 'hg_border', from: 'q_huohuang', to: 'q_fin', who: '火国守将', t: '边关的风一年四季都是热的。我们这儿的人，冬天穿单衣，夏天……夏天也穿单衣，不然没得脱了。' },
  { at: 'hg_city', from: 'q_niepan', to: 'q_fin', who: 'huolinger', t: '我的火鸟最近不太理我，天天往你那只大红鸟边上飞。……都怪你！' },
  { at: 'hg_city', from: 'q_niepan', to: 'q_fin', who: 'huolinger', t: '父皇说，你在百断山偷圣药那天，他其实是故意放你走的。……他才不会承认呢。' },
  { at: 'hg_city', from: 'q_letter', to: 'q_fin', who: 'huolinger', t: '你从涅槃池出来那天，瘦得只剩一把骨头。我让御膳房做了三天的饭，你吃了三天。……你到底是人还是饕餮？' },
  { at: 'hg_city', from: 'q_niepan', to: 'q_fin', who: 'huohuang', t: '涅槃池边上那行字，朕守了十几年。今天总算等到了该看它的人。' },
  { at: 'hg_city', from: 'q_letter', to: 'q_fin', who: 'huohuang', t: '灵儿这丫头，以前一年都不往西边看一眼。……你小子，好自为之。' },
  { at: 'hg_city', from: 'q_huohuang', to: 'q_fin', who: '皇城卖火晶的小贩', t: '火晶糖！咬一口，嘴里冒火星子！……你吃了五块？你、你嘴里怎么还没冒？' },
  { at: 'hg_volcano', from: 'q_huohuang', to: 'q_fin', who: '采火晶的矿工', t: '火山口里住着一头熔岩龟王，背上的壳比我们的矿还值钱。没人敢去敲。' },
  { at: 'hg_nirvana', from: 'q_letter', to: 'q_fin', who: '守池的老祭司', t: '涅槃池几百年没让外人进过。上一个外人，是你娘。……你们娘儿俩，都挺能扛。' },
  { at: 'huoguo', from: 'q_huohuang', to: 'q_fin', night: 1, who: '巡夜的火国兵', t: '夜里火山的光能照到边关。我们火国人说，那是祖宗在点灯。' },
  // 第四卷 · 下界边陲
  { at: 'bz_camp', from: 'q_baojie', to: 'q_fin', who: 'bzlao', t: '我这条腿，是四十年前在战场尽头丢的。那会儿我也觉得自己能走过去。' },
  { at: 'bz_camp', from: 'q_baojie', to: 'q_fin', who: '营地的货郎', t: '金乌族的人买东西从来不还价，天角蚁族的人从来不给钱，狰族的人……直接把我的摊子当饭吃。' },
  { at: 'bz_camp', from: 'q_baojie', to: 'q_bzcore', who: '天角蚁族少年', t: '你就是那个“荒”？（他把你从头看到脚）……也没多高嘛。' },
  { at: 'bz_camp', from: 'q_bzcore', to: 'q_fin', who: '天角蚁族少年', t: '（他看见你，往旁边让了让）……荒哥。我刚才什么都没说。' },
  { at: 'bz_camp', from: 'q_bzcore', to: 'q_fin', who: '金乌族少年', t: '我那三个族兄回去以后，族长问他们是谁打的。他们说：“荒。”族长问荒是谁，他们说：“……一个特别能吃的。”' },
  { at: 'bz_camp', from: 'q_bzcore', to: 'q_fin', who: '狰族少年', t: '我们狰族不服人。……可你那一拳，我服。' },
  { at: 'bz_camp', from: 'q_yunzu', to: 'q_fin', who: 'bzlao', t: '祭坛碎的那天，我在营地里坐了一夜。我那个兄弟……总算能歇着了。' },
  { at: 'bz_camp', from: 'q_bzcamp', to: 'q_fin', night: 1, who: '守夜的狰族战士', t: '夜里别往战场里走。那里面的喊杀声，是死人在喊。' },
  { at: 'bz_field', from: 'q_bzfield', to: 'q_fin', who: '捡兵器的少年', t: '这片地上插着的兵器，有一半是金乌族的，一半是天角蚁族的，还有一半……（他想了想）反正很多。' },
  { at: 'bz_field', from: 'q_bzcore', to: 'q_fin', who: '金乌族战士', t: '你别过来！……我是说，你过来可以，别打我。' },
  { at: 'bz_core', from: 'q_altar', to: 'q_fin', who: '守墙的百族老兵', t: '墙开了一道缝以后，好多人想从缝里挤过去。挤过去的，都去了祭坛。' },
  { at: 'bz_altar', from: 'q_yunzu', to: 'q_fin', who: '收拾祭坛的云族人', t: '祭坛底下挖出来好多锁链，一根一根的，都写着名字。我们把名字都刻在了崖上。' },
  { at: 'bz_yun', from: 'q_huobye', to: 'q_fin', who: 'yunlao', t: '族里的小娃娃天天趴在云边上往上看。他们说，大哥哥答应了，会回来讲上面的故事。' },
  { at: 'bz_yun', from: 'q_huobye', to: 'q_fin', who: '云族的小娃娃', t: '大哥哥，你上去了吗？……你怎么又下来了？上面不好玩吗？' },
  { at: 'bz_yun', from: 'q_yunzu', to: 'q_fin', who: '云族的老婆婆', t: '我们云族的人，走路是不出声的。你走路……（她听了听）像一头熊。' },
  { at: 'bz_road', from: 'q_v5', to: 'q_fin', who: '在登天路下徘徊的少年', t: '听说有人从这条路走上去了。……我也想试试。（他看了看满台阶的雷）明年吧。' },
  // 第五卷 · 上界
  { at: 'sj_gate', from: 'q_ladder', to: 'q_fin', who: '路边歇脚的修士', t: '（他看见你，往旁边挪了挪）……罪州来的。别靠太近。' },
  { at: 'sj_gate', from: 'q_tianshen', to: 'q_fin', who: '路边歇脚的修士', t: '（他看见你，站了起来）荒、荒兄！我刚才不是在说你！' },
  { at: 'sj_town', from: 'q_ladder', to: 'q_fin', who: '天仙城的掌柜', t: '下界来的？（他把价钱翻了一倍）……罪州来的，加收一成“晦气钱”。' },
  { at: 'sj_town', from: 'q_tianshen', to: 'q_fin', who: '天仙城的掌柜', t: '荒爷！（他把价钱减了一半）您随便拿，随便拿！晦气钱？什么晦气钱？没听说过！' },
  { at: 'sj_town', from: 'q_dojo', to: 'q_fin', who: 'qidaolin', t: '徒弟，为师跟你说，三千州的饭馆，哪家最便宜，哪家能赊账，为师门儿清。' },
  { at: 'sj_town', from: 'q_dojo', to: 'q_fin', who: 'qidaolin', t: '为师年轻的时候，也是一表人才。（他摸了摸乱糟糟的胡子）……真的。' },
  { at: 'sj_town', from: 'q_kuang', to: 'q_fin', who: 'qidaolin', t: '天人族那个护道者又来找为师了。为师跟他说：“你打我徒弟一下，我就去你家矿里再挖一车。”他就走了。' },
  { at: 'sj_town', from: 'q_qidao', to: 'q_fin', who: '天仙城的说书人', t: '至尊道场？（台下哄笑）那是三千州最大的道场——因为它只有一个人，地方够大！' },
  { at: 'sj_town', from: 'q_tianshen', to: 'q_fin', who: '天仙城的说书人', t: '今天不讲笑话了。今天讲：一个罪血，在至尊古台上，斩了一位天神。' },
  { at: 'sj_academy', from: 'q_qidao', to: 'q_fin', who: '书院执事', t: '天梯八级全过……被齐道临那个老骗子拐跑了。院长知道了，摔了三个茶杯。' },
  { at: 'sj_academy', from: 'q_dojo', to: 'q_fin', who: '天仙书院的师姐', t: '你就是那个把我师弟们打跑的“大师兄”？……（她笑了）他们回来以后，一个月没敢出门。' },
  { at: 'sj_ladder', from: 'q_qidao', to: 'q_fin', who: '在天梯下发呆的少年', t: '第七级问“何为道”，我答了三天，都没过。听说有人踢翻了那盏灯就过了？……我怎么没想到！' },
  { at: 'sj_desert', from: 'q_tianren', to: 'q_fin', who: 'qidaolin', t: '这根柱子，是为师小时候刻过字的。（他指着一个歪歪扭扭的“齐”字）至尊道场，以前人很多的。' },
  { at: 'sj_tianren', from: 'q_kuang', to: 'q_fin', who: '天人城的守卫', t: '（他握紧了枪，又松开了）……荒，城里的接风宴，以后不敢摆了。' },
  { at: 'sj_gutai', from: 'q_tianshen', to: 'q_fin', who: '古台下的天才', t: '天碑上那个“罪”字，有人想把它抹掉。抹了三天，抹不掉。' },
  { at: 'sj_gutai', from: 'q_tianshen', to: 'q_fin', who: '古台下的天才', t: '我在第三层下面转了三个月。你上去的那天……我决定，明天再试一次。' },
  { at: 'sj_wild', from: 'q_v5end', to: 'q_fin', who: '葛潜', t: '花蕾还没开。等它开的那天，我们再打一场。……你别再舔龙涎了，那东西是用来炼药的！' },
  { at: 'shangjie', from: 'q_ladder', to: 'q_fin', night: 1, who: '上界的守夜人', t: '上界的夜里，星星离得很近。你伸手，好像就能摘下来一颗。' },
  // 第六卷 · 三千州
  { at: 'sq_town', from: 'q_yinmo', to: 'q_fin', who: 'qidaolin', t: '徒弟，争霸城的馆子为师都打听好了。最便宜的那家，老板是为师的老相识——他欠为师钱。' },
  { at: 'sq_town', from: 'q_yinmo', to: 'q_arena', who: '争霸城的说书人', t: '八个神火境围一个人！那蓝一尘，怕是要把麒麟交出来了。' },
  { at: 'sq_town', from: 'q_arena', to: 'q_fin', who: '争霸城的说书人', t: '银磨山八个天骄，一个都没下山！诸位，三千州要变天了！' },
  { at: 'sq_town', from: 'q_arena', to: 'q_fin', who: '蓝一尘', t: '八珍麒天天往争霸台那边跑，拦都拦不住。它说……（他顿了顿）它想看你打架。' },
  { at: 'sq_town', from: 'q_kuliu', to: 'q_arena2', who: '酒楼里的天骄', t: '那个罪血跑了！五百八十八场，最后还是跑了！哈哈——（旁边有人小声说：“他是走下去的，不是跑。”）' },
  { at: 'sq_town', from: 'q_v7', to: 'q_fin', who: '酒楼里的天骄', t: '……（他看见你，把手里的酒杯放下，站了起来）荒兄。上回在台下，我也喊了。我给你赔个不是。' },
  { at: 'sq_town', from: 'q_v7', to: 'q_fin', who: 'qidaolin', t: '至尊道场门口现在排着长队，全是来拜师的！为师……为师一个都没收。（他挺起胸）至尊道场，一代只传一个。' },
  { at: 'sq_arena', from: 'q_kuliu', to: 'q_arena2', who: '孤剑云', t: '（他抱着剑坐在台边）……你还会回来的。我等着。' },
  { at: 'sq_arena', from: 'q_v7', to: 'q_fin', who: '争霸台的裁判', t: '台上那些坑，现在有人专门来看。指着最大的那个说：“荒打的。”' },
  { at: 'sq_cliff', from: 'q_arena2', to: 'q_fin', who: '', t: '（枯柳根上的那点绿，又长大了一点。你蹲下来，看了它很久。）' },
  { at: 'sq_valley', from: 'q_arena', to: 'q_fin', who: '蓝一尘', t: '八珍麒吃的八种草，我给你包了一包。……你别自己吃啊，那是给麒麟的。' },
  { at: 'sq_wild', from: 'q_sqtown', to: 'q_fin', who: '磨刀的天骄', t: '我在这儿磨了三个月的刀。等我磨好了……（他看见你，刀掉了）……再磨三个月。' },
  // 第七卷 · 仙古
  { at: 'xg_gate', from: 'q_xgruins', to: 'q_fin', who: '守门的老人', t: '仙古的门开一回，要死很多人。门关的时候，里面的人，有一半出不来。' },
  { at: 'xg_ruins', from: 'q_xglake', to: 'q_fin', who: '石毅', t: '这里的柱子上刻着字。我用重瞳看了很久，看懂了一句：“我们不是最后一个纪元。”' },
  { at: 'xg_forest', from: 'q_xgruins', to: 'q_fin', who: '', t: '（一棵比山还高的树，低下头来，好像在看你。你冲它挥了挥手。它的叶子，哗啦啦地响了一阵。）' },
  { at: 'xg_lake', from: 'q_xgdian', to: 'q_fin', who: '石毅', t: '小时候的事，我记不太清了。可我记得有一个比我小的孩子，总是跟在我后面跑。……是你吧？' },
  { at: 'xg_peak', from: 'q_xgend', to: 'q_fin', who: '', t: '（峰顶那个“帝”字，被人在下面添了一行小字：“刻得太大了”。字迹很像帝冲的。）' },
  // 第八卷 · 帝关
  { at: 'dg_city', from: 'q_qiwang', to: 'q_anlan', who: 'mengtz', t: '帝关的饭难吃吧？（他笑了）我吃了几万年，还是难吃。' },
  { at: 'dg_city', from: 'q_qiwang', to: 'q_anlan', who: 'mengtz', t: '你问我为什么守在这儿？……几万年前，有个人替我挡过一刀。他是七王的后人。' },
  { at: 'dg_city', from: 'q_qiwang', to: 'q_fin', who: '帝关的老兵', t: '新来的？（他看了看你）能活过第一场仗，再来跟我说话。' },
  { at: 'dg_city', from: 'q_v9', to: 'q_fin', who: '帝关的老兵', t: '孟老那一剑，我看见了。（他擦了擦眼睛）我在帝关守了八千年，没见过那么好看的一剑。' },
  { at: 'dg_city', from: 'q_dizu', to: 'q_fin', who: '帝关的伙夫', t: '今天的饭少做了三十份。……不是没米了。是吃饭的人，少了三十个。' },
  { at: 'dg_qiwang', from: 'q_wangjia', to: 'q_fin', who: 'qiwanghou', t: '我每天都给七王添灯油。添着添着，就觉得他们在看着我。……你也觉得吗？' },
  { at: 'dg_qiwang', from: 'q_v9', to: 'q_fin', who: 'qiwanghou', t: '孟老的牌位，我也放进来了。第八个。（他低着头添灯油）他不是七王的后人。可他也守了。' },
  { at: 'dg_qiwang', from: 'q_v9end', to: 'q_fin', who: 'qiwanghou', t: '门匾换了。（他摸了摸额头上那个淡下去的字）……有人跟我说，这个字，以后会有人替我们洗掉。他说话算话。' },
  { at: 'dg_wall', from: 'q_dizu', to: 'q_fin', who: '城头的守兵', t: '往外看，别往里看。往里看，会想家。' },
  { at: 'dg_field', from: 'q_bianhuang', to: 'q_fin', who: '', t: '（战场上插着很多断掉的兵器。有一把是胖子的刀，你认得。你把它扶正了。）' },
  { at: 'diguan', from: 'q_qiwang', to: 'q_fin', night: 1, who: '守夜的兵', t: '边荒的夜里，异域那边会有人唱歌。很好听。……听久了，会想打开城门。别听。' },
  // 第九卷 · 九天 / 石村
  { at: 'sc_street', from: 'q_train', to: 'q_fin', who: '大壮的孙子', t: '爷爷说，你小时候举不动石锁，哭着回家。……真的假的？' },
  { at: 'sc_street', from: 'q_train', to: 'q_army', who: 'dazhuang', t: '你练你的，我们练我们的。（他把一块石锁扛上了肩）……老了，扛不动以前那块了。' },
  { at: 'sc_willow', from: 'q_envoy', to: 'q_fin', who: '', t: '（烂木盒子放在树桩旁边。你一直没有打开它。你觉得，还不到时候。）' },
  { at: 'jt_gate', from: 'q_train', to: 'q_fin', who: '天门下的商人', t: '王家进仙域了。……听说王长生亲手处置了六个儿子。啧，长生世家，长生长生，长的是他一个人。' },
  { at: 'jt_wang', from: 'q_train', to: 'q_fin', who: '王家的门房', t: '（他看见你，立刻把门关上了。门缝里传来一句：“家主去仙域了！不在！”）' },
  { at: 'jt_sect', from: 'q_jin', to: 'q_fin', who: '道统的老杂役', t: '七座山门都倒了。我在这儿扫了一辈子地，头一回觉得……地干净了。' },
  { at: 'jt_peak', from: 'q_v9end', to: 'q_fin', who: 'dazhuang', t: '小不点，你看，九天的灯，跟石村的灯，长得一样。' },
  { at: 'jiutian', from: 'q_envoy', to: 'q_fin', night: 1, who: '九天的守夜人', t: '九天的夜里，长生世家的宅子都亮着灯。他们睡不着——活得太久，就怕死。' },
  // 第九卷 · 异域 / 第十卷 · 仙域
  { at: 'yy_jail', from: 'q_yyarena', to: 'q_yyfalls', who: '黑水狱卒', t: '……今天的黑水，给你换成温的了。（他压低声音）别跟别人说。' },
  { at: 'yy_jail', from: 'q_yyarena', to: 'q_fin', who: '', t: '（你在墙上刻了一道。墙上已经有很多道了。每一道，是一年。）' },
  { at: 'yy_gate', from: 'q_yyarena', to: 'q_yyfalls', who: '城门下的异域小孩', t: '（他朝你扔了一块石头，又偷偷捡回来一块饼，扔了上来。）' },
  { at: 'yy_arena', from: 'q_yytree', to: 'q_fin', who: '排队的异域天骄', t: '排了三个月！轮到我了！……（他看了你一眼）我能不能再排三个月？' },
  { at: 'yy_tree', from: 'q_guzu', to: 'q_fin', who: '', t: '（茶树的一片叶子落在你头上。你没有拿下来。）' },
  { at: 'yy_guzu', from: 'q_yyfalls', to: 'q_fin', who: 'guzu', t: '……又回来了？（灯下的影子好像笑了）一个不一样的结局。我还在看。' },
  { at: 'xy_shore', from: 'q_yuanshi', to: 'q_fin', who: '三藏', t: '我在这儿给始祖鱼苗搭了个窝。（他挠了挠光头）它救了我们三个，得供着。' },
  { at: 'xy_city', from: 'q_yuanshi', to: 'q_fin', who: '仙域的老人', t: '下界来的？（他慢慢地眨了眨眼）上一个从下界来的，是很多很多年前了。' },
  { at: 'xy_yuanshi', from: 'q_back', to: 'q_fin', who: '帝城的残魂', t: '……帝关还在吗？（你点点头。它也点点头，接着在城墙上走。）' },
  { at: 'dg_city', from: 'q_anlan', to: 'q_anlan', who: 'mengtz', t: '回来就好。（他看着边荒，很久没说话）……这几天，太安静了。' },
  // 第十二卷 · 天庭 / 第十三卷 · 帝落
  { at: 'jt_court', from: 'q_dam', to: 'q_fin', who: 'qidaolin', t: '天庭的第一顿饭，为师请！……徒弟，你先帮为师垫上。' },
  { at: 'jt_court', from: 'q_dam', to: 'q_fin', who: 'qiwanghou', t: '天庭的柱子底下，我添了一盏灯。七王祠的灯，分过来的。' },
  { at: 'jt_court', from: 'q_dam', to: 'q_fin', who: '石毅', t: '……我来了，就不走了。（他看着那根柱子）这回，我们站同一边。' },
  { at: 'jt_canxian', from: 'q_tianting', to: 'q_fin', who: '', t: '（墓底下没有呼吸声了。只有九天的风，吹进来，又吹出去。）' },
  { at: 'jh_dam', from: 'q_xwhy', to: 'q_fin', who: '守坝的老人', t: '别往海里看太久。……你又在看。' },
  { at: 'xy_city', from: 'q_zaohua', to: 'q_fin', who: '仙王后裔', t: '我爹说，他年轻的时候也输过一次。他说，输过的人，才走得远。……你走慢点。' },
  { at: 'dl_age', from: 'q_lives', to: 'q_v14', who: '帝落古兵', t: '那个传说里的孩子……你见过他吗？' },
  { at: 'dl_river', from: 'q_dlage', to: 'q_fin', who: '', t: '（河里漂过一盏灯。你认出来了——是石村的灯。）' },
  // 第十四卷 · 第十五卷
  { at: 'jt_court', from: 'q_liushen2', to: 'q_v15', who: '天庭的侍女', t: '火灵儿姑娘还在睡。……她睡着的时候，嘴角是翘着的。' },
  { at: 'jt_court', from: 'q_fin', to: 'q_fin', who: 'huolinger', t: '你走了以后，我天天在天庭门口站着。……才没有在等你。' },
  { at: 'yy_gate', from: 'q_kundi', to: 'q_fin', who: '异域的老兵', t: '城门上那根绳子，我们摘了。……不敢不摘。' },
  { at: 'yy_capital', from: 'q_v15', to: 'q_fin', who: '异域的孩子', t: '大人们说，以后不打帝关了。……帝关是什么？' },
  { at: 'jh_sea', from: 'q_kundi2', to: 'q_fin', who: '', t: '（一片枯叶一样的世界漂过去。你伸手，把它推回了岸边。）' },
  { at: 'jh_top', from: 'q_fin', to: 'q_fin', who: 'willow', t: '（黑色的柳枝在断口边上轻轻摇。它说：“这里，也挺好。”）' },
  { at: 'sc_street', from: 'q_fin', to: 'q_fin', who: '石村的孩子', t: '娘说，天上有个小不点，在替我们看着门。……他吃饱了吗？' },
];

  { from: 'q_memory', to: 'q_bandit0', who: '过路的兽车商队', t: '有辆往外走的兽车在古道上翻了，车上是一老一小，也不知道活下来没有。' },
  { from: 'q_bandit', to: 'q_leave', who: '山贼的余党', t: '老大的祭灵都被一个娃娃打散了……咱们赶紧换个山头吧。' },
  { from: 'q_xushen', to: 'q_gate', who: '虚神界里的少年', t: '那个从大荒来的，光幕上的名字一天一个样，跟坐了雷翅雕似的。' },
  { from: 'q_xushen0', to: 'q_leave', who: '过路的兽车商队', t: '补天阁又要收徒了，带上补天石去山门就行。' },
  { from: 'q_leave', to: 'q_lotus', who: '补天阁外门弟子', t: '虎穴里那朵黑莲，我听说已经好几年没人摘回来过了。' },
  { from: 'q_join', to: 'q_lei', who: '补天阁外门弟子', t: '扛着半扇虎肉进山门的那个，就是他。阁主亲自开的口。' },
  { from: 'q_bully', to: 'q_lib', who: '补天阁弟子', t: '诡爷开口了！我在阁里待了六年，头一回听见他出声。' },
  { from: 'q_lei', to: 'q_qf2', who: '雷池的师兄', t: '那个新来的小师弟，才坐了几天，雷光就绕着他的手指转了。' },
  { from: 'q_lib', to: 'q_baiduan', who: '藏经阁的扫地弟子', t: '第五层的锁又被人摸开了……守阁人说他知道是谁，但他不说。' },
  { from: 'q_qf1', to: 'q_qf3', who: '补天阁外门弟子', t: '外门那个叫清风的姑娘，每天练拳练到后半夜，木桩都打裂了两根。' },
  { from: 'q_lib', to: 'q_bdgate', who: '补天阁弟子', t: '百断山快开了，各族的天才都往这边赶。火国的公主好像也要来。' },
  { from: 'q_bdgate', to: 'q_lion', who: '火国侍卫', t: '公主说大荒来的那个小子“没规矩”。……可她说的时候在笑。' },
  { from: 'q_bdgate', to: 'q_yu', who: '雨族少年', t: '补天阁那个小子在虚神界抢了我们的名次。进了百断山，有他好看。' },
  { from: 'q_lion', to: 'q_cliff', who: '断山里的散修', t: '分宝崖上的兵器，几百年没人拔出来过。都说它们在等人。' },
  { from: 'q_yu', to: 'q_spring', who: '断山里的散修', t: '雨族那几个人吃了大亏，说是被一只大红鸟连人带冰叼走了。' },
  { from: 'q_cliff', to: 'q_spring', who: '各族少年', t: '不老泉边守着两头凶物，谁也不敢先过去。' },
  { from: 'q_spring', to: 'q_mount', who: '各族少年', t: '花果山上的猴王脾气不好。桃子碰不得——碰了就是把命押上去。' },
  { from: 'q_mount', to: 'q_return', who: '逃出来的少年', t: '神猴王被一只从天外伸进来的手拍翻了！那是什么人物？' },
  { from: 'q_end', to: 'q_end', who: '补天阁弟子', t: '神藤的葫芦又鼓起来了，阁主这几天走路都带风。' },
  { from: 'q_end', to: 'q_end', who: '过路的兽车商队', t: '外面的天下大着呢。听说更远的地方，有好些比补天阁大得多的地方。' },
  { from: 'q_end', to: 'q_end', who: '虚神界里的少年', t: '光幕最前面那个带“重瞳”的名字，最近好像很少出现了。' },
  { from: 'q_wolf0', to: 'q_wolf', who: '邻村的娃娃', t: '石村有个娃娃迎霞锻体，霞光吸多了，打了一早上的嗝。' },
  { from: 'q_egg0', to: 'q_egg', who: '赶山的老汉', t: '前两天在山里捡了张狼皮，剥得歪歪扭扭的，跟狗啃的一样——这手艺，八成是个娃娃。' },
  { from: 'q_tomb0', to: 'q_tomb', who: '石林的采药人', t: '石林上空老有一只大鹰在转圈，叫得那叫一个惨，跟被人掏了老窝似的。' },
  { from: 'q_bei', to: 'q_yaoding', who: '邻村的猎手', t: '狻猊墓里出来个娃娃，比墓门还矮。我们二十几个大人进去，被抬出来十几个。' },
  { from: 'q_bei', to: 'q_yaoding', who: '走村的货郎', t: '狈村在悬赏一个娃娃，赏金是一头肥羊。……这价开得也太看不起人了。' },
  { from: 'q_yaoding', to: 'q_shanbao', who: '狈村的小孩', t: '我娘说我再不听话，就把我送去石村，给那个小不点当沙包。' },
  { from: 'q_shanbao', to: 'q_ruin', who: '隔壁村的大婶', t: '石村那口药鼎熬了三天三夜，药味飘了十里地，我家的鸡到现在都不下蛋。' },
  { from: 'q_ruin', to: 'q_jijing', who: '逃难的猎户', t: '岩浆冲下来那天，有人说石村的人是从一道光里走掉的。说的人自己都不信。' },
  { from: 'q_ruin', to: 'q_jijing', who: '林子里的采药人', t: '大荒深处多了一只金毛小猴，偷东西专挑兽奶罐子，抓都抓不住。' },
  { from: 'q_memory', to: 'q_qingfeng', who: '火国的商队', t: '我们公主前几天骑着火鸟在大荒上转了一圈，回来说看见一个“特别能打的小矮子”。' },
  { from: 'q_memory', to: 'q_qingfeng', who: '邻村的猎户', t: '“大荒几百年没人走到搬血极境了”——这话是谁传出来的？石村族长喝多了自己说的。' },
  { from: 'q_qingfeng', to: 'q_bandit0', who: '邻村的猎户', t: '石村族长屋里的灯，那天晚上亮了一整夜。' },
  { from: 'q_bandit0', to: 'q_bandit', who: '古道边的茶摊老板', t: '那几头黑罴是被一个娃娃打死的？难怪这两天来喝茶的猎户，都把弓藏到桌子底下了。' },
  { from: 'q_xushen0', to: 'q_leave', who: '山贼的余党', t: '别问了。问就是这辈子不想再看见小孩。' },
  { from: 'q_leave', to: 'q_lotus', who: '虚神界里的少年', t: '大荒来的那个，打完了会问对面“你们族的人好吃吗”。我们族老让我们离他远点。' },
  { from: 'q_leave', to: 'q_gate', who: '虚神界里的少女', t: '那个小矮子赢了以后，在石台上蹲了半天找吃的。虚神界里哪有吃的啊！' },
  { from: 'q_gate', to: 'q_lotus', who: '古道上的车夫', t: '有两个娃娃搭我的车去补天阁，男娃一路问了我十七遍“这牛能吃吗”。那是犀，不是牛。' },
  { from: 'q_lotus', to: 'q_join', who: '补天阁外门弟子', t: '今年来拜师的有个娃娃，排队的时候把前头那人的干粮吃了一半，还夸人家手艺好。' },
  { from: 'q_bully', to: 'q_lei', who: '补天阁伙房的厨子', t: '新来的小师弟一顿吃了九碗饭。我掌勺二十年，头一回被吃怕了。' },
  { from: 'q_lei', to: 'q_qf1', who: '补天阁外门弟子', t: '那几个收份例的师兄，现在走路都绕着内院。听说是被新来的娃娃挨个“讲了讲道理”。' },
  { from: 'q_qf1', to: 'q_lib', who: '雷池的师兄', t: '雷池边那个小师弟又被劈了，他冲着天喊“再来一个！”。我们都躲远了。' },
  { from: 'q_qf2', to: 'q_baiduan', who: '藏经阁的扫地弟子', t: '藏经阁里少了三本书，多了一堆啃干净的骨头。守阁人的胡子都气翘了。' },
  { from: 'q_baiduan', to: 'q_bdgate', who: '补天阁外门弟子', t: '外门小比那天，清风一拳把守关师兄送出了场子。现在外门都管她叫“清风姐”。' },
  { from: 'q_qf3', to: 'q_bdgate', who: '补天阁弟子', t: '阁主点了小师弟去百断山。诡爷听说以后，只说了一个字：“……吵。”' },
  { from: 'q_lion', to: 'q_yu', who: '火国侍卫', t: '公主的火鸟被一只大红鸟抢了肉。公主说，要亲手把那只鸟拔成秃子。' },
  { from: 'q_yu', to: 'q_cliff', who: '断山里的散修', t: '九头狮倒了。动手的是补天阁那娃娃和火国公主——到底谁出力多，两个人吵了一路。' },
  { from: 'q_cliff', to: 'q_spring', who: '雨族少年', t: '我们的人说，补天阁那小子被冻成冰雕的时候都在笑。……他是不是脑子不太好？' },
  { from: 'q_spring', to: 'q_tiangu', who: '断山里的散修', t: '分宝崖上那把锈剑被拔走了！拔它的人还嫌它锈，说回去拿沙子磨一磨。' },
  { from: 'q_tiangu', to: 'q_mount', who: '各族少年', t: '不老泉边，云曦仙子居然出手帮了人。帮的是谁？一个满脸是血、还冲她傻笑的小矮子。' },
  { from: 'q_mount', to: 'q_return', who: '断山里的散修', t: '天骨禁区那堆骨头塌了。有人说塌之前，里面传出半句“记住……”。记住啥，没说完。' },
  { from: 'q_return', to: 'q_end', who: '各族少年', t: '神猴王那棵仙桃圣药到底被谁拔走了？现在百断山出来的人，人人都说是自己拔的。' },
  { from: 'q_end', to: 'q_end', who: '补天阁伙房的厨子', t: '小师弟从百断山回来，第一件事不是去见阁主，是来伙房找吃的。' },
  { from: 'q_end', to: 'q_end', who: '补天阁弟子', t: '外门的人都在学小师弟那句“这能吃吗”。诡爷听见了，说：“……吵。”' },
  { from: 'q_end', to: 'q_end', who: '过路的兽车商队', t: '大荒里现在流行一句话：出门遇见背着锈剑的小矮子，先把干粮藏好。' },
  { from: 'q_end', to: 'q_end', who: '捎话的猎户', t: '石村的大壮让我捎句话：“村里的兽奶罐子没人偷了，二猛说怪没意思的。”' },
  { from: 'q_end', to: 'q_end', who: '石国来的行商', t: '石国皇都要办天骄会了，各族的少年天才都在往那边赶。你不去凑凑热闹？' },
  { from: 'q_wolf0', to: 'q_egg', who: '邻村的猎户', t: '石村的族长最近总往空地跑，说是去看娃娃练功。我看他是去看那个娃娃有没有偷懒。' },
  { from: 'q_egg0', to: 'q_tomb', who: '邻村的大娘', t: '石村几个娃娃被罚扫村口，扫帚比人还高。那个最小的，扫得最干净。' },
  { from: 'q_tomb0', to: 'q_bei', who: '走村的货郎', t: '石林里的鹰叫声停了。有人说，那只鹰在石村的柳树上蹲了一宿，又飞走了。' },
  { from: 'q_bei', to: 'q_shanbao', who: '狈村的猎手', t: '那小娃娃打风狈那一下，我在树上看得清清楚楚——他身后有一只鹰的影子。' },
  { from: 'q_yaoding', to: 'q_ruin', who: '大荒里的老猎人', t: '我在大荒打了六十年猎，第一次见到四头至尊一起打架。这辈子值了。……也差点没了。' },
  { from: 'q_ruin', to: 'q_memory', who: '新村附近的樵夫', t: '新来的那个村子，晚上能听见小孩的笑声，还有……猴子叫？' },
  { from: 'q_jijing', to: 'q_bandit0', who: '火国的商队', t: '公主回来以后，天天让火鸟往大荒那边飞。说是巡视边境。……大荒是我们的边境吗？' },
  { from: 'q_memory', to: 'q_bandit', who: '古道边的茶摊老板', t: '这几天有个大荒来的小娃娃常往古道跑，每次都在我这儿蹭一碗凉茶，喝完了说“下回给钱”。' },
  { from: 'q_bandit', to: 'q_leave', who: '邻村的猎户', t: '石村的族长被山贼绑了，是他孙子一个人去救回来的。他孙子多大？你猜。……不对，再小点。' },
  { from: 'q_xushen0', to: 'q_gate', who: '虚神界里的少年', t: '虚神界里新来了个娃娃，第一天就问“这儿有没有吃的”。' },
  { from: 'q_gate', to: 'q_bully', who: '补天阁外门弟子', t: '今年的新弟子里有个姑娘，排队的时候一直攥着补天石，攥得指节都白了。' },
  { from: 'q_lotus', to: 'q_bully', who: '阁外山林的猎户', t: '虎穴里那两头黑纹虎，有一头被打得现在见了光就躲。另一头……听说被扛走了一半。' },
  { from: 'q_bully', to: 'q_qf1', who: '补天阁伙房的厨子', t: '小师弟来帮厨三天，第一天把灶烧塌了，第二天把锅吃穿了，第三天阁主求我放他走。' },
  { from: 'q_qf1', to: 'q_qf2', who: '补天阁外门弟子', t: '小师弟天天傍晚去山门外蹲着，嘴里叼根草，看清风练拳。看完了还点评：“出拳慢了。”' },
  { from: 'q_qf3', to: 'q_lion', who: '补天阁弟子', t: '小师弟走的那天，清风师姐在山门口站了很久。我问她站着干嘛，她说“看风景”。' },
  { from: 'q_bdgate', to: 'q_yu', who: '断山里的散修', t: '百断山口那只大红鸟，抢了七八个少年的干粮。唯一没抢成的，是被它抢了以后追着它打了三座山的那个。' },
  { from: 'q_lion', to: 'q_cliff', who: '火国侍卫', t: '公主说九头狮是她打的。我们都点头。……可她晚上一个人在帐篷里画那个小娃娃的画像，画了又撕。' },
  { from: 'q_yu', to: 'q_spring', who: '各族少年', t: '你们看见没有？那只大红鸟现在跟着补天阁那小子了。上回还见它俩打得满天毛。' },
  { from: 'q_cliff', to: 'q_mount', who: '各族少年', t: '分宝崖底下那颗没主的蛋，被补天阁那小子揣走了。他说要孵出来——孵出来干嘛？他没说，但我们都猜到了。' },
  { from: 'q_spring', to: 'q_return', who: '各族少年', t: '云曦仙子从不老泉回来以后，有人看见她对着泉水笑了一下。就一下。' },
  { from: 'q_tiangu', to: 'q_return', who: '断山里的散修', t: '天骨禁区里出来的人都说听见了一句话，可每个人听见的都不一样。' },
  { from: 'q_return', to: 'q_end', who: '补天阁弟子', t: '神藤活过来以后，补天阁后山的灵草长得特别好。伙房说，今年能多做好几道菜了。' },
  { from: 'q_end', to: 'q_end', who: '大荒里的老猎人', t: '我年轻那会儿，大荒里最凶的是凶兽。现在大荒里最凶的……是个娃娃。' },
  { from: 'q_end', to: 'q_end', who: '火国侍卫', t: '公主最近在学烤肉。烤糊了九回，第十回她说：“哼，反正不是给某人吃的。”' },
  { from: 'q_end', to: 'q_end', who: '虚神界里的少女', t: '光幕上那个叫“小不点”的名字，每天都在往上爬。有人专门去看它今天爬到哪儿了。' },
  { from: 'q_sgmarket', to: 'q_yuwang', who: '皇都的酒客', t: '城外来了一头九个脑袋的狮子，在官道边上趴着晒太阳，谁也不敢过去。守城的说，它在等一个孩子。' },
  { from: 'q_wuwang', to: 'q_invite', who: '雨族的仆役', t: '雨王府的雨神法旨被人吃了！当场吃的！嚼得嘎嘣响！' },
  { from: 'q_wuwang', to: 'q_shouyan', who: '皇都的酒客', t: '武王府门口这两天一直有个驼背老头在转悠，像是在等谁。' },
  { from: 'q_invite', to: 'q_shouyan', who: '武王府的马夫', t: '子腾老爷的战戟断了。断成两截，一截插在院子里，没人敢拔。' },
  { from: 'q_invite', to: 'q_jiaojun', who: '茶楼说书的', t: '十三年前武王府那件事，现在满皇都都知道了。一块骨头，两个孩子，啧啧。' },
  { from: 'q_shouyan', to: 'q_jiaojun', who: '御膳房的帮厨', t: '人皇的寿宴备了三千道菜。御膳房总管说，要是那个大荒来的孩子去，得再备三千道。' },
  { from: 'q_jiaojun', to: 'q_houfu', who: '皇宫的侍卫', t: '寿宴上的大金蛛少了一条腿，那条腿被架上了烤架。在场的纯血，有一半当场吐了，另一半……说挺香。' },
  { from: 'q_jiaojun', to: 'q_houfu', who: '太古神山来的使者', t: '两位尊者在校军场等那孩子？……这是要拿人皇的寿宴当刑场啊。' },
  { from: 'q_houfu', to: 'q_leiting', who: '城墙上看热闹的', t: '我亲眼看见的！那孩子脖子上的小塔一亮，太古魔蛛的八条腿全软了！' },
  { from: 'q_houfu', to: 'q_v3', who: '皇都的酒客', t: '人皇封了个“荒天侯”。荒天——大荒的天。人皇这是在说，这孩子是大荒的天。' },
  { from: 'q_leiting', to: 'q_v3', who: '武王府的护卫', t: '荒天侯在侯府门口喊了三天“石毅出来”。武王府里，一点动静都没有。' },
  { from: 'q_huohuang', to: 'q_niepan', who: '火国的商人', t: '石国的荒天侯来火国了！公主殿下亲自去城门口接的！跑着去的！' },
  { from: 'q_letter', to: 'q_shiyi2', who: '火国的祭司', t: '涅槃池的火三天没灭。祭司们说，池子里有个孩子，烧了三天，没吭一声。' },
  { from: 'q_shiyi2', to: 'q_dajie', who: '皇都的酒客', t: '石毅下了战书：七日后，天空战场。全皇都的人都在押注——押荒天侯的，赔率一赔三。' },
