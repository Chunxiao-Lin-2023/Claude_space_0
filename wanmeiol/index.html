/* heard rumours are kept in the save (C.rumorLog) so they can be reread under 📜 记录 → 江湖传闻; co-op guests see the host's */
function rumorTick() {
  if (STATE.mode !== 'play' || !C || NETROLE === 'guest' || curMode() !== 'explore' || UI.nav || now() < (UI.rumorNext || 0)) return; UI.rumorNext = now() + rint(35000, 60000);
  const q = C.story.q, A = RUMORS.filter(r => q >= qi(r.from) && q <= qi(r.to)); if (!A.length) return;
  const heard = new Set((C.rumorLog || []).map(r => r.t)); // each rumour is heard once per save; when they run out, it stays quiet until the story moves on
  const L = A.filter(r => !heard.has(r.t)); if (!L.length) return;
  const r = pick(L); C.rumorLog = (C.rumorLog || []).concat([{ who: r.who, t: r.t, day: C.day || 1, at: C.loc, nt: isNight() ? 1 : 0, n: (C.rumorN = (C.rumorN || 0) + 1) }]).slice(-300);
  logLine(`【传闻 · ${esc(r.who)}】${r.t}`, 'rumor dim'); save(); renderRumor(); netSync(); }
const rumorWide = () => document.body.classList.contains('cols');
function renderRumor() { // wide screens: the last three, always there; phones: the newest one floats by for a few seconds
  const e = $('rumor'); if (!e || !C) return; const L = C.rumorLog || []; if (!L.length) { e.className = ''; e.innerHTML = ''; return; } const last = L[L.length - 1];
  if (rumorWide()) { e.className = 'multi'; e.innerHTML = L.slice(-3).reverse().map((r, i) => `<div class="rl ${i === 0 && UI.rumorKey !== last.n ? 'new' : ''}"><span class="rw">${esc(r.who)}</span>${r.t}</div>`).join('') + `<div class="rmore">江湖传闻 · 共 ${L.length} 条 ›</div>`; UI.rumorKey = last.n; return; }
  if (UI.rumorKey === last.n && e.classList.contains('one')) return; const fresh = UI.rumorKey !== last.n; UI.rumorKey = last.n; if (!fresh) { e.className = ''; return; }
  e.innerHTML = `<span class="rw">${esc(last.who)}</span>${last.t}<span class="rmore"> ›</span>`; e.className = ''; void e.offsetWidth; e.className = 'one on'; clearTimeout(UI.rumorT); UI.rumorT = setTimeout(() => e.classList.remove('on'), 9000); }
function openRumors() { UI.logTab = 'rumor'; if (UI.nav === 'log') { sfx('click'); renderSide(); } else navTo('log'); }

/* ================= climaxes: making the big moments feel big =================
   Story side
     cine(text, kind)   a full-screen line over the location painting (no paper box). kind: '' (night ink), 'mem' (a memory, sepia), 'card' (chapter title)
     chapterCard(no, title, sub)
   Battle side — pass `epic` in a fight spec (or a dungeon boss room):
     { name, sub, seal, intro:[lines], phase:'line at half health', low:{who, t}, end:[lines] }
     · a boss card (huge name, epithet, a few lines) before the first turn, with the boss music
     · at half health the boss's line crosses the screen
     · 绝境: the first time 石昊 drops under 30% (or would fall) someone's words come back to him — he recovers 25% 气血,
       shakes off bad effects and hits 30% harder for 3 rounds. Once per fight.
     · the killing blow flashes white, then the closing lines.
   Battle overlays are recorded as events (k:'cine' / 'finish'), so a co-op partner sees them too, and the playback waits for them. */
const cine = (text, kind = '') => dlgShow({ who: '', text, cine: kind || 'ink' });
const chapterCard = async (no, title, sub = '') => { await cine(`<div class="cc"><small>${no}</small><b>${title}</b>${sub ? `<i>${sub}</i>` : ''}</div>`, 'card'); if (STATE.bridgeQ) await playBridge(); };
const plainLen = t => String(t || '').replace(/<[^>]+>/g, '').length;
const cineMs = ev => ev.k === 'finish' ? 900 : Math.min(4600, 2000 + plainLen(ev.text) * 75) * (SET.fast ? 0.7 : 1);
const EPIC_BAD = ['stun', 'bleed', 'burn', 'poison', 'weak', 'bound', 'brk', 'mark', 'dark'];

/* ---------- battle hooks (called from the engine) ---------- */
function epicLow(B, d) { // 绝境
  const E = B.epic; if (!E || !E.low || B.burst || d.kind !== 'pc' || d.hp >= d.hpMax * 0.3) return; B.burst = 1; if (d.hp <= 0) d.hp = 1;
  const h = Math.round(d.hpMax * 0.25); d.hp = Math.min(d.hpMax, d.hp + h); d.st = d.st.filter(s => !EPIC_BAD.includes(s.k)); addSt(d, { k: 'burst', t: 3, v: 0.3 });
  fxe(B, { k: 'cine', cls: 'burst', who: E.low.who || '', text: E.low.t }); blog(B, `<span class="cine">${E.low.who ? `<b>${esc(E.low.who)}</b>　` : ''}${E.low.t}</span>`);
  fxe(B, { k: 'heal', t: d.id, v: h, hp: hpr(d) }); blog(B, `<span class="phase">绝境！${uName(d)} 气血回复 ${h}，身上的伤病一扫而空，接下来 3 回合攻击 +30%</span>`); }
function epicPhase(B, d) { const E = B.epic; if (!E || !E.phase) return; fxe(B, { k: 'cine', cls: 'phase', who: d.name, text: E.phase }); blog(B, `<span class="cine red">${E.phase}</span>`); }
function epicKill(B, d) { if (B.epic && d.side === 1 && (d.boss || alive(B, 1).length === 0)) fxe(B, { k: 'finish', t: d.id }); }
function epicEnd(B) { const E = B.epic; if (!E || !E.end || !E.end.length) return; const t = E.end.join('<br>'); fxe(B, { k: 'cine', cls: 'end', text: t }); blog(B, `<span class="cine">${t}</span>`); }

/* ---------- battle overlays ---------- */
function fxBossCard(B) { const E = B.epic, intro = E.intro || [], dur = Math.round((2600 + intro.length * 1000) * (SET.fast ? 0.75 : 1));
  const d = el('div', 'fx bosscard', `<div class="bc-ink"></div><div class="bc-sub">${esc(E.sub || '')}</div><div class="bc-name">${esc(E.name)}</div><div class="bc-seal">${esc(E.seal || '首领')}</div><div class="bc-lines">${intro.map((t, i) => `<div class="bc-line" style="animation-delay:${0.9 + i * 0.95}s">${t}</div>`).join('')}</div><div class="bc-skip">点击跳过</div>`);
  d.style.setProperty('--dur', dur + 'ms'); $('bfx').appendChild(d); sfx('epic'); $('vBattle').classList.remove('quake'); void $('vBattle').offsetWidth; $('vBattle').classList.add('quake');
  const end = () => { if (!d.parentNode) return; d.classList.add('out'); setTimeout(() => d.remove(), 400); }; d.onclick = e => { e.stopPropagation(); end(); UI.animEnd = Math.min(UI.animEnd, now() + 200); setTimeout(() => { if (STATE.battle && STATE.battle.id === B.id) renderBattle(true); }, 260); };

  { id: 'tk_qf3', npc: 'qingfeng', from: 'q_gate', to: 'q_join', s: [['qingfeng', '小不点……我要是考不进补天阁怎么办？'], ['ch', ['那就明年再考', '那我也不进了'], [[['qingfeng', '（她攥紧了补天石）……嗯。明年，后年，我都考。']], [['qingfeng', '（她瞪了你一眼）别说傻话。你进去，然后……等我。'], ['me', '好。我在伙房门口等你。'], ['qingfeng', '……为什么是伙房？']]]]] },
  { id: 'tk_qf4', npc: 'qingfeng', from: 'q_lib', to: 'q_qf3', s: [['qingfeng', '你最近在藏经阁看什么书？'], ['me', '《大荒异兽食谱》。'], ['qingfeng', '……藏经阁里有这种书？'], ['me', '没有。我在看《大荒异兽图录》，看哪些能吃，自己记。'], ['qingfeng', '（她叹了口气）你能不能有一回，看书是为了变强？'], ['me', '吃饱了才能变强。']] },
  { id: 'tk_qf5', npc: 'qingfeng', from: 'q_return', to: 'q_end', s: [['qingfeng', '百断山里……是不是很危险？'], ['me', '还好。就是被冻成过冰雕，被猴子砸进过湖里，被树做了个梦。'], ['qingfeng', '……这叫还好？'], ['me', '我回来了嘛。'], ['qingfeng', '（她低头看着自己的手）下次去这种地方，带上我。我已经是内门弟子了。']] },
  { id: 'tk_gy3', npc: 'guiye', from: 'q_return', to: 'q_end', s: [['me', '诡爷，锈剑我带回来了。你要不要拿着看看？'], ['nar', '诡爷伸手，在剑身上弹了一下。“嗡”的一声，剑鸣了很久。'], ['guiye', '……它想砍东西。'], ['me', '砍什么？'], ['guiye', '……天。'], ['nar', '他说完这个字，就闭上了眼睛，再也不理你了。']] },
  { id: 'tk_gz3', npc: 'gezhu', from: 'q_return', to: 'q_end', s: [['gezhu', '石昊，神藤这一回，补天阁欠你的。'], ['me', '那能不能把伙房的门……'], ['gezhu', '（阁主扶着额头）……开。从今天起，伙房给你单独开一口灶。'], ['me', '！！！'], ['gezhu', '别高兴太早。厨子说了，那口灶，你自己烧。']] },
  { id: 'tk_lib2', npc: 'libelder', from: 'q_qf2', to: 'q_end', s: [['libelder', '你知道藏经阁第五层为什么要上锁吗？'], ['me', '因为里面有好东西。'], ['libelder', '因为里面有危险的东西。'], ['me', '危险的东西一般都是好东西。'], ['libelder', '（守阁人愣了一下）……这话谁教你的？'], ['me', '我们族长。他说毒蘑菇都长得好看。'], ['libelder', '……你们族长说得对。']] },
  { id: 'tk_lib3', npc: 'libelder', from: 'q_return', to: 'q_end', s: [['libelder', '听说你在百断山里碰到了天骨。'], ['me', '它跟我说“记住”。我记住了它的样子，可上面的字一个都不认识。'], ['libelder', '（守阁人的眼睛亮了）画给我看。'], ['nar', '你在地上画了半天。守阁人看了半天。'], ['libelder', '……你画的这是只鸡？'], ['me', '是骨头！']] },
  { id: 'tk_hl3', npc: 'huolinger', from: 'q_bdgate', to: 'q_lion', s: [['huolinger', '你真的是从大荒里出来的？'], ['me', '嗯。'], ['huolinger', '大荒里的人都像你这样……这么能吃？'], ['me', '不。他们比我还能吃。'], ['huolinger', '（她想了想那个画面，打了个寒战）……那你们村的粮食够吗？'], ['me', '不够就去山里打。山里的凶兽，都挺好吃的。'], ['huolinger', '……你离我的火鸟远一点。']] },
  { id: 'tk_hl4', npc: 'huolinger', from: 'q_spring', to: 'q_end', s: [['huolinger', '你跟云曦……很熟吗？'], ['me', '不熟。她帮我打了一只鸟。'], ['huolinger', '哼。她那个人，冷冰冰的，跟谁都不说话。'], ['me', '她跟我说了。她说“站起来”。'], ['huolinger', '……就这三个字？'], ['me', '对。'], ['huolinger', '（她的嘴角不知道为什么翘了起来）那你们果然不熟。']] },
  // 石国
  { id: 'tk_leiting1', npc: 'leiting', from: 'q_shouyan', to: 'q_jiaojun', s: [['leiting', '你知道寿宴上最危险的是什么吗？'], ['ch', ['尊者？', '菜不够吃？'], [[['leiting', '不，是坐在你旁边的人。他们会对着你笑，然后在你酒里下毒。']], [['leiting', '……（他沉默了一会儿）跟你说话，我总觉得是我想多了。']]]], ['me', '下毒我也不怕。我小时候喝过雨族的毒，跟兽奶差不多。'], ['leiting', '那叫毒？那叫……算了，你赢了。']] },
  { id: 'tk_leiting2', npc: 'leiting', from: 'q_houfu', to: 'q_fin', s: [['leiting', '我们雷族世代守着雷池。你去过补天阁的雷池？'], ['me', '去过。挨劈挨了二十多回。'], ['leiting', '二十多回？！我们族里的少年，劈三回就得躺半个月。'], ['me', '我躺了半天。……主要是饿醒的。'], ['nar', '雷霆盯着你看了很久，最后伸出手，跟你碰了碰拳头。']] },
  { id: 'tk_zhong1', npc: 'laozhong', from: 'q_leiting', to: 'q_fin', s: [['laozhong', '侯爷，老奴给您讲讲老太爷年轻时候的事吧？'], ['ch', ['好。', '讲讲我爹。'], [[['laozhong', '老太爷年轻的时候，一个人打穿了三座王府。为什么？因为人家说他吃饭吧唧嘴。'], ['me', '……我吃饭也吧唧嘴。'], ['laozhong', '（钟伯笑出了眼泪）那是家传的。']], [['laozhong', '你爹……话不多。可你一生下来，他抱着你在院子里站了一整夜，谁要都不给。'], ['laozhong', '那天晚上的月亮，老奴到现在都记得。']]]]] },
  { id: 'tk_zhong2', npc: 'laozhong', from: 'q_qishen', to: 'q_fin', s: [['laozhong', '陛下……'], ['me', '叫我小不点。'], ['laozhong', '这、这不合规矩。'], ['me', '我是石皇，规矩我定的。'], ['laozhong', '（他张了张嘴，眼圈红了）……小不点。'], ['nar', '他说完这三个字，背过身去，肩膀一直在抖。']] },
  // 火国
  { id: 'tk_huo1', npc: 'huolinger', from: 'q_niepan', to: 'q_fin', s: [['huolinger', '喂，你在百断山的时候，说过要请我吃烤肉。'], ['me', '说过。'], ['huolinger', '那你什么时候请？'], ['ch', ['现在。', '等我打赢石毅。'], [[['nar', '你从怀里掏出一大块烤得金黄的兽腿。火灵儿瞪着它看了半天：“……你一直揣在怀里？”'], ['me', '揣了一路。还热乎。']], [['huolinger', '……（她别过脸去）那你得赢。不赢不许回来见我。']]]]] },
  { id: 'tk_huo2', npc: 'huolinger', from: 'q_dajie', to: 'q_fin', s: [['huolinger', '你跟石毅打的那天，我在云上看着。'], ['me', '你哭了吗？'], ['huolinger', '谁、谁哭了！是风大！天空战场上的风很大！'], ['me', '哦。'], ['huolinger', '……你被劫光吞进去的那一下，我差点跳下去。（她小声说）以后别这样了。']] },
  { id: 'tk_huohuang1', npc: 'huohuang', from: 'q_niepan', to: 'q_fin', s: [['huohuang', '百断山里，朕那一掌，你可记恨？'], ['ch', ['记着呢。', '不记恨，挺暖和的。'], [[['huohuang', '（火皇大笑）好！记着好！记着，才有力气往上爬。']], [['huohuang', '……暖和？（他愣了一下，又笑了）你这孩子，跟你娘一个样，说话能把人噎死。']]]]] },
  { id: 'tk_huohuang2', npc: 'huohuang', from: 'q_letter', to: 'q_fin', s: [['huohuang', '你娘走的时候，跟朕说过一句话。'], ['me', '什么话？'], ['huohuang', '她说：“如果有一天，一个胸口有疤的孩子来找涅槃池，请让他进去。不要问他是谁。”'], ['nar', '火皇看着你，很久没说话。'], ['huohuang', '朕没问。朕知道。']] },
  // 第四卷 · 第五卷
  { id: 'tk_bzlao1', npc: 'bzlao', from: 'q_baojie', to: 'q_fin', s: [['bzlao', '小子，你知道为什么百族营地里，每一族都只围着自己的火吗？'], ['ch', ['因为谁也看不起谁？', '因为火不够用？'], [[['bzlao', '对了一半。还因为——今天坐在一堆火边上的人，明天可能就在战场上碰见。']], [['bzlao', '（老兵愣了一下，笑得直咳嗽）……你这小子。']]]], ['bzlao', '我年轻的时候，跟一个金乌族的人坐过一堆火。后来在战场上碰见了。'], ['me', '谁赢了？'], ['bzlao', '（他拍了拍那条瘸腿）你说呢。……他请我喝过一碗酒。我到现在都记得那个味儿。']] },
  { id: 'tk_yunlao1', npc: 'yunlao', from: 'q_huobye', to: 'q_fin', s: [['yunlao', '你知道云族为什么叫云族吗？'], ['me', '因为住在云里？'], ['yunlao', '因为我们的祖先，是踩着云从上面下来的。他们说，下来看看就回去。'], ['yunlao', '……然后就没回去。路断了。一断就是几千年。'], ['nar', '老人看着天，很久没说话。']] },
  { id: 'tk_qi1', npc: 'qidaolin', from: 'q_dojo', to: 'q_fin', s: [['qidaolin', '徒弟，你是不是觉得为师是个骗子？'], ['ch', ['是。', '有一点。', '不是。'], [[['qidaolin', '（他一口茶喷了出来）……你倒是实诚！']], [['qidaolin', '一点？好，比为师想的少。']], [['qidaolin', '……（他盯着你看了很久）你这孩子，说谎都不会。']]]], ['qidaolin', '为师骗过很多人。可至尊道场是真的，无敌道是真的。'], ['qidaolin', '为师就想……在为师死之前，看一眼至尊道场再热闹起来。哪怕就两个人。'], ['me', '现在不就是两个人吗？'], ['nar', '齐道临别过脸去，半天没说话。']] },
  { id: 'tk_qi2', npc: 'qidaolin', from: 'q_tianshen', to: 'q_fin', s: [['qidaolin', '徒弟，你在天碑上写那个字的时候，为师在台下。'], ['qidaolin', '为师这辈子，被人指着鼻子骂过骗子、骂过疯子。可从来没想过——有人敢指着整个上界的鼻子，说它错了。'], ['me', '它本来就错了。'], ['qidaolin', '（他笑了，笑着笑着，眼睛就红了）……对。它本来就错了。']] },
  // 第六～九卷
  { id: 'tk_qi3', npc: 'qidaolin', from: 'q_v7', to: 'q_fin', s: [['qidaolin', '徒弟，争霸台上那一招，为师看见了。'], ['me', '哪一招？'], ['qidaolin', '你从台上走下去的那一招。（他难得认真）往前不回头，不是不能退。是退了，还会回来。'], ['ch', ['师父，你这句话是刚想的吧？', '……谢谢师父。'], [[['qidaolin', '（他咳嗽了一声）……昨天想的。想了一晚上。']], [['qidaolin', '（他别过脸去）谢什么谢！吃饭去！你请！']]]]] },
  { id: 'tk_meng1', npc: 'mengtz', from: 'q_qiwang', to: 'q_anlan', s: [['mengtz', '孩子，你想成仙吗？'], ['ch', ['想。', '不知道。成了仙，还能吃烤肉吗？'], [[['mengtz', '我也想。想了几万年。（他看着城外）……可每次快到了，城外就有人来。']], [['mengtz', '（他愣了一下，哈哈大笑）能！我替你问过了——问的是个死了的仙人，他没回答。']]]], ['mengtz', '成仙那条路，我就差一步了。'], ['mengtz', '……可我总觉得，这一步，跟守城比，没那么要紧。']] },
  { id: 'tk_qi7', npc: 'qiwanghou', from: 'q_wangjia', to: 'q_fin', s: [['qiwanghou', '你说，七王当年怕不怕？'], ['me', '怕吧。'], ['qiwanghou', '那他们为什么不跑？'], ['ch', ['因为后面有人。', '因为跑了，就回不了家了。'], [[['qiwanghou', '（他想了想）……后面的人跑了，他们还是没跑。']], [['qiwanghou', '（他低下头）我们这一支，从来没见过家。']]]], ['nar', '小七添完灯油，冲七个牌位磕了三个头。他磕得很认真。']] },
  { id: 'tk_army1', npc: 'dazhuang', from: 'q_purge', to: 'q_fin', s: [['dazhuang', '小不点，你还记得你小时候被我笑举不动石锁吗？'], ['me', '记得。笑了一个月。'], ['dazhuang', '（他挠了挠头）我那时候其实也举不动。我是踮着脚，用肩膀扛起来的。'], ['me', '……你骗了我几十年？'], ['dazhuang', '（他哈哈大笑，笑得胡子直抖）现在说出来，舒服多了！']] },
  // 第九～十五卷
  { id: 'tk_guzu1', npc: 'guzu', from: 'q_yyfalls', to: 'q_fin', s: [['guzu', '你知道异域为什么一直往帝关打吗？'], ['ch', ['为了抢地盘？', '为了那只盒子？'], [[['guzu', '那是他们自己以为的。']], [['guzu', '……盒子只是一个借口。']]]], ['guzu', '因为界海那边的黑，在往这边推。异域在前面，被推着走。帝关在后面，挡着。'], ['guzu', '打来打去，都是被推着的。（它看着灯）你要是能往上走……就去看看，是谁在推。']] },
  { id: 'tk_meng2', npc: 'mengtz', from: 'q_anlan', to: 'q_anlan', s: [['mengtz', '你在异域那一百年，我把你的那份饭，每天都留着。'], ['me', '……一百年的饭？'], ['mengtz', '（他笑了）都喂了城头的乌鸦。帝关的乌鸦，现在比人都胖。']] },
  { id: 'tk_huo3', npc: 'huolinger', from: 'q_fin', to: 'q_fin', s: [['huolinger', '我睡了好久好久。睡着的时候，一直梦见百断山。'], ['me', '梦见什么？'], ['huolinger', '梦见你偷神猴王的圣药，被我父皇一掌拍飞。（她笑了）你飞出去的样子，特别傻。'], ['ch', ['……你就记得这个？', '（递给她一块烤肉）'], [[['huolinger', '还记得你说要请我吃烤肉。欠了好多好多年。']], [['huolinger', '（她接过去，咬了一大口）……这回是热的。']]]]] },
  { id: 'tk_willow9', npc: 'willow', from: 'q_fin', to: 'q_fin', s: [['willow', '（柳枝在你额头上点了一下）……还记得你小时候，第一次爬我的树吗？'], ['me', '记得。摔下来了，你接住了我。'], ['willow', '……你现在，也接住了很多人。']] },
];
const talkNext = id => TALKS.find(T => T.npc === id && !(C.talked || {})[T.id] && C.story.q >= qi(T.from) && C.story.q <= qi(T.to));
async function talkSteps(steps) { for (const st of steps) { const [w, t, r] = st;
  if (w === 'me') await me(t); else if (w === 'nar') await nar(t); else if (w === 'ch') { const c = await choose(t); await talkSteps(r[c] || []); } else await say(w, t); } }
function talkPlay(id) { const T = talkNext(id); if (!T) return; (C.talked = C.talked || {})[T.id] = 1; save(); return runScene(() => talkSteps(T.s), { title: '闲聊' }); }

/* ================= UI: one screen at a time =================
   探索 (dark green): location, what just happened, the quest line and what you can do here.
   对话 (paper): who is speaking (a seal with their name), the line, ▼ to continue or the choices.
   战斗 (dark red): enemies on top, what happened this round, your side, the 宝术 bar.
   The full text record, the memoir and the bestiary live behind 📜 in the top bar. */
const UI = { layout: '', tab: 'hero', nav: null, selFoe: null, hist: [], cur: null, logTab: 'log' };
function layout() {
  const w = innerWidth, h = innerHeight, short = h <= 500, narrow = w < 700 && !short, cols = (w >= 760 && !short) || (short && w >= 600);
  const b = document.body; b.classList.toggle('narrow', narrow); b.classList.toggle('short', short); b.classList.toggle('cols', cols); b.classList.toggle('dock', cols && !short); b.classList.toggle('touch', IS_TOUCH);
  const L = (narrow ? 'n' : '') + (short ? 's' : '') + (cols ? 'c' : ''); if (UI.layout !== L) { UI.layout = L; refresh(); } bannerDraw();
}
addEventListener('resize', () => { clearTimeout(UI.rsT); UI.rsT = setTimeout(() => { layout(); if (STATE.mode === 'title') titleDraw(); }, 80); });
addEventListener('orientationchange', () => setTimeout(layout, 150));
function toast(t) { const d = el('div', '', esc(t)); $('toast').appendChild(d); setTimeout(() => d.remove(), 2200); while ($('toast').children.length > 3) $('toast').firstChild.remove(); }
function applyFont() { document.documentElement.style.fontSize = [15, 17, 19.5][SET.fs || 0] + 'px'; }
applyFont();
const curMode = () => DLG ? 'talk' : STATE.battle ? 'battle' : 'explore';
function applyMode(force) { const m = curMode(), b = document.body;
  // leaving a conversation: wait a moment — the next line usually follows at once, and flipping screens in between makes everything blink
  if (UI.lastMode === 'talk' && m !== 'talk' && !force) { if (!UI.leaveT) UI.leaveT = setTimeout(() => { UI.leaveT = 0; applyMode(true); if (STATE.mode === 'play' && C) refresh(); }, 140); return; }
  if (UI.leaveT) { clearTimeout(UI.leaveT); UI.leaveT = 0; } for (const k of ['explore', 'talk', 'battle']) b.classList.toggle('m-' + k, m === k); if (m !== UI.lastMode) { if (UI.lastMode && m === 'battle') stageTransition(m); UI.lastMode = m; atmoUpdate(); if (m !== 'explore' && UI.nav && UI.nav !== 'log') { UI.nav = null; renderSide(); } musicMode(); if (m === 'explore') setTimeout(bannerDraw, 0); } if (m === 'talk') talkBgDraw(); }

/* ---------- log (kept for 📜 记录 and co-op; the explore screen shows the latest few lines) ---------- */
function logLine(html, cls = '') { const L = $('log'); if (!L) return; L.appendChild(el('div', 'ln ' + cls, html)); while (L.children.length > 300) L.firstChild.remove(); if (NETROLE === 'host') netLog(html, cls); UI.logDirty = 1; if (STATE.mode === 'play') { clearTimeout(UI.feedT); UI.feedT = setTimeout(() => { renderFeed(); if (UI.nav === 'log') renderSide(); }, 30); } }
function feedLines(max = 5) { const out = []; const kids = $('log').children; for (let i = kids.length - 1; i >= 0 && out.length < max; i--) { const d = kids[i]; if (d.classList.contains('loc')) break; if (d.classList.contains('bat') || d.classList.contains('say') || d.classList.contains('rumor')) continue; out.unshift(d); } return out; }
function renderFeed() { const F_ = $('feed'); if (!F_) return; const L = feedLines(); F_.innerHTML = L.map((d, i) => { if (!d.dataset.n) d.dataset.n = ++UI.feedN; const nw = +d.dataset.n > (UI.feedSeen || 0); return `<div class="${d.className}${i < L.length - 2 ? ' old' : ''}${nw ? ' new' : ''}">${d.innerHTML}</div>`; }).join(''); UI.feedSeen = UI.feedN; }
UI.feedN = 0;

/* ---------- dialogue ---------- */

/* ================= the late game: 悟道, 炼器, 隐世天骄, the partners' third form and three new partners, late fused 宝术,
   the 天庭 you can build up, 轮回 (a second life), and the 前情提要 =================
   悟道  past 40 层, experience you cannot use (a level gate, or the cap) turns into 悟道点: one per quarter of a level.
         Spend them on the 石昊 page: 气血 / 攻击 / 防御 +1% each (20 at most), or +20 熟练度 to a 宝术 on your bar.
   炼器  after 第六卷, a 宝骨 can be forged up to +5: each level +20% of what it gives (+10% for the special ones).
         Costs 灵石 and 兽骨; +4 and +5 can fail (the 灵石 are gone, the 兽骨 are not). 天庭's 炼器坊 makes it cheaper and surer.
   隐世天骄  after 第六卷, six people who never stood on the 虚神界 list can be challenged (once a day each); the first win
         gives a 宝骨 of their own. All six → the title 隐世无双.
   真身  a partner that has 返祖 and is 70 级 with full affection takes its true form: +5% again. Partners now grow to 85.
   天庭  after it is founded: 药园 / 炼器坊 / 演武场 / 城墙, three levels each.
   轮回  after the end, at 上苍之上: start again from 石村 with your titles, 图鉴, records, 悟道, 宝骨 (and their forging);
         foes are stronger each time (气血 +30%, 攻击 +20% per life), experience +25% per life. */

/* ---------- 悟道 ---------- */
const DAO_MAX = 20;
const DAO_OPTS = [{ k: 'hp', n: '气血', i: '❤️' }, { k: 'atk', n: '攻击', i: '⚔️' }, { k: 'def', n: '防御', i: '🛡️' }];
function daoGain(over) { if (!C || over <= 0 || C.lv < 40) return; C.daoX = (C.daoX || 0) + over; const per = Math.max(1, Math.round(BAL.expNext(C.lv) * 0.25)); let n = 0; while (C.daoX >= per) { C.daoX -= per; n++; }
  if (n) { C.dao = (C.dao || 0) + n; logLine(`用不上的经验化成了<b class="lvup">悟道点 +${n}</b>（现有 ${C.dao}）——在「石昊」页的「悟道」里用。`, 'sys'); } }
function capExp() { const need = BAL.expNext(C.lv); if (C.exp > need) { if (C.lv >= 40) daoGain(C.exp - need); else C.expBank = (C.expBank || 0) + C.exp - need; } C.exp = need; } /* before 40 nothing is thrown away: it waits in C.expBank */
function daoSpend(k) { if (NETROLE === 'guest' || STATE.battle) return; if (!(C.dao > 0)) { toast('没有悟道点'); return; } C.daoP = C.daoP || {};
  if (k === 'prof') { const L = C.bar.filter(id => profLevel(id) < PROF_MAX).sort((a, b) => ((C.prof || {})[a] || 0) - ((C.prof || {})[b] || 0)); if (!L.length) { toast('带着的宝术都圆满了'); return; } const id = L[0]; for (let i = 0; i < 20; i++) profUse(id); logLine(`悟道：${SKILLS[id].icon}${SKILLS[id].name} 熟练度 +20`, 'sys'); }
  else { if ((C.daoP[k] || 0) >= DAO_MAX) { toast('这一项已经悟到头了'); return; } C.daoP[k] = (C.daoP[k] || 0) + 1; }
  C.dao--; fixHp(); sfx('magic'); save(); refresh(); }
function daoHtml() { if (C.lv < 40 && !C.dao) return ''; const P = C.daoP || {};
  return `<div class="card"><h3>悟道 <span class="dim" style="font-size:.8rem;font-family:var(--ff)">40 层以后，用不上的经验（卡在境界关口、或者到顶了）会化成悟道点</span></h3>
    <div class="row" style="flex-wrap:wrap;gap:6px"><span>悟道点 <b class="pw" style="font-size:1.1rem">${C.dao || 0}</b></span><span class="dim" style="font-size:.8rem">（下一点还差 ${fmt(Math.max(0, Math.round(BAL.expNext(C.lv) * 0.25) - Math.round(C.daoX || 0)))} 经验）</span></div>
    <div class="dts" style="margin-top:6px">${DAO_OPTS.map(o => `<button class="sb" ${C.dao > 0 && (P[o.k] || 0) < DAO_MAX ? '' : 'disabled'} onclick="daoSpend('${o.k}')">${o.i} ${o.n} +1%（${P[o.k] || 0}/${DAO_MAX}）</button>`).join('')}<button class="sb" ${C.dao > 0 ? '' : 'disabled'} onclick="daoSpend('prof')" title="给宝术栏里熟练度最低、还没圆满的那一门">📿 宝术熟练 +20</button></div></div>`; }

/* ---------- 炼器 ---------- */
const FORGE_MAX = 5;
const forgeLv = (id, c = C) => (c && c.forge && c.forge[id]) || 0;
function relicB(id, c = C) { const R = RELICS[id]; if (!R || !R.b) return null; const m = 1 + 0.2 * forgeLv(id, c); if (m === 1) return R.b; const o = {}; for (const k in R.b) o[k] = R.b[k] * m; return o; }
const forgeOpen = () => !!(C && C.story.f.v6end);
function forgeCost(id) { const l = forgeLv(id), cut = 1 - 0.1 * ttLv('lu'); return { money: Math.round((l + 1) * (80 + C.lv * 14) * cut), bone: 3 * (l + 1), yao: l >= 3 ? 1 : 0, ok: l < 3 ? 1 : Math.min(1, (l === 3 ? 0.7 : 0.5) + 0.1 * ttLv('lu')) }; }
async function forgeRelic(id) {
  if (NETROLE === 'guest' || STATE.scene || STATE.battle || !(C.relics || {})[id] || !forgeOpen()) return; const l = forgeLv(id); if (l >= FORGE_MAX) { toast('已经炼到 +5 了'); return; }
  const k = forgeCost(id); if ((C.money || 0) < k.money || itemN('bone') < k.bone || itemN('baoyao') < k.yao) { toast(`需要 💎${k.money} 灵石、兽骨×${k.bone}${k.yao ? '、宝药×1' : ''}`); return; }
  C.money -= k.money; if (k.yao) takeItem('baoyao', 1); const R = RELICS[id];
  if (Math.random() < k.ok) { takeItem('bone', k.bone); C.forge = C.forge || {}; C.forge[id] = l + 1; fixHp(); sfx('epic'); logLine(`<b class="lvup">炼器</b>：${R.i}<b>${R.n}</b> 炼到了 <b>+${l + 1}</b>（效果 ×${(1 + 0.2 * (l + 1)).toFixed(1)}）。`, 'sys'); bigFlash(`${R.n} +${l + 1}`, 'relic'); }
  else { sfx('fail'); logLine(`炼器：火候差了一点，${R.n} 上的纹路散了回去。灵石烧掉了，兽骨还在。<span class="dim">（成功率 ${Math.round(k.ok * 100)}%）</span>`, 'sys'); }
  save(); refresh(); }
function forgeBtn(id) { if (!forgeOpen()) return ''; const l = forgeLv(id); if (l >= FORGE_MAX) return `<span class="pill gold">+${l}</span>`; const k = forgeCost(id);
  return `<button class="sb" style="min-height:30px" title="💎${k.money} 灵石 · 兽骨×${k.bone}${k.yao ? ' · 宝药×1' : ''} · 成功率 ${Math.round(k.ok * 100)}%" onclick="event.stopPropagation();forgeRelic('${id}')">🔥炼${l ? ' +' + l : ''}</button>`; }

Object.assign(MINI, {
  memory: { title: '逆活八世', hint: '翻开两张，一样的就留下。<b>把八世都对上</b>——翻错太多次，前世就散了。',
    init(o) { const L = (o.faces || ['🔨', '🛡️', '🥣', '🌳', '🤱', '🧱', '🪑', '⚔️']).slice(0, 8); return { c: shuffle([...L, ...L]), open: [], got: [], miss: 0, lim: o.miss || 10 }; },
    tap(M, i) { if (typeof i !== 'number' || M.got.includes(i) || M.open.includes(i)) return; if (M.open.length >= 2) M.open = []; M.open.push(i); sfx('click');
      if (M.open.length === 2) { const [a, b] = M.open; if (M.c[a] === M.c[b]) { M.got.push(a, b); M.open = []; sfx('level'); if (M.got.length === M.c.length) return { end: true, score: M.miss <= 3 ? 3 : M.miss <= 6 ? 2 : 1 }; } else { M.miss++; if (M.miss > M.lim) return { end: false, score: 0 }; } } },
    html(M) { return `<div class="mgrid" style="grid-template-columns:repeat(4,1fr);width:248px">${M.c.map((f, i) => { const up = M.got.includes(i) || M.open.includes(i); return `<button class="cell ${M.got.includes(i) ? 'on' : ''}" onclick="miniTap(${i})">${up ? f : ''}</button>`; }).join('')}</div>
        <div class="mmsg">对上 ${M.got.length / 2}/8 · 翻错 <span class="${M.miss > M.lim * 0.7 ? 'bad' : ''}">${M.miss}/${M.lim}</span></div>`; } },
  clones: { title: '他化自在', hint: '追兵从三路来。<b>哪一路亮起 ⚠，就点哪一路</b>——让那一路的你挡住它。',
    init: o => ({ n: o.n || 8, need: o.need || 6, i: 0, hits: 0, lane: rint(0, 2), T: o.T || 1500 }),
    next(M, ok, msg) { M.hits += ok; M.last = msg; M.lastOk = ok; sfx(ok ? 'hit' : 'miss'); M.i++; M.t0 = now(); M.lane = rint(0, 2); M._dirty = 1; if (M.i >= M.n) return { end: M.hits >= M.need, score: M.hits >= M.n ? 3 : 2 }; },
    tap(M, a) { if (typeof a !== 'number') return; return this.next(M, a === M.lane, a === M.lane ? '挡住了！' : '挡错了一路'); },
    check(M) { if (now() - M.t0 > M.T * Math.max(0.6, 1 - M.i * 0.05)) return this.next(M, false, '慢了——追兵冲过去了'); },
    html(M) { return `<div class="mstack">${Array.from({ length: M.n }, (_, i) => `<span class="${i < M.i ? 'ok' : ''}">${i < M.i ? '👥' : '·'}</span>`).join('')}</div>
        <div class="mgrid" style="grid-template-columns:repeat(3,1fr);width:240px">${[0, 1, 2].map(i => `<button class="cell ${i === M.lane ? 'on' : ''}" onclick="miniTap(${i})">${i === M.lane ? '⚠' : '👤'}</button>`).join('')}</div>
        <div class="mmsg ${M.lastOk ? 'ok' : ''}">${M.last || ''}　挡住 ${M.hits}/${M.need}</div>`; } },
  rhythm: { title: '独断万古', hint: '光走到<b>金色的节点</b>上时点“斩”。走两遍，一共十下。',
    init: o => ({ notes: o.notes || [16, 33, 51, 69, 86], passes: o.passes || 2, p: 0, hit: [], hits: 0, need: o.need || 7, D: o.D || 3600 }),
    pos(M) { return clamp((now() - M.t0) / M.D * 100, 0, 100); },
    tap(M) { const x = this.pos(M); let best = -1, bd = 99; M.notes.forEach((n, i) => { if (!M.hit.includes(i) && Math.abs(n - x) < bd) { bd = Math.abs(n - x); best = i; } });
      if (best >= 0 && bd <= 5.5) { M.hit.push(best); M.hits++; M.last = '斩！'; M.lastOk = true; sfx('hit'); } else { M.last = '空了'; M.lastOk = false; sfx('miss'); } },
    check(M) { if (now() - M.t0 >= M.D) { M.p++; M.hit = []; M.t0 = now(); if (M.p >= M.passes) return { end: M.hits >= M.need, score: M.hits >= M.notes.length * M.passes - 1 ? 3 : 2 }; return 0; } },
    tick(M, D) { const e = D.querySelector('.rmark'); if (e) e.style.left = this.pos(M) + '%'; },
    html(M) { return `<div class="mbar">${M.notes.map((n, i) => `<div class="rnote ${M.hit.includes(i) ? 'ok' : ''}" style="left:${n}%"></div>`).join('')}<div class="rmark" style="left:${this.pos(M)}%"></div></div>

});

  const c = await choose(['（问他）你们……在这里漂了多久？', '（看着自己的手，它在一点点变淡）', '（不说话，回头往上看）']);

  await nar('你想起来了：龙椅才坐了七天。石村的兽奶还没喝够。答应火灵儿的烤肉，还欠着。');
  await me('……我还没吃饱。');

  await nar(sw.ok ? '你一下一下地往上划。河水推你，灯里的孩子们在后面推你。' : '河水把你冲下去三次。第四次，好几盏灯一起撞在你背上——是灯里的孩子，在推你。');

  else await nar(mm.ok ? '碎片拼回来了。有几道裂缝，可你不在乎——裂缝里，能透进光来。' : '有几片怎么也找不着了。你没再找——缺了几块，也还是你。');
