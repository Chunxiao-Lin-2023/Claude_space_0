    await nar('月亮很亮。一棵枯树的树洞里，几只毛茸茸的小夜枭挤成一团，正眨巴着大眼睛看你。');
    const c = await choose(['（悄悄退开）', '（摸一摸）']);
    if (c === 1) { await nar('你刚伸出手，头顶一阵冷风——它们的娘回来了！'); await fight({ mobs: [['owl', clamp(C.lv, 3, 9)], ['owl', clamp(C.lv, 3, 9)]], title: '夜枭的窝', noLose: true, flee: true }); }
    else { await nar('你退开的时候，树上的大夜枭盯了你一路，最后扔下来一块兽骨。'); give('bone'); } } },
  { id: 'wisps', night: true, when: P => P.area === 'baiduan', run: async () => { logLine('断山之间飘起一串鬼火，悠悠地朝你围了过来。', 'enc'); const lv = clamp(rint(P0().lv[0], P0().lv[1]), 13, 20); const r = await startBattle({ mobs: [['wisp', lv], ['wisp', lv]], title: '百断山 · 鬼火', flee: true }); if (r && r.win) logLine('鬼火散了，地上留下几点亮晶晶的东西。', 'dim'); } },
];
const P0 = () => PLACES[C.loc];
function wildEventFor(P) {
  const L = WILD.filter(e => (!e.once || !C.story.f['wd_' + e.id]) && (e.night === undefined || e.night === isNight()) && e.when(P));
  const once = L.filter(e => e.once); return once.length ? once[0] : L.length ? pick(L) : null;
}
async function runWild(e) { if (e.once) C.story.f['wd_' + e.id] = 1; if (e.scene) await runScene(e.scene, { title: e.title }); else await e.run(); save(); refresh(); }

/* ---------- 骨文 game: the runes light up one by one (numbered), then you connect them 1 → n.
   Nothing to memorise — the numbers stay. Finishing in time without a wrong tap gives the 宝术 a head start.
   The lighting is game state (R.shown), not a CSS animation, so it works with animations off and is mirrored in co-op. */
function runeGame(id) {
  if (window.__dbg && __dbg.auto) return Promise.resolve(!__dbg.runeFail);
  const n = { qly: 4, sn: 5, lei: 6, gw: 6 }[id] || 5, nodes = [];
  for (let t = 0; nodes.length < n && t < 400; t++) { const x = 34 + Math.random() * 252, y = 34 + Math.random() * 124; if (nodes.every(o => Math.hypot(o.x - x, o.y - y) > 66)) nodes.push({ x: Math.round(x), y: Math.round(y), g: runeGlyph() }); }
  const seq = shuffle(nodes.map((_, i) => i));
  return new Promise(res => { DLG = { rune: { id, name: SKILLS[id].name, nodes, seq, got: [], phase: 'show', shown: 0, fails: 0, bad: -1, dur: n * 1400 + 2000, t0: 0, k: uid() }, res }; renderDlg(); netSync(); runeShowStep(); });
}
function runeGlyph() { // a few strokes inside a circle — an abstract rune, different every time
  const P = () => [Math.round((Math.random() - 0.5) * 24), Math.round((Math.random() - 0.5) * 24)]; let d = '';
  for (let i = 0; i < 2 + rint(0, 1); i++) { const a = P(), b = P(), c = P(); d += i % 2 ? `M${a[0]} ${a[1]}Q${c[0]} ${c[1]} ${b[0]} ${b[1]}` : `M${a[0]} ${a[1]}L${b[0]} ${b[1]}`; } return d;
}
function runeShowStep() { const R = DLG && DLG.rune; if (!R || R.phase !== 'show') return; const k = R.k;
  setTimeout(() => { const Q = DLG && DLG.rune; if (!Q || Q.k !== k || Q.phase !== 'show') return;
    if (Q.shown < Q.seq.length) { Q.shown++; sfx('click'); renderDlg(); netSync(); runeShowStep(); }
    else { Q.phase = 'input'; Q.t0 = now(); renderDlg(); netSync(); } }, R.shown === 0 ? 500 : R.shown < R.seq.length ? 520 : 800); }
function runeTap(i) { const R = DLG && DLG.rune; if (!R || R.phase !== 'input' || NETROLE === 'guest' || R.got.includes(i)) return;
  if (R.seq[R.got.length] === i) { R.got.push(i); R.bad = -1; sfx('click'); if (R.got.length === R.seq.length) { R.phase = 'done'; R.ok = R.fails === 0 && now() - R.t0 <= R.dur; sfx(R.ok ? 'epic' : 'click'); renderDlg(); netSync(); if (R.ok) setTimeout(() => runeEnd(true), 900); return; } }
  else { R.fails++; R.bad = i; sfx('fail'); }
  renderDlg(); netSync(); }
function runeRetry() { const R = DLG && DLG.rune; if (!R || R.phase !== 'done' || R.ok || NETROLE === 'guest') return; Object.assign(R, { seq: shuffle(R.seq.slice()), got: [], phase: 'show', shown: 0, fails: 0, bad: -1, t0: 0, tries: (R.tries || 0) + 1, k: uid() }); sfx('click'); renderDlg(); netSync(); runeShowStep(); }
function runeAccept() { const R = DLG && DLG.rune; if (R && R.phase === 'done' && !R.ok && NETROLE !== 'guest') runeEnd(false); }
function runeSkip() { if (DLG && DLG.rune && NETROLE !== 'guest') runeEnd(false); }
function runeEnd(ok) { const D_ = DLG; if (!D_ || !D_.rune) return; DLG = null; logLine(ok ? '骨文一气呵成地连了起来，你一下子就看透了它的走向。' : '骨文连上了，可还不够顺，往后得慢慢磨。', 'dim'); renderDlg(); netSync(); D_.res(ok); }
function runeHtml(R) {
  const order = {}; R.seq.forEach((n, j) => order[n] = j); const path = R.phase === 'show' ? R.seq.slice(0, R.shown) : R.phase === 'done' ? R.seq : R.got;
  const links = path.slice(1).map((n, j) => { const a = R.nodes[path[j]], b = R.nodes[n]; return `<line class="lnk ${R.phase === 'show' ? 'demo' : ''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`; }).join('');
  const numOn = i => R.phase !== 'show' || order[i] < R.shown, lit = i => R.phase === 'show' ? order[i] < R.shown : R.phase === 'done' || R.got.includes(i);
  const nodes = R.nodes.map((o, i) => `<g class="nd ${lit(i) ? 'lit' : ''} ${R.phase === 'show' && order[i] === R.shown - 1 ? 'pop' : ''} ${R.phase === 'input' && R.seq[R.got.length] === i ? 'next' : ''} ${R.bad === i ? 'bad' : ''}" onclick="runeTap(${i})" transform="translate(${o.x} ${o.y})"><circle r="22"/><path d="${o.g}"/>${numOn(i) ? `<g class="num" transform="translate(16 -16)"><circle r="9"/><text y="4">${order[i] + 1}</text></g>` : ''}</g>`).join('');
  const left = R.phase === 'input' ? Math.max(0, R.dur - (now() - R.t0)) : R.dur;
  const msg = R.phase === 'show' ? `看骨文一道道亮起来……（${R.shown}/${R.seq.length}）` : R.phase === 'input' ? `按 1 → ${R.seq.length} 的顺序点，把骨文连起来（${R.got.length}/${R.seq.length}）${R.fails ? `　<span class="bad">点错 ${R.fails} 次</span>` : ''}` : R.ok ? '一气呵成！熟练度起步更高。' : `连上了，不过${R.fails ? `点错了 ${R.fails} 次` : '慢了一点'}。一气呵成的话，熟练度起步更高。`;
  return `<div class="line"><div>${sealHtml({ n: R.name, c: '#7a4a1a' })}</div><div class="tx nar">${R.phase === 'done' ? '骨文连成了一体，在你眼前亮了一下，钻进了你的骨头里。' : R.phase === 'show' ? '骨文在你眼前一道接一道地亮起来，串成一条路。' : '照着它的路，自己走一遍。不用记——数字都在。'}</div></div>
    <div class="rune"><svg viewBox="0 0 320 190">${links}${nodes}</svg>${R.phase === 'input' ? `<div class="rtime" title="又快又不点错，熟练度起步更高"><i style="animation-duration:${R.dur}ms;animation-delay:-${R.dur - left}ms"></i></div>` : ''}<div class="msg">${msg}</div></div>${R.phase !== 'done' ? `<div class="ch"><button class="chb" onclick="runeSkip()">先不连了，直接学（跳过）</button></div>` : R.ok ? '' : `<div class="ch"><button class="chb" onclick="runeRetry()">↻ 再连一次</button><button class="chb" onclick="runeAccept()">就这样，学下来</button></div>`}`;
}

/* ================= long-term goals and conveniences =================
   宝骨 · 灵兽觉醒 · 材料兑换 · 每日悬赏 · 地点探索度 · 称号 · 传送 · 睡到天黑/天亮 · 洞天重开 · 困难秘境 · 战斗教学 */

/* ---------- 宝骨 ---------- */
function gainRelic(id, quiet) { C.relics = C.relics || {}; if (C.relics[id]) return; C.relics[id] = 1; const R = RELICS[id]; C.eq = C.eq || []; if (C.eq.length < relicSlots(C.lv)) C.eq.push(id);
  if (!quiet) { logLine(`<b class="lvup">得到宝骨</b>：${R.i}<b>${R.n}</b>——${R.d}${C.eq.includes(id) ? '（已经戴上了）' : '（在“石昊”页里换着戴）'}`, 'sys'); sfx('epic'); bigFlash(R.n, 'relic'); } fixHp(); }
function relicFromKills(kills) { for (const [mob, , boss] of kills || []) if (boss) for (const [id, R] of Object.entries(RELICS)) if (R.from === mob) gainRelic(id); }
function equipRelic(id) { if (!C.relics || !C.relics[id]) return; C.eq = C.eq || []; const i = C.eq.indexOf(id); if (i >= 0) C.eq.splice(i, 1); else { if (C.eq.length >= relicSlots(C.lv)) { toast('宝骨栏满了（' + relicSlots(C.lv) + ' 件），先摘下一件'); return; } C.eq.push(id); } fixHp(); sfx('click'); save(); refresh(); }

/* ---------- 灵兽觉醒 at full affection ---------- */
const EVO_TEXT = {
  maoqiu: ['毛球蹲在石头上晒太阳，晒着晒着，它身上的金毛一根根竖了起来，像着了火。', '你眨了眨眼——它投在地上的影子，有那么一瞬间，大得像一座山。', '影子缩了回去。毛球打了个哈欠，跳上你的肩膀。可你知道，它不一样了。'],
  dahong: ['大红在你头顶盘旋了三圈，忽然一声长鸣，翅膀上的红羽一片片亮起来，像烧透的炭。', '它落下来的时候，羽毛尖上还跳着小小的火苗。它得意地冲你“嘎”了一声。'],
  ertuzi: ['二秃子缩在你衣领里，忽然浑身发起光来，五种颜色的光一圈一圈往外荡。', '光散了。你凑近了仔细看——它脑袋顶上，终于冒出了一根毛。只有一根。'],
};
function petEvoCheck(id) { const p = C.pets[id]; if (!p || p.evo || p.aff < 100 || NETROLE === 'guest') return; p.evo = 1;
  setTimeout(() => runScene(async () => { for (const t of EVO_TEXT[id]) await nar(t); if (id === 'ertuzi') await me('……恭喜你。'); const P = PETS[id], sk = P.sk.find(s => s.evo);
    logLine(`<b class="lvup">灵兽觉醒</b>：${P.icon}<b>${P.name}</b> 全身属性 +15%，学会了 <b>${sk.n}</b>。`, 'sys'); sfx('epic'); bigFlash(P.name + ' · 觉醒', 'relic'); }, { title: PETS[id].name + '觉醒' }), 500); }

/* ---------- trading surplus materials ---------- */
function tradeOptions(npc) { return TRADES.map((T, i) => [T, i]).filter(([T]) => T.npc === npc).map(([T, i]) => ({ t: `🔁 ${T.t}`, dis: !T.need.every(([k, n]) => itemN(k) >= n), f: () => tradeDo(i) })); }
async function tradeDo(i) { const T = TRADES[i]; if (!T || !T.need.every(([k, n]) => itemN(k) >= n)) { toast('东西不够'); return; }
  if (T.prof) { if (!C.sk.length) { toast('你还没学会宝术'); return; } await runScene(async () => { await say(T.npc, '想练哪一门？'); const c = await choose([...C.sk.map(id => SKILLS[id].icon + SKILLS[id].name + `（${(C.prof && C.prof[id]) || 0}）`), '算了']); if (c >= C.sk.length) return;
      for (const [k, n] of T.need) takeItem(k, n); const id = C.sk[c]; for (let k = 0; k < T.prof; k++) profUse(id); await say(T.npc, '照着这上面的纹路，再走几遍。'); logLine(`${SKILLS[id].name} 熟练度 +${T.prof}（${C.prof[id]}）`, 'sys'); }); return; }
  for (const [k, n] of T.need) takeItem(k, n); T.give(); sfx('loot'); save(); refresh(); }

/* ---------- daily bounties ---------- */
function bountyToday() { // one per person per day; someone who becomes available later in the day gets theirs then
  const d = gameDay(); if (!C.bounty || C.bounty.day !== d) C.bounty = { day: d, list: [] }; const list = C.bounty.list;
  for (const B of BOUNTY_FROM) { if (!B.open() || list.some(b => b.npc === B.npc)) continue; const r = srng('bounty' + d + C.created + B.npc);
    const ps = Object.values(PLACES).filter(p => B.areas.includes(p.area) && placeOpen(p.id) && p.mobs && p.lv && p.lv[0] <= C.lv + 2);
    if (ps.length && r() < 0.7) { const P = ps[Math.floor(r() * ps.length)], m = P.mobs[Math.floor(r() * P.mobs.length)][0]; list.push({ npc: B.npc, kind: 'kill', id: m, n: 4 + Math.floor(r() * 3), got: 0, st: 'new', where: P.name, loc: P.id }); }
    else { const it = ['bone', 'herb', 'meat', 'lingyao'][Math.floor(r() * 4)]; list.push({ npc: B.npc, kind: 'item', id: it, n: it === 'lingyao' ? 2 : 3 + Math.floor(r() * 2), got: 0, st: 'new' }); } }
  return list; }
const bountyText = b => b.kind === 'kill' ? `打 ${b.n} 头${MOBS[b.id].name}（${b.where}，${Math.min(b.got, b.n)}/${b.n}）` : `带 ${b.n} 个${ITEMS[b.id].name}（${Math.min(itemN(b.id), b.n)}/${b.n}）`;
const bountyReady = b => b.kind === 'kill' ? b.got >= b.n : itemN(b.id) >= b.n;
function bountyOptions(npc) { const out = []; bountyToday().forEach((b, i) => { if (b.npc !== npc || b.st === 'done') return;
  out.push({ t: b.st === 'new' ? `📋 今日悬赏：${bountyText(b)}` : bountyReady(b) ? `✔ 交悬赏：${bountyText(b)}` : `📋 悬赏进行中：${bountyText(b)}`, dis: b.st === 'on' && !bountyReady(b), f: () => bountyTake(i) }); }); return out; }
function bountyTake(i) { const b = bountyToday()[i]; if (!b || b.st === 'done') return;
  if (b.st === 'new') { b.st = 'on'; logLine(`【悬赏】${NPCS[b.npc].name}：${bountyText(b)}`, 'quest'); save(); refresh(); return; }
  if (!bountyReady(b)) return; if (b.kind === 'item') takeItem(b.id, b.n); b.st = 'done'; C.stats.bounty = (C.stats.bounty || 0) + 1;
  logLine(`【悬赏完成】${NPCS[b.npc].name}很满意。`, 'quest'); gainMoney(20 + C.lv * 4, '赏钱'); addItem('baoyao'); addItem('lingyao'); gainExp(BAL.expNext(C.lv) * 0.3); const sk = C.bar.length ? pick(C.bar) : null; if (sk) { for (let k = 0; k < 5; k++) profUse(sk); logLine(`${SKILLS[sk].name} 熟练度 +5`, 'dim'); } sfx('loot'); save(); refresh(); }
function bountyKill(mob) { if (!C.bounty || C.bounty.day !== gameDay()) return; for (const b of C.bounty.list) if (b.st === 'on' && b.kind === 'kill' && b.id === mob && b.got < b.n) { b.got++; if (b.got === b.n) logLine(`【悬赏】${MOBS[mob].name} 够数了，回去找${NPCS[b.npc].name}。`, 'quest'); } }

/* ---------- 地点探索度: every kind of beast here beaten + everything here gathered ---------- */
function exTargets(P) { const m = [...new Set((P.mobs || []).map(x => x[0]))], g = [...new Set((P.gather || []).map(x => x[0]))]; return { m, g, n: m.length + g.length }; }
function exState(loc) { C.ex = C.ex || {}; return C.ex[loc] || (C.ex[loc] = { m: {}, g: {} }); }
function exCount(loc) { const P = PLACES[loc], T = exTargets(P), E = (C.ex && C.ex[loc]) || { m: {}, g: {} }; return { have: T.m.filter(x => E.m[x]).length + T.g.filter(x => E.g[x]).length, n: T.n, done: !!E.done }; }
function exNote(loc, k, id) { const P = PLACES[loc]; if (!P || !P.lv) return; const T = exTargets(P); if (!T[k].includes(id)) return; const E = exState(loc); if (E[k][id]) return; E[k][id] = 1;
  const c = exCount(loc); if (c.have >= c.n && !E.done) { E.done = 1; logLine(`<b class="lvup">${P.name} 探索完成</b>：这里的凶兽都交过手，能采的东西也都找到了。`, 'sys'); addItem('baoyao'); addItem('lingyao'); gainMoney(30 + C.lv * 5, '还翻出了'); gainExp(BAL.expNext(C.lv) * 0.3); sfx('epic'); bigFlash(P.name + ' · 探索完成', 'relic'); } }

/* ---------- 称号 ---------- */
function achCheck() { if (!C || NETROLE === 'guest') return; C.ach = C.ach || {}; for (const A of ACH) if (!C.ach[A.id]) { let ok = false; try { ok = A.ok(); } catch (e) { } if (ok) { C.ach[A.id] = now(); logLine(`<b class="lvup">获得称号「${A.n}」</b>——${A.d}`, 'sys'); toast('称号：' + A.n); sfx('level'); } } }
function setTitle(id) { C.title = C.title === id ? '' : id; sfx('click'); save(); refresh(); }

/* ---------- 传送 (阁主's jade token, after joining 补天阁) ---------- */
const TP = [{ id: 'sc_street', n: '石村' }, { id: 'bt_court', n: '补天阁内院' }, { id: 'bd_gate', n: '百断山口' }, { id: 'xs_hall', n: '虚神界（神魂过去）' }];
const canTeleport = () => !!C.story.f.joined && (PLACES[C.loc].town || C.loc === 'bd_gate');
async function teleport() { if (!canTeleport() || STATE.scene || STATE.battle || STATE.dungeon) return; const L = TP.filter(t => t.id !== C.loc && placeOpen(t.id)); if (!L.length) return; let to = null;
  await runScene(async () => { const c = await dlgChoose([...L.map(t => ({ t: '🌀 ' + t.n })), { t: '算了' }], '玉符在掌心微微发烫。去哪儿？'); if (c < L.length) to = L[c].id; });
  if (to) { logLine('玉符一亮，眼前的景物像水面一样晃了晃——', 'dim'); go(to); } }

/* ---------- 休息：歇一会儿 / 睡到天黑 / 睡到天亮 ---------- */
async function rest() { if (STATE.scene || STATE.battle) return; let c = 0;
  await runScene(async () => { c = await dlgChoose([{ t: '🛏 歇一会儿（气血符力回满）' }, { t: '🌙 一觉睡到天黑', dis: isNight() }, { t: `🌅 一觉睡到天亮（第 ${(C.day || 1) + 1} 天：虚神界、悬赏换新）` }, { t: '算了' }], C.loc === 'sc_willow' ? '柳枝在头顶轻轻晃着。' : C.loc === 'bt_court' ? '神藤下很安静。' : '石屋里铺着兽皮，暖烘烘的。'); });
  if (c === 3) return; fullHeal(); sfx('heal'); if (c === 1) { C.tick = BAL.duskAt; bannerKey = ''; } if (c === 2) newDay();
  logLine(c === 1 ? '你一觉睡到了天黑。窗外的大荒换了一副样子，夜行的东西都出来了。' : c === 2 ? '你一觉睡到了天亮，伸了个懒腰，浑身是劲。' : C.loc === 'sc_willow' ? '你在柳树下坐了一会儿，一缕神光拂过，身上的伤都不疼了。' : C.loc === 'bt_court' ? '你在神藤下打坐了一个时辰，气血、符力都回满了。' : '你美美地睡了一觉，气血、符力都回满了。', 'dim'); save(); refresh(); bannerDraw(); }

/* ---------- 洞天重开 at 柳神 ---------- */
async function dongtianRedo() { if (!C.dt.length || !itemN('lingyao')) return;
  await runScene(async () => { await say('willow', '（柳枝垂下来，点在你胸口。你体内的洞天一座座亮了起来。）'); const c = await choose([...C.dt.map((k, i) => `第 ${i + 1} 座：${DONGTIAN.find(d => d.k === k).n}`), '算了']); if (c >= C.dt.length) return;
    const old = C.dt[c], opts = shuffle(DONGTIAN.filter(d => d.k !== old).slice()).slice(0, 2); const c2 = await choose([...opts.map(o => `${o.n}（${o.d}）`), '还是留着原来的']); if (c2 >= 2) return;
    takeItem('lingyao'); C.dt[c] = opts[c2].k; fixHp(); logLine(`第 ${c + 1} 座洞天重开成了<b>${opts[c2].n}</b>（${opts[c2].d}）。`, 'sys'); sfx('epic'); }); }

/* ---------- 困难秘境 ---------- */
function enterDungeonHard(id) { if (!C.dungeons[id]) return; enterDungeon(id, true); }

/* ---------- 任务列表: main line, side errands and bounties side by side; pick which one to follow ---------- */
const npcLocNow = n => { const P = Object.values(PLACES).find(p => placeOpen(p.id) && npcsHere(p.id).includes(n)); return P ? P.id : null; };
function itemWhere(id) { // the open wild place closest to your level where it can be gathered, or else where a beast drops it
  const open = Object.values(PLACES).filter(p => placeOpen(p.id) && p.lv && route(C.loc, p.id)), by = L => L.sort((a, b) => Math.abs(a.lv[0] - C.lv) - Math.abs(b.lv[0] - C.lv))[0];

    if (p.bar.length < n) p.bar.push(i); else { const cat = PETS[id].sk[i].cat, old = p.bar.filter(k => PETS[id].sk[k].cat === cat)[0]; if (old != null) { p.bar[p.bar.indexOf(old)] = i; if (STATE.mode === 'play') toast(`${PETS[id].name} 学会「${PETS[id].sk[i].n}」，换下了「${PETS[id].sk[old].n}」`); } } }

  else if (bar.length < n) p.bar = [...bar, i];

  setTimeout(() => { const D_ = DLG; if (!D_ || D_.mini !== M) return; DLG = null; clearInterval(UI.miniT); renderDlg(); netSync(); D_.res({ ok, score: score || 0, skip: !!skip }); }, skip ? 50 : 1100); }
function miniRetry() { const M = DLG && DLG.mini; if (!M || !M.ask || NETROLE === 'guest') return; sfx('click'); DLG.mini = miniNew(M.kind, M.o, (M.tries || 0) + 1); renderDlg(); netSync(); miniLoop(); }
function miniGiveUp() { const D_ = DLG, M = D_ && D_.mini; if (!M || !M.ask || NETROLE === 'guest') return; sfx('click'); DLG = null; clearInterval(UI.miniT); renderDlg(); netSync(); D_.res({ ok: false, score: M.score || 0, skip: false, gaveUp: true }); }
function miniHtml(M) { const G = MINI[M.kind];
  if (M.ask) return `<div class="line"><div>${sealHtml({ n: M.title, c: '#7a4a1a' })}</div><div class="tx nar">没成……${M.tries ? `（已经试了 ${M.tries + 1} 回）` : ''}要再来一次吗？</div></div><div class="ch"><button class="chb" onclick="miniRetry()">↻ 再试一次</button><button class="chb" onclick="miniGiveUp()">跳过，接着往下</button></div>`;
  if (M.done) return `<div class="line"><div>${sealHtml({ n: M.title, c: '#7a4a1a' })}</div><div class="tx nar">${M.skip ? '先不玩了。' : '<b>成了！</b>'}</div></div>`;
  return `<div class="line"><div>${sealHtml({ n: M.title, c: '#7a4a1a' })}</div><div class="tx nar">${M.desc || ''}<div class="mhint">${G.hint}</div></div></div>
    <div class="mini m-${M.kind}">${now() < M.t0 ? '<div class="mready">准备……</div>' : ''}${G.html.call(G, M)}</div><div class="ch"><button class="chb" onclick="miniSkip()">先不玩了（跳过）</button></div>`; }
addEventListener('keydown', e => { if (DLG && DLG.mini && !DLG.mini.done && (e.key === ' ' || e.key === 'Enter') && DLG.mini.kind !== 'lights') { e.preventDefault(); miniTap(); } }, true);

  if (o.shiyi) logLine('石毅的两个瞳孔一起转了过来。<b>重瞳</b>：同一门宝术连着对他用，会被他看穿（伤害减半）。', 'tip');
  const r = await startBattle({ rivals: [o], title: `虚神界 · 挑战第 ${o.rank} 名 ${o.name}`, noLose: true, flee: false, arena: 1, noPet: true });
  if (r && r.win && o.shiyi && !C.story.f.shiyiWin) { C.story.f.shiyiWin = 1; setTimeout(() => runScene(async () => { await nar('光幕上，你的名字压过了那个带着“重瞳”二字的名字。'); await say('石毅', '……第一，你先拿着。'); await nar('他转身走进了光里，没有回头。你胸口的疤，又跳了一下。'); }, { title: '登顶' }), 900); }
  fullHeal(); if (r && r.win) { C.arena.wins++; const old = C.arena.rank; if (o.rank < old) C.arena.rank = o.rank; logLine(`虚神界排名 ${old > 100 ? '榜外' : old} → <b>${C.arena.rank}</b>`, 'sys'); arenaMilestones(); storyArena(); }
  else logLine('输了。光幕上你的名字没动。', 'dim'); save(); refresh();
}

/* ---------- 虚神界 rewards: one-time when you first reach the top 50 / 10 / 1, and a daily gift by rank ---------- */
const ARENA_MS = [{ r: 50, t: '光幕上，你的名字第一次镶上了金边。', items: [['baoyao', 2]], exp: 0.3 }, { r: 10, t: '你挤进了虚神界前十。各族的天才开始记住“大荒来的小不点”这个名字。', items: [['baoyao', 3], ['lingyao', 3]], exp: 0.5 }, { r: 1, t: '虚神界第一！光幕上，你的名字压在了所有人的头上。', items: [['baoyao', 5], ['lingyao', 5]], exp: 1 }];
function arenaMilestones() { const r = C.arena.rank; C.arena.best = Math.min(C.arena.best || 999, r); C.arena.got = C.arena.got || {};
  for (const M of ARENA_MS) if (r <= M.r && !C.arena.got[M.r]) { C.arena.got[M.r] = 1; logLine(`<b class="lvup">${M.t}</b>`, 'sys'); for (const [k, n] of M.items) addItem(k, n); gainExp(BAL.expNext(C.lv) * M.exp); sfx('epic'); }
  if (r <= 10 && !C.story.f.shiyi) setTimeout(() => runScene(S_shiyi, { title: '重瞳' }), 700); }
const arenaGift = r => r <= 10 ? { items: [['baoyao', 2], ['lingyao', 2]], exp: 0.25 } : r <= 50 ? { items: [['baoyao', 1], ['lingyao', 1]], exp: 0.15 } : r <= 100 ? { items: [['lingyao', 1], ['herb', 2]], exp: 0.08 } : { items: [['herb', 2]], exp: 0.04 };
function arenaClaim() { if (C.arena.claimed === gameDay()) return; C.arena.claimed = gameDay(); const g = arenaGift(arenaRank()); logLine(`虚神界的光幕洒下一片微光——按今天的排名（${arenaRank() > 100 ? '榜外' : '第 ' + arenaRank() + ' 名'}）领到了奖励。`, 'sys'); for (const [k, n] of g.items) addItem(k, n); gainExp(BAL.expNext(C.lv) * g.exp); sfx('loot'); save(); refresh(); }

/* heard rumours are kept in the save (C.rumorLog) so they can be reread under 📜 记录 → 江湖传闻; co-op guests see the host's */
function rumorTick() {
  if (STATE.mode !== 'play' || !C || NETROLE === 'guest' || curMode() !== 'explore' || UI.nav || now() < (UI.rumorNext || 0)) return; UI.rumorNext = now() + rint(35000, 60000);
  const q = C.story.q, A = RUMORS.filter(r => q >= qi(r.from) && q <= qi(r.to)); if (!A.length) return;
  const heard = new Set((C.rumorLog || []).map(r => r.t)); // each rumour is heard once per save; when they run out, it stays quiet until the story moves on
  const L = A.filter(r => !heard.has(r.t)); if (!L.length) return;
  const r = pick(L); C.rumorLog = (C.rumorLog || []).concat([{ who: r.who, t: r.t, day: C.day || 1, at: C.loc, nt: isNight() ? 1 : 0, n: (C.rumorN = (C.rumorN || 0) + 1) }]).slice(-300);
  logLine(`【传闻 · ${esc(r.who)}】${r.t}`, 'rumor dim'); save(); renderRumor(); netSync(); }
const rumorWide = () => document.body.classList.contains('cols');
function renderRumor() { // wide screens: the last three, always there; phones: the newest one floats by for a few seconds
  const e = $('rumor'); if (!e || !C) return; const L = C.rumorLog || []; if (!L.length) { e.className = ''; e.innerHTML = ''; return; } const last = L[L.length - 1];
  if (rumorWide()) { e.className = 'multi'; e.innerHTML = L.slice(-3).reverse().map((r, i) => `<div class="rl ${i === 0 && UI.rumorKey !== last.n ? 'new' : ''}"><span class="rw">${esc(r.who)}</span>${r.t}</div>`).join('') + `<div class="rmore">江湖传闻 · 共 ${L.length} 条 ›</div>`; UI.rumorKey = last.n; return; }
  if (UI.rumorKey === last.n && e.classList.contains('one')) return; const fresh = UI.rumorKey !== last.n; UI.rumorKey = last.n; if (!fresh) { e.className = ''; return; }
  e.innerHTML = `<span class="rw">${esc(last.who)}</span>${last.t}<span class="rmore"> ›</span>`; e.className = ''; void e.offsetWidth; e.className = 'one on'; clearTimeout(UI.rumorT); UI.rumorT = setTimeout(() => e.classList.remove('on'), 9000); }
function openRumors() { UI.logTab = 'rumor'; if (UI.nav === 'log') { sfx('click'); renderSide(); } else navTo('log'); }

/* ================= climaxes: making the big moments feel big =================
   Story side
     cine(text, kind)   a full-screen line over the location painting (no paper box). kind: '' (night ink), 'mem' (a memory, sepia), 'card' (chapter title)
     chapterCard(no, title, sub)
   Battle side — pass `epic` in a fight spec (or a dungeon boss room):
     { name, sub, seal, intro:[lines], phase:'line at half health', low:{who, t}, end:[lines] }
     · a boss card (huge name, epithet, a few lines) before the first turn, with the boss music
     · at half health the boss's line crosses the screen
     · 绝境: the first time 石昊 drops under 30% (or would fall) someone's words come back to him — he recovers 25% 气血,
       shakes off bad effects and hits 30% harder for 3 rounds. Once per fight.
     · the killing blow flashes white, then the closing lines.
   Battle overlays are recorded as events (k:'cine' / 'finish'), so a co-op partner sees them too, and the playback waits for them. */
const cine = (text, kind = '') => dlgShow({ who: '', text, cine: kind || 'ink' });
const chapterCard = (no, title, sub = '') => cine(`<div class="cc"><small>${no}</small><b>${title}</b>${sub ? `<i>${sub}</i>` : ''}</div>`, 'card');
const plainLen = t => String(t || '').replace(/<[^>]+>/g, '').length;
const cineMs = ev => ev.k === 'finish' ? 900 : Math.min(4600, 2000 + plainLen(ev.text) * 75) * (SET.fast ? 0.7 : 1);
const EPIC_BAD = ['stun', 'bleed', 'burn', 'poison', 'weak', 'bound', 'brk', 'mark'];

/* ---------- battle hooks (called from the engine) ---------- */
function epicLow(B, d) { // 绝境
  const E = B.epic; if (!E || !E.low || B.burst || d.kind !== 'pc' || d.hp >= d.hpMax * 0.3) return; B.burst = 1; if (d.hp <= 0) d.hp = 1;
  const h = Math.round(d.hpMax * 0.25); d.hp = Math.min(d.hpMax, d.hp + h); d.st = d.st.filter(s => !EPIC_BAD.includes(s.k)); addSt(d, { k: 'burst', t: 3, v: 0.3 });
  fxe(B, { k: 'cine', cls: 'burst', who: E.low.who || '', text: E.low.t }); blog(B, `<span class="cine">${E.low.who ? `<b>${esc(E.low.who)}</b>　` : ''}${E.low.t}</span>`);
  fxe(B, { k: 'heal', t: d.id, v: h, hp: hpr(d) }); blog(B, `<span class="phase">绝境！${uName(d)} 气血回复 ${h}，身上的伤病一扫而空，接下来 3 回合攻击 +30%</span>`); }
function epicPhase(B, d) { const E = B.epic; if (!E || !E.phase) return; fxe(B, { k: 'cine', cls: 'phase', who: d.name, text: E.phase }); blog(B, `<span class="cine red">${E.phase}</span>`); }
function epicKill(B, d) { if (B.epic && d.side === 1 && (d.boss || alive(B, 1).length === 0)) fxe(B, { k: 'finish', t: d.id }); }
function epicEnd(B) { const E = B.epic; if (!E || !E.end || !E.end.length) return; const t = E.end.join('<br>'); fxe(B, { k: 'cine', cls: 'end', text: t }); blog(B, `<span class="cine">${t}</span>`); }

/* ---------- battle overlays ---------- */
function fxBossCard(B) { const E = B.epic, intro = E.intro || [], dur = Math.round((2600 + intro.length * 1000) * (SET.fast ? 0.75 : 1));
  const d = el('div', 'fx bosscard', `<div class="bc-ink"></div><div class="bc-sub">${esc(E.sub || '')}</div><div class="bc-name">${esc(E.name)}</div><div class="bc-seal">${esc(E.seal || '首领')}</div><div class="bc-lines">${intro.map((t, i) => `<div class="bc-line" style="animation-delay:${0.9 + i * 0.95}s">${t}</div>`).join('')}</div><div class="bc-skip">点击跳过</div>`);
  d.style.setProperty('--dur', dur + 'ms'); $('bfx').appendChild(d); sfx('epic'); $('vBattle').classList.remove('quake'); void $('vBattle').offsetWidth; $('vBattle').classList.add('quake');
  const end = () => { if (!d.parentNode) return; d.classList.add('out'); setTimeout(() => d.remove(), 400); }; d.onclick = e => { e.stopPropagation(); end(); UI.animEnd = Math.min(UI.animEnd, now() + 200); setTimeout(() => { if (STATE.battle && STATE.battle.id === B.id) renderBattle(true); }, 260); };
  setTimeout(end, dur); return dur; }
function fxCine(ev) { $('bfx').querySelectorAll('.cineband').forEach(e => e.remove()); const ms = cineMs(ev);
  const d = el('div', 'fx cineband ' + (ev.cls || ''), `${ev.who ? `<small>${esc(ev.who)}</small>` : ''}<span>${ev.text}</span>`); d.style.setProperty('--dur', ms + 'ms'); $('bfx').appendChild(d); $('bfx').classList.add('cining'); clearTimeout(UI.cineT); UI.cineT = setTimeout(() => { d.remove(); $('bfx').classList.remove('cining'); }, ms); // speech bubbles step aside while the band is up
  if (ev.cls === 'burst') { fxSpawn('fx-burstflash', { x: 0, y: 0, w: 0 }, '', 1400); fxClass('hero', 'bursting', 1600); sfx('level'); }
  else if (ev.cls === 'phase') sfx('fail'); else sfx('magic'); }
function fxFinish(ev) { const c = cardOf(ev.t); fxSpawn('fx-whiteflash', { x: 0, y: 0, w: 0 }, '', 900); if (c) fxSpawn('fx-inkburst', fxAt(c), '<b></b><b></b><b></b>', 1100);
  $('vBattle').classList.remove('quake'); void $('vBattle').offsetWidth; $('vBattle').classList.add('quake'); sfx('crit'); }

  { id: 'tk_chief1', npc: 'chief', from: 'q_wolf0', to: 'q_bei', s: [['chief', '小不点，你过来。今天跟谁打架了？'], ['me', '没有！'], ['chief', '那你袖子呢？'], ['me', '……被狼借走了。'], ['chief', '（族长扶着额头叹气）狼还会借袖子了。去，把这件换上。'], ['nar', '他扔过来一件新缝的小褂，针脚密得像鱼鳞。']] },
  { id: 'tk_chief2', npc: 'chief', from: 'q_yaoding', to: 'q_leave', s: [['chief', '你知道“骨文”是什么吗？'], ['ch', ['凶兽骨头上的花纹', '能吃的花纹？'], [[['chief', '对了一半。那是天地刻在它们身上的道理。认得了骨文，就认得了它们的本事。']], [['chief', '……（族长沉默了很久）你这辈子，是不是除了吃就没别的了？'], ['me', '还有睡觉。'], ['chief', '滚去练功！']]]]] },
  { id: 'tk_chief3', npc: 'chief', from: 'q_xushen0', to: 'q_leave', s: [['chief', '虚神界里，打得过就打，打不过……'], ['me', '就跑？'], ['chief', '……就记住他的样子，回来练。跑什么跑，石村的孩子不跑。'], ['me', '可你上次说打不过就跑。'], ['chief', '那是在墓里！虚神界又死不了人！']] },
  { id: 'tk_linhu1', npc: 'linhu', from: 'q_yard', to: 'q_tomb', s: [['linhu', '进山打猎，第一条规矩是什么？'], ['ch', ['别出声', '先吃饱'], [[['linhu', '对。第二条？'], ['me', '……还是先吃饱。'], ['linhu', '（林虎叔想了想）……也对。']], [['linhu', '（他张嘴想骂，又闭上了）……行吧，这条也算。饿着肚子拉不开弓。']]]]] },
  { id: 'tk_linhu2', npc: 'linhu', from: 'q_bei', to: 'q_leave', s: [['linhu', '小不点，我打了三十年猎，你知道最难打的是什么吗？'], ['me', '青鳞鹰？'], ['linhu', '是你婶子。'], ['nar', '远处传来一声“石林虎！你又在那儿说我什么？！”林虎叔的脸一下子白了。'], ['linhu', '……我什么都没说。你也什么都没听见。']] },
  { id: 'tk_dz1', npc: 'dazhuang', from: 'q_wake', to: 'q_egg', s: [['dazhuang', '小不点，你说，凶兽是生吃好吃，还是烤着好吃？'], ['ch', ['烤着', '看什么凶兽'], [[['dazhuang', '我也这么想！我们果然是好兄弟！']], [['me', '狼要烤，鸟要炖，蛇要熬汤。'], ['dazhuang', '（擦口水）……你懂得真多。你以后肯定能当族长。'], ['me', '当族长能多吃吗？'], ['dazhuang', '能！'], ['me', '那我当。']]]]] },
  { id: 'tk_dz2', npc: 'dazhuang', from: 'q_ruin', to: 'q_leave', s: [['dazhuang', '小不点，搬家那天，我把我家的肉干全扛上了。'], ['me', '那你爹娘呢？'], ['dazhuang', '……他们自己会走啊。'], ['nar', '大壮的爹在不远处，正好听见了这句话。'], ['nar', '那天晚上，大壮家传出了很响的声音。']] },
  { id: 'tk_ph1', npc: 'pihou', from: 'q_wake', to: 'q_tomb', s: [['pihou', '小不点，我教你一招“猴子偷桃”！'], ['ch', ['好啊', '你先打一遍'], [[['nar', '皮猴一爪子抓过来，你一侧身，他一头扎进了草垛。'], ['pihou', '（从草里探出头）……这招还有第二式，叫“猴子钻草”。']], [['nar', '皮猴打了一遍，摔了两跤，扭了一回脚。'], ['pihou', '这招是这样的，你学会了吗？'], ['me', '学会了。“别学”。']]]]] },
  { id: 'tk_ph2', npc: 'pihou', from: 'q_xushen0', to: 'q_leave', s: [['pihou', '小不点，虚神界里是不是有好多长角的、长翅膀的？'], ['me', '还有眼睛里有两个瞳孔的。'], ['pihou', '两个？那他看我是看到两个我吗？'], ['me', '……不知道。下回我问问。'], ['pihou', '你问的时候说我是你大哥！']] },
  { id: 'tk_em1', npc: 'ermeng', from: 'q_wake', to: 'q_bei', s: [['ermeng', '……（二猛看了看四周，压低声音）你要兽奶吗？'], ['ch', ['要', '哪儿来的？'], [[['nar', '他从怀里掏出一罐，又掏出一罐，又掏出一罐。'], ['me', '你身上到底装了多少？'], ['ermeng', '……够用。']], [['ermeng', '……你别问。问了你就是同伙了。'], ['me', '那我不问了。给我。']]]]] },
  { id: 'tk_em2', npc: 'ermeng', from: 'q_jijing', to: 'q_leave', s: [['ermeng', '毛球偷了族长的兽奶，族长以为是我。'], ['me', '然后呢？'], ['ermeng', '我挨了一顿骂。'], ['me', '那你冤啊。'], ['ermeng', '……不冤。我昨天也偷了。']] },
  { id: 'tk_willow1', npc: 'willow', from: 'q_egg0', to: 'q_leave', s: [['me', '柳神柳神，你吃东西吗？'], ['nar', '柳枝一动不动。'], ['me', '那你饿不饿？'], ['nar', '柳枝一动不动。'], ['me', '我给你带了块肉干——'], ['nar', '一根柳枝轻轻垂下来，把肉干推回了你手里，又在你脑袋上拍了拍。'], ['me', '……好吧，我自己吃。']] },
  { id: 'tk_willow2', npc: 'willow', from: 'q_memory', to: 'q_leave', s: [['me', '柳神，我要出村了。'], ['nar', '风停了。柳枝垂得很低，几乎碰到你的头顶。'], ['me', '我会回来的。到时候给你带外面的土，外面的水，还有外面的肉——'], ['nar', '柳枝在你额头上，轻轻弹了一下。'], ['me', '……好，肉就不带了。']] },
  // 补天阁
  { id: 'tk_qf1', npc: 'qingfeng', from: 'q_join', to: 'q_qf2', s: [['qingfeng', '你一顿吃九碗饭，伙房的人都在说。'], ['me', '他们做得好吃。'], ['qingfeng', '……我一顿吃一碗。'], ['me', '那你吃得太少了，所以才——'], ['qingfeng', '才什么？'], ['ch', ['才打不过我', '才这么好看'], [[['nar', '清风盯着你看了三息，转身走了。第二天，她练拳的木桩换成了石桩。']], [['nar', '清风愣了一下，耳朵慢慢红了，然后一拳砸在你肩膀上。'], ['qingfeng', '……吃你的饭去。']]]]] },
  { id: 'tk_qf2', npc: 'qingfeng', from: 'q_qf2', to: 'q_end', s: [['qingfeng', '小比的时候，我用了你那招“绕到背后”。'], ['me', '管用吧？'], ['qingfeng', '管用。就是守关的师兄说我“跟那个大荒来的一个德行”。'], ['me', '那是夸你。'], ['qingfeng', '……我知道。']] },
  { id: 'tk_gy1', npc: 'guiye', from: 'q_bully', to: 'q_end', s: [['me', '诡爷，你今天说了几个字了？'], ['guiye', '……'], ['me', '我数着呢，零个。'], ['guiye', '……一。'], ['me', '“一”也算？'], ['guiye', '……二。'], ['nar', '你觉得他在笑。可他的脸一点都没动。']] },
  { id: 'tk_gy2', npc: 'guiye', from: 'q_qf3', to: 'q_end', s: [['me', '诡爷，百断山里那把锈剑，你认识？'], ['guiye', '……'], ['nar', '诡爷看了你很久，伸手在你脑袋上按了一下，又放开。'], ['guiye', '……吵。'], ['me', '我就问了一句！'], ['guiye', '……一句，也吵。']] },
  { id: 'tk_gz1', npc: 'gezhu', from: 'q_bully', to: 'q_end', s: [['gezhu', '听说你把收份例的那几个师兄打了？'], ['me', '他们先动的手。'], ['gezhu', '嗯。打得好。'], ['me', '……你不罚我？'], ['gezhu', '罚。去伙房帮厨三天。'], ['me', '！！！'], ['gezhu', '……你是不是太高兴了？把厨子吓跑了我拿你是问。']] },
  { id: 'tk_gz2', npc: 'gezhu', from: 'q_lei', to: 'q_baiduan', s: [['gezhu', '神藤一年不如一年了。补天阁的根，都在它身上。'], ['me', '它渴吗？我去给它挑水。'], ['gezhu', '（阁主笑了）它要的水，不是井里的水。'], ['me', '那是哪儿的水？'], ['gezhu', '……等你再强一点，我告诉你。']] },
  { id: 'tk_lib1', npc: 'libelder', from: 'q_lib', to: 'q_end', s: [['libelder', '你，站住。'], ['me', '我什么都没拿。'], ['libelder', '那你怀里鼓的是什么？'], ['me', '……肉干。'], ['libelder', '藏经阁不许吃东西！'], ['ch', ['（老老实实交出来）', '（分他一半）'], [[['libelder', '……下不为例。（他把肉干揣进了自己袖子）']], [['libelder', '（他犹豫了一下，接了过去）……第五层的书，可以多看半个时辰。']]]]] },
  // 百断山
  { id: 'tk_hl1', npc: 'huolinger', from: 'q_lion', to: 'q_end', s: [['huolinger', '喂，小不点，打九头狮那次，是我出力多。'], ['me', '是我。'], ['huolinger', '是我！我放的火！'], ['me', '火是你放的，狮子是我打倒的。'], ['huolinger', '狮子是被火烧倒的！'], ['ch', ['好好好，你出力多', '那下次比比？'], [[['huolinger', '（她愣了一下）……你让我？我才不要你让！'], ['nar', '她气鼓鼓地走了。走了没两步，又回头冲你做了个鬼脸。']], [['huolinger', '比就比！谁输了谁请吃烤肉！'], ['me', '那我输了也有烤肉吃？'], ['huolinger', '……你脑子里除了吃还有什么？！']]]]] },
  { id: 'tk_hl2', npc: 'huolinger', from: 'q_cliff', to: 'q_end', s: [['huolinger', '你那只大红鸟，到底是什么来头？'], ['me', '它？它是我的鸟。'], ['huolinger', '我是问它是什么血脉！'], ['me', '（想了想）……很能吃的血脉。'], ['huolinger', '我的火鸟最近茶饭不思，老往它那儿看。'], ['me', '那它俩……'], ['huolinger', '不许说！']] },
  // ---- more (2026-11, round 2) ----
  { id: 'tk_chief4', npc: 'chief', from: 'q_egg0', to: 'q_tomb', s: [['chief', '昨天林虎说，你一个人在空地上对着石头比划了一下午。'], ['me', '我在练青鳞鹰的骨文。'], ['chief', '石头练会了没有？'], ['me', '石头没会，我会了。'], ['chief', '（族长嘴角动了一下）……嗯。石头碎了几块？'], ['me', '……七块。'], ['chief', '那是村口的界石！']] },
  { id: 'tk_chief5', npc: 'chief', from: 'q_ruin', to: 'q_leave', s: [['chief', '新村子的水甜，地也肥。就是……'], ['me', '就是什么？'], ['chief', '就是旧村那棵老枣树没带过来。你小时候最爱爬那棵树。'], ['me', '我现在也爱爬。'], ['chief', '你现在爬柳神。……下来！说了多少遍了，那是柳神！']] },
  { id: 'tk_chief6', npc: 'chief', from: 'q_gate', to: 'q_end', s: [['chief', '（族长看见你，愣了好一会儿）……回来了？'], ['me', '回来看看。'], ['chief', '瘦了。不对，壮了。……在外面有没有好好吃饭？'], ['me', '补天阁的伙房，现在看见我就关门。'], ['chief', '（族长终于笑出了声）好，好。那就是吃上了。']] },
  { id: 'tk_chief7', npc: 'chief', from: 'q_bdgate', to: 'q_end', s: [['chief', '你胸口那道疤……最近疼不疼？'], ['me', '不疼。有时候夜里会热一下。'], ['chief', '（族长沉默了一阵）热是好事。骨头没了，可它在那儿待过。'], ['ch', ['爷爷，我会把它拿回来的', '没了就没了，我自己长'], [[['chief', '……先把自己活明白了，再说拿不拿。']], [['chief', '（他把手放在你头顶，很久都没拿开）……好孩子。']]]]] },
  { id: 'tk_linhu3', npc: 'linhu', from: 'q_shanbao', to: 'q_leave', s: [['linhu', '搬家那天，你看见我扛的那捆箭没有？'], ['me', '看见了，你扛着箭，婶子扛着你。'], ['linhu', '……我那是腿被岩浆燎了一下！'], ['me', '婶子说你是吓软的。'], ['linhu', '（林虎叔的脸涨得通红）你婶子的话，信一半就行。']] },
  { id: 'tk_linhu4', npc: 'linhu', from: 'q_gate', to: 'q_end', s: [['linhu', '小不点，外头的凶兽，比咱们这儿的厉害吗？'], ['me', '有一头狮子长了九个脑袋。'], ['linhu', '九个？！那得多少张嘴吃饭……'], ['me', '它现在不用吃饭了。'], ['linhu', '……你打的？'], ['me', '还有一个火国的公主。她说是她打的。'], ['linhu', '公主？！你、你认识公主了？！（他转身就跑）我去告诉你婶子！']] },
  { id: 'tk_dz3', npc: 'dazhuang', from: 'q_egg0', to: 'q_tomb', s: [['dazhuang', '小不点……那天在石林，我是不是挺怂的？'], ['ch', ['你脚都流血了还抱着蛋', '有一点'], [[['dazhuang', '（他愣了愣，挺起了胸）……对哦！我抱着蛋呢！我是不是挺厉害的？'], ['me', '挺厉害的。'], ['dazhuang', '那下回掏窝还叫上我！']], [['dazhuang', '（他低下头）……嗯。下回我不怂了。'], ['me', '下回你在前面。'], ['dazhuang', '……那还是你在前面吧。']]]]] },
  { id: 'tk_dz4', npc: 'dazhuang', from: 'q_gate', to: 'q_end', s: [['dazhuang', '小不点！补天阁的饭好吃吗？'], ['me', '好吃。一顿九碗。'], ['dazhuang', '九碗！（他掰着手指头算）那我去了能吃十碗！'], ['me', '你得先考进去。'], ['dazhuang', '考什么？'], ['me', '考打架，考认字，考骨文。'], ['dazhuang', '……那我在村里吃两碗也挺好的。']] },
  { id: 'tk_dz5', npc: 'dazhuang', from: 'q_xushen', to: 'q_leave', s: [['dazhuang', '虚神界里，是不是能打架打到天亮，第二天起来一点都不疼？'], ['me', '对。'], ['dazhuang', '那吃东西呢？在里面吃东西，出来会饱吗？'], ['me', '……不会。'], ['dazhuang', '（他一脸失望）那还有什么意思。']] },
  { id: 'tk_ph3', npc: 'pihou', from: 'q_egg0', to: 'q_tomb', s: [['pihou', '那天要不是我喊“快跑啊”，你们都得被鹰叼走！'], ['me', '你喊完就自己先跑了。'], ['pihou', '那叫……那叫探路！'], ['me', '你跑到村口才回头。'], ['pihou', '……路比较长。']] },
  { id: 'tk_ph4', npc: 'pihou', from: 'q_gate', to: 'q_end', s: [['pihou', '小不点，你在外面有没有说你有个大哥叫皮猴？'], ['me', '说了。'], ['pihou', '真的？！他们怎么说？'], ['me', '他们问：“皮猴是什么猴？”'], ['pihou', '……那你怎么答的？'], ['me', '我说是一种会翻跟头、翻到第十一个就摔的猴。'], ['pihou', '我都说了不提第十一个！']] },
  { id: 'tk_em3', npc: 'ermeng', from: 'q_bandit', to: 'q_leave', s: [['ermeng', '……山贼来的那天，我躲在兽奶缸里。'], ['me', '那你没事吧？'], ['ermeng', '没事。就是出来的时候，缸空了。'], ['me', '……你在里面喝完了？'], ['ermeng', '躲了一下午，饿。']] },
  { id: 'tk_em4', npc: 'ermeng', from: 'q_gate', to: 'q_end', s: [['ermeng', '你走了以后，村里的兽奶多了。'], ['me', '因为我不偷了？'], ['ermeng', '因为我一个人偷不完。'], ['nar', '他从怀里掏出一罐，塞给你。'], ['ermeng', '……攒的。等你回来。']] },
  { id: 'tk_willow3', npc: 'willow', from: 'q_jijing', to: 'q_leave', s: [['me', '柳神，极境的那条路，你走过吗？'], ['nar', '柳枝沙沙地响了一阵，像是很久很久以前的风。'], ['me', '你走过。对不对？'], ['nar', '一片叶子落在你手心。叶子上的脉络，弯弯曲曲，像一条没有尽头的路。']] },
  { id: 'tk_willow4', npc: 'willow', from: 'q_return', to: 'q_end', s: [['me', '柳神，我脖子上这个小塔，是你给我的吗？'], ['nar', '柳枝静了一下。'], ['me', '它在灵湖阵里救了我。'], ['nar', '柳枝慢慢垂下来，碰了碰那座小塔。小塔轻轻亮了一下，又暗了。'], ['me', '……你们认识？'], ['nar', '风吹过来，柳枝摇了摇。你分不清那是点头，还是摇头。']] },
  { id: 'tk_qf3', npc: 'qingfeng', from: 'q_gate', to: 'q_join', s: [['qingfeng', '小不点……我要是考不进补天阁怎么办？'], ['ch', ['那就明年再考', '那我也不进了'], [[['qingfeng', '（她攥紧了补天石）……嗯。明年，后年，我都考。']], [['qingfeng', '（她瞪了你一眼）别说傻话。你进去，然后……等我。'], ['me', '好。我在伙房门口等你。'], ['qingfeng', '……为什么是伙房？']]]]] },
  { id: 'tk_qf4', npc: 'qingfeng', from: 'q_lib', to: 'q_qf3', s: [['qingfeng', '你最近在藏经阁看什么书？'], ['me', '《大荒异兽食谱》。'], ['qingfeng', '……藏经阁里有这种书？'], ['me', '没有。我在看《大荒异兽图录》，看哪些能吃，自己记。'], ['qingfeng', '（她叹了口气）你能不能有一回，看书是为了变强？'], ['me', '吃饱了才能变强。']] },
  { id: 'tk_qf5', npc: 'qingfeng', from: 'q_return', to: 'q_end', s: [['qingfeng', '百断山里……是不是很危险？'], ['me', '还好。就是被冻成过冰雕，被猴子砸进过湖里，被树做了个梦。'], ['qingfeng', '……这叫还好？'], ['me', '我回来了嘛。'], ['qingfeng', '（她低头看着自己的手）下次去这种地方，带上我。我已经是内门弟子了。']] },
  { id: 'tk_gy3', npc: 'guiye', from: 'q_return', to: 'q_end', s: [['me', '诡爷，锈剑我带回来了。你要不要拿着看看？'], ['nar', '诡爷伸手，在剑身上弹了一下。“嗡”的一声，剑鸣了很久。'], ['guiye', '……它想砍东西。'], ['me', '砍什么？'], ['guiye', '……天。'], ['nar', '他说完这个字，就闭上了眼睛，再也不理你了。']] },
  { id: 'tk_gz3', npc: 'gezhu', from: 'q_return', to: 'q_end', s: [['gezhu', '石昊，神藤这一回，补天阁欠你的。'], ['me', '那能不能把伙房的门……'], ['gezhu', '（阁主扶着额头）……开。从今天起，伙房给你单独开一口灶。'], ['me', '！！！'], ['gezhu', '别高兴太早。厨子说了，那口灶，你自己烧。']] },
  { id: 'tk_lib2', npc: 'libelder', from: 'q_qf2', to: 'q_end', s: [['libelder', '你知道藏经阁第五层为什么要上锁吗？'], ['me', '因为里面有好东西。'], ['libelder', '因为里面有危险的东西。'], ['me', '危险的东西一般都是好东西。'], ['libelder', '（守阁人愣了一下）……这话谁教你的？'], ['me', '我们族长。他说毒蘑菇都长得好看。'], ['libelder', '……你们族长说得对。']] },

const CMDS = {};
UI.inClick = false; const markClick = () => { UI.inClick = true; setTimeout(() => { UI.inClick = false; }, 0); };
document.addEventListener('click', markClick, true); document.addEventListener('keydown', markClick, true);
for (const fn of CMD_NAMES) { const orig = window[fn]; CMDS[fn] = orig; window[fn] = function (...a) {
  if (UI.inClick && NETROLE) { if (!myControl()) { toast('现在是队友在操作（点上面的 🔗 可以接手）'); return; } if (NETROLE === 'guest') { netSend({ t: 'cmd', fn, a: JSON.parse(JSON.stringify(a)) }); return; } }
  return orig.apply(this, a); }; }
function netLeave() {
  const wasGuest = NETROLE === 'guest'; try { if (wasGuest) raw(NET.conn, { t: 'bye' }); netBroadcast({ t: 'bye' }); } catch (e) { } try { NET.peer && NET.peer.destroy(); } catch (e) { }
  NET.peer = null; NET.conn = null; NET.conns.clear(); NET.code = ''; NET.ctrl = 'host'; NET.peers = 0; NETROLE = null; MYID = 'local';
  if (wasGuest) { C = null; STATE.battle = null; STATE.dungeon = null; STATE.scene = null; DLG = null; toTitle(); } else refresh();
}
/* ---------- host ---------- */
async function netHost() {
  netLeave(); NET.status = '正在开房间…'; openModal('coop', 1);
  try { await loadPeer(); } catch (e) { NET.status = '联机组件加载失败，请检查网络'; openModal('coop', 1); return; }
  const open = tries => { const code = genCode(), peer = new Peer('wmol-' + code, PEER_OPTS); NET.peer = peer; NET.code = code;
    peer.on('open', id => { NETROLE = 'host'; MYID = id; NET.status = ''; NET.ctrl = 'host'; refresh(); openModal('coop', 1); logLine(`房间已开好，房间码 <b>${code}</b>。把它发给朋友。`, 'sys'); });
    peer.on('error', err => { if (err.type === 'unavailable-id' && tries < 4) { try { peer.destroy(); } catch (e) { } open(tries + 1); } else { NET.status = '房间出错（' + err.type + '）'; openModal('coop', 1); } });
    peer.on('disconnected', () => { if (NET.peer === peer && !peer.destroyed) try { peer.reconnect(); } catch (e) { } });
    peer.on('connection', conn => {
      if (NET.conns.size >= 3) { conn.on('open', () => { raw(conn, { t: 'full' }); setTimeout(() => conn.close(), 300); }); return; }
      conn.on('open', () => { NET.conns.set(conn.peer, conn); NET.peers = NET.conns.size; const L = [...$('log').children].slice(-120).map(d => [d.innerHTML, d.className.replace(/^ln\s*/, '')]);
        raw(conn, { t: 'hello', log: L, code: NET.code }); raw(conn, snapshot()); logLine('有人加入了房间，正在和你看同一个画面。', 'sys'); sfx('level'); refresh(); });
      conn.on('data', d => { try { hostRecv(conn.peer, JSON.parse(d)); } catch (e) { console.error(e); } });
      conn.on('close', () => { if (NET.conns.get(conn.peer) === conn) { NET.conns.delete(conn.peer); NET.peers = NET.conns.size; if (NET.ctrl === conn.peer) { NET.ctrl = 'host'; toast('队友离开了，你接回了操作'); } logLine('队友离开了房间。', 'dim'); netSync(); refresh(); } });
    }); };
  open(0);
}
function hostRecv(pid, m) {
  if (m.t === 'take') { NET.ctrl = pid; netBroadcast({ t: 'ctrl', ctrl: pid }); toast('队友接手了操作'); refresh(); netSync(); return; }
  if (NET.ctrl !== pid) return;
  if (m.t === 'cmd' && CMDS[m.fn]) { try { CMDS[m.fn](...(m.a || [])); } catch (e) { console.error(e); } netSync(); }
  if (m.t === 'dlg' && DLG) { if (DLG.choice) { const i = m.i; if (DLG.choice[i] && !DLG.choice[i].dis) { const r = DLG.res; logLine('▸ ' + DLG.choice[i].t, 'say mine'); DLG = null; renderDlg(); r(i); } } else { const r = DLG.res; DLG = null; renderDlg(); r(); } netSync(); }
}
/* ---------- guest ---------- */
async function netJoin(code) {
  code = (code || '').toUpperCase().trim(); if (code.length !== 4) { toast('房间码是 4 位'); return; }
  if (C && NETROLE !== 'guest') save(true); netLeave(); NET.status = '正在连接 ' + code + '…'; if (STATE.mode === 'play') openModal('coop', 1); else titleStatus(NET.status);
  try { await loadPeer(); } catch (e) { NET.status = '联机组件加载失败'; titleStatus(NET.status); return; }
  const peer = new Peer(PEER_OPTS); NET.peer = peer;
  peer.on('open', id => { MYID = id; const c = peer.connect('wmol-' + code, { reliable: true, serialization: 'raw', label: 'ctl' }); NET.conn = c;
    c.on('open', () => { NETROLE = 'guest'; NET.code = code; });
    c.on('data', d => { try { guestRecv(JSON.parse(d)); } catch (e) { console.error(e); } });
    c.on('close', () => { if (NETROLE === 'guest') { toast('房主离开了'); netLeave(); } }); });
  peer.on('error', err => { NET.status = '连接失败（' + err.type + '）。检查房间码，或者让房主重新开房间。'; NETROLE = null; MYID = 'local'; titleStatus(NET.status); });
}
function guestRecv(m) {
  if (m.t === 'full') { NET.status = '房间满了'; netLeave(); titleStatus(NET.status); return; }
  if (m.t === 'hello') { STATE.mode = 'play'; $('title').style.display = 'none'; closeModal(); $('log').innerHTML = ''; for (const [h, c] of m.log || []) $('log').appendChild(el('div', 'ln ' + c, h)); NET.status = ''; UI.nav = null; layout(); return; }
  if (m.t === 'log') { logLine(m.html, m.cls); return; }
  if (m.t === 'ctrl') { NET.ctrl = m.ctrl; refresh(); if (UI.modal === 'coop') openModal('coop', 1); return; }
  if (m.t === 'st') { const first = !C; C = m.C; STATE.battle = m.st.battle; STATE.dungeon = m.st.dungeon; STATE.scene = m.st.scene ? 'remote' : null; STATE.busy = m.st.busy; ROAM = m.roam; NET.ctrl = m.ctrl; NET.peers = m.peers;
    if (STATE.battle) { STATE.shown = STATE.battle.log.length; STATE.shownFor = STATE.battle.id; }
    DLG = m.dlg ? Object.assign({ res: () => { } }, m.dlg) : null; if (DLG && DLG.mini) { DLG.mini.t0 = now() - DLG.mini.age; miniLoop(); } renderDlg(); refresh(); bannerDraw(); return; }
  if (m.t === 'bye') { toast('房主关闭了房间'); netLeave(); }
}

/* ================= title & boot ================= */
function toTitle() {
  if (C && NETROLE !== 'guest') save(true); STATE.mode = 'title'; closeModal(); UI.nav = null; $('title').style.display = 'flex'; titleDraw(); musicMode();
  const sv = loadSave(); const hub = HUB ? `<button class="hub" onclick="hubBack2(this)">‹ 游戏厅</button>` : '';
  $('tbx').innerHTML = `${hub}<h1>完美世界</h1><div class="sub">石昊篇 · 文字版</div>
    <div class="btns">${sv ? `<button class="big" onclick="enterGame()">继续<br><span style="font-size:13px;font-weight:400">存档 ${SLOT} · ${realmOf(sv.lv).name} · 第 ${sv.lv} 层 · ${esc(MAIN[sv.story.q].title)}</span></button>` : `<button class="big" onclick="newGame()">开始${SLOT > 1 ? `<br><span style="font-size:13px;font-weight:400">存档 ${SLOT}</span>` : ''}</button>`}<button class="big sec" onclick="slotsShow()">📂 存档（${SLOTS} 个位置）</button>
    <div class="join"><input id="tjoin" class="namein" maxlength="4" placeholder="朋友的房间码"><button class="big sec" style="min-width:0" onclick="netJoin($('tjoin').value)">加入</button></div><div id="tstat" class="warn" style="font-size:13px"></div></div>
    <div class="note">你是石村的小不点。<br>根据辰东《完美世界》改编：石村 → 出村 → 补天阁 → 百断山。<br>朋友有存档码？开始后在 ⚙️ 设置里读取。</div>`;
}
function slotInfo(s) { const v = loadSave(s); if (!v) return null; const q = MAIN[v.story.q] || MAIN[0], P = PLACES[v.loc]; return { v, t: `${realmOf(v.lv).name} 第 ${v.lv} 层 · ${CH_NAMES[q.ch] || ''} · ${q.title}`, s: `第 ${v.day || 1} 天 · ${P ? P.name : ''}${v.savedAt ? ' · ' + new Date(v.savedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}` }; }
function slotsShow() { UI.slotArm = null; const L = Array.from({ length: SLOTS }, (_, i) => i + 1).map(s => { const I = slotInfo(s), cur = s === SLOT;
    return `<div class="slot ${cur ? 'cur' : ''}"><div class="sn">${s}</div><div class="si">${I ? `<b>${esc(I.t)}</b><small>${esc(I.s)}</small>` : '<span class="dim">空</span>'}</div><div class="sa">${I ? `<button class="sb" onclick="slotPlay(${s})">${cur ? '继续' : '读取'}</button><button class="sb del" onclick="slotDel(${s},this)">删除</button>` : `<button class="sb" onclick="slotNew(${s})">在这里开新档</button>`}</div></div>`; }).join('');
  $('tbx').innerHTML = `<h1 style="font-size:44px">存档</h1><div class="sub">每个位置是一段独立的人生，回忆录也分开记</div><div class="slots">${L}</div><div class="btns"><button class="big sec" onclick="toTitle()">‹ 返回</button></div>`; }
function slotPlay(s) { useSlot(s); C = null; enterGame(); }
function slotNew(s) { useSlot(s); audioInit(); C = newChar(); fullHeal(); JOURNAL = []; saveJournal(); save(true); enterGame(true); }
function slotDel(s, b) { if (UI.slotArm !== s) { UI.slotArm = s; b.textContent = '再点一次删除'; b.style.color = '#ff8a7a'; return; } store.del(saveKey(s)); store.del(jKey(s)); if (s === SLOT) { JOURNAL = []; C = null; } slotsShow(); }
function titleStatus(t) { const e = document.getElementById('tstat'); if (e) e.textContent = t || ''; }
function hubBack2(b) { if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = '再点一次确认'; setTimeout(() => { b.dataset.arm = ''; b.textContent = '‹ 游戏厅'; }, 3000); return; } location.href = '../'; }
function newGame(b) { if (b && !b.dataset.arm) { b.dataset.arm = 1; b.textContent = `再点一次（会清掉存档 ${SLOT}）`; return; } audioInit(); C = newChar(); fullHeal(); JOURNAL = []; saveJournal(); save(true); enterGame(true); }
function enterGame(fresh) {
  audioInit(); if (!fresh) C = loadSave(); if (!C) return newGame(); fixHp(); arenaDaily();
  STATE.mode = 'play'; $('title').style.display = 'none'; $('log').innerHTML = ''; UI.nav = null; UI.memo = null; bannerKey = ''; layout();
  if (fresh) logLine('<div class="lochead">完美世界</div>大荒，八百万里群山，凶兽横行。群山之间，有一个叫石村的小村子。', 'loc'); else { describe(); logLine('欢迎回来，小不点。', 'dim'); }
  refresh(); bannerDraw(); musicMode(); setTimeout(storyPoll, 600);
}
setInterval(() => { if (STATE.mode !== 'play' || !C) return; try { roamTick(); npcTick(); rumorTick(); } catch (e) { console.error(e); } }, 1000);
setInterval(() => { if (STATE.mode === 'play' && C && !STATE.battle && !DLG) { renderTop(); if (UI.night !== isNight()) { UI.night = isNight(); bannerDraw(); refresh(); } } }, 5000);
addEventListener('pointerdown', () => { audioInit(); musicMode(); }, { once: true });
document.addEventListener('visibilitychange', () => { if (document.hidden && C) save(true); });
addEventListener('pagehide', () => { if (C) save(true); });
layout(); toTitle();
/* ---------- test hooks ---------- */
if (window.__dbg) { Object.defineProperties(window.__dbg, { C: { get: () => C }, STATE: { get: () => STATE }, NET: { get: () => NET }, ROAM: { get: () => ROAM }, DLG: { get: () => DLG }, NETROLE: { get: () => NETROLE } });
  Object.assign(window.__dbg, { MAIN, PLACES, go, explore, startBattle, battleAct, curQ, questComplete, storyPoll, enterDungeon, autoWalk, newChar, enterGame, save, refresh, openModal, closeModal, gainExp, addItem, npcTalk, questTalkOptions,
    arenaFight, arenaOpponents, useItem, fightRoam, feedPet, setPet, netHost, netJoin, takeControl, dlgPick, CMDS, runeTap, runeSkip, arenaClaim, arenaMilestones, exportCode, importCode, wildEventFor, runWild, storyEvents, WILD, EVENTS, navTo, ready: true });
  Object.defineProperty(window.__dbg, 'JOURNAL', { get: () => JOURNAL }); }

</script>
