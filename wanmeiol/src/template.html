
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
__IOSMETA__
<title>完美世界 · 石昊篇</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* one screen at a time: 探索 (dark green) · 对话 (paper) · 战斗 (dark red).  Panels open as a sheet over the screen. */
:root{--bg:#0f0d0a;--bg2:#17130f;--pan:#1d1813;--pan2:#251f18;--line:#3a3024;--line2:#4e4130;--gold:#d4ad62;--gold2:#f0d79a;--tx:#e8dfcc;--dim:#9b907c;--dim2:#6f6656;--red:#e0604f;--hp:#d0483c;--mp:#3f8fd8;--exp:#c9a442;--grn:#7fd36f;
  --sa:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--ff:'Noto Serif SC','Songti SC','STSong','SimSun',serif;--fh:'Ma Shan Zheng','STKaiti','KaiTi',serif;
  --paper:#efe5cd;--paper2:#f7f0de;--ink:#2a2118;--ink2:#6b5c48;--seal:#b3342a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--ff);line-height:1.65;overflow:hidden;-webkit-text-size-adjust:100%}
body{font-size:1rem}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
b{color:var(--gold2)}
.dim{color:var(--dim)}
#log{display:none}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:var(--st) var(--sr) 0 var(--sa)}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid #00000066;background:#0b0a08;min-height:44px;z-index:5}
#top .who{font-family:var(--fh);font-size:1.25rem;color:var(--gold);white-space:nowrap;line-height:1}
#top .lv{font-size:.8rem;color:var(--gold2);white-space:nowrap}
#top .bars3{flex:1;max-width:260px;min-width:60px;display:flex;flex-direction:column;gap:2px}
#top .bars3 .bar{height:5px;margin:0}
#top .sp{flex:1}
.tb{background:none;border:1px solid #ffffff1a;border-radius:9px;padding:3px 10px;font-size:.87rem;color:var(--tx);white-space:nowrap;min-height:36px;min-width:40px;position:relative}
.tb:hover{background:#ffffff0d}
.tb.on{border-color:var(--gold);color:var(--gold2)}
.tb.net{color:#8fd0ff;border-color:#8fd0ff55}
.tb .dot,.dot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
/* ---------- stage & views ---------- */
#stage{position:relative;min-height:0;overflow:hidden;transition:background .35s}
.view{position:absolute;inset:0;display:none}
body.m-explore #stage{background:radial-gradient(ellipse at 30% 0%,#1d3326 0%,#0d1711 70%)}
body.m-battle #stage{background:radial-gradient(ellipse at 50% 0%,#3a1512 0%,#160909 72%)}
body.m-talk #stage{background:#1a1510}
body.m-explore #vExplore,body.m-battle #vBattle,body.m-talk #vTalk{display:flex;animation:vin .25s both}
@keyframes vin{from{opacity:0}to{opacity:1}}
/* explore */
#vExplore{flex-direction:column}
.ex-l{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.ex-r{flex:none;max-height:56%;overflow-y:auto;padding:8px 12px calc(10px + var(--sb));border-top:1px solid #8fbf8a22;background:#0a130dcc}
#banner{position:relative;height:150px;overflow:hidden}
#banner canvas{position:absolute;inset:0;width:100%;height:100%}
#banner::after{content:'';position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,#0d1711)}
#banner .nm{position:absolute;left:16px;bottom:10px;z-index:1;font-family:var(--fh);font-size:2.2rem;color:#f4ead2;text-shadow:0 2px 8px #000;line-height:1}
#banner .ar{position:absolute;left:18px;top:9px;z-index:1;font-size:.8rem;color:#efe4c8;text-shadow:0 1px 3px #000;letter-spacing:1px;background:#00000055;border-radius:6px;padding:0 6px}
#desc{padding:8px 16px 4px;font-size:1.03rem;line-height:1.8;color:#dfe6d6}
#desc .night{color:#a9b9d8}
#feed{padding:2px 16px 8px}
#feed .ln{font-size:.93rem;margin:5px 0;color:#c9d3c0;border-left:2px solid #6f9a6a55;padding-left:9px;animation:fade .35s both}
#feed .ln.old{opacity:.55}
#feed .ln.sys{border-left-color:var(--gold);color:var(--gold2)}
#feed .ln.tip{border-left-color:#4a8ad0;color:#9fd4ff}
#feed .ln.quest{border-left-color:#e0a840;color:#f3c56a}
#feed .ln.loot{color:#c9e8b8}
#feed .ln.npc .who,#feed .ln .who{color:#d9bd72;font-weight:700;margin-right:6px}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
#bq{display:block;width:100%;text-align:left;background:#1a2a1eee;border:1px solid #c9a44a66;border-radius:10px;padding:7px 11px;font-size:.9rem;line-height:1.45;color:#f2e6c8;margin-bottom:8px}
#bq b{color:var(--gold)}
#bq .go{color:#8fd0ff;margin-left:6px;white-space:nowrap}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.grp:last-child{margin-bottom:0}
.gl{font-size:.72rem;color:#8fae8a;letter-spacing:2px;writing-mode:vertical-rl;min-height:36px;text-align:center;flex:none;width:14px}
.ab{background:linear-gradient(#1f3326,#16261b);border:1px solid #3f5e47;border-radius:9px;padding:6px 12px;font-size:.95rem;min-height:42px;min-width:44px;line-height:1.25;color:#e6eedc}
.ab:hover{border-color:#a8c88a}
.ab.main{background:linear-gradient(#5a4a20,#3e3317);border-color:#a8903e;color:#ffeab8;font-weight:700}
.ab.q{border-color:#d6a640;color:#ffd77a}
.ab.dir small{margin-left:6px;font-size:.72rem;color:#9fb79a}
.ab.npc{color:#efe2c0}
.ab.wb{border-color:#e05a3a;color:#ffb08a;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 12px #e05a3a88}}
.ab:disabled{opacity:.38;cursor:not-allowed}
.ab.sm{min-height:40px;padding:5px 10px;font-size:.9rem}
.wait{text-align:center;color:#8fae8a;font-size:.9rem;padding:8px}
/* talk (paper) */
#vTalk{align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + var(--sb));background:#1a1510}
#tbg{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.6}
#vTalk::before{content:'';position:absolute;inset:0;background:linear-gradient(#0000 30%,#140f0bdd 85%)}
#dlg{z-index:1}
#dlg{width:min(780px,100%);max-height:100%;overflow-y:auto;background:linear-gradient(var(--paper2),var(--paper));color:var(--ink);border-radius:6px;padding:16px 20px 14px;box-shadow:0 8px 30px #000a,inset 0 0 0 1px #c8b48a,inset 0 0 40px #c8a8701f;position:relative}
#dlg b{color:#8a3a14}
#dlg .tplace{font-size:.78rem;color:var(--ink2);letter-spacing:3px;margin-bottom:6px;border-bottom:1px dashed #b8a37c;padding-bottom:4px;display:flex;gap:8px}
#dlg .tplace span{margin-left:auto}
#dlg .hist{font-size:.88rem;color:#8a7a62;line-height:1.6;margin-bottom:6px}
#dlg .hist div{margin:2px 0}
#dlg .hist .hw{font-weight:700;margin-right:5px}
#dlg .line{display:flex;gap:14px;align-items:flex-start}
.seal{flex:none;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--fh);font-size:1.15rem;line-height:1.05;letter-spacing:1px;color:#fbf2df;background:var(--sc,var(--seal));border-radius:5px;padding:5px 4px;min-width:2.3rem;min-height:2.6rem;max-height:4.8rem;box-shadow:inset 0 0 0 2px #fbf2df55,0 1px 0 #0003;transform:rotate(-2deg)}
.seal.long{writing-mode:horizontal-tb;font-size:1rem;padding:4px 7px;max-height:none;min-height:0}
.seal.me{--sc:#a8781e}
.seal.sm{font-size:.82rem;min-width:1.6rem;min-height:1.6rem;padding:2px 3px;transform:none;vertical-align:middle}
#dlg .ttl{font-size:.75rem;color:var(--ink2);margin-top:4px;text-align:center;writing-mode:horizontal-tb}
#dlg .tx{font-size:1.12rem;line-height:1.85;flex:1;min-height:2.4em}
#dlg .tx.nar{font-size:1.06rem;color:#3a3024;text-indent:2em}
#dlg .tx.mine{color:#5a3a10}
#dlg .nx{text-align:right;color:var(--ink2);font-size:.8rem;margin-top:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
#dlg .ch{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.chb{text-align:left;background:#fffaf0;border:1px solid #b8a37c;border-radius:6px;padding:9px 14px;font-size:1rem;line-height:1.5;min-height:44px;color:var(--ink)}
.chb:hover{border-color:var(--seal);background:#fff}
.chb:disabled{opacity:.45;cursor:not-allowed}
.chb::before{content:'▸ ';color:var(--seal)}
/* 骨文 mini-game */
.rune{position:relative;margin:6px auto 0;max-width:340px}
.rune svg{display:block;width:100%;height:auto}
.rune .nd{cursor:pointer}
.rune .nd circle{fill:#fff8e8;stroke:#8a6a3a;stroke-width:2}
.rune .nd{transform-box:fill-box}
.rune .nd path{stroke:#5a4024;stroke-width:2.6;fill:none;stroke-linecap:round}
.rune .nd.lit circle{fill:#ffd88a;stroke:#b3342a}
.rune .nd.flash circle{animation:rflash .5s both;animation-delay:var(--d)}
@keyframes rflash{0%,100%{fill:#fff8e8}40%{fill:#ffcf5a;stroke:#b3342a}}
.rune .lnk{stroke:#b3342a;stroke-width:3;stroke-linecap:round;opacity:.8}
.rune .msg{text-align:center;font-size:.92rem;color:var(--ink2);margin:4px 0}
/* battle */
#vBattle{flex-direction:column;padding:8px 10px 0}
#bhead{flex:none;text-align:center;font-family:var(--fh);font-size:1.3rem;color:#ffcfb8;line-height:1.2;padding:2px 0 6px}
#bhead small{font-family:var(--ff);font-size:.75rem;color:#c99a8a;margin-left:8px}
.side{flex:none;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
#bfeed{flex:1;min-height:60px;overflow-y:auto;margin:8px auto;width:min(760px,100%);padding:6px 10px;background:#00000040;border:1px solid #ffffff10;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end}
#bfeed .ln{font-size:.9rem;margin:2px 0;color:#e8d4c8;line-height:1.5}
#bfeed .ln.old{opacity:.5}
#bfeed .phase{color:#ff7a5a;font-weight:700;text-align:center;font-size:1rem}
#bacts{flex:none;padding:8px 0 calc(8px + var(--sb));border-top:1px solid #ff8a6a22;margin:0 -10px;padding-left:10px;padding-right:10px;background:#120707cc}
.arow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px}
.arow:last-child{margin-bottom:0}
.uc{position:relative;width:158px;background:#2a1513;border:1px solid #6a332c;border-radius:9px;padding:5px 8px;font-size:.84rem;line-height:1.35;cursor:pointer}
.uc.ally{background:#1c1a16;border-color:#5a4e3a}
.uc.sel{outline:2px solid #ffcf6a;outline-offset:1px}
.uc.me{border-color:#4a7ab0}
.uc.dead{opacity:.35;filter:grayscale(1)}
.uc .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc .n small{font-weight:400;color:#c4a090;margin-left:3px}
.uc .wk{font-size:.7rem;color:#ffd34a;margin-left:4px;font-weight:400}
.bar{height:7px;background:#00000066;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--hp);transition:width .35s}
.bar.mp i{background:var(--mp)}.bar.exp i{background:var(--exp)}
.uc .hpn{font-size:.7rem;color:#c4a090;display:flex;justify-content:space-between}
.uc .sts{min-height:15px;font-size:.7rem;margin-top:1px}
.uc .sts span{margin-right:3px}
.uc .int{font-size:.74rem;color:#ffb48a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc .int.chg{color:#ff6a4a;font-weight:700}
.uc.rage{box-shadow:0 0 10px #ff4a2a99}
.skb{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:70px;min-height:54px;padding:4px 8px;background:linear-gradient(#3a1d18,#271210);border:1px solid #7a3a30;border-radius:10px;font-size:.84rem;line-height:1.2;color:#f6e2d6}
.skb .i{font-size:1.25rem}
.skb .c{font-size:.68rem;color:#8fc0ff}
.skb .pf{position:absolute;top:2px;right:4px;font-size:.6rem;color:#ffd34a}
.skb .cd{position:absolute;inset:0;background:#000000aa;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;color:#fff;font-weight:700}
.skb:disabled{opacity:.45}
.skb:hover:not(:disabled){border-color:#ffcf6a}
#bacts .ab{background:linear-gradient(#3a1d18,#271210);border-color:#7a3a30;color:#f6e2d6}
#bacts .ab.q{border-color:#ffcf6a;color:#ffd77a}
/* battle log colours */
.bt{display:block;text-align:center;font-family:var(--fh);font-size:1.3rem;color:var(--gold2);margin:4px 0}
.bt.win{color:#ffd96a}.bt.lose{color:#ff7a6a}
.rd{display:block;color:#a0807a;font-size:.75rem;text-align:center;margin-top:4px}
.foe{color:#ff9a8a;font-weight:700}.pc{color:#9fd4ff;font-weight:700}.ally{color:#a8e6a0;font-weight:700}
.sk{color:#ffd88a}.dmg{color:#ff8a6a;font-weight:700}.crit{color:#ffcf3a;font-weight:700;font-size:1.08em}.heal{color:#7fe08a;font-weight:700}.miss{color:#9ab}.die{color:#ff5a4a}
.weak{color:#ffe14a;font-weight:700}
.st{font-size:.75rem;border:1px solid currentColor;border-radius:4px;padding:0 3px}
.lvup{color:#ffd96a!important}
.it{color:#e8e0c8}.exp{color:#c9a442}
.qnew{color:#ffd068;font-weight:700}
.warn{color:#ff9a5a}
/* ---------- bottom nav ---------- */
#bnav{display:flex;justify-content:center;border-top:1px solid #ffffff14;background:#0b0a08;padding:0 var(--sr) var(--sb) var(--sa)}
#bnav button{flex:1;max-width:130px;background:none;border:0;color:var(--dim);font-size:.78rem;padding:5px 0 4px;min-height:52px;position:relative;line-height:1.2}
#bnav button .i{display:block;font-size:1.25rem}
#bnav button.on{color:var(--gold2)}
#bnav button .dot{top:6px;right:auto;left:58%}
body.m-talk #bnav,body.m-battle #bnav{display:none}
/* ---------- sheet (石昊 / 宠物 / 背包 / 地图 / 记录) ---------- */
#sheet{position:absolute;inset:0;z-index:20;background:#15110dfa;display:none;flex-direction:column}
#sheet.on{display:flex;animation:vin .2s both}
#sheet .shd{display:flex;align-items:center;gap:4px;padding:6px 8px 0 12px;border-bottom:1px solid var(--line);flex:none}
#sheet .shd h2{margin:0 8px 0 0;font-family:var(--fh);font-weight:400;font-size:1.5rem;color:var(--gold);line-height:1.6}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;font-size:.93rem;color:var(--dim);white-space:nowrap}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
#sheet .x{background:none;border:0;font-size:1.7rem;color:var(--dim);min-width:44px;min-height:44px;flex:none}
.pbody{flex:1;min-height:0;overflow:auto;padding:10px 12px calc(12px + var(--sb));-webkit-overflow-scrolling:touch}
.pbody>*{max-width:760px;margin-left:auto;margin-right:auto}
/* log view inside the sheet */
.logv .ln{margin:0 0 7px;font-size:.93rem}
.logv .ln.dim{color:var(--dim)}
.logv .ln.loc{margin-top:12px;color:#d8cfbb}
.lochead{font-family:var(--fh);font-size:1.4rem;color:var(--gold2);line-height:1.3}
.lochead span{font-family:var(--ff);font-size:.75rem;color:var(--dim);margin-left:10px}
.logv .ln.sys{color:#f0d79a;border-left:3px solid var(--gold);padding-left:9px}
.logv .ln.tip{color:#9fd4ff;border-left:3px solid #4a8ad0;padding-left:9px}
.logv .ln.quest{color:#f3c56a}.logv .ln.loot{color:#c9e8b8}.logv .ln.enc{color:#f2c8a8}
.logv .ln .who{color:var(--gold);font-weight:700;margin-right:6px}
.logv .ln.say.mine .who{color:#e8c070}
.logv .ln.bat{font-size:.84rem;margin:0 0 2px;color:#cfc4b2}
.logv .ln.npc{color:#d9cfb6;border-left:2px solid #6a5a40;padding-left:9px}
/* memoir */
.memo{background:linear-gradient(var(--paper2),var(--paper));color:var(--ink);border-radius:6px;padding:12px 16px;margin-bottom:10px}
.memo h4{margin:0 0 6px;font-family:var(--fh);font-weight:400;font-size:1.3rem;color:#7a2a1a}
.memo p{margin:4px 0;font-size:.95rem;line-height:1.75}
.memo b{color:#8a3a14}
.memo .mw{font-weight:700;color:#7a2a1a;margin-right:6px}
.memo .mc{color:#8a5a2a}
.chap{font-family:var(--fh);font-size:1.3rem;color:var(--gold);margin:10px 0 4px}
/* panels */
.card{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-family:var(--fh);font-weight:400;font-size:1.3rem;color:var(--gold)}
.card h4{margin:6px 0 4px;font-size:.93rem;color:var(--gold2)}
.row{display:flex;align-items:center;gap:8px}
.row .sp{flex:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:.9rem}
.kv span{color:var(--dim)}
.me-hd{display:flex;gap:10px;align-items:center}
.me-hd .nm{font-weight:700;font-size:1.13rem}
.me-hd .sub{font-size:.8rem;color:var(--dim)}
.pw{font-family:var(--fh);font-size:1.45rem;color:#ffcf6a}
.bars{font-size:.73rem;color:var(--dim)}
.bars .bar{height:9px;margin:1px 0 4px}
.sb{background:#2a2219;border:1px solid var(--line2);border-radius:7px;padding:4px 10px;font-size:.87rem;min-height:36px}
.sb:hover{border-color:var(--gold)}
.sb.pri{background:linear-gradient(#5a4220,#3e2e17);border-color:#a8843e;color:#ffe9b8}
.sb:disabled{opacity:.4}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:.9rem;line-height:1.4}
.li .ic{font-size:1.3rem;width:26px;text-align:center;flex:none}
.li .t{flex:1;min-width:0}
.li .t small{display:block;color:var(--dim);font-size:.8rem}
.li .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.li.on{border-color:#a8843e;background:#2e2518}
.li .chk{color:#ffd77a;font-weight:700;width:18px;text-align:center}
.li[onclick]{cursor:pointer}
.li.unk{opacity:.5}
.pill{display:inline-block;font-size:.73rem;padding:0 6px;border-radius:9px;border:1px solid var(--line2);color:var(--dim);margin-right:4px}
.pill.gold{color:#f0d79a;border-color:#a8843e}
.pf-bar{height:5px;background:#00000066;border-radius:3px;overflow:hidden;margin-top:3px}
.pf-bar i{display:block;height:100%;background:#d4ad62}
.dts{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .sb.on{border-color:var(--gold);color:var(--gold2)}
textarea.code{width:100%;min-height:80px;background:#0c0a08;border:1px solid var(--line2);border-radius:8px;color:var(--tx);font-family:monospace;font-size:12px;padding:8px;word-break:break-all}
/* map */
.map{position:relative;margin:4px auto 6px}
.mn{position:absolute;transform:translate(-50%,-50%);background:#2a2219;border:1px solid var(--line2);border-radius:8px;padding:3px 6px;font-size:.8rem;white-space:nowrap;cursor:pointer;line-height:1.25;text-align:center}
.mn.cur{background:#5a4220;border-color:var(--gold);color:#fff;font-weight:700}
.mn.q::after{content:'★';color:#ffd05a;position:absolute;right:-8px;top:-9px;font-size:.87rem}
.mn.wb{border-color:#e05a3a}
.mn small{display:block;color:var(--dim);font-size:.67rem}
/* modal (虚神界 / 联机 / 设置) */
#modal{position:fixed;inset:0;z-index:50;display:none;background:#000000aa;padding:calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sa));overflow:auto;align-items:safe center;justify-content:center}
#modal.on{display:flex}
#modal .box{width:min(640px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;margin:auto;box-shadow:0 10px 40px #000}
#modal .mh{display:flex;align-items:center;margin-bottom:8px}
#modal .mh h2{margin:0;flex:1;font-family:var(--fh);font-weight:400;font-size:1.7rem;color:var(--gold)}
#modal .x{background:none;border:0;font-size:1.7rem;color:var(--dim);min-width:44px;min-height:44px}
#toast{position:fixed;left:50%;top:calc(56px + var(--st));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#000000dd;border:1px solid var(--line2);color:#f3e8cc;padding:7px 14px;border-radius:20px;font-size:.93rem;animation:fade .25s both;max-width:86vw}
/* title */
#title{position:fixed;inset:0;z-index:40;display:flex;align-items:safe center;justify-content:center;overflow:auto;padding:calc(16px + var(--st)) 16px calc(16px + var(--sb))}
#title canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
#title .tbx{width:min(560px,100%);text-align:center;margin:auto}
#title h1{font-family:var(--fh);font-weight:400;font-size:84px;line-height:1;margin:0;color:#f6e6bc;text-shadow:0 4px 18px #000,0 0 30px #d4ad6244;letter-spacing:10px}
#title .sub{color:#d8c9a8;margin:10px 0 22px;font-size:15px;text-shadow:0 1px 4px #000}
#title .btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.big{min-width:250px;min-height:52px;font-size:18px;border-radius:12px;background:linear-gradient(#5e4422,#3e2d16);border:1px solid #b18d48;color:#ffeac0;font-weight:700;padding:8px 20px}
.big.sec{background:#1c1712cc;border-color:var(--line2);color:var(--tx);font-weight:400;font-size:16px}
.big:hover{filter:brightness(1.15)}
#title .note{margin-top:18px;font-size:12.5px;color:#b8ab90;text-shadow:0 1px 3px #000}
.hub{position:absolute;left:calc(12px + var(--sa));top:calc(10px + var(--st));background:#00000088;border:1px solid var(--line2);color:var(--tx);border-radius:10px;padding:8px 14px;font-size:14px;min-height:40px}
.namein{width:100%;background:#120f0cdd;border:1px solid var(--line2);color:var(--tx);border-radius:10px;padding:10px 12px;font-size:18px;font-family:inherit;text-align:center}
.join{display:flex;gap:6px;margin-top:6px;width:min(320px,100%)}
.join .namein{font-size:17px;letter-spacing:4px;text-transform:uppercase;padding:8px;flex:1;min-width:0}
.join .big{white-space:nowrap;flex:none;min-width:72px;padding:8px 14px}
/* ---------- wide / short layouts (classes set by JS) ---------- */
body.cols #vExplore{display:none}
body.cols.m-explore #vExplore{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr)}
body.cols .ex-l{border-right:1px solid #8fbf8a22}
body.cols .ex-r{max-height:none;border-top:0;background:#0a130d99;padding:12px 14px calc(12px + var(--sb))}
body.cols #banner{height:200px}
body.cols .gl{writing-mode:horizontal-tb;width:100%;min-height:0;text-align:left;margin:2px 0 -2px}
body.narrow #top .who{display:none}
body.narrow #banner{height:112px}
body.narrow #banner .nm{font-size:1.8rem;left:12px}
body.narrow #desc{padding:6px 12px 2px;font-size:.98rem}
body.narrow #feed{padding:2px 12px 6px}
body.narrow .uc{width:calc(50% - 4px);font-size:.8rem;padding:4px 7px}
body.narrow .skb{min-width:62px;min-height:50px;font-size:.78rem}
body.narrow #title h1{font-size:60px}
body.narrow #dlg{padding:14px 14px 12px}
body.short #banner{height:84px}
body.short #banner .nm{font-size:1.5rem}
body.short #desc{font-size:.92rem;line-height:1.6}
body.short #bnav button{min-height:40px;font-size:.7rem;padding:2px 0}
body.short #bnav button .i{font-size:1rem;display:inline;margin-right:3px}
body.short #title h1{font-size:48px}
body.short #title .sub{margin:4px 0 10px}
body.short .big{min-height:44px;font-size:16px}
body.short #vBattle{padding-top:4px}
body.short #bhead{font-size:1rem;padding:0 0 2px}
body.short .uc{width:136px;font-size:.74rem;padding:3px 6px;line-height:1.25}
body.short .uc .sts,body.short .uc .hpn{display:none}
body.short #bfeed{margin:4px auto;min-height:40px}
body.short .skb{min-height:44px;min-width:58px;font-size:.74rem;padding:2px 6px}
body.short .skb .i{font-size:1rem}
body.short #vTalk{padding:6px 8px calc(6px + var(--sb))}
body.short #dlg{padding:10px 14px}
body.short #dlg .hist{display:none}
@media (hover:none){.ab:hover,.sb:hover,.chb:hover{border-color:inherit}}
</style>
<body>
<div id="app">
  <header id="top"></header>
  <div id="stage">
    <section id="vExplore" class="view">
      <div class="ex-l"><div id="banner"><canvas id="bcv"></canvas><div class="ar" id="bar"></div><div class="nm" id="bnm"></div></div><div id="desc"></div><div id="feed"></div></div>
      <div class="ex-r"><button id="bq"></button><div id="acts"></div></div>
    </section>
    <section id="vTalk" class="view"><canvas id="tbg"></canvas><div id="dlg"></div></section>
    <section id="vBattle" class="view"><div id="bhead"></div><div id="foes" class="side"></div><div id="bfeed"></div><div id="party" class="side"></div><div id="bacts"></div></section>
    <div id="sheet"><div class="shd"><h2 id="sht"></h2><div class="tabs" id="stabs"></div><button class="x" onclick="navTo('adv')">×</button></div><div class="pbody" id="sbody"></div></div>
  </div>
  <nav id="bnav"></nav>
</div>
<div id="log"></div>
<div id="modal"><div class="box"><div class="mh"><h2 id="mt"></h2><button class="x" onclick="closeModal()">×</button></div><div id="mb"></div></div></div>
<div id="toast"></div>
<div id="title"><canvas id="tcv"></canvas><div class="tbx" id="tbx"></div></div>

</body>
